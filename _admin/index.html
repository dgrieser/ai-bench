        + "says what happened.";
  } else if (mode === "quick") {
    /* The whole point of the quick run: say where the questions it collected
       are, since that is what the person has been waiting on. */
    state.ok = "The quick run has finished and the queue has just been re-read. "
      + "Mapping questions for anything it added are on the Queue tab -- search it "
      + "for the model's name. Scores arrive with the next full run; send the "
      + "mappings with Full to have them sooner.";
  } else {
    /* It used to add that anything still listed is a question the run did not
       answer. That is only true once the queue it pushed has propagated, which
       is what the note under this one says when it has not. */
    state.ok = "That run has finished and the queue has just been re-read. Its "
      + "own summary is the record of what landed, not its colour: a failed "
      + "refresh reds a run whose answers applied perfectly.";
  }
}

let poll = null;

/* Idempotent, and called at the end of every render, so the timer exists
   exactly while something is in flight. */
function syncPolling() {
  if (locked() && poll === null) poll = setInterval(tick, POLL_MS);
  else if (!locked() && poll !== null) { clearInterval(poll); poll = null; }
}

async function tick() {
  const wasLocked = locked();
  if (!(await loadRuns())) {
    render();       // the note says why; the lock stays until GitHub answers
    return;
  }
  if (wasLocked && !locked()) {
    await loadData();
    return;
  }
  render();         // the pill moves from queued to in progress
}

/* --------------------------------------------------- artificial analysis */

/* Asked for once, and only when something needs it: this is the largest thing
   the page reads and most sittings never rename anything.

   Read from the repo, beside the queue and llm.json, rather than proxied live
   through api.php. The proxy had to exist while this came from the AA API --
   which authenticates with a header, so a browser request preflights and AA
   sends no CORS headers -- but the list is now committed on every refresh, so
   the page reads the file directly: no key, no proxy, and none of the four API
   requests a live read costs against a hundred-a-day budget. */
async function ensureAaSlugs() {
  // state.raw is api.php's answer to where the data lives, and loadRuns() is
  // awaited before anything renders -- but a render that beat it would fetch
  // "undefined/_aa/models.json" and cache the failure under asked.
  if (!state.raw || state.aa.asked) return;
  state.aa.asked = true;
  try {
    const response = await fetch(bust(`${dataBase()}/_aa/models.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const body = await response.json();
    const models = (body.models || []).filter((m) => m && typeof m.slug === "string");
    state.aa.models = new Map(models.map((m) => [m.slug, m]));
    state.aa.slugs = models.map((m) => m.slug);
  } catch (error) {
    state.aa.error = String(error.message);
  }
  render();
}

/* What is known about a slug beyond the slug itself, as a short trailing
   phrase -- the creator and the release date are what separate two slugs whose
   names read alike. Empty when the list carries neither. */
function aaSlugDetail(slug) {
  const model = state.aa.models && state.aa.models.get(slug);
  if (!model) return "";
  const parts = [model.creator, model.release_date].filter(Boolean);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

/* The same row in prose, for a card that is about the model rather than about
   a slug being suggested: AA's own name for it, then who made it and when.
   Empty when the published list has never heard of the slug, which for a
   reference model is worth saying out loud. */
function aaSlugSummary(slug) {
  const model = state.aa.models && state.aa.models.get(slug);
  if (!model) return "";
  const tail = [model.creator, model.release_date].filter(Boolean).join(", ");
  return [model.name || slug, tail].filter(Boolean).join(" -- ");
}

/* AA slugs worth offering for a model of this name, best first. The ranking is
   deliberately shallow -- these are suggestions to click, and the click sends a
   slug from AA's own list either way. */
function aaSuggestions(name, limit = 6) {
  const wanted = normSlug(name);
  const ranked = [];
  for (const slug of state.aa.slugs || []) {
    const norm = normSlug(slug);
    if (norm === wanted) ranked.push([0, "the same name bar punctuation", slug]);
    else if (norm.startsWith(`${wanted}-`)) ranked.push([1, "this name with a suffix", slug]);
    else if (wanted.startsWith(`${norm}-`)) ranked.push([2, "a shorter form of this name", slug]);
    else if (norm.includes(wanted) || wanted.includes(norm)) ranked.push([3, "an overlapping name", slug]);
  }
  ranked.sort((a, b) => a[0] - b[0] || a[2].length - b[2].length || a[2].localeCompare(b[2]));
  return ranked.slice(0, limit).map(([, why, slug]) => ({ slug, why }));
}

/* ---------------------------------------------------------------- loading */

async function load() {
  /* First, because it says where everything else lives. Without it the page
     could not send either, so failing here is fatal rather than degraded. */
  if (!(await loadRuns())) {
    render();
    return;
  }

  await loadData();
}

/* Where to read the data: main as of its newest commit, by that commit's id.

   raw.githubusercontent caches a branch URL for five minutes and ignores the
   query string, so bust() never busted anything: a read made right after a run
   pushed was served the file as it was before the push, for up to five
   minutes. That is how a quick run's questions went missing -- the run had
   published them, and the page re-read the queue seconds later and got the old
   one. A URL naming a commit is a different URL for every push, so it is
   never stale.

   The commit id comes from GitHub's public API, which needs no token and sends
   CORS headers. When it cannot be had -- rate limited at 60 an hour per
   address, offline, a fork that is private -- the branch URL is still used, as
   before. */
async function resolveSha() {
  if (!state.repo) return null;
  const ref = state.ref || "main";
  try {
    const response = await fetch(`https://api.github.com/repos/${state.repo}/commits/${ref}`, {
      cache: "no-store",
      headers: { Accept: "application/vnd.github.sha" },
    });
    if (!response.ok) return null;
    const sha = (await response.text()).trim();
    return /^[0-9a-f]{40}$/.test(sha) ? sha : null;
  } catch {
    return null;
  }
}

const dataBase = () => (state.sha && state.repo
  ? `https://raw.githubusercontent.com/${state.repo}/${state.sha}`
  : state.raw);

async function loadData() {
  state.sha = await resolveSha();
  const base = dataBase();
  const json = (url) => fetch(bust(url), { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))));
  const [queue, llm, reference] = await Promise.allSettled([
    json(`${base}/_pending/pending.json`),
    json(`${base}/llm.json`),
    json(`${base}/reference-models.json`),
  ]);

  if (queue.status === "fulfilled") {
    state.questions = queue.value.questions || [];
    state.stale = pruneApplied(state.questions);
    /* A restored draft may answer a question an earlier run has since
       answered; sending it would sink the batch. Said, not silently dropped. */
    const dropped = pruneDraft();
    if (dropped) {
      state.warn = `${dropped} drafted answer(s) were dropped: the queue no longer `
        + "asks those questions, so a run would have refused the whole batch.";
    }
  } else {
    /* Until the first refresh publishes it there is nothing to answer, which is
       a state worth naming rather than showing as a failure. */
    state.questions = [];
    /* No queue read means no proof either way, so the applied keys stay -- but
       there is nothing on the page for the note to point at. */
    state.stale = 0;
    state.error = String(queue.reason.message).includes("404")
      ? "No published queue yet. It appears after the next refresh run."
      : `Could not read the queue (${queue.reason.message}).`;
  }
  if (llm.status === "fulfilled") state.llm = llm.value;
  else state.error = `Could not read llm.json (${llm.reason.message}).`;

  /* Its own error rather than the page's: the list is one tab, and a
     repository that predates it should not red the whole page. */
  if (reference.status === "fulfilled" && Array.isArray(reference.value)) {
    state.reference = { slugs: reference.value.filter((s) => typeof s === "string"), error: "" };
  } else {
    const why = reference.status === "fulfilled"
      ? "the file is not a JSON array of slugs"
      : reference.reason.message;
    state.reference = { slugs: null, error: String(why) };
  }

  render();
}

/* The mapping log, read once and only when the Updates tab wants it: it is the
   largest file here after llm.json, and most sittings never open that tab. */
async function ensureMapLog(force = false) {
  if (!state.raw || (state.mapLog.asked && !force)) return;
  state.mapLog.asked = true;
  try {
    const response = await fetch(bust(`${dataBase()}/_log/mappings.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const body = await response.json();
    state.mapLog = {
      entries: (body.entries || []).filter((e) => e && typeof e.at === "string"),
      error: "",
      asked: true,
    };
  } catch (error) {
    state.mapLog = { entries: null, error: String(error.message), asked: true };
  }
  if (state.tab === "updates") render();
}

async function loadRuns() {
  try {
    const response = await fetch(bust("api.php"), { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.runs = body.runs || [];
    /* Announced rather than required: an endpoint without an AA key -- or one
       older than this page -- costs the rename suggestions and nothing else. */
    /* Announced rather than required, like the AA key above: without it the
       page cannot tell an applied batch from a refused one and keeps every
       answered card locked, which costs a wait rather than a rejected batch.
       Read before settling, which is what asks. */
    state.steps = Boolean(body.steps);
    /* Announced too, so an older endpoint costs the Runs tab its button rather
       than offering one that 400s. */
    state.refreshable = Boolean(body.refresh);
    /* Announced as well: an older endpoint costs the Runs tab its warnings. */
    state.warningsOffered = Boolean(body.warnings);
    /* And the quick run: an older endpoint costs the bar its Quick choice. */
    state.quickOffered = Boolean(body.quick);
    loadRunWarnings();
    await settleSent();
    if (body.raw) state.raw = body.raw;
    if (body.repo) state.repo = body.repo;
    if (body.ref) state.ref = body.ref;
    if (!state.raw || (body.api || 1) < NEEDS_API) {
      state.error = "api.php answered, but it is older than this page: it did not "
        + "say which repository to read. Upload _admin/api.php alongside "
        + "index.html -- ./_admin/deploy sends both. Until then the queue cannot "
        + "be loaded and nothing can be sent.";
      return false;
    }
    return true;
  } catch (error) {
    state.runs = [];
    state.refreshable = false;
    state.error = `Could not reach api.php (${error.message}). `
      + "Nothing can be read or sent until it answers -- check the host config "
      + "and the error log; see _admin/README.md.";
    return false;
  }
}

/* A broken fetcher no longer reds a run -- it is a warning on it, so a green
   run may still have skipped a source. Asked for per finished run, in parallel
   and in the background: nothing waits on them, and each one re-renders the
   Runs tab when it lands. A read that fails is not remembered, so the next
   run list read asks again. */
function loadRunWarnings() {
  if (!state.warningsOffered) return;
  for (const run of state.runs) {
    if (run.status !== "completed" || state.runWarnings.has(run.id)) continue;
    state.runWarnings.set(run.id, { pending: true });
    fetch(bust(`api.php?warnings=${encodeURIComponent(run.id)}`), { cache: "no-store" })
      .then(async (response) => {
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        state.runWarnings.set(run.id, {
          warnings: Array.isArray(body.warnings) ? body.warnings : null,
          reason: body.reason || "",
        });
      })
      .catch(() => { state.runWarnings.delete(run.id); })
      .finally(() => { if (state.tab === "runs") render(); });
  }
}

/* The universes are derived here rather than shipped with the queue: the model
   list alone is hundreds of names and the AA list thousands, so committing them
   would rewrite pending.json on runs where no question changed. answer.py
   revalidates everything regardless, which is the check that counts. */
const models = () => [...new Set([
  ...(state.llm?.models || []).map((m) => m.name).filter(Boolean),
  ...batchCreated(),
])].sort();

/* The models this batch adds, by name. A mapping may answer with one of them --
   answer.py runs the creates first -- so they are searchable on every Queue
   card, and a second board listing the same release maps onto it too. */
const batchCreated = () => [...state.answers.values()]
  .filter((record) => record.kind === "model-create" || record.kind === "model-add")
  .map((record) => record.name);

/* What llm.json records of one score's past, newest first, each entry saying
   what that write did. The kind is derived from the list rather than stored --
   the same rule _history.py writes by and llm.html reads by, so the three
   cannot drift: nothing before it is an arrival, a null is a withdrawal,
   anything else replaced the number in the entry before it. An entry older
   than history_since is a first sighting: the index kept no history then, so
   all that is known is the day the score was last written. */
function recordedHistory(model, key) {
  const log = model?.scores_history?.[key];
  if (!Array.isArray(log)) return [];
  const since = state.llm?.history_since || "";
  let previous = null;
  const events = log.filter((entry) => entry && entry.date).map((entry) => {
    const value = typeof entry.score === "number" ? entry.score : null;
    const seeded = previous === null && since && entry.date < since;
    const kind = value === null ? "withdrawn"
      : previous === null ? (seeded ? "first recorded" : "added")
      : `was ${previous}`;
    const event = { date: entry.date, value, kind };
    previous = value;
    return event;
  });
  return events.reverse();
}
const benchmarks = () => [...new Set([
  ...Object.entries(state.llm?.benchmarks || {})
    .filter(([, b]) => b?.derived !== true)
    .map(([key]) => key),
  ...batchCreatedBenchmarks(),
])].sort();

/* What a benchmark column actually holds -- which metric, which subset,
   whether tools were allowed, which harness -- and what must not be filed in
   it. The queue asks "is this label that column?", and llm.json is the only
   place that answers it: a key like `charxiv_reasoning` says nothing about the
   split or the tool mode, and the labels that turn up here
   ("CharXiv (descriptive)", "HLE w/ tools", "Terminal Bench 2.1 (best
   harness)") differ from the column by exactly that. */
function benchNote(key) {
  const bench = state.llm?.benchmarks?.[key];
  if (!bench) return null;
  const settings = Array.isArray(bench.settings)
    ? bench.settings.filter((tag) => typeof tag === "string" && tag.trim())
    : [];
  const excludes = Array.isArray(bench.excludes)
    ? bench.excludes.filter((item) => typeof item === "string" && item.trim())
    : [];
  if (!settings.length && !excludes.length) return null;
  return el("div", { className: "bench-note" }, [
    bench.name ? el("span", { className: "bench-note-name" }, bench.name) : null,
    settings.length
      ? el("span", { className: "bench-tags" },
          settings.map((tag) => el("span", { className: "bench-tag" }, tag.trim())))
      : null,
    excludes.length ? el("span", { className: "excludes" }, `Not this: ${excludes.join(" · ")}`) : null,
  ]);
}

/* Which list an answer must come from, as the queue states it.
   Never inferred from the kind: update_huggingface_mapping.py asks a plain
   "mapping" question whose answers are benchmark keys, so guessing from the
   kind string offered model slugs for every HuggingFace question. propose.ROUTES
   is where this is known, and pending.json now carries it.
   An older queue has no universe field; offering nothing beats offering the
   wrong list, and the next refresh restores it. */
const UNIVERSES = {
  models,
  benchmarks,
  /* The AA route asks which slug a model is, and its answers are AA's own
     names -- which the page can only offer now that api.php can list them.
     Empty without a key, which is the same as it has always been: the
     candidates the queue carries, and nothing to search. */
  "aa-slugs": () => state.aa.slugs || [],
};

/* What a question's answer has to be, in words, for the card's chip. */
const UNIVERSE_NOUNS = {
  models: ["a model", "models"],
  benchmarks: ["a benchmark", "benchmarks"],
  "aa-slugs": ["an Artificial Analysis slug", "AA slugs"],
};
const universeNoun = (question, plural = false) =>
  (UNIVERSE_NOUNS[question.universe] || UNIVERSE_NOUNS.models)[plural ? 1 : 0];

function universeFor(question) {
  const build = UNIVERSES[question.universe];
  return build ? build() : [];
}

/* ---------------------------------------------------------------- answers */

/* rerender:false is for the free-text box. render() rebuilds the whole view,
   which replaces the very input being typed into -- the caret, the value and
   the focus all went with it, so the box could only ever be filled by picking
   from the list in one shot. Typing now updates the batch and touches only the
   footer and this card. */
function setAnswer(question, record, rerender = true) {
  const key = KEY(question);
  if (record === null) state.answers.delete(key);
  else state.answers.set(key, record);
  if (rerender) render();
  else refreshFooter();
}

/* The count, and from CAP_NOTICE_AT on, how much room is left in the batch.
   Named before it runs out rather than after: past the cap the only way out is
   to un-answer cards, and the further in that is discovered the more of the
   sitting has to be undone. */
function refreshFooter() {
  const pending = state.answers.size;
  const room = MAX_RECORDS - pending;
  const count = document.getElementById("count");
  const text = !pending
    ? "Nothing to send yet"
    : room < 0
      ? `${pending} answers -- ${-room} over the ${MAX_RECORDS} a batch holds; `
        + `un-answer ${-room} to send`
      : room === 0
        ? `${MAX_RECORDS} of ${MAX_RECORDS} ready to send -- a batch is full`
        : pending >= CAP_NOTICE_AT
          ? `${pending} of ${MAX_RECORDS} ready to send -- room for ${room} more`
          : `${pending} answer${pending === 1 ? "" : "s"} ready to send`;
  /* The count, and under it what Send will do with them -- the choice beside
     it is three words, and the cost of each is worth reading before sending. */
  count.replaceChildren(text,
    pending ? el("span", { id: "mode-hint" }, `Send ${MODE_HINTS[state.mode]}`) : "");
  renderMode();
  saveDraft();
  count.classList.toggle("ready", pending > 0 && pending < CAP_NOTICE_AT);
  count.classList.toggle("near", pending >= CAP_NOTICE_AT && room >= 0);
  count.classList.toggle("over", room < 0);
  const send = document.getElementById("send");
  /* Disabled rather than left to fail on the endpoint: the 400 comes back after
     the batch has been typed out in full, and says nothing about which answers
     to drop. */
  send.disabled = pending === 0 || room < 0;
  send.title = room < 0 ? `At most ${MAX_RECORDS} answers per batch.` : "";
  document.getElementById("clear").disabled = pending === 0;
}

const answerOf = (question) => state.answers.get(KEY(question));

function mappingRecord(question, value) {
  return {
    kind: "mapping",
    route: question.route,
    route_kind: question.route_kind,
    subject: question.subject,
    answer: value,
    /* What the queue said the file held. answer.py rejects the record if the
       file has since changed, rather than overwriting whoever answered first. */
    if_previous: question.if_previous ?? null,
  };
}

/* --------------------------------------------------------------- rendering */

/* The corner's GitHub button, pointed at whichever repository api.php names.
   Hidden until it does: a link to the wrong repository is worse than no link,
   and an endpoint that has not answered is a state the page already reports
   loudly enough elsewhere. */
function setRepoLink() {
  const link = document.getElementById("repoLink");
  link.href = state.repo ? `https://github.com/${state.repo}` : "#";
  link.hidden = !state.repo;
  if (state.repo) link.title = `Repository: ${state.repo}`;
}

function render() {
  /* Named, so it is obvious which repository a batch is about to be sent to. */
  /* With the commit the data was read at, so "is this the queue after the
     run?" can be answered by comparing it with the run's commit on GitHub. */
  document.getElementById("repo").textContent = state.repo
    ? `${state.repo}${state.sha ? ` @${state.sha.slice(0, 7)}` : ""}` : "";
  setRepoLink();
  renderTabs();

  const notice = document.getElementById("notice");
  notice.replaceChildren();
  if (state.error) notice.append(el("div", { className: "note bad" }, state.error));
  if (state.warn) notice.append(el("div", { className: "note busy" }, state.warn));
  if (state.ok) notice.append(el("div", { className: "note good" }, state.ok));
  if (locked()) notice.append(inFlightNote());
  else if (state.stale) notice.append(staleQueueNote());

  document.getElementById("view").replaceChildren(
    state.tab === "queue" ? renderQueue()
      : state.tab === "updates" ? renderUpdates()
      : state.tab === "new" ? renderNew()
        : state.tab === "models" ? renderModels()
          : state.tab === "benchmarks" ? renderBenchmarks()
          : state.tab === "reference" ? renderReference()
            : renderRuns()
  );

  refreshFooter();
  syncPolling();
}

/* Why those cards are disabled, and what to wait for. */
function inFlightNote() {
  const run = applyingRun();
  const count = state.sent.keys.length;
  return el("div", { className: "note busy" }, el("span", {}, [
    count === 1 ? "1 answer is on its way" : `${count} answers are on their way`,
    run ? " in " : ", but the run has not appeared on GitHub yet.",
    run ? el("a", { href: run.url, target: "_blank", rel: "noreferrer" }, run.name || String(run.id)) : null,
    run ? ` (${runLabel(run)}).` : "",
    " Until that run finishes, the questions it answers stay disabled: the queue "
    + "is only republished when the run pushes, so it still lists them, and "
    + "answering one twice would have the next batch rejected as stale. Checked "
    + `every ${POLL_MS / 1000} seconds.`,
  ]));
}

/* A card whose answer is in the run, or in one that has already applied it.
   Disabled after the fact rather than at every control, so one place locks
   every kind of card and one unlocks it. */
function lockCard(card, applied = false) {
  card.classList.add("sent");
  card.classList.remove("answered");
  card.querySelectorAll("button, input, select, textarea").forEach((node) => { node.disabled = true; });
  card.prepend(el("div", { className: "sent-mark" }, applied ? [
    el("span", { className: "pill success" }, [el("span", { className: "dot" }), "answered"]),
    "answered in an earlier batch -- the queue has not caught up yet",
  ] : [
    el("span", { className: "pill running" }, [el("span", { className: "dot" }), "sent"]),
    "the run is applying this answer",
  ]));
  return card;
}

const guard = (card, key) => (
  isSent(key) ? lockCard(card)
    : isApplied(key) ? lockCard(card, true)
      : card
);

/* Why a card is locked when nothing is in flight. Two ways the queue comes back
   still listing an answered question: the run pushes the re-rendered queue
   seconds before it reports completed and raw serves the previous blob for a
   while yet, and a record-only run does not republish it at all -- so this can
   mean a minute or the wait for the next scheduled refresh. */
function staleQueueNote() {
  return el("div", { className: "note busy" }, el("span", {}, [
    state.stale === 1
      ? "1 question below has already been answered and sent"
      : `${state.stale} questions below have already been answered and sent`,
    ", and the queue has not caught up: a run republishes it only after a "
    + "successful refresh, and a record-only run skips that entirely. They stay "
    + "locked until it does -- answering one again would be refused as a "
    + "question nothing asked, and a batch is all or nothing. A question the "
    + "site means to ask again unlocks itself once a scheduled run has "
    + "republished the queue still listing it.",
  ]));
}

const tabList = (mappingCount = null, newCount = null) => [
  ["queue", "Queue", mappingCount],
  ["new", "New models", newCount],
  ["updates", "Updates", null],
  ["models", "Models", null],
  ["benchmarks", "Benchmarks", null],
  ["reference", "Reference", state.reference.slugs?.length ?? null],
  ["runs", "Runs", null],
];

/* The tab lives in the URL, so a reload lands where it was and a phone's back
   button steps back through the tabs instead of leaving the page. */
function showTab(id, { push = true } = {}) {
  if (!tabList().some(([tab]) => tab === id)) id = "queue";
  const changed = state.tab !== id;
  state.tab = id;
  if (push && location.hash !== `#${id}`) history.pushState(null, "", `#${id}`);
  render();
  if (changed) window.scrollTo({ top: 0 });
  /* The tab strip scrolls sideways on a phone; keep the chosen one in view. */
  document.querySelector('#tabs button[aria-selected="true"]')
    ?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderTabs() {
  const mappingCount = state.questions.filter((q) => q.route !== NEW_MODEL_ROUTE).length;
  const newCount = state.questions.filter((q) => q.route === NEW_MODEL_ROUTE).length;
  document.getElementById("tabs").replaceChildren(
    ...tabList(mappingCount, newCount).map(([id, label, n]) => {
      const button = el("button", {
        type: "button",
        onclick: () => showTab(id),
      }, label);
      button.setAttribute("aria-selected", String(state.tab === id));
      if (n !== null) button.append(el("span", { className: "badge" }, String(n)));
      return button;
    })
  );
}

function chip(label, value, { className = "", prose = false } = {}) {
  return el("span", { className: `chip ${className}`.trim() },
    [label ? el("b", {}, label) : null,
     el("span", { className: prose ? "prose" : "mono" }, value)]);
}

function option(text, why, { pressed, className = "", tag = "", note = null, onclick }) {
  const head = el("div", { className: "head" },
    [el("span", {}, text), tag ? el("span", { className: "tag" }, tag) : null]);
  const button = el("button", { type: "button", className: `opt ${className}`.trim(), onclick }, head);
  button.setAttribute("aria-pressed", String(pressed));
  button.append(el("span", { className: "why" }, why));
  if (note) button.append(note);
  button.append(el("span", { className: "tick" }, "✓"));
  return button;
}

const sourceOf = (question) => question.route.replace(/^update_/, "").replace(/_mapping\.py$/, "");

/* Whether a question is about `needle`: its subject, or any name offered as its
   answer. The second half is the one that matters after a quick run -- a model
   just added is a *candidate* on every board that lists it, not a subject, so
   typing its name here gathers exactly the questions it raised. */
const questionMatches = (question, needle) => !needle
  || question.subject.toLowerCase().includes(needle)
  || (question.candidates || []).some((c) => String(c.option).toLowerCase().includes(needle));

function renderQueue() {
  const questions = state.questions.filter((q) => q.route !== NEW_MODEL_ROUTE);
  if (questions.some((q) => q.universe === "aa-slugs")) ensureAaSlugs();
  if (!questions.length) {
    return el("p", { className: "empty" },
      "Nothing pending. Every source name and benchmark label is mapped.");
  }
  const box = el("div", { className: "stack" });
  const list = el("div", { className: "stack" });

  /* Filters, once there are enough questions to need them. Kept in state so
     answering a card -- which re-renders -- does not throw them away. */
  if (questions.length > 4) {
    const counts = new Map();
    for (const q of questions) counts.set(sourceOf(q), (counts.get(sourceOf(q)) || 0) + 1);
    const source = el("select", {
      onchange: () => { state.queueFilter.source = source.value; draw(); },
    }, [el("option", { value: "" }, `All sources (${questions.length})`),
      ...[...counts.entries()].sort().map(([name, n]) =>
        el("option", { value: name, selected: state.queueFilter.source === name }, `${name} (${n})`))]);
    const text = noAuto(el("input", {
      type: "search",
      placeholder: "Filter by name or candidate...",
      value: state.queueFilter.text,
      enterKeyHint: "search",
    }));
    text.oninput = () => { state.queueFilter.text = text.value; draw(); };
    const shown = el("span", { className: "count" });
    box.append(el("div", { className: "toolbar search" }, [
      el("div", { className: "grow" }, text), el("div", {}, source), shown]));

    const draw = () => {
      const needle = state.queueFilter.text.trim().toLowerCase();
      const found = questions.filter((q) => (!state.queueFilter.source
        || sourceOf(q) === state.queueFilter.source) && questionMatches(q, needle));
      shown.textContent = found.length === questions.length ? "" : `${found.length} shown`;
      list.replaceChildren(...(found.length
        ? found.map((question) => guard(renderQuestion(question), KEY(question)))
        : [el("p", { className: "empty" }, "No question matches that filter.")]));
    };
    draw();
  } else {
    list.append(...questions.map((question) => guard(renderQuestion(question), KEY(question))));
  }
  box.append(list);
  return box;
}

/* "New model" on a Queue card: a release a board lists before Artificial
   Analysis does, added and mapped in one sitting. The card opens the same form
   as the New models tab's "Add a model", pre-filled from the source's name, and
   while it is open it owns the question's answer -- its create record and the
   mapping onto it come and go together. answer.py runs creates first. */
const createDraftFor = (key) => state.newModels.find((d) => d.question === key);

function dropCreate(question) {
  const draft = createDraftFor(KEY(question));
  if (!draft) return false;
  if (draft.key) state.answers.delete(draft.key);
  state.answers.delete(KEY(question));
  state.newModels = state.newModels.filter((d) => d !== draft);
  return true;
}

/* The slug a source's name most likely wants: its last path segment, in the
   shape every llm.json name has. A guess to edit, not an answer -- a board's
   "stepfun/step-5-preview" is usually right, its "Step 5 (Preview)" less so. */
const guessName = (subject) => normSlug(String(subject).split("/").pop());

/* The creator, when the source names its org ("stepfun/...") and exactly one
   creator llm.json knows reads the same. Short names must match outright:
   "ai2" is a prefix of "ai21labs" and names somebody else. */
function guessCreator(subject) {
  const parts = String(subject).split("/");
  if (parts.length < 2) return null;
  const squash = (value) => normSlug(value).replace(/-/g, "");
  const head = squash(parts[0]);
  if (!head) return null;
  const hits = fieldSuggestions("creator").filter((name) => {
    const known = squash(name);
    if (known === head) return true;
    return Math.min(known.length, head.length) >= 4
      && (known.startsWith(head) || head.startsWith(known));
  });
  return hits.length === 1 ? hits[0] : null;
}

function openCreate(question) {
  state.answers.delete(KEY(question));
  const fields = {};
  const creator = guessCreator(question.subject);
  if (creator) {
    fields.creator = creator;
    const url = creatorUrl(creator);
    if (url) fields.creator_url = url;
  }
  state.newModels.push({
    id: draftId(), name: guessName(question.subject), fields, key: "", question: KEY(question),
  });
}

function renderQuestion(question) {
  const chosen = answerOf(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  const creating = question.universe === "models" ? createDraftFor(KEY(question)) : null;
  /* Every other answer closes the form: one question, one answer. */
  const choose = (record) => {
    dropCreate(question);
    setAnswer(question, record);
  };
  card.append(el("div", { className: "subject" }, question.subject));

  const chips = el("div", { className: "chips" }, [
    chip("source", sourceOf(question)),
    chip("answer", universeNoun(question), { prose: true }),
  ]);
  if (question.if_previous) {
    chips.append(chip("now", question.if_previous.join(", "), { className: "now" }));
  }
  if (question.ruled_out) {
    /* Back because something new matched: what is listed is what is left. */
    chips.append(chip("ruled out", `${question.ruled_out} earlier`, { prose: true }));
  }
  card.append(chips);
  if (question.note) card.append(el("div", { className: "note-text" }, question.note));

  const options = el("div", { className: "options" });
  for (const candidate of question.candidates || []) {
    const pressed = chosen?.answer === candidate.option;
    const exact = candidate.confidence === "exact";
    options.append(option(candidate.option, candidate.reason, {
      pressed,
      className: exact ? "exact" : "",
      tag: exact ? "best match" : "",
      note: question.universe === "benchmarks" ? benchNote(candidate.option) : null,
      onclick: () => choose(pressed ? null : mappingRecord(question, candidate.option)),
    }));
  }
  if (question.universe === "models") {
    options.append(option("New model…", creating
      ? `adds ${creating.name.trim() || "it"} and maps this name to it, in one batch`
      : "not tracked yet: add it here and map this name to it in one go", {
      pressed: Boolean(creating),
      className: "decline",
      onclick: () => {
        if (!dropCreate(question)) openCreate(question);
        render();
        /* Into view, not focused: the name is already filled in, and focus
           would open the keyboard over the rest of the form on a phone. */
        if (!creating) {
          document.querySelector(`#view [data-create="${CSS.escape(KEY(question))}"]`)
            ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      },
    }));
  }
  /* None of these: rule every candidate shown out, and answer nothing else.
     The name stays unreviewed, so it is asked again -- with only the new
     candidates -- once the matcher finds one that is not in this list. Only
     the candidates the queue graded against a real list: a "recorded" one was
     offered by the prompt alone, and the runner could not check it. */
  const skippable = (question.candidates || [])
    .filter((c) => c.confidence !== "recorded").map((c) => c.option);
  if (skippable.length) {
    const skipping = chosen?.kind === "candidates-skip";
    options.append(option("None of these",
      skipping
        ? `rules out ${skippable.join(", ")}; asked again when a new candidate turns up`
        : "not a match, but not unmappable either: ask again when a new candidate turns up", {
        pressed: skipping,
        className: "decline",
        onclick: () => choose(skipping ? null : {
          kind: "candidates-skip",
          route: question.route,
          route_kind: question.route_kind,
          subject: question.subject,
          answer: skippable,
        }),
      }));
  }
  const declined = chosen?.answer === "__unmappable__";
  options.append(option("__unmappable__", "reviewed, deliberately not mapped", {
    pressed: declined,
    className: "decline",
    onclick: () => choose(declined ? null : mappingRecord(question, "__unmappable__")),
  }));
  card.append(options);

  if (creating) {
    const form = renderAddModel(creating, 0, flyingCreates(), {
      question,
      onCommit: (ok) => card.classList.toggle("answered", ok),
    });
    form.dataset.create = KEY(question);
    card.append(form);
  }

  /* Anything the candidates missed. Filtered client-side purely so the control
     is usable; the value is checked again on the runner. */
  const universe = universeFor(question);
  if (universe.length) {
    const freeform = chosen
      && !creating
      && chosen.kind === "mapping"
      && chosen.answer !== "__unmappable__"
      && !(question.candidates || []).some((c) => c.option === chosen.answer);
    const noun = universeNoun(question, true);
    const input = slugInput({
      placeholder: `Search all ${universe.length} ${noun}...`,
      value: freeform ? chosen.answer : "",
    });
    /* A list drawn by hand rather than a datalist: Android's datalist popup
       covers the keyboard's suggestion strip, cannot be scrolled past a few
       rows and does not match mid-word, which is how a slug is remembered. */
    const list = comboBox(input, () => universe, {
      min: 2,
      detail: question.universe === "aa-slugs" ? aaSlugDetail
        : question.universe === "benchmarks" ? (key) => {
          const name = state.llm?.benchmarks?.[key]?.name;
          return name && name !== key ? ` (${name})` : "";
        } : () => "",
    });
    /* An answer typed here is an answer, and until now it was the only one
       that did not look like one: a button turns solid when it is chosen, and
       a filled box looked exactly like a half-typed one. So the field carries
       the state -- and, for a benchmark, the same terms the buttons carry,
       because a name typed in by hand is the answer most likely to be wrong:
       nothing offered it. */
    const picked = el("div", {});
    const field = el("div", { className: "field picker" }, [list, picked]);
    const drawPicked = () => {
      const value = input.value.trim();
      const known = universe.includes(value);
      field.classList.toggle("is-picked", known);
      // Half-typed is neither an answer nor an error; only a finished word
      // that names nothing is worth flagging.
      input.classList.toggle("unknown", Boolean(value) && !known);
      picked.replaceChildren();
      const note = known && question.universe === "benchmarks" ? benchNote(value) : null;
      if (note) picked.append(note);
    };
    input.oninput = () => {
      const value = input.value.trim();
      const known = universe.includes(value);
      /* Typing here is choosing another answer, so an open "New model" form
         goes -- taken out of the card by hand, since a render would replace
         the box being typed into. */
      if (value && dropCreate(question)) {
        card.querySelector(".add-model")?.remove();
      }
      setAnswer(question, known ? mappingRecord(question, value) : null, false);
      card.classList.toggle("answered", Boolean(answerOf(question)));
      if (value) {
        card.querySelectorAll('.opt[aria-pressed="true"]')
          .forEach((button) => button.setAttribute("aria-pressed", "false"));
      }
      drawPicked();
    };
    drawPicked();
    card.append(field);
  }
  return card;
}

function renderNew() {
  ensureAaSlugs();
  const questions = state.questions.filter((q) => q.route === NEW_MODEL_ROUTE);
  const box = el("div", { className: "stack" }, renderAddModels());
  if (!questions.length) {
    box.append(el("p", { className: "empty" },
      "No new models waiting. Artificial Analysis has offered nothing this site "
      + "does not already track."));
    return box;
  }
  box.append(renderNewBulk(questions), ...questions.map(renderNewQuestion));
  return box;
}

/* Every offered model answered the same way in one tap -- a release week can
   put a dozen on this tab, and on a phone that was a dozen scrolls and taps.
   Only the open questions: one already sent or answered stays as it is. */
function renderNewBulk(questions) {
  const open = questions.filter((q) => !isSent(KEY(q)) && !isApplied(KEY(q)));
  const all = (record) => {
    for (const question of open) setAnswer(question, record(question), false);
    render();
  };
  const bar = el("div", { className: "toolbar" }, [
    el("span", { className: "count grow" },
      `${questions.length} offered by Artificial Analysis`),
    el("button", {
      type: "button", className: "btn ghost tiny", disabled: !open.length,
      onclick: () => all((q) => ({ kind: "model-add", name: q.subject })),
    }, `Add all ${open.length}`),
    el("button", {
      type: "button", className: "btn ghost tiny", disabled: !open.length,
      onclick: () => all((q) => ({ kind: "new-model", subject: q.subject, answer: "__ignored__" })),
    }, "Ignore all"),
    el("button", {
      type: "button", className: "btn ghost tiny",
      disabled: !open.some((q) => answerOf(q)),
      onclick: () => all(() => null),
    }, "Reset"),
  ]);
  return bar;
}

/* Models nothing offered. check_new.py finds the ones Artificial Analysis
   publishes; this is the other direction -- a release AA does not track, or
   does not track yet -- so there is no question to answer and no slug to
   accept. add.py builds each entry from what is typed here, filling anything
   left blank from AA if it happens to know the name.

   One card per model, as many as a sitting needs: a family released together
   is one batch, and one run adds them all. Each card owns one record in the
   batch, remembered as the draft's `key`, so editing one never disturbs
   another's. */
const MODEL_CREATE_KEY = (name) => `model-create  ${name}`;

/* What is already on its way, from the batch that was sent rather than from
   the cards: a card is gone once sent, so a reload shows the same thing. */
const flyingCreates = () => (locked()
  ? state.sent.keys.filter((key) => key.startsWith("model-create  "))
    .map((key) => key.slice("model-create  ".length))
  : []);

function renderAddModels() {
  /* The cards opened from a Queue question live on that question's card. */
  const standalone = () => state.newModels.filter((d) => !d.question);
  if (!standalone().length) state.newModels.push({ id: draftId(), name: "", fields: {}, key: "", question: "" });
  const box = el("div", { className: "stack" });

  const flying = flyingCreates();
  if (flying.length) {
    const card = el("div", { className: "card" }, [
      el("div", { className: "subject" }, flying.length === 1 ? "Being added" : `Being added (${flying.length})`),
      el("div", { className: "queued" }, flying.map((name) =>
        el("div", { className: "queued-row sent" }, el("span", {}, name)))),
    ]);
    box.append(lockCard(card));
  }

  standalone().forEach((draft, index) => box.append(renderAddModel(draft, index, flying)));

  const another = el("button", { className: "btn ghost", type: "button" }, "+ Add another model");
  another.onclick = () => {
    state.newModels.push({ id: draftId(), name: "", fields: {}, key: "", question: "" });
    render();
    /* The new card is the last; put its name box under the thumb. */
    const inputs = document.querySelectorAll("#view .add-model input");
    inputs[inputs.length - 1]?.focus();
  };
  box.append(el("div", {}, another));
  return box;
}

/* `question` is set when the form is opened from a Queue card: it then also
   writes that question's mapping onto the model it adds, and `onCommit` tells
   the card whether the pair is in the batch. */
function renderAddModel(draft, index, flying, { question = null, onCommit = null } = {}) {
  const card = el("div", { className: `card add-model${question ? " nested" : ""}` });
  const known = new Set((state.llm?.models || []).map((m) => m.name));

  const discard = el("button", { className: "btn ghost tiny", type: "button" },
    question ? "Cancel" : "Discard");
  discard.onclick = () => {
    if (question) {
      dropCreate(question);
    } else {
      if (draft.key) state.answers.delete(draft.key);
      state.newModels = state.newModels.filter((d) => d !== draft);
    }
    render();
  };
  const hasContent = draft.name.trim() || Object.keys(draft.fields).length;
  card.append(el("div", { className: "card-head" }, [
    el("div", { className: "subject" },
      question ? "Add it as a new model" : index === 0 ? "Add a model" : "Add another model"),
    question || state.newModels.filter((d) => !d.question).length > 1 || hasContent ? discard : null,
  ]));

  const status = el("div", { className: "chips" });
  const tip = el("p", { className: "tip-text", hidden: true });
  const commit = () => {
    if (draft.key) state.answers.delete(draft.key);
    draft.key = "";
    const name = draft.name.trim();
    const shaped = SLUG_RE.test(name);
    const taken = known.has(name);
    const broken = META_FIELDS.some(([f, type]) => type === "url" && badUrl(draft.fields[f]));
    /* Typed back in after being sent: the run is creating it, and a second
       record would have add.py refuse the whole batch for a duplicate name. */
    const inFlight = flying.includes(name);
    /* The same name on two cards is one entry twice, which answer.py refuses --
       and so is one the New models tab is already adding from AA's offer. */
    const twice = state.newModels.some((d) => d !== draft && d.name.trim() === name)
      || batchCreated().includes(name);

    status.replaceChildren(...(!name ? [] : [
      !shaped
        ? chip("", "not a slug: lowercase words joined by single dots or dashes",
          { prose: true, className: "now" })
        : taken
          ? chip("", "already tracked -- edit it on the Models tab", { prose: true, className: "now" })
          : inFlight
            ? chip("", "already sent -- the run is creating it", { prose: true, className: "now" })
            : twice
              ? chip("", question
                ? "already being added in this batch -- close this and pick it in the search box below"
                : "named on another card too -- one entry per name", { prose: true, className: "now" })
              : state.aa.slugs === null
                ? chip("", "adding it as a new entry", { prose: true })
                : state.aa.slugs.includes(name)
                  ? chip("", `an Artificial Analysis slug${aaSlugDetail(name)}: its scores arrive on the next refresh`,
                    { prose: true })
                  : chip("", "not an AA slug: AA scores will need a mapping or a rename later",
                    { prose: true }),
    ]));

    const ok = shaped && !taken && !broken && !inFlight && !twice;
    if (ok) {
      const fields = Object.fromEntries(
        Object.entries(draft.fields).filter(([, value]) => value !== null)
      );
      draft.key = MODEL_CREATE_KEY(name);
      state.answers.set(draft.key, { kind: "model-create", name, fields });
    }
    if (question) {
      /* The pair goes in together or not at all: a mapping onto a name that is
         not being created would be refused, and take the batch with it. */
      if (ok) state.answers.set(KEY(question), mappingRecord(question, name));
      else state.answers.delete(KEY(question));
      onCommit?.(ok);
    }
    card.classList.toggle("answered", ok && !question);
    if (question) {
      tip.hidden = !ok;
      tip.textContent = `Two records: adds ${name}, then maps ${question.subject} to it. `
        + "Full scores it in this run; Quick asks every other board about it first.";
    } else {
      tip.hidden = !ok || state.mode === "quick" || !state.quickOffered;
      tip.textContent = "Tip: send with Quick and the run asks every board about this "
        + "model in a couple of minutes, so its mappings can be answered in this sitting.";
    }
    refreshFooter();
  };

  const nameInput = slugInput({ placeholder: "acme-model-1", value: draft.name });
  nameInput.oninput = () => {
    draft.name = nameInput.value;
    nameInput.classList.toggle("unknown",
      Boolean(draft.name.trim()) && !SLUG_RE.test(draft.name.trim()));
    commit();
  };
  /* The AA slugs the site does not carry yet: the names most likely to be
     wanted here, and the ones whose scores arrive without a mapping. Picking
     one also fills the creator, when AA names it and nothing is typed. */
  const offered = () => (state.aa.slugs || []).filter((slug) => !known.has(slug));
  const nameBox = comboBox(nameInput, offered, {
    detail: aaSlugDetail,
    onPick: (slug) => {
      const creator = state.aa.models?.get(slug)?.creator;
      if (creator && !draft.fields.creator && inputs.creator) {
        inputs.creator.value = creator;
        inputs.creator.oninput();
      }
    },
  });
  card.append(el("div", { className: "field" }, [el("label", {}, "name"), nameBox]), status);

  /* Held so the creator field can reach the creator url field below it: the
     handler runs long after the loop, by which time both are in here. */
  const inputs = {};
  const fillCreatorUrl = creatorUrlFiller(inputs, "");
  /* Only the name is needed; the rest folds away on a phone, where six empty
     fields per card is a lot of scrolling for what add.py fills from AA. */
  const more = el("details", { open: Object.keys(draft.fields).length > 0 });
  more.append(el("summary", { className: "note-text", style: "cursor:pointer" },
    "Details (optional): params, context, url, creator"));
  for (const [field, type, placeholder] of META_FIELDS) {
    if (field === "date_added") continue;   // add.py stamps the day it runs
    const input = el("input", { type, placeholder, value: draft.fields[field] ?? "" });
    if (type === "url") { input.inputMode = "url"; noAuto(input); }
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === "") delete draft.fields[field];
      else draft.fields[field] = value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    more.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), ...fieldControl(field, input)]));
  }
  more.append(el("p", { className: "note-text" },
    "Anything left blank is filled from Artificial Analysis when it knows the "
    + "name, and stays empty when it does not. Scores land on the next refresh; "
    + "type them in on the Models tab if they are not coming from anywhere."));
  card.append(more, tip);

  commit();
  return card;
}

function renderNewQuestion(question) {
  const chosen = answerOf(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  card.append(el("div", { className: "subject" }, question.subject));
  if (question.note) {
    card.append(el("div", { className: "chips" }, chip("", question.note, { prose: true })));
  }

  /* "Yes" is a model-add, not an __added__ decision. apply_decisions() keeps
     __added__ only for an entry already in llm.json; for a new slug it clears
     the line without dismissing it, so the model is offered again on every
     run after this one. */
  const adding = chosen?.kind === "model-add";
  const ignoring = chosen?.kind === "new-model";
  card.append(el("div", { className: "options" }, [
    option("Add it", "adds the entry; scores land on the next refresh", {
      pressed: adding,
      className: "exact",
      onclick: () => setAnswer(question, adding ? null
        : { kind: "model-add", name: question.subject }),
    }),
    option("Ignore it", "never offer this slug again", {
      pressed: ignoring,
      className: "decline",
      onclick: () => setAnswer(question, ignoring ? null
        : { kind: "new-model", subject: question.subject, answer: "__ignored__" }),
    }),
  ]));
  return guard(card, KEY(question));
}

/* ── Reference models ──
   The closed frontier models the index carries as a yardstick for the open
   field (reference-models.json). The list is Artificial Analysis slugs, which
   is what makes them resolvable: the llm.json entry is named after the slug,
   so every source's mapping lands on it without one being written.

   Three things can be done to a row, and they are three different records.
   Adding one carries the slug *and* creates the entry behind it; removing one
   drops both, because an entry left behind is a closed model the table shows
   as an open-weight one; renaming one is the ordinary model-rename the Models
   tab sends, which moves the name through every mapping file and the list with
   it -- and keeps the scores, which remove-then-add would not. */

const REFERENCE_ADD_KEY = (slug) => `reference-add  ${slug}`;
const REFERENCE_REMOVE_KEY = (slug) => `reference-remove  ${slug}`;

const answerKeys = (prefix) => [...state.answers.keys()].filter((key) => key.startsWith(prefix));

/* How many reference models this batch would leave behind. The floor is
   answer.py's (at least one), applied here as well so the last Remove is
   simply not offered rather than taking a whole sitting down with it. */
const referenceRemaining = () => (state.reference.slugs?.length || 0)
  - answerKeys("reference-remove  ").length
  + answerKeys("reference-add  ").length;

function renderReference() {
  ensureAaSlugs();
  const box = el("div", { className: "stack" });

  if (state.reference.slugs === null) {
    box.append(el("p", { className: "empty" },
      !state.reference.error
        ? "The reference list has not been read yet."
        : state.reference.error.includes("404")
          ? "This repository has no reference-models.json yet."
          : `Could not read the reference list (${state.reference.error}).`));
    return box;
  }

  box.append(el("p", { className: "note-text" },
    "The closed models the index carries so the open field has something to be "
    + "measured against. The table hides them behind its Closed models "
    + "checkbox; a model's own page and a comparison always offer them. Each is "
    + "named after an Artificial Analysis slug, which is what lets every "
    + "source's scores find it. There is always at least one."));

  box.append(renderReferenceAdd());
  box.append(...state.reference.slugs.map(renderReferenceCard));
  return box;
}

/* Carry more. Each slug has to be one AA publishes -- answer.py checks the
   same thing on the runner -- because a name AA does not know collects nothing
   and would sit in the table empty forever.

   As many as a sitting needs: a slug picked from the list, or typed and added
   with the button, joins the batch and the box empties for the next one. The
   queued ones are listed in the card, each removable. */
function renderReferenceAdd() {
  const card = el("div", { className: "card" });
  card.append(el("div", { className: "subject" }, "Carry more models"));

  const queued = answerKeys("reference-add  ").map((key) => key.slice("reference-add  ".length));
  const flying = locked()
    ? state.sent.keys.filter((key) => key.startsWith("reference-add  "))
      .map((key) => key.slice("reference-add  ".length))
    : [];
  const carried = new Set(state.reference.slugs || []);

  /* Why a slug cannot be added, or "" when it can. */
  const refusal = (slug) => {
    if (!SLUG_RE.test(slug)) return "not a slug: lowercase words joined by single dots or dashes";
    if (carried.has(slug)) return "already carried -- it is one of the cards below";
    if (queued.includes(slug)) return "already in this batch";
    if (flying.includes(slug)) return "already sent -- the run is adding it";
    if (state.aa.slugs !== null && !state.aa.slugs.includes(slug)) {
      return "Artificial Analysis does not publish this slug, so nothing would find the model";
    }
    return "";
  };

  const status = el("div", { className: "chips" });
  const input = slugInput({ placeholder: "gpt-6-astra", value: state.referenceDraft });
  const add = el("button", { className: "btn ghost tiny", type: "button" }, "Add");
  const draw = () => {
    const slug = state.referenceDraft.trim();
    const why = slug ? refusal(slug) : "";
    add.disabled = !slug || Boolean(why);
    status.replaceChildren(...(!slug ? [] : [why
      ? chip("", why, { prose: true, className: "now" })
      : chip("", [aaSlugSummary(slug), "Add puts it in this batch"].filter(Boolean).join(" -- "),
        { prose: true })]));
  };
  const take = () => {
    const slug = state.referenceDraft.trim();
    if (!slug || refusal(slug)) { input.classList.add("unknown"); return; }
    state.answers.set(REFERENCE_ADD_KEY(slug), { kind: "reference-add", name: slug });
    state.referenceDraft = "";
    render();
    /* Straight back into the box for the next one. */
    document.querySelector("#view .reference-add input")?.focus();
  };
  input.oninput = () => {
    state.referenceDraft = input.value;
    input.classList.remove("unknown");
    draw();
    saveDraft();
  };
  add.onclick = take;
  const offered = () => (state.aa.slugs || []).filter((slug) => !carried.has(slug) && !queued.includes(slug));
  const box = comboBox(input, offered, { detail: aaSlugDetail, min: 2, onPick: take });
  /* After the list's own handler, which takes an Enter on a highlighted row
     and marks it handled; a bare Enter adds what is typed. */
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.defaultPrevented) { event.preventDefault(); take(); }
  });
  card.classList.add("reference-add");
  card.append(el("div", { className: "field" }, [
    el("label", {}, "artificial analysis slug"),
    el("div", { className: "score-row" }, [box, add]),
  ]), status);

  const rows = [
    ...queued.map((slug) => el("div", { className: "queued-row" }, [
      el("span", {}, [slug, aaSlugSummary(slug) ? el("span", { className: "detail" }, aaSlugSummary(slug)) : null]),
      el("button", {
        type: "button", className: "btn ghost tiny",
        onclick: () => { state.answers.delete(REFERENCE_ADD_KEY(slug)); render(); },
      }, "Remove"),
    ])),
    ...flying.map((slug) => el("div", { className: "queued-row sent" }, [
      el("span", {}, [slug, el("span", { className: "detail" }, "sent -- the run is adding it")]),
    ])),
  ];
  if (rows.length) card.append(el("div", { className: "queued" }, rows));
  if (queued.length) {
    card.classList.add("answered");
    card.append(el("p", { className: "note-text" },
      `${queued.length} to carry: each entry is created with its slug and its `
      + "scores land on the next refresh."));
  }

  if (state.aa.error) {
    card.append(el("p", { className: "note-text" },
      `The slug list could not be read (${state.aa.error}), so nothing is suggested `
      + "here. A slug typed in full is still checked on the runner."));
  }
  draw();
  return card;
}

function renderReferenceCard(slug) {
  const removeKey = REFERENCE_REMOVE_KEY(slug);
  const renameKey = `model-rename  ${slug}`;
  const removing = state.answers.has(removeKey);
  const rename = state.answers.get(renameKey);
  const card = el("div", { className: `card${removing || rename ? " answered" : ""}` });
  const model = (state.llm?.models || []).find((m) => m.name === slug);

  card.append(el("div", { className: "subject" }, slug));
  const summary = aaSlugSummary(slug);
  card.append(el("div", { className: "chips" }, [
    chip("", summary || (state.aa.slugs === null
      ? "reading the Artificial Analysis list..."
      : "Artificial Analysis no longer publishes this slug"),
      { prose: true, className: summary || state.aa.slugs === null ? "" : "now" }),
    model
      ? chip("scores", String(Object.values(model.scores || {}).filter((v) => v !== null).length))
      : chip("", "no llm.json entry yet -- the next refresh cannot fill one either",
        { prose: true, className: "now" }),
  ]));

  if (rename) {
    card.append(
      el("div", { className: "chips" }, chip("rename to", rename.new_name)),
      el("div", { className: "options" }, option("Cancel the rename", "keep this slug", {
        pressed: false,
        className: "decline",
        onclick: () => { state.answers.delete(renameKey); render(); },
      })),
      el("p", { className: "note-text" },
        `${slug} becomes ${rename.new_name} in llm.json, in the reference list and in `
        + "every mapping file that names it. The scores come along; a different model "
        + "is Stop carrying plus Carry another instead."),
    );
    return guard(card, renameKey);
  }

  const last = referenceRemaining() <= 1 && !removing;
  card.append(el("div", { className: "options" }, [
    option("Stop carrying it", removing
      ? "the slug and its entry go on the next run"
      : last
        ? "not while it is the only one left -- add its replacement first"
        : "drops the slug and its llm.json entry, scores and all", {
      pressed: removing,
      className: "decline",
      onclick: () => {
        if (removing) state.answers.delete(removeKey);
        else {
          /* One record per entry per run: a rename of a model this batch also
             removes is refused on the runner, and the removal is the thing
             just clicked. */
          state.answers.delete(renameKey);
          state.answers.set(removeKey, { kind: "reference-remove", name: slug });
        }
        render();
      },
    }),
  ]));
  if (last) {
    card.querySelectorAll(".options button").forEach((button) => { button.disabled = true; });
  }

  card.append(referenceRenameBlock(slug, renameKey));
  /* Whichever of the two is in flight: a reload drops the drafted record but
     not the lock, and a rename sent from here has to keep its card disabled
     just as a removal does. Same choice renderModelCard makes. */
  return guard(card, isSent(renameKey) ? renameKey : removeKey);
}

/* Rename, for the slug that moved rather than the model that did: AA renames
   one of these now and then, and the entry has to follow or its scores stop
   arriving. Simpler than the Models tab's block, which also has to work out
   whether AA knows the name at all -- here it does, by construction. */
function referenceRenameBlock(slug, renameKey) {
  const block = el("div", { className: "provenance aa" });
  block.append(el("div", { className: "field" }, el("label", {}, "rename")));

  if (state.aa.slugs === null) {
    block.append(el("p", { className: "note-text" },
      state.aa.error
        ? `The Artificial Analysis slugs could not be read (${state.aa.error}).`
        : "Reading the Artificial Analysis slugs..."));
    return block;
  }

  const input = slugInput({ placeholder: "the slug AA uses now" });
  const apply = el("button", { className: "btn ghost tiny", type: "button" }, "Rename");
  apply.onclick = () => {
    const value = input.value.trim();
    const taken = (state.llm?.models || []).some((m) => m.name === value);
    if (value === slug || taken || !state.aa.slugs.includes(value)) {
      input.classList.add("unknown");
      return;
    }
    state.answers.delete(REFERENCE_REMOVE_KEY(slug));
    state.answers.delete(`model-edit  ${slug}`);
    state.answers.set(renameKey, { kind: "model-rename", name: slug, new_name: value });
    render();
  };
  input.oninput = () => input.classList.remove("unknown");

  block.append(
    el("div", { className: "score-row" }, [
      el("label", {}, `one of ${state.aa.slugs.length} AA slugs`),
      comboBox(input, () => state.aa.slugs.filter((value) => !(state.reference.slugs || []).includes(value)),
        { detail: aaSlugDetail, min: 2 }),
      apply,
    ]),
    el("p", { className: "note-text" },
      "For the same model under a new slug -- the name moves through llm.json, the "
      + "reference list and every mapping file at once, and the scores stay."),
  );
  return block;
}

/* How the Models tab orders its list. "least" puts the emptiest rows first --
   the ones a sitting is most likely to be filling in -- and "newest" the
   models added last, which are usually the same thing a week later. */
const MODEL_SORTS = [
  ["least", "Least scored first"],
  ["newest", "Last added first"],
];

/* The scores a model carries, out of the columns a hand edit can write: a
   derived index is computed, so counting it would only flatter every row. */
const scoredCount = (model) =>
  benchmarks().filter((bench) => model.scores?.[bench] != null).length;

function sortedModels(models, sort) {
  const added = (m) => m.date_added || "";
  const byNewest = (a, b) => added(b).localeCompare(added(a)) || a.name.localeCompare(b.name);
  if (sort === "newest") return [...models].sort(byNewest);
  const counts = new Map(models.map((m) => [m, scoredCount(m)]));
  return [...models].sort((a, b) => counts.get(a) - counts.get(b) || byNewest(a, b));
}

function renderModels() {
  ensureAaSlugs();
  const box = el("div", { className: "stack" });
  const search = noAuto(el("input", {
    type: "search",
    placeholder: "Filter by model or provider...",
    value: state.modelSearch,
    enterKeyHint: "search",
  }));
  /* One box for both: the suggestions offer every provider, with how many
     models it has, ahead of the model names. A provider's exact name filters
     to that provider alone, not also every model that happens to carry the
     name; anything else is a substring of either. */
  const providers = new Map();
  for (const m of state.llm?.models || []) {
    const name = m.creator?.name;
    if (name) providers.set(name, (providers.get(name) || 0) + 1);
  }
  const offered = [...[...providers.keys()].sort((a, b) => a.localeCompare(b)),
    ...(state.llm?.models || []).map((m) => m.name).filter((n) => !providers.has(n)).sort()];
  const creatorOf = new Map((state.llm?.models || []).map((m) => [m.name, m.creator?.name || ""]));
  const combo = comboBox(search, () => offered, {
    min: 1,
    detail: (value) => (providers.has(value)
      ? `provider · ${providers.get(value)} model${providers.get(value) === 1 ? "" : "s"}`
      : creatorOf.get(value) || ""),
  });
  const sort = el("select", {
    onchange: () => { state.modelSort = sort.value; draw(); },
  }, MODEL_SORTS.map(([value, label]) =>
    el("option", { value, selected: state.modelSort === value }, label)));
  const shown = el("span", { className: "count" });
  const results = el("div", { className: "stack" });
  const draw = () => {
    const all = state.llm?.models || [];
    const needle = state.modelSearch.trim().toLowerCase();
    const provider = [...providers.keys()].find((name) => name.toLowerCase() === needle);
    const found = sortedModels(all.filter((m) => !needle
      || (provider ? m.creator?.name === provider
        : [m.name, m.creator?.name].some((v) => String(v ?? "").toLowerCase().includes(needle)))),
    state.modelSort);
    shown.textContent = needle ? `${found.length} of ${all.length}` : `${all.length} models`;
    results.replaceChildren(...(found.length
      ? found.map(renderModelCard)
      : [el("p", { className: "empty" }, all.length
        ? `No model matches "${state.modelSearch.trim()}".`
        : "llm.json has not been read yet.")]));
  };
  /* Held in state, not in the input: a rename is drafted with a click, which
     re-renders the whole view, and a needle that lived only in the DOM would
     take the card being worked on with it. */
  search.oninput = () => { state.modelSearch = search.value; draw(); };
  box.append(
    el("div", { className: "toolbar search" }, [
      el("div", { className: "grow" }, combo), el("div", {}, sort), shown]),
    results,
  );
  draw();
  return box;
}

/* One card per model, folded to its name until opened. The form inside is
   only built on the first unfold: 179 models times every column would be ten
   thousand inputs on a phone, almost none of which a sitting ever looks at. */
function renderModelCard(model) {
  const key = `model-edit  ${model.name}`;
  const renameKey = `model-rename  ${model.name}`;
  const rename = state.answers.get(renameKey);
  const existing = state.answers.get(key);
  const lockKey = isSent(renameKey) ? renameKey : key;
  const locked = isSent(lockKey) || isApplied(lockKey);
  const card = el("details", { className: `card model-card${existing || rename ? " answered" : ""}` });
  const columns = benchmarks();
  const count = scoredCount(model);
  card.append(el("summary", {}, [
    el("span", { className: "subject" }, model.name),
    el("div", { className: "chips" }, [
      chip("", model.creator?.name || "unknown", { prose: true }),
      chip("added", model.date_added || "?"),
      chip("scored", `${count} / ${columns.length}`,
        { className: count < columns.length / 4 ? "now" : "" }),
    ]),
  ]));

  let built = false;
  const build = () => {
    if (built) return;
    built = true;
    fillModelCard(card, model, { key, renameKey, rename, existing, columns });
  };
  card.open = state.modelOpen.has(model.name) || Boolean(existing || rename);
  card.ontoggle = () => {
    if (card.open) { state.modelOpen.add(model.name); build(); }
    else state.modelOpen.delete(model.name);
  };
  /* A locked card disables whatever it holds when it is locked, so the form has
     to be there by then. */
  if (card.open || locked) build();
  return guard(card, lockKey);
}

function fillModelCard(card, model, { key, renameKey, rename, existing, columns }) {
  const draft = {
    fields: { ...(existing?.fields || {}) },
    scores: { ...(existing?.scores || {}) },
    score_date: existing?.score_date ?? today(),
    score_url: existing?.score_url ?? "",
  };
  let provenance;
  const commit = () => {
    const scored = Object.keys(draft.scores).length > 0;
    const writes = Object.values(draft.scores).some((value) => value !== null);
    provenance.hidden = !scored;
    /* A batch is all or nothing on the runner, so a half-typed page must not
       reach it: it would refuse this record and take every other answer in the
       sitting down with it. The card simply stops counting as answered until
       the URL is one. */
    const broken = META_FIELDS.some(([field, type]) => type === "url" && badUrl(draft.fields[field]))
      || (scored && badScoreUrl(draft.score_url, writes));
    const empty = !Object.keys(draft.fields).length && !scored;
    if (empty || broken) state.answers.delete(key);
    else {
      /* The provenance travels with the scores or not at all: answer.py refuses
         a date or a page with nothing to stamp it on, and a params-only edit
         has nothing. A blank date leaves the stamping to the runner, which is
         still "now", just its own. */
      const record = { kind: "model-edit", name: model.name, fields: draft.fields, scores: draft.scores };
      if (scored) {
        if (draft.score_date) record.score_date = draft.score_date;
        record.score_url = draft.score_url.trim() || null;
      }
      state.answers.set(key, record);
    }
    /* Same reason the queue's search box does not re-render: a full rebuild
       would replace the input being typed into. */
    card.classList.toggle("answered", !empty && !broken);
    refreshFooter();
  };

  /* Every field add.py asks for, so nothing is enterable once and then frozen.
     Anything outside this list exits 2 out of edit.py's argparse. */
  const fields = el("div", {});
  const inputs = {};
  const fillCreatorUrl = creatorUrlFiller(inputs, readField(model, "creator_url"));
  for (const [field, type, placeholder] of META_FIELDS) {
    const current = readField(model, field);
    const input = el("input", {
      type,
      placeholder,
      value: draft.fields[field] ?? current,
      disabled: Boolean(rename),
    });
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === current) delete draft.fields[field];
      else draft.fields[field] = value === "" ? null : value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    fields.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), ...fieldControl(field, input)]));
  }
  card.append(fields);

  /* One date and one page for the whole edit rather than per score: a sitting
     is one leaderboard read on one day, and edit.py stamps what that run
     changes. Two dates means two batches. */
  const dateInput = el("input", {
    type: "date", value: draft.score_date, max: today(), disabled: Boolean(rename),
  });
  dateInput.oninput = () => { draft.score_date = dateInput.value; commit(); };
  const urlInput = el("input", {
    type: "url",
    inputMode: "url",
    placeholder: "https://... page the scores were read from",
    value: draft.score_url,
    disabled: Boolean(rename),
  });
  urlInput.oninput = () => {
    draft.score_url = urlInput.value;
    urlInput.classList.toggle("unknown", badScoreUrl(draft.score_url, false));
    commit();
  };
  provenance = el("div", { className: "provenance" }, [
    el("div", { className: "fields" }, [
      el("div", { className: "field" }, [el("label", {}, "score date"), dateInput]),
      el("div", { className: "field" }, [el("label", {}, "score url"), urlInput]),
    ]),
    el("p", { className: "note-text" },
      "Stamped on every score changed below, and required with one. A page moves "
      + "the value onto that page's rung of the source precedence, where only that "
      + "page or a better one may overwrite it."),
  ]);

  /* Every column a hand edit can write, the empty ones included -- an empty
     box is how a missing score gets typed in. A box is only part of the answer
     once it differs from what llm.json holds; clearing a stored score sends a
     null, which edit.py reads as "remove it". */
  const scores = el("div", { className: "model-scores" });
  for (const bench of columns) {
    const stored = model.scores?.[bench] ?? null;
    const input = el("input", {
      type: "number", step: "0.1", inputMode: "decimal",
      placeholder: stored === null ? "missing" : "",
      value: bench in draft.scores ? (draft.scores[bench] ?? "") : (stored ?? ""),
      disabled: Boolean(rename),
    });
    const row = el("div", { className: `score-row${stored === null ? " missing" : ""}` });
    const undo = el("button", { type: "button", className: "btn ghost tiny" }, "Undo");
    const mark = () => {
      const changed = bench in draft.scores;
      row.classList.toggle("changed", changed);
      undo.disabled = !changed || Boolean(rename);
    };
    input.oninput = () => {
      const value = input.value === "" ? null : Number(input.value);
      if (value === stored) delete draft.scores[bench];
      else draft.scores[bench] = value;
      mark();
      commit();
    };
    undo.onclick = () => {
      delete draft.scores[bench];
      input.value = stored ?? "";
      mark();
      commit();
    };
    /* What is already on record for this score, under the box about to
       overwrite it: the number typed here becomes the next entry in that
       list, and whoever types it should be able to see what it replaces
       without opening the site in another tab. Read-only -- the history is
       written by the runner, from the scores, and is not an answer to send.
       Three entries is the whole past of almost every score; the rest is
       counted rather than listed, since this is a hint beside a form and not
       the model's page. */
    const past = recordedHistory(model, bench);
    const shown = past.slice(0, 3).map((event) =>
      el("span", {}, `${event.date} · ${event.value === null ? "—" : event.value} · ${event.kind}`));
    if (past.length > shown.length) {
      shown.push(el("span", { className: "more" }, `+${past.length - shown.length} earlier`));
    }
    const name = state.llm?.benchmarks?.[bench]?.short_name || state.llm?.benchmarks?.[bench]?.name;
    row.append(el("label", { title: name || bench }, bench), input, undo);
    if (past.length) row.append(el("div", { className: "score-past" }, shown));
    mark();
    scores.append(row);
  }
  const missing = columns.filter((bench) => model.scores?.[bench] == null).length;
  card.append(
    el("div", { className: "field" }, el("label", {},
      `scores -- ${columns.length - missing} of ${columns.length}, ${missing} missing`)),
    scores,
    provenance,
  );
  commit();
  card.append(renameBlock(model, renameKey, rename));
}

/* Which Artificial Analysis slug this entry answers to -- and, when the answer
   is "none of them", the way to change that.

   update.resolve_aa_slugs() reads AA for a model whose *name* is a slug there,
   byte for byte. So an entry added by hand before AA tracked it starts
   collecting AA scores by itself the day AA publishes the same slug, and needs
   nothing here. When AA publishes it under a different slug there are two ways
   out: map the name to the slug (the Queue tab asks exactly that, once a
   refresh has noticed), or take the slug as the entry's name, which leaves
   nothing to maintain afterwards. This is the second. */
function renameBlock(model, renameKey, rename) {
  const block = el("div", { className: "provenance aa" });
  block.append(el("div", { className: "field" }, el("label", {}, "artificial analysis")));

  if (rename) {
    block.append(
      el("div", { className: "chips" }, chip("rename to", rename.new_name)),
      el("div", { className: "options" }, option("Cancel the rename", "keep this name", {
        pressed: false,
        className: "decline",
        onclick: () => { state.answers.delete(renameKey); render(); },
      })),
      el("p", { className: "note-text" },
        `${model.name} becomes ${rename.new_name} in llm.json and in every mapping `
        + "file that names it -- rename.py does both, because a name left behind in "
        + "one of them does not fail, it just stops matching. The fields above are "
        + "not sent with it: one record per model per run."),
    );
    return block;
  }

  if (state.aa.error) {
    block.append(el("p", { className: "note-text" },
      String(state.aa.error).includes("404")
        ? "No published Artificial Analysis list yet. It appears after the next "
          + "refresh run. ./rename.py does the same job from a terminal."
        : `Could not read the Artificial Analysis slugs (${state.aa.error}).`));
    return block;
  }
  if (state.aa.slugs === null) {
    block.append(el("p", { className: "note-text" }, "Reading the Artificial Analysis slugs..."));
    return block;
  }
  if (state.aa.slugs.includes(model.name)) {
    block.append(el("p", { className: "note-text good-text" },
      "Artificial Analysis publishes this exact slug, so update.py reads it "
      + "directly. Nothing to map and nothing to rename."));
    return block;
  }

  const suggestions = aaSuggestions(model.name);
  const options = el("div", { className: "options" });
  for (const { slug, why } of suggestions) {
    options.append(option(slug, `rename to this -- ${why}${aaSlugDetail(slug)}`, {
      pressed: false,
      className: why.startsWith("the same name") ? "exact" : "",
      tag: why.startsWith("the same name") ? "best match" : "",
      onclick: () => setRename(model, renameKey, slug),
    }));
  }
  if (suggestions.length) block.append(options);
