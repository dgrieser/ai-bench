  const input = slugInput({ placeholder: "type to search" });
  const apply = el("button", { className: "btn ghost tiny", type: "button" }, "Rename");
  apply.onclick = () => {
    const value = input.value.trim();
    if (!state.aa.slugs.includes(value)) {
      input.classList.add("unknown");
      return;
    }
    setRename(model, renameKey, value);
  };
  input.oninput = () => input.classList.remove("unknown");
  block.append(
    el("div", { className: "score-row" }, [
      el("label", {}, `or one of ${state.aa.slugs.length} AA slugs`),
      comboBox(input, () => state.aa.slugs, { detail: aaSlugDetail, min: 2 }),
      apply,
    ]),
    el("p", { className: "note-text" },
      suggestions.length
        ? "Renaming is what makes AA read this model without a mapping. Keeping the "
          + "name instead is the Queue tab's job: it asks which slug this model is."
        : "No slug looks like this name. If AA does track the model under an "
          + "unrelated slug, map it from the Queue tab rather than renaming."),
  );
  return block;
}

function setRename(model, renameKey, slug) {
  /* One record per model per run: the batch applies in order and rolls back
     together, so an edit sent alongside a rename would be looking for a name
     that is no longer there. The edit loses, because the rename is the thing
     just clicked. */
  state.answers.delete(`model-edit  ${model.name}`);
  state.answers.set(renameKey, { kind: "model-rename", name: model.name, new_name: slug });
  render();
}

/* ── Benchmarks ──
   The columns themselves: llm.json's `benchmarks` object, which names each
   column, says which run of its benchmark it holds and what must not be filed
   in it, and links where to read about it. Those words are what a reader of the
   index sees in the column's dialog and what the Queue tab shows beside every
   mapping question, so a wrong one costs more than a typo.

   Two records: benchmark-edit changes what differs on one column, and
   benchmark-create adds one. answer.py holds both to the rules
   test_benchmark_settings.py holds the file to; the checks here only stop a
   half-typed form from taking the rest of a sitting down with it. A new column
   is filled by hand on the Models tab -- or by a mapping onto it -- until a
   scraper is written for it, and both may be in the same batch as the create. */

const BENCH_CREATE_KEY = (key) => `benchmark-create  ${key}`;
const BENCH_EDIT_KEY = (key) => `benchmark-edit  ${key}`;

/* _answers.BENCHMARK_KEY_RE: an identifier, since it becomes edit.py's --flag. */
const BENCH_KEY_RE = /^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$/;
const BENCH_KEY_MAX = 48;
/* edit.py's own options, which a column's flag would collide with. */
const BENCH_RESERVED = new Set(["json_file", "model", "missing", "benchmark", "field", "after",
  "help", "score_date", "score_url", ...META_FIELDS.map(([field]) => field)]);

/* [field, longest, placeholder] -- _answers.BENCHMARK_TEXT_FIELDS. */
const BENCH_TEXT = [
  ["name", 80, "SWE-bench Verified"],
  ["short_name", 24, "SWE-V"],
  ["category", 40, "Software Engineering"],
];
const BENCH_DESCRIPTION_MAX = 2000;
const BENCH_LISTS = [
  ["settings", "Resolved %\nagentic", "One tag per line: the metric, the subset, the tool mode, the harness. "
    + "At most 30 characters each; shown as chips."],
  ["excludes", "runs named for another harness", "Optional. One phrase per line: the runs that must not be filed here."],
  ["urls", "https://...", "One page per line: the leaderboard first, then the paper or the repository."],
];
const SETTING_MAX = 30;

const benchCategories = () => [...new Set(Object.values(state.llm?.benchmarks || {})
  .map((bench) => bench?.category).filter(Boolean))];

/* The batch's new columns, by key. Scores and mappings may name them: answer.py
   applies the creates first. */
const batchCreatedBenchmarks = () => [...state.answers.values()]
  .filter((record) => record.kind === "benchmark-create")
  .map((record) => record.key);

const flyingBenchmarks = () => (locked()
  ? state.sent.keys.filter((key) => key.startsWith("benchmark-create  "))
    .map((key) => key.slice("benchmark-create  ".length))
  : []);

/* One line per item, whitespace folded the way answer.py folds it. */
const textLines = (text) => String(text ?? "").split("\n")
  .map((line) => line.split(/\s+/).filter(Boolean).join(" "))
  .filter(Boolean);

/* What the inputs hold for a column: everything as text, so a half-typed
   number survives a redraw. */
const benchText = (bench = {}) => ({
  name: bench.name ?? "",
  short_name: bench.short_name ?? "",
  category: bench.category ?? "",
  description: bench.description ?? "",
  settings: (bench.settings || []).join("\n"),
  excludes: (bench.excludes || []).join("\n"),
  urls: (bench.urls || []).join("\n"),
  decimals: bench.decimals ?? "",
  range_low: bench.range?.[0] ?? "",
  range_high: bench.range?.[1] ?? "",
  round_to: bench.round_to ?? "",
  lower_is_better: bench.lower_is_better === true,
});

/* The record's fields from that text -- null where a field is cleared -- and
   what is wrong, by input. */
function benchParse(text, { derived = false } = {}) {
  const fields = {};
  const bad = {};
  for (const [field, max] of [...BENCH_TEXT, ["description", BENCH_DESCRIPTION_MAX]]) {
    const value = String(text[field] ?? "").trim();
    if (!value) bad[field] = "required";
    else if (value.length > max) bad[field] = `at most ${max} characters`;
    else if (field !== "description" && /[\r\n\t]/.test(value)) bad[field] = "one line";
    fields[field] = value;
  }
  for (const [field] of BENCH_LISTS) {
    const items = textLines(text[field]);
    if (new Set(items).size !== items.length) bad[field] = "an item is listed twice";
    if (items.length > 12) bad[field] = "at most 12";
    for (const item of items) {
      if (field === "urls") {
        if (!/^https?:\/\/\S+$/i.test(item)) bad[field] = `not a URL: ${item}`;
      } else if (item.endsWith(".")) {
        bad[field] = `a phrase, not a sentence: drop the full stop in "${item}"`;
      } else if (field === "settings" && item.length > SETTING_MAX) {
        bad[field] = `"${item}" is longer than ${SETTING_MAX} characters`;
      }
    }
    if (!items.length && field !== "excludes") bad[field] = "at least one";
    fields[field] = items.length ? items : null;
  }
  if (!derived) {
    const number = (raw) => (String(raw).trim() === "" ? null : Number(raw));
    const decimals = number(text.decimals);
    if (decimals !== null && !(Number.isInteger(decimals) && decimals >= 0 && decimals <= 4)) {
      bad.decimals = "a whole number from 0 to 4";
    }
    fields.decimals = decimals;
    const [low, high] = [number(text.range_low), number(text.range_high)];
    if ((low === null) !== (high === null)) bad.range_low = bad.range_high = "both, or neither";
    else if (low !== null && !(Number.isFinite(low) && Number.isFinite(high) && low < high)) {
      bad.range_low = bad.range_high = "low below high";
    }
    fields.range = low === null || high === null ? null : [low, high];
    const roundTo = number(text.round_to);
    if (roundTo !== null && !(Number.isFinite(roundTo) && roundTo > 0)) bad.round_to = "a positive number";
    fields.round_to = roundTo;
    fields.lower_is_better = text.lower_is_better ? true : null;
  }
  return { fields, bad };
}

/* The scores already stored in a column, for the range they must fit in. */
const storedScores = (key) => (state.llm?.models || [])
  .map((model) => model.scores?.[key])
  .filter((value) => typeof value === "number");

/* The form, shared by the edit and the add card. `onInput` runs on every
   keystroke without a redraw, so the caret stays where it is; `mark` flags the
   inputs a parse found wrong. */
function benchForm(text, { derived = false, disabled = false, onInput }) {
  const box = el("div", {});
  const inputs = {};
  const hints = {};
  const field = (name, control, hint = "") => {
    hints[name] = el("p", { className: "note-text field-hint" }, hint);
    hints[name].dataset.hint = hint;
    box.append(el("div", { className: "field" }, [el("label", {}, name.replace(/_/g, " ")), control, hints[name]]));
  };
  const wire = (name, input, read = () => input.value) => {
    inputs[name] = input;
    input.disabled = disabled;
    input.oninput = () => { text[name] = read(); onInput(); };
    return input;
  };

  for (const [name, max, placeholder] of BENCH_TEXT) {
    const input = wire(name, el("input", { type: "text", maxLength: max, placeholder, value: text[name] }));
    let list = null;
    if (name === "category") {
      const listId = `c-${Math.random().toString(36).slice(2)}`;
      input.setAttribute("list", listId);
      list = el("datalist", { id: listId }, benchCategories().map((value) => el("option", { value })));
    }
    field(name, list ? el("div", {}, [input, list]) : input);
  }
  field("description", wire("description", el("textarea", {
    rows: 4, maxLength: BENCH_DESCRIPTION_MAX, value: text.description,
    placeholder: "What it measures and how it is graded, and which run this column holds.",
  })));
  for (const [name, placeholder, hint] of BENCH_LISTS) {
    const area = wire(name, el("textarea", { rows: 3, placeholder, value: text[name] }));
    if (name === "urls") noAuto(area);
    field(name, area, hint);
  }

  if (!derived) {
    const scale = el("details", {
      open: Boolean(String(text.decimals) + String(text.range_low) + String(text.round_to))
        || text.lower_is_better,
    });
    scale.append(el("summary", { className: "note-text", style: "cursor:pointer" },
      "Scale (optional): decimals, range, rounding, direction"));
    const numberInput = (name, placeholder, step = "any") =>
      wire(name, el("input", { type: "number", step, inputMode: "decimal", placeholder, value: text[name] }));
    const row = (name, controls, hint) => {
      hints[name] = el("p", { className: "note-text field-hint" }, hint);
      hints[name].dataset.hint = hint;
      scale.append(el("div", { className: "field" }, [el("label", {}, name), controls, hints[name]]));
    };
    row("decimals", numberInput("decimals", "1", "1"), "Digits the site prints. Blank is 1.");
    row("range_low", el("div", { className: "range-pair" }, [
      numberInput("range_low", "0"), numberInput("range_high", "100"),
    ]), "Lowest and highest score this column can hold. Blank is 0 to 100, a percentage.");
    hints.range_high = hints.range_low;
    row("round_to", numberInput("round_to", "e.g. 5"),
      "Store scores on multiples of this instead, for a number that moves on its own (an Elo).");
    const lower = wire("lower_is_better", el("input", {
      type: "checkbox", checked: Boolean(text.lower_is_better),
    }), () => inputs.lower_is_better.checked);
    lower.onchange = lower.oninput;
    scale.append(el("label", { className: "check" }, [lower, " lower is better (a rate of failures, a cost)"]));
    box.append(scale);
  }

  const mark = (bad) => {
    for (const [name, input] of Object.entries(inputs)) {
      input.classList.toggle("unknown", Boolean(bad[name]));
    }
    for (const [name, hint] of Object.entries(hints)) {
      const problem = bad[name];
      hint.textContent = problem || hint.dataset.hint;
      hint.classList.toggle("bad-text", Boolean(problem));
    }
  };
  return { box, mark };
}

const sameValue = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

function renderBenchmarks() {
  const box = el("div", { className: "stack" });
  box.append(el("p", { className: "note-text" },
    "What each column of the index is called, which run of its benchmark it "
    + "holds, what must not be filed in it and where to read about it. The Queue "
    + "tab shows the same words beside every mapping question. A new column "
    + "starts empty: give it scores on the Models tab, in this batch if you like, "
    + "or map a source's label onto it from the Queue."));
  box.append(renderBenchmarkAdd());

  const search = el("input", {
    type: "search",
    placeholder: "Find a benchmark by name, key or category...",
    value: state.benchSearch,
  });
  const results = el("div", { className: "stack" });
  const draw = () => {
    const needle = state.benchSearch.trim().toLowerCase();
    const all = Object.entries(state.llm?.benchmarks || {});
    const found = all.filter(([key, bench]) => !needle
      || [key, bench?.name, bench?.short_name, bench?.category]
        .some((value) => String(value ?? "").toLowerCase().includes(needle)));
    results.replaceChildren(...(found.length
      ? found.map(([key, bench]) => renderBenchmarkCard(key, bench))
      : [el("p", { className: "empty" }, all.length
        ? `No benchmark matches "${state.benchSearch.trim()}".`
        : "llm.json has not been read yet.")]));
  };
  search.oninput = () => { state.benchSearch = search.value; draw(); };
  box.append(el("div", { className: "search" }, search), results);
  draw();
  return box;
}

function renderBenchmarkCard(key, bench) {
  const recordKey = BENCH_EDIT_KEY(key);
  const existing = state.answers.get(recordKey);
  const derived = bench?.derived === true;
  const card = el("details", { className: `card bench-card${existing ? " answered" : ""}` });
  card.open = state.benchOpen.has(key) || Boolean(existing);
  card.ontoggle = () => {
    if (card.open) state.benchOpen.add(key);
    else state.benchOpen.delete(key);
  };
  card.append(el("summary", {}, [
    el("span", { className: "subject" }, bench?.name || key),
    el("div", { className: "chips" }, [
      chip("", key),
      chip("", bench?.category || "no category", { prose: true }),
      derived ? chip("", "derived index", { prose: true }) : null,
    ]),
  ]));

  const text = benchText({ ...bench, ...Object.fromEntries(
    Object.entries(existing?.fields || {}).map(([f, v]) => [f, v === null ? undefined : v])) });
  const scores = storedScores(key);
  let form;
  const commit = () => {
    const { fields, bad } = benchParse(text, { derived });
    if (fields.range && scores.some((v) => v < fields.range[0] || v > fields.range[1])) {
      bad.range_low = bad.range_high = "a stored score falls outside it";
    }
    form.mark(bad);
    const changed = Object.fromEntries(Object.entries(fields)
      .filter(([field, value]) => !sameValue(value, bench?.[field])));
    const ok = !Object.keys(bad).length && Object.keys(changed).length > 0;
    if (ok) state.answers.set(recordKey, { kind: "benchmark-edit", key, fields: changed });
    else state.answers.delete(recordKey);
    card.classList.toggle("answered", ok);
    refreshFooter();
  };
  form = benchForm(text, { derived, onInput: commit });
  card.append(form.box);
  if (derived) {
    card.append(el("p", { className: "note-text" },
      "A derived index: its scale is derive_indexes.py's, so only the words are editable here."));
  }
  const reset = el("button", { type: "button", className: "btn ghost tiny" }, "Undo changes");
  reset.onclick = () => { state.answers.delete(recordKey); render(); };
  card.append(el("div", { className: "card-foot" }, reset));
  commit();
  return guard(card, recordKey);
}

function renderBenchmarkAdd() {
  if (!state.benchDraft) state.benchDraft = { key: "", after: "", text: benchText(), record: "" };
  const draft = state.benchDraft;
  const box = el("div", { className: "stack" });

  const flying = flyingBenchmarks();
  if (flying.length) {
    box.append(lockCard(el("div", { className: "card" }, [
      el("div", { className: "subject" }, flying.length === 1 ? "Being added" : `Being added (${flying.length})`),
      el("div", { className: "queued" }, flying.map((key) =>
        el("div", { className: "queued-row sent" }, el("span", {}, key)))),
    ])));
  }

  const card = el("details", { className: "card add-bench" });
  card.open = state.benchOpen.has("") || Boolean(draft.key || draft.record);
  card.ontoggle = () => {
    if (card.open) state.benchOpen.add("");
    else state.benchOpen.delete("");
  };
  card.append(el("summary", {}, el("span", { className: "subject" }, "Add a benchmark")));

  const known = state.llm?.benchmarks || {};
  const status = el("div", { className: "chips" });
  let form;
  const commit = () => {
    if (draft.record) state.answers.delete(draft.record);
    draft.record = "";
    const key = draft.key.trim();
    const { fields, bad } = benchParse(draft.text);
    form.mark(bad);
    const problem = !key ? ""
      : !BENCH_KEY_RE.test(key) || key.length > BENCH_KEY_MAX
        ? "not a key: lowercase words joined by single underscores, like swe_bench_pro"
        : key in known ? "already a column -- edit it below"
          : BENCH_RESERVED.has(key) ? "one of edit.py's own options -- pick another key"
            : flying.includes(key) ? "already sent -- the run is creating it" : "";
    keyInput.classList.toggle("unknown", Boolean(problem));
    status.replaceChildren(...(problem ? [chip("", problem, { prose: true, className: "now" })] : []));
    const ok = key && !problem && !Object.keys(bad).length;
    if (ok) {
      const record = {
        kind: "benchmark-create",
        key,
        fields: Object.fromEntries(Object.entries(fields).filter(([, value]) => value !== null)),
      };
      if (draft.after) record.after = draft.after;
      draft.record = BENCH_CREATE_KEY(key);
      state.answers.set(draft.record, record);
    }
    card.classList.toggle("answered", Boolean(ok));
    refreshFooter();
  };

  const keyInput = slugInput({ placeholder: "new_bench_1_0", value: draft.key, maxLength: BENCH_KEY_MAX });
  keyInput.oninput = () => { draft.key = keyInput.value; commit(); };
  card.append(el("div", { className: "field" }, [el("label", {}, "key"), keyInput]), status,
    el("p", { className: "note-text field-hint" },
      "The column's identifier: in llm.json, in every mapping file that names it, and "
      + "as edit.py's --flag. It cannot be changed from here afterwards."));

  form = benchForm(draft.text, { onInput: commit });
  card.append(form.box);

  const after = el("select", {}, [el("option", { value: "" }, "At the end of its category")]
    .concat(Object.entries(known).map(([key, bench]) =>
      el("option", { value: key, selected: draft.after === key }, `after ${bench?.name || key}`))));
  after.onchange = () => { draft.after = after.value; commit(); };
  card.append(el("div", { className: "field" }, [el("label", {}, "place"), after]));

  const discard = el("button", { type: "button", className: "btn ghost tiny" }, "Discard");
  discard.onclick = () => {
    if (draft.record) state.answers.delete(draft.record);
    state.benchDraft = null;
    render();
  };
  card.append(el("div", { className: "card-foot" }, discard));
  commit();
  box.append(card);
  return box;
}

/* ── Updates ──
   What changed, day by day: models added, scores that arrived or moved, and
   mappings written -- the public page's Recently Added panel, plus the one
   thing only this page can say, which is who made each mapping.

   The scores and the models come from llm.json (scores_history and
   date_added), read the same way the site reads them. The mappings come from
   _log/mappings.json, which the workflow appends to just before each of its
   commits: an answer sent from here is "you", a write the pipeline made by
   itself -- a mapping re-pointed at a model just added, a rename carried
   through every file -- is "automatic". */

const UPDATE_PREVIEW = 8;    // entries a day shows before "N more"
const UPDATE_WINDOWS = [[7, "7 days"], [30, "30 days"], [0, "All"]];
const UPDATE_SHOWS = [["all", "Everything"], ["models", "Models"], ["scores", "Scores"],
  ["mappings", "Mappings"], ["mine", "My mappings"], ["auto", "Automatic mappings"]];

const BY_LABELS = {
  admin: ["you", "answered from this page"],
  auto: ["automatic", "written by the pipeline on its own"],
  proposal: ["proposal PR", "merged from a proposal pull request"],
  hand: ["commit", "changed by a commit to the repository"],
};

/* A day in the reader's own calendar, not UTC's, so a mapping sent at 1am is
   filed under the day it was sent on. */
const localDay = (iso) => {
  const when = new Date(iso);
  if (Number.isNaN(when.getTime())) return String(iso).slice(0, 10);
  return new Date(when.getTime() - when.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

const dayAge = (day) => {
  const days = Math.round((Date.parse(`${today()}T00:00:00`) - Date.parse(`${day}T00:00:00`)) / 86400000);
  return days === 0 ? "today" : days === 1 ? "yesterday" : `${days} days ago`;
};

const benchLabel = (key) => {
  const bench = state.llm?.benchmarks?.[key];
  return bench?.short_name || bench?.name || key;
};

const shownValue = (value) => (value === null || value === undefined
  ? "\u2014"
  : Array.isArray(value) ? value.join(", ") : String(value));

/* Every change in the window, grouped by day, newest day first. */
function collectUpdates() {
  const { days, show, search } = state.updates;
  const since = days ? (() => {
    const d = new Date(`${today()}T00:00:00`);
    d.setDate(d.getDate() - days + 1);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  })() : "";
  const needle = search.trim().toLowerCase();
  const byDay = new Map();
  const day = (date) => {
    if (!byDay.has(date)) byDay.set(date, { date, models: new Map(), scores: new Map(), mappings: [] });
    return byDay.get(date);
  };
  const wantModels = show === "all" || show === "models";
  const wantScores = show === "all" || show === "scores";
  const wantMaps = show === "all" || show === "mappings" || show === "mine" || show === "auto";

  for (const model of state.llm?.models || []) {
    const hit = !needle || model.name.toLowerCase().includes(needle);
    if (!hit) continue;
    const added = model.date_added;
    if (wantModels && added && added >= since) day(added).models.set(model.name, { model, scores: [] });
    if (!wantScores && !wantModels) continue;
    for (const key of Object.keys(model.scores_history || {})) {
      if (state.llm?.benchmarks?.[key]?.derived === true) continue;
      for (const event of recordedHistory(model, key)) {
        if (event.date < since) continue;
        const entry = { key, ...event };
        const arrival = day(event.date).models.get(model.name);
        /* A new model's scores on the day it arrived belong to its arrival,
           the way the site lists them: "arrived with 12 scores". */
        if (arrival && event.date === added) {
          arrival.scores.push(entry);
        } else if (wantScores) {
          const scores = day(event.date).scores;
          if (!scores.has(model.name)) scores.set(model.name, { model, scores: [] });
          scores.get(model.name).scores.push(entry);
        }
      }
    }
  }

  if (wantMaps) {
    for (const entry of state.mapLog.entries || []) {
      if (show === "mine" && entry.by !== "admin") continue;
      if (show === "auto" && entry.by !== "auto") continue;
      const date = localDay(entry.at);
      if (date < since) continue;
      if (needle && ![entry.subject, shownValue(entry.value), shownValue(entry.previous), entry.route]
        .some((text) => String(text).toLowerCase().includes(needle))) continue;
      day(date).mappings.push(entry);
    }
  }

  return [...byDay.values()]
    .filter((d) => d.models.size || d.scores.size || d.mappings.length)
    .sort((a, b) => b.date.localeCompare(a.date));
}

/* One score's change as a chip: the benchmark, what it was, what it is. */
function scoreChip(event, model) {
  const source = model.scores_history?.[event.key]?.find((e) => e.date === event.date)?.source || "";
  const moved = event.kind.startsWith("was ");
  const gone = event.value === null;
  const label = [
    el("span", { className: "bench" }, benchLabel(event.key)),
    moved ? el("span", { className: "was" }, event.kind.slice(4)) : null,
    el("span", { className: "val" }, gone ? "withdrawn" : String(event.value)),
  ];
  const title = `${event.key}: ${gone ? "withdrawn" : event.value} (${event.kind})`
    + (source ? `\n${source}` : "\nno source recorded");
  return /^https?:\/\//.test(source)
    ? el("a", { className: `score-chip${gone ? " gone" : ""}`, href: source, target: "_blank", rel: "noreferrer", title }, label)
    : el("span", { className: `score-chip${gone ? " gone" : ""}`, title }, label);
}

/* A model's name that opens it on the Models tab -- where a wrong score is
   fixed -- rather than a dead label. */
function modelLink(name) {
  return el("button", {
    type: "button",
    className: "upd-name",
    title: "Edit on the Models tab",
    onclick: () => { state.modelSearch = name; state.modelOpen.add(name); showTab("models"); },
  }, name);
}

function renderModelUpdate({ model, scores }, arrived) {
  const moved = scores.filter((e) => e.kind.startsWith("was ")).length;
  const note = arrived
    ? (scores.length ? `arrived with ${scores.length} score${scores.length === 1 ? "" : "s"}` : "added")
    : [scores.length - moved ? `${scores.length - moved} new` : "", moved ? `${moved} updated` : ""]
      .filter(Boolean).join(", ");
  return el("div", { className: "upd" }, [
    el("div", { className: "upd-head" }, [
      arrived ? el("span", { className: "pill upd-new" }, "new model") : null,
      modelLink(model.name),
      model.creator?.name ? el("span", { className: "upd-note" }, model.creator.name) : null,
      note ? el("span", { className: "upd-note" }, `· ${note}`) : null,
    ]),
    scores.length
      ? el("div", { className: "score-chips" },
        scores.sort((a, b) => benchLabel(a.key).localeCompare(benchLabel(b.key)))
          .map((event) => scoreChip(event, model)))
      : null,
  ]);
}

function renderMappingUpdate(entry) {
  const [label, meaning] = BY_LABELS[entry.by] || [entry.by, ""];
  const source = String(entry.route || "").replace(/^update_/, "").replace(/_mapping\.py$/, "");
  const time = new Date(entry.at);
  const link = entry.run || (entry.commit && state.repo
    ? `https://github.com/${state.repo}/commit/${entry.commit}` : "");
  const removed = entry.value === null || entry.value === undefined;
  return el("div", { className: "upd map-row" }, [
    el("span", {
      className: `pill by-${entry.by}`,
      title: meaning + (entry.inferred ? " -- credited from the commit it came in" : ""),
    }, label),
    el("div", { className: "what" }, [
      el("span", { className: "src" }, `${source} · `),
      entry.subject,
      el("span", { className: "arrow" }, " \u2192 "),
      removed ? el("span", { className: "was" }, shownValue(entry.previous)) : shownValue(entry.value),
      !removed && entry.previous !== null && entry.previous !== undefined
        ? el("span", { className: "was" }, ` ${shownValue(entry.previous)}`) : null,
    ]),
    el("div", { className: "meta" }, [
      Number.isNaN(time.getTime()) ? "" : time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      removed ? " · mapping removed" : "",
      entry.why ? ` · ${entry.why}` : "",
      link ? " · " : "",
      link ? el("a", { href: link, target: "_blank", rel: "noreferrer" }, entry.run ? "run" : entry.commit) : null,
    ]),
  ]);
}

function renderUpdates() {
  ensureMapLog();
  const box = el("div", { className: "stack" });

  const search = noAuto(el("input", {
    type: "search", placeholder: "Filter by model or source name...", value: state.updates.search,
    enterKeyHint: "search",
  }));
  const windowSelect = el("select", {
    onchange: () => { state.updates.days = Number(windowSelect.value); render(); },
  }, UPDATE_WINDOWS.map(([days, label]) =>
    el("option", { value: String(days), selected: state.updates.days === days }, label)));
  const showSelect = el("select", {
    onchange: () => { state.updates.show = showSelect.value; render(); },
  }, UPDATE_SHOWS.map(([value, label]) =>
    el("option", { value, selected: state.updates.show === value }, label)));
  const list = el("div", {});
  box.append(el("div", { className: "toolbar" }, [
    el("div", { className: "grow" }, search), el("div", {}, showSelect), el("div", {}, windowSelect)]));
  if (state.mapLog.error && state.updates.show !== "models" && state.updates.show !== "scores") {
    box.append(el("p", { className: "note busy" }, state.mapLog.error.includes("404")
      ? "No mapping log in the repository yet: mapping changes appear here from the first run that records them."
      : `Could not read the mapping log (${state.mapLog.error}); scores and models are still listed.`));
  }
  box.append(list);

  const draw = () => {
    const days = collectUpdates();
    if (!state.llm) {
      list.replaceChildren(el("p", { className: "empty" }, "llm.json has not been read yet."));
      return;
    }
    if (!days.length) {
      list.replaceChildren(el("p", { className: "empty" },
        state.updates.search.trim() ? "Nothing in this window matches that filter."
          : "Nothing changed in this window."));
      return;
    }
    list.replaceChildren(...days.map((d) => {
      const entries = [
        ...[...d.models.values()].map((row) => renderModelUpdate(row, true)),
        ...[...d.scores.values()].sort((a, b) => a.model.name.localeCompare(b.model.name))
          .map((row) => renderModelUpdate(row, false)),
        ...d.mappings.slice().sort((a, b) => b.at.localeCompare(a.at)).map(renderMappingUpdate),
      ];
      const scoreCount = [...d.scores.values()].reduce((n, row) => n + row.scores.length, 0);
      const tally = [
        d.models.size ? `${d.models.size} model${d.models.size === 1 ? "" : "s"}` : "",
        scoreCount ? `${scoreCount} score${scoreCount === 1 ? "" : "s"}` : "",
        d.mappings.length ? `${d.mappings.length} mapping${d.mappings.length === 1 ? "" : "s"}` : "",
      ].filter(Boolean).join(" · ");
      const head = entries.slice(0, UPDATE_PREVIEW);
      const tail = entries.slice(UPDATE_PREVIEW);
      return el("section", { className: "day" }, [
        el("h3", { className: "day-head" }, [
          d.date, el("span", { className: "age" }, dayAge(d.date)), el("span", { className: "tally" }, tally),
        ]),
        ...head,
        tail.length ? el("details", { className: "more-entries" }, [
          el("summary", {}, `${tail.length} more ${tail.length === 1 ? "entry" : "entries"}`),
          ...tail,
        ]) : null,
      ]);
    }));
  };
  /* The box re-draws the list, not the page, so typing keeps its focus. */
  search.oninput = () => { state.updates.search = search.value; draw(); };
  draw();
  return box;
}

const runLabel = (run) => (run.status === "completed"
  ? (run.conclusion || "done")
  : run.status.replace(/_/g, " "));

/* Why the run this tab can ask for is not always available.

   `locked()` is the one that is not obvious. A batch in flight is matched to
   its run by "the newest run created after the batch was sent" -- there is
   nothing else to match on, since the dispatch answers 204 without a run id --
   so a refresh queued behind that batch would *become* the run the page reads
   the answer step off. It carries no answers, the step reports nothing, and the
   batch would settle as "cannot tell" while its real run was still going. The
   button therefore waits for the batch, which costs a few minutes and keeps
   the one piece of state that must not be wrong.

   A queued run is api.php's own refusal restated: the workflow's concurrency
   group holds one run plus one queued, and a third arrival cancels the queued
   one, so there is nothing a second refresh would add. */
function refreshBlocked() {
  if (!state.refreshable) {
    return "api.php is older than this page and cannot start a run on its own. "
      + "Upload _admin/api.php alongside index.html -- ./_admin/deploy sends both.";
  }
  if (state.refreshing || state.quicking) return "Asking GitHub to queue the run.";
  if (locked()) {
    return "Not while a batch of answers is in flight: the run this would queue "
      + "sits behind that one, and the page identifies a batch's run by when it "
      + "started. Wait for the batch to finish.";
  }
  if (state.runs.some((run) => run.status === "queued")) {
    return "A run is already queued; there is nothing a refresh would add.";
  }
  return "";
}

/* One button: the run the cron would have made, asked for now. No answers, no
   proposal PR -- just re-scrape the sources, commit whatever moved, and
   republish the queue. Worth having by hand because a new score can be hours
   from the next cron, and because the queue is only re-collected by a run. */
function renderRunNow() {
  const blocked = refreshBlocked();
  const button = el("button", {
    className: "btn ghost",
    type: "button",
    disabled: Boolean(blocked),
    title: blocked || "Dispatch update-benchmarks.yml with no answers",
  }, state.refreshing ? "Starting..." : "Run the refresh now");
  if (!blocked) button.onclick = () => refreshNow(false);
  /* The same run cut down to its questions: every board's names matched
     against llm.json and the queue republished, no score read. For a model
     added by hand, or a mapping fixed in a terminal, whose questions should
     not wait for the next cron. */
  const quick = state.quickOffered ? el("button", {
    className: "btn ghost",
    type: "button",
    disabled: Boolean(blocked),
    title: blocked || "Dispatch update-benchmarks.yml with quick: mapping queue only",
    onclick: blocked ? null : () => refreshNow(true),
  }, state.quicking ? "Starting..." : "Quick run") : null;
  return el("div", { className: "runs-bar" }, [
    el("div", { className: "toolbar" }, [button, quick]),
    el("p", {}, blocked || "Run the refresh: update-benchmarks.yml against main with no "
      + "answers attached, the same run the schedule makes every three hours. It "
      + "re-reads every source, commits the scores that moved, and republishes "
      + "the queue this page answers."
      + (state.quickOffered ? " Quick run: only re-asks the mapping questions -- every "
        + "board's names against llm.json, no scores -- in a couple of minutes." : "")),
  ]);
}

/* The last line of a warning's message: for a traceback, the exception. */
const lastLine = (text) => String(text || "").trim().split("\n").pop();

/* Beside the run they came from: a count on its row, and the sources it could
   not read underneath, each with the reason its fetcher gave. */
function renderRunWarnings(run) {
  const found = state.runWarnings.get(run.id);
  if (!found || found.pending || !found.warnings || !found.warnings.length) return null;
  const count = found.warnings.length;
  return el("details", { className: "run-warnings" }, [
    el("summary", {}, `${count} fetcher${count === 1 ? "" : "s"} failed; `
      + "their scores stay where the last good run left them"),
    el("ul", {}, found.warnings.map((w) => el("li", {}, [
      el("strong", {}, w.source || "unknown source"),
      el("span", { title: w.message || "" }, lastLine(w.message) || "see the run's log"),
    ]))),
  ]);
}

/* Once, above the list, when the token cannot list annotations: saying it on
   every row would bury the runs, and saying nothing would read as "none". */
function warningsUnavailable() {
  const denied = [...state.runWarnings.values()].find((w) => !w.pending && w.warnings === null);
  if (!denied) return null;
  return el("p", { className: "note busy" }, "Fetcher warnings cannot be shown: "
    + (denied.reason || "api.php could not read the runs' annotations."));
}

function renderRuns() {
  return el("div", {}, [
    renderRunNow(),
    warningsUnavailable(),
    state.runs.length
      ? el("ul", { className: "runs" }, state.runs.map((run) => {
        const shade = run.status !== "completed" ? "running" : (run.conclusion || "");
        const when = new Date(run.created_at);
        const found = state.runWarnings.get(run.id);
        const warned = found && found.warnings && found.warnings.length;
        return el("li", {}, [
          el("span", { className: `pill ${shade}` }, [el("span", { className: "dot" }), runLabel(run)]),
          el("a", { href: run.url, target: "_blank", rel: "noreferrer" }, [
            run.name || String(run.id),
            warned ? el("span", { className: "pill warned", title: "Fetchers that failed on this run" },
              `${warned} warning${warned === 1 ? "" : "s"}`) : null,
          ]),
          el("time", { dateTime: run.created_at }, when.toLocaleString()),
          renderRunWarnings(run),
        ]);
      }))
      : el("p", { className: "empty" }, "No runs to show."),
  ]);
}

/* Dispatches it. Nothing is locked afterwards: the run carries no answers, so
   there is no card whose state depends on how it ends, and the list below is
   the whole of what there is to watch. */
async function refreshNow(quick = false) {
  if (quick) state.quicking = true;
  else state.refreshing = true;
  state.error = state.warn = state.ok = "";
  render();
  try {
    const response = await fetch("api.php", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AI-Bench-Admin": "1" },
      body: JSON.stringify(quick ? { quick: true } : { refresh: true }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.ok = quick
      ? "Queued a quick run. It re-asks every board's mapping questions and shows "
        + "up in the list below in a moment; tap the reload button up top once it "
        + "has finished to read the queue it republished."
      : "Queued a refresh. It takes a few minutes and shows up in the list "
        + "below in a moment. Nothing on this page is waiting on it -- reload once "
        + "it has finished to see the scores it committed and the queue it "
        + "republished.";
    /* A dispatch answers 204 before the run exists, so the read below will not
       have it yet and there is nothing here to poll for: no card's state
       depends on this run. One delayed re-read is what puts it in the list. */
    setTimeout(() => { loadRuns().finally(render); }, RUN_APPEARS_MS);
  } catch (error) {
    state.error = `Could not start a run: ${error.message}`;
  }
  state.refreshing = state.quicking = false;
  await loadRuns();
  render();
}

/* The header's reload: everything the page reads, re-read in place. The draft
   stays -- that is the difference from reloading the page. */
async function reloadData() {
  const button = document.getElementById("reload");
  if (button.classList.contains("busy")) return;
  button.classList.add("busy");
  state.error = state.warn = state.ok = "";
  try {
    if (await loadRuns()) {
      await loadData();
      if (state.mapLog.asked) await ensureMapLog(true);
    } else {
      render();
    }
  } finally {
    button.classList.remove("busy");
  }
}

/* ---------------------------------------------------------------- sending */

/* A mapping onto a model this batch was going to create, whose card has since
   been discarded or renamed: answer.py would refuse it, and the whole batch
   with it, after the run has already started. */
function danglingMappings() {
  const known = { models: new Set(models()), benchmarks: new Set(benchmarks()) };
  const byKey = new Map(state.questions.map((q) => [KEY(q), q]));
  return [...state.answers.entries()].filter(([key, record]) => record.kind === "mapping"
    && known[byKey.get(key)?.universe]
    && record.answer !== "__unmappable__"
    && !known[byKey.get(key).universe].has(record.answer))
    .map(([, record]) => record);
}

/* The same for a score typed into a column this batch was going to add. */
function danglingScores() {
  const known = new Set(benchmarks());
  return [...state.answers.values()].filter((record) => record.kind === "model-edit")
    .flatMap((record) => Object.keys(record.scores || {})
      .filter((bench) => !known.has(bench)).map((bench) => `${record.name}: ${bench}`));
}

async function send() {
  const dangling = danglingMappings();
  if (dangling.length) {
    state.error = "Not sent: " + dangling.map((r) => `${r.subject} -> ${r.answer}`).join(", ")
      + " names a model or benchmark that is neither in llm.json nor added in this batch. "
      + "Add it again, or answer that question another way.";
    render();
    return;
  }
  const strays = danglingScores();
  if (strays.length) {
    state.error = `Not sent: a score for ${strays.join(", ")} goes to a benchmark that is `
      + "neither in llm.json nor added in this batch. Add the benchmark again, or remove the score.";
    render();
    return;
  }
  const answers = [...state.answers.values()];
  const keys = [...state.answers.keys()];
  const mode = state.mode === "quick" && !state.quickOffered ? "full" : state.mode;
  document.getElementById("send").disabled = true;
  state.error = state.warn = state.ok = "";
  try {
    const response = await fetch("api.php", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AI-Bench-Admin": "1" },
      body: JSON.stringify({
        answers,
        skip_refresh: false,
        ...(mode === "quick" ? { quick: true } : {}),
      }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.answers.clear();
    /* The cards that were typed into this batch are done with; what is in
       flight is listed from state.sent instead. */
    state.newModels = state.newModels.filter((d) => !keys.includes(d.key));
    if (keys.some((key) => key.startsWith("reference-add  "))) state.referenceDraft = "";
    if (state.benchDraft?.record && keys.includes(state.benchDraft.record)) state.benchDraft = null;
    /* Before the run list is refreshed, so nothing can settle the batch before
       it is even recorded. */
    /* `queued` is read off the queue as it stands now, because settling cannot:
       it happens inside the run list read, which on a fresh page runs before
       the queue has been read at all. */
    /* What each "None of these" ruled out, for the lock to recognise the
       question when it comes back with something new. */
    const skips = Object.fromEntries(answers
      .map((record, i) => [keys[i], record])
      .filter(([, record]) => record.kind === "candidates-skip")
      .map(([key, record]) => [key, record.answer]));
    writeSent({ at: Date.now(), keys, queued: queueKeys(keys), mode, skips });
    saveDraft();
    state.ok = mode === "quick"
      ? `Dispatched ${body.dispatched} answer(s) as a quick run: it applies them, then `
        + "re-asks every board's mapping questions without refreshing a score. This "
        + "page re-reads the queue by itself when it finishes, a couple of minutes "
        + "from now -- a model added in this batch then has its mapping questions "
        + "waiting on the Queue tab."
      : `Dispatched ${body.dispatched} answer(s). The run applies and pushes them. `
        + "Watch it under Runs; the questions it answers are disabled until it "
        + "finishes, and its own summary is what counts, not its colour, since a "
        + "failed refresh reds a run whose answers landed perfectly well.";
  } catch (error) {
    state.error = `Could not send: ${error.message}`;
  }
  await loadRuns();
  render();
}

applyTheme(readTheme());
/* Before the first read, so a reload mid-run renders the cards it answers as
   locked rather than offering them again for one paint. */
state.sent = readSent();
state.applied = readApplied();
readDraft();
state.tab = (location.hash || "#queue").slice(1);
if (!tabList().some(([tab]) => tab === state.tab)) state.tab = "queue";
window.addEventListener("popstate", () => showTab((location.hash || "#queue").slice(1), { push: false }));
/* The sticky day headings on the Updates tab sit under the sticky header,
   whose height depends on how the tab strip wraps. */
const measureHeader = () => document.documentElement.style.setProperty(
  "--header-h", `${document.querySelector("header").offsetHeight}px`);
window.addEventListener("resize", measureHeader);
measureHeader();
document.getElementById("reload").onclick = reloadData;
document.getElementById("theme").onclick = cycleTheme;
document.getElementById("send").onclick = send;
document.getElementById("clear").onclick = () => {
  /* Everything drafted goes, add-a-model cards included; asked first, because
     on a phone this button sits a thumb's width from Send. */
  if (state.answers.size > 3 && !confirm(`Clear all ${state.answers.size} drafted answers?`)) return;
  state.answers.clear();
  state.newModels = [];
  state.referenceDraft = "";
  state.benchDraft = null;
  render();
};
load();
</script>
</body>
</html>
