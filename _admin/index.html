  return [...models].sort((a, b) => counts.get(a) - counts.get(b) || byNewest(a, b));
}

function renderModels() {
  ensureAaSlugs();
  ensureMapIndex();
  const box = el("div", { className: "stack" });
  const search = noAuto(el("input", {
    type: "search",
    placeholder: "Filter by model or provider...",
    value: state.modelSearch,
    enterKeyHint: "search",
  }));
  /* One box for both: the suggestions offer every provider, with how many
     models it has, ahead of the model names. A provider's exact name filters
     to that provider alone, not also every model that happens to carry the
     name; anything else is a substring of either. */
  const providers = new Map();
  for (const m of state.llm?.models || []) {
    const name = m.creator?.name;
    if (name) providers.set(name, (providers.get(name) || 0) + 1);
  }
  const offered = [...[...providers.keys()].sort((a, b) => a.localeCompare(b)),
    ...(state.llm?.models || []).map((m) => m.name).filter((n) => !providers.has(n)).sort()];
  const creatorOf = new Map((state.llm?.models || []).map((m) => [m.name, m.creator?.name || ""]));
  const combo = comboBox(search, () => offered, {
    min: 1,
    detail: (value) => (providers.has(value)
      ? `provider · ${providers.get(value)} model${providers.get(value) === 1 ? "" : "s"}`
      : creatorOf.get(value) || ""),
  });
  const sort = el("select", {
    onchange: () => { state.modelSort = sort.value; draw(); },
  }, MODEL_SORTS.map(([value, label]) =>
    el("option", { value, selected: state.modelSort === value }, label)));
  const shown = el("span", { className: "count" });
  const results = el("div", { className: "stack" });
  const draw = () => {
    const all = state.llm?.models || [];
    const needle = state.modelSearch.trim().toLowerCase();
    const provider = [...providers.keys()].find((name) => name.toLowerCase() === needle);
    const found = sortedModels(all.filter((m) => !needle
      || (provider ? m.creator?.name === provider
        : [m.name, m.creator?.name].some((v) => String(v ?? "").toLowerCase().includes(needle)))),
    state.modelSort);
    shown.textContent = needle ? `${found.length} of ${all.length}` : `${all.length} models`;
    results.replaceChildren(...(found.length
      ? found.map(renderModelCard)
      : [el("p", { className: "empty" }, all.length
        ? `No model matches "${state.modelSearch.trim()}".`
        : "llm.json has not been read yet.")]));
  };
  /* Held in state, not in the input: a rename is drafted with a click, which
     re-renders the whole view, and a needle that lived only in the DOM would
     take the card being worked on with it. */
  search.oninput = () => { state.modelSearch = search.value; draw(); };
  box.append(
    renderAddBox(),
    el("div", { className: "toolbar search" }, [
      el("div", { className: "grow" }, combo), el("div", {}, sort), shown]),
    results,
  );
  draw();
  return box;
}

/* "Add a model", folded above the model list: a release nothing offered, or
   one Artificial Analysis lists that the Queue is not asking about (older than
   check_new.py's window, or dismissed once). Open by itself while a card holds
   something, so a draft restored after a reload is not hidden. */
function renderAddBox() {
  const busy = state.newModels.some((d) => !d.question && (d.name.trim() || Object.keys(d.fields).length))
    || flyingCreates().length > 0;
  const box = el("details", { className: "add-box", open: state.addOpen || busy });
  box.ontoggle = () => { state.addOpen = box.open; };
  box.append(el("summary", { className: "section-title", style: "cursor:pointer" },
    "Add a model -- by hand, or one Artificial Analysis lists"));
  box.append(renderAddModels());
  return box;
}

/* One card per model, folded to its name until opened. The form inside is
   only built on the first unfold: 179 models times every column would be ten
   thousand inputs on a phone, almost none of which a sitting ever looks at. */
const MODEL_DELETE_KEY = (name) => `model-delete  ${name}`;

function renderModelCard(model) {
  const key = `model-edit  ${model.name}`;
  const renameKey = `model-rename  ${model.name}`;
  const deleteKey = MODEL_DELETE_KEY(model.name);
  const rename = state.answers.get(renameKey);
  const existing = state.answers.get(key);
  const deleting = state.answers.has(deleteKey);
  /* Whichever of the three is in flight: a reload drops the drafted record but
     not the lock. */
  const lockKey = [deleteKey, renameKey].find((k) => isSent(k) || isApplied(k)) || key;
  const locked = isSent(lockKey) || isApplied(lockKey);
  const card = el("details", {
    className: `card model-card${existing || rename || deleting ? " answered" : ""}`,
  });
  const columns = benchmarks();
  const count = scoredCount(model);
  const mapDrafts = state.mapIndex.doc ? mappingDraftCount(model.name) : 0;
  const hinting = state.answers.has(HINTS_KEY(model.name));
  card.append(el("summary", {}, [
    aaMark(model),
    el("span", { className: "subject" }, model.name),
    el("div", { className: "chips" }, [
      chip("", model.creator?.name || "unknown", { prose: true }),
      chip("added", model.date_added || "?"),
      chip("scored", `${count} / ${columns.length}`,
        { className: count < columns.length / 4 ? "now" : "" }),
      deleting ? chip("", "deleted on the next run", { prose: true, className: "now" }) : null,
      mapDrafts ? chip("mappings", `${mapDrafts} change${mapDrafts === 1 ? "" : "s"}`, { className: "now" }) : null,
      hinting ? chip("", "\"not this\" hints change", { prose: true, className: "now" }) : null,
    ]),
  ]));

  let built = false;
  const build = () => {
    if (built) return;
    built = true;
    if (deleting) {
      card.append(
        el("div", { className: "options" }, option("Keep it", "cancel the delete", {
          pressed: false,
          onclick: () => { state.answers.delete(deleteKey); render(); },
        })),
        el("p", { className: "note-text" },
          `${model.name} leaves llm.json on the next run, with its ${count} score${count === 1 ? "" : "s"} `
          + "and their history, and its slug is dismissed so the new-model check does "
          + "not offer it again. Mapping files are left as they are."),
      );
      return;
    }
    /* The two whole-model actions first: they are what a card is usually opened
       for, and below the score list they sat a long scroll down on a phone. */
    card.append(
      hintsBlock(model),
      renameBlock(model, renameKey, rename),
      deleteBlock(model, { key, renameKey, deleteKey }),
      mappingsBlock(model),
    );
    fillModelCard(card, model, { key, renameKey, rename, existing, columns });
  };
  card.open = state.modelOpen.has(model.name) || Boolean(existing || rename || deleting || mapDrafts || hinting);
  card.ontoggle = () => {
    if (card.open) { state.modelOpen.add(model.name); build(); }
    else state.modelOpen.delete(model.name);
  };
  /* A locked card disables whatever it holds when it is locked, so the form has
     to be there by then. */
  if (card.open || locked) build();
  return guard(card, lockKey);
}

/* What a source name that looks like this model must not be mapped onto it
   as: the model's "not this" hints, llm.json `excludes` on the entry, one per
   line. The Queue shows them under the model wherever it is offered as a
   candidate, the way it shows a column's "Not this" list -- so whoever
   answers sees "not Muse Spark (API)" before picking muse-spark-open. Sent
   as a `model-hints` record, on its own: it may share a batch with an edit of
   the same model, not with its rename or delete. */
const HINTS_KEY = (name) => `model-hints  ${name}`;

function hintsBlock(model) {
  const key = HINTS_KEY(model.name);
  const stored = (model.excludes || []).filter((h) => typeof h === "string");
  const record = state.answers.get(key);
  const block = el("div", { className: `provenance hints${record ? " changed" : ""}` });
  const area = el("textarea", {
    rows: Math.max(2, Math.min(6, (record?.excludes || stored).length + 1)),
    placeholder: "Muse Spark (the closed API model)\nthe -fp8 quant",
    value: (record?.excludes || stored).join("\n"),
    disabled: isSent(key),
  });
  const problem = el("p", { className: "note-text" });
  const commit = () => {
    const lines = area.value.split("\n").map((l) => l.trim()).filter(Boolean);
    const unique = [...new Set(lines)];
    const long = unique.find((l) => l.length > 160);
    const tooMany = unique.length > 12;
    const same = unique.length === stored.length && unique.every((l, i) => l === stored[i]);
    problem.textContent = long ? "a hint is at most 160 characters"
      : tooMany ? "at most 12 hints"
        : same ? "Shown under this model on every Queue card that offers it. One per line."
          : "Changes on the next run.";
    problem.classList.toggle("bad-text", Boolean(long || tooMany));
    if (long || tooMany || same) state.answers.delete(key);
    else state.answers.set(key, { kind: "model-hints", name: model.name, excludes: unique, if_previous: stored.length ? stored : null });
    block.classList.toggle("changed", state.answers.has(key));
    refreshFooter();
  };
  area.oninput = commit;
  block.append(
    el("div", { className: "field" }, el("label", {}, "not this -- hints for whoever maps a name onto it")),
    area, problem,
  );
  commit();
  if (isSent(key)) block.append(el("p", { className: "note-text" }, "sent -- waiting for the run"));
  return block;
}

/* Delete, for an entry that should never have been tracked. One record per
   model per run, so drafting it drops this card's edit and rename. A reference
   model is not deleted here: it is on reference-models.json too, and the
   Reference tab's Stop carrying takes both. */
function deleteBlock(model, { key, renameKey, deleteKey }) {
  const reference = model.reference === true || (state.reference.slugs || []).includes(model.name);
  const block = el("div", { className: "provenance" });
  block.append(el("div", { className: "field" }, el("label", {}, "delete")));
  if (reference) {
    block.append(el("p", { className: "note-text" },
      "A reference model: stop carrying it from the Reference tab, which removes "
      + "the slug and this entry together."));
    return block;
  }
  block.append(el("div", { className: "options" }, option("Delete this model",
    "drops the entry from llm.json, scores and history included", {
      pressed: false,
      className: "decline",
      onclick: () => {
        if (!confirm(`Delete ${model.name} and all of its scores?`)) return;
        state.answers.delete(key);
        state.answers.delete(renameKey);
        state.answers.set(deleteKey, { kind: "model-delete", name: model.name });
        render();
      },
    })));
  return block;
}

function fillModelCard(card, model, { key, rename, existing, columns }) {
  const draft = {
    fields: { ...(existing?.fields || {}) },
    scores: { ...(existing?.scores || {}) },
    score_date: existing?.score_date ?? today(),
    score_url: existing?.score_url ?? "",
  };
  let provenance;
  const commit = () => {
    const scored = Object.keys(draft.scores).length > 0;
    const writes = Object.values(draft.scores).some((value) => value !== null);
    provenance.hidden = !scored;
    /* A batch is all or nothing on the runner, so a half-typed page must not
       reach it: it would refuse this record and take every other answer in the
       sitting down with it. The card simply stops counting as answered until
       the URL is one. */
    const broken = META_FIELDS.some(([field, type]) => type === "url" && badUrl(draft.fields[field]))
      || (scored && badScoreUrl(draft.score_url, writes));
    const empty = !Object.keys(draft.fields).length && !scored;
    if (empty || broken) state.answers.delete(key);
    else {
      /* The provenance travels with the scores or not at all: answer.py refuses
         a date or a page with nothing to stamp it on, and a params-only edit
         has nothing. A blank date leaves the stamping to the runner, which is
         still "now", just its own. */
      const record = { kind: "model-edit", name: model.name, fields: draft.fields, scores: draft.scores };
      if (scored) {
        if (draft.score_date) record.score_date = draft.score_date;
        record.score_url = draft.score_url.trim() || null;
      }
      state.answers.set(key, record);
    }
    /* Same reason the queue's search box does not re-render: a full rebuild
       would replace the input being typed into. */
    card.classList.toggle("answered", !empty && !broken);
    refreshFooter();
  };

  /* Every field add.py asks for, so nothing is enterable once and then frozen.
     Anything outside this list exits 2 out of edit.py's argparse. */
  const fields = el("div", {});
  const inputs = {};
  const fillCreatorUrl = creatorUrlFiller(inputs, readField(model, "creator_url"));
  for (const [field, type, placeholder] of META_FIELDS) {
    const current = readField(model, field);
    const input = el("input", {
      type,
      placeholder,
      value: draft.fields[field] ?? current,
      disabled: Boolean(rename),
    });
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === current) delete draft.fields[field];
      else draft.fields[field] = value === "" ? null : value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    const picker = field !== "url" ? null : hfUrlPicker(input, {
      fixed: () => [[current, current ? "keep the URL it has now" : "leave it empty"]],
      search: modelUrlSearch(() => model.name, () => current, () => readField(model, "creator_url")),
      locked: Boolean(rename),
    });
    fields.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), ...fieldControl(field, input, picker)]));
    picker?.refresh();
  }
  card.append(fields);

  /* One date and one page for the whole edit rather than per score: a sitting
     is one leaderboard read on one day, and edit.py stamps what that run
     changes. Two dates means two batches. */
  const dateInput = el("input", {
    type: "date", value: draft.score_date, max: today(), disabled: Boolean(rename),
  });
  dateInput.oninput = () => { draft.score_date = dateInput.value; commit(); };
  const urlInput = el("input", {
    type: "url",
    inputMode: "url",
    placeholder: "https://... page the scores were read from",
    value: draft.score_url,
    disabled: Boolean(rename),
  });
  urlInput.oninput = () => {
    draft.score_url = urlInput.value;
    urlInput.classList.toggle("unknown", badScoreUrl(draft.score_url, false));
    commit();
  };
  provenance = el("div", { className: "provenance" }, [
    el("div", { className: "fields" }, [
      el("div", { className: "field" }, [el("label", {}, "score date"), dateInput]),
      el("div", { className: "field" }, [el("label", {}, "score url"), urlInput]),
    ]),
    el("p", { className: "note-text" },
      "Stamped on every score changed below, and required with one. A page moves "
      + "the value onto that page's rung of the source precedence, where only that "
      + "page or a better one may overwrite it."),
  ]);

  /* Every column a hand edit can write, the empty ones included -- an empty
     box is how a missing score gets typed in. A box is only part of the answer
     once it differs from what llm.json holds; clearing a stored score sends a
     null, which edit.py reads as "remove it". */
  const scores = el("div", { className: "model-scores" });
  for (const bench of columns) {
    const stored = model.scores?.[bench] ?? null;
    const input = el("input", {
      type: "number", step: "0.1", inputMode: "decimal",
      placeholder: stored === null ? "missing" : "",
      value: bench in draft.scores ? (draft.scores[bench] ?? "") : (stored ?? ""),
      disabled: Boolean(rename),
    });
    const row = el("div", { className: `score-row${stored === null ? " missing" : ""}` });
    const undo = el("button", { type: "button", className: "btn ghost tiny" }, "Undo");
    const mark = () => {
      const changed = bench in draft.scores;
      row.classList.toggle("changed", changed);
      undo.disabled = !changed || Boolean(rename);
    };
    input.oninput = () => {
      const value = input.value === "" ? null : Number(input.value);
      if (value === stored) delete draft.scores[bench];
      else draft.scores[bench] = value;
      mark();
      commit();
    };
    undo.onclick = () => {
      delete draft.scores[bench];
      input.value = stored ?? "";
      mark();
      commit();
    };
    /* What is already on record for this score, under the box about to
       overwrite it: the number typed here becomes the next entry in that
       list, and whoever types it should be able to see what it replaces
       without opening the site in another tab. Read-only -- the history is
       written by the runner, from the scores, and is not an answer to send.
       Three entries is the whole past of almost every score; the rest is
       counted rather than listed, since this is a hint beside a form and not
       the model's page. */
    const past = recordedHistory(model, bench);
    const shown = past.slice(0, 3).map((event) =>
      el("span", {}, `${event.date} · ${event.value === null ? "—" : event.value} · ${event.kind}`));
    if (past.length > shown.length) {
      shown.push(el("span", { className: "more" }, `+${past.length - shown.length} earlier`));
    }
    const name = state.llm?.benchmarks?.[bench]?.short_name || state.llm?.benchmarks?.[bench]?.name;
    row.append(el("label", { title: name || bench }, bench), input, undo);
    if (past.length) row.append(el("div", { className: "score-past" }, shown));
    mark();
    scores.append(row);
  }
  const missing = columns.filter((bench) => model.scores?.[bench] == null).length;
  /* Folded: a hundred-odd boxes are most of the card's height, and most
     sittings open a card for its fields or its mappings. Unfolded by itself
     when the draft already changes a score. */
  const scoreFold = el("details", { className: "score-fold" }, [
    el("summary", {}, `scores -- ${columns.length - missing} of ${columns.length}, ${missing} missing`),
    scores,
  ]);
  scoreFold.open = state.scoresOpen.has(model.name) || Object.keys(draft.scores).length > 0;
  scoreFold.ontoggle = () => (scoreFold.open ? state.scoresOpen.add(model.name) : state.scoresOpen.delete(model.name));
  card.append(scoreFold, provenance);
  commit();
}

/* Which Artificial Analysis slug this entry answers to -- and, when the answer
   is "none of them", the way to change that.

   update.resolve_aa_slugs() reads AA for a model whose *name* is a slug there,
   byte for byte. So an entry added by hand before AA tracked it starts
   collecting AA scores by itself the day AA publishes the same slug, and needs
   nothing here. When AA publishes it under a different slug there are two ways
   out: map the name to the slug (the Queue tab asks exactly that, once a
   refresh has noticed), or take the slug as the entry's name, which leaves
   nothing to maintain afterwards. This is the second. */
function renameBlock(model, renameKey, rename) {
  const block = el("div", { className: "provenance aa" });
  block.append(el("div", { className: "field" }, el("label", {}, "artificial analysis")));

  if (rename) {
    block.append(
      el("div", { className: "chips" }, chip("rename to", rename.new_name)),
      el("div", { className: "options" }, option("Cancel the rename", "keep this name", {
        pressed: false,
        className: "decline",
        onclick: () => { state.answers.delete(renameKey); render(); },
      })),
      el("p", { className: "note-text" },
        `${model.name} becomes ${rename.new_name} in llm.json and in every mapping `
        + "file that names it -- rename.py does both, because a name left behind in "
        + "one of them does not fail, it just stops matching. The fields above are "
        + "not sent with it: one record per model per run."),
    );
    return block;
  }

  if (state.aa.error) {
    block.append(el("p", { className: "note-text" },
      String(state.aa.error).includes("404")
        ? "No published Artificial Analysis list yet. It appears after the next "
          + "refresh run. ./rename.py does the same job from a terminal."
        : `Could not read the Artificial Analysis slugs (${state.aa.error}).`));
    return block;
  }
  if (state.aa.slugs === null) {
    block.append(el("p", { className: "note-text" }, "Reading the Artificial Analysis slugs..."));
    return block;
  }
  if (state.aa.slugs.includes(model.name)) {
    block.append(el("p", { className: "note-text good-text" },
      "Artificial Analysis publishes this exact slug, so update.py reads it "
      + "directly. Nothing to map and nothing to rename."));
    return block;
  }

  const suggestions = aaSuggestions(model.name);
  const options = el("div", { className: "options" });
  for (const { slug, why } of suggestions) {
    options.append(option(slug, `rename to this -- ${why}${aaSlugDetail(slug)}`, {
      pressed: false,
      className: why.startsWith("the same name") ? "exact" : "",
      tag: why.startsWith("the same name") ? "best match" : "",
      onclick: () => setRename(model, renameKey, slug),
    }));
  }
  if (suggestions.length) block.append(options);

  const input = slugInput({ placeholder: "type to search" });
  const apply = el("button", { className: "btn ghost tiny", type: "button" }, "Rename");
  apply.onclick = () => {
    const value = input.value.trim();
    if (!state.aa.slugs.includes(value)) {
      input.classList.add("unknown");
      return;
    }
    setRename(model, renameKey, value);
  };
  input.oninput = () => input.classList.remove("unknown");
  block.append(
    el("div", { className: "score-row" }, [
      el("label", {}, `or one of ${state.aa.slugs.length} AA slugs`),
      comboBox(input, () => state.aa.slugs, { detail: aaSlugDetail, min: 2 }),
      apply,
    ]),
    el("p", { className: "note-text" },
      suggestions.length
        ? "Renaming is what makes AA read this model without a mapping. Keeping the "
          + "name instead is the Queue tab's job: it asks which slug this model is."
        : "No slug looks like this name. If AA does track the model under an "
          + "unrelated slug, map it from the Queue tab rather than renaming."),
  );
  return block;
}

function setRename(model, renameKey, slug) {
  /* One record per model per run: the batch applies in order and rolls back
     together, so an edit sent alongside a rename would be looking for a name
     that is no longer there. The edit loses, because the rename is the thing
     just clicked. */
  state.answers.delete(`model-edit  ${model.name}`);
  state.answers.set(renameKey, { kind: "model-rename", name: model.name, new_name: slug });
  render();
}

/* ── A model's mappings ──
   Every source name that feeds this model, from every fetcher's mapping file,
   with the columns each source supplies to it -- and the way to change any of
   them. The queue asks about a name once; a decision made there, or by a
   cleanup that parked a preview's names, used to be final from here. Now a
   line can be re-pointed, parked, removed (the queue asks about the name
   again) or added, as a `mapping-edit` record, and a name's "not these" list
   -- the candidates a "None of these" ruled out -- edited as a
   `rejection-edit`. _mapping_index.py publishes what this reads;
   _answers.py holds both records to the rules a queue answer is held to. */

const MAP_EDIT_KEY = (rid, subject) => `mapping-edit  ${rid} ${subject}`;
const RULE_EDIT_KEY = (rid, subject) => `rejection-edit  ${rid} ${subject}`;
const MAP_SENTINEL = /^__.*__$/;
const AA_ROUTE_ID = "update_artificialanalysis_mapping.py *";

async function ensureMapIndex(force = false) {
  if (!state.raw || (state.mapIndex.asked && !force)) return;
  state.mapIndex.asked = true;
  try {
    const response = await fetch(bust(`${dataBase()}/_pending/mappings.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const doc = await response.json();
    if (!Array.isArray(doc.routes) || !doc.files) throw new Error("the file has no routes");
    state.mapIndex = { doc, error: "", asked: true };
  } catch (error) {
    state.mapIndex = { doc: null, error: String(error.message), asked: true };
  }
  if (state.tab === "models" || state.tab === "benchmarks") render();
}

const mapRoutes = () => state.mapIndex.doc?.routes || [];
/* The Models tab's routes (model names and AA slugs) and the Benchmarks
   tab's (card and llm-stats labels onto a column). */
const isLabelRoute = (route) => route?.universe === "benchmarks";
const modelRoutes = () => mapRoutes().filter((r) => !isLabelRoute(r));
const labelRoutes = () => mapRoutes().filter(isLabelRoute);
const mapRoute = (rid) => mapRoutes().find((r) => r.id === rid) || null;
const mapSource = (rid) => {
  const route = mapRoute(rid);
  return route ? sourceOf(route) : rid;
};
const asValues = (value) => (value === undefined || value === null ? null
  : Array.isArray(value) ? value : [value]);
const mapFileValue = (rid, subject) => asValues(state.mapIndex.doc?.files?.[rid]?.[subject]);
const mapRejected = (rid, subject) => state.mapIndex.doc?.rejections?.[rid]?.[subject] || [];
const benchShort = (key) => (key === "vram" ? "VRAM"
  : state.llm?.benchmarks?.[key]?.short_name || state.llm?.benchmarks?.[key]?.name || key);

/* The matcher's exact tier is normalized equality (normSlug above), and
   answer.py refuses a mapping that contradicts it (test_propose.py would fail
   on it). Checked here as well, so a refused record does not take the rest of
   the batch down with it; the runner's check is the real one. */
function exactClash(rid, subject, value) {
  const universe = mapRoute(rid)?.universe;
  if (!["models", "benchmarks"].includes(universe) || MAP_SENTINEL.test(value)) return "";
  const tail = normSlug(subject.includes("/") ? subject.slice(subject.lastIndexOf("/") + 1) : subject);
  /* For a label, every column key -- the derived ones too, as test_propose.py
     replays them. */
  const options = universe === "models"
    ? (state.llm?.models || []).map((m) => m.name)
    : Object.keys(state.llm?.benchmarks || {});
  const hits = options.filter((name) => normSlug(name) === tail);
  return hits.length === 1 && hits[0] !== value ? hits[0] : "";
}

/* What this card's model is fed by, read off the index: the lines naming it
   (for the AA file, the line keyed by it), grouped per route. */
function modelMappings(name) {
  const doc = state.mapIndex.doc;
  const groups = new Map();
  const group = (rid) => {
    if (!groups.has(rid)) groups.set(rid, { rid, lines: [], parked: [], ruled: [], supplies: [] });
    return groups.get(rid);
  };
  for (const route of modelRoutes()) {
    const file = doc.files[route.id] || {};
    if (route.id === AA_ROUTE_ID) {
      if (name in file) group(route.id).lines.push({ subject: name, value: asValues(file[name]) });
    } else {
      for (const [subject, value] of Object.entries(file)) {
        if (asValues(value).includes(name)) group(route.id).lines.push({ subject, value: asValues(value) });
      }
    }
    for (const [subject, options] of Object.entries(doc.rejections?.[route.id] || {})) {
      if (route.id === AA_ROUTE_ID ? subject === name : options.includes(name)) {
        group(route.id).ruled.push({ subject, options });
      }
    }
  }
  for (const [rid, subject] of doc.parked?.[name] || []) {
    if (mapRoute(rid)) group(rid).parked.push({ subject, value: mapFileValue(rid, subject) });
  }
  const supplies = doc.contributions?.[name] || {};
  for (const [rid, keys] of Object.entries(supplies)) {
    if (mapRoute(rid)) group(rid).supplies = keys;
  }
  /* Lines this batch adds or moves onto the model, which the index cannot
     know about yet: they are listed with the rest, so Undo is where it was. */
  for (const [key, record] of state.answers) {
    if (record.kind !== "mapping-edit" || record.answer !== name) continue;
    const rid = `${record.route} ${record.route_kind}`;
    if (!mapRoute(rid) || rid === AA_ROUTE_ID || isLabelRoute(mapRoute(rid))) continue;
    const g = group(rid);
    if (!g.lines.some((l) => l.subject === record.subject) && !g.parked.some((l) => l.subject === record.subject)) {
      g.lines.push({ subject: record.subject, value: mapFileValue(rid, record.subject), added: true });
    }
  }
  const order = new Map(mapRoutes().map((r, i) => [r.id, i]));
  return {
    groups: [...groups.values()].sort((a, b) => (order.get(a.rid) ?? 999) - (order.get(b.rid) ?? 999)),
    card: supplies.card || [],
    other: supplies.other || [],
  };
}

/* The mapping drafts in the batch that concern this model, for its summary. */
function mappingDraftCount(name) {
  let n = 0;
  for (const record of state.answers.values()) {
    if (record.kind === "mapping-edit" && isLabelRoute(mapRoute(`${record.route} ${record.route_kind}`))) continue;
    if (record.kind === "mapping-edit") {
      const before = mapFileValue(`${record.route} ${record.route_kind}`, record.subject) || [];
      if (record.answer === name || before.includes(name)
        || (record.route === "update_artificialanalysis_mapping.py" && record.subject === name)) n += 1;
    } else if (record.kind === "rejection-edit") {
      if ([...record.add, ...record.remove].includes(name)
        || (record.route === "update_artificialanalysis_mapping.py" && record.subject === name)) n += 1;
    }
  }
  return n;
}

function setMapEdit(rid, subject, answer) {
  const route = mapRoute(rid);
  const key = MAP_EDIT_KEY(rid, subject);
  const before = mapFileValue(rid, subject);
  /* Back to what the file holds is no edit at all. */
  const same = answer === undefined
    || (answer === null ? before === null : before && before.length === 1 && before[0] === answer);
  if (same) state.answers.delete(key);
  else {
    state.answers.set(key, {
      kind: "mapping-edit", route: route.route, route_kind: route.route_kind,
      subject, answer, if_previous: before,
    });
  }
}

/* One record per name, however many cards edit its list: each card adds or
   takes off its own model, and the record is the sum. */
function setRuleEdit(rid, subject, option, op) {
  const route = mapRoute(rid);
  const key = RULE_EDIT_KEY(rid, subject);
  const record = state.answers.get(key) || {
    kind: "rejection-edit", route: route.route, route_kind: route.route_kind, subject, add: [], remove: [],
  };
  record.add = record.add.filter((o) => o !== option);
  record.remove = record.remove.filter((o) => o !== option);
  if (op === "add") record.add.push(option);
  if (op === "remove") record.remove.push(option);
  if (record.add.length || record.remove.length) state.answers.set(key, record);
  else state.answers.delete(key);
}
const ruleOp = (rid, subject, option) => {
  const record = state.answers.get(RULE_EDIT_KEY(rid, subject));
  return record?.add.includes(option) ? "add" : record?.remove.includes(option) ? "remove" : null;
};

/* A segmented choice, as the Cleanup tab draws its Keep / Park. */
function segChoice(choices, current, onpick, disabled = false) {
  const box = el("div", { className: "seg" });
  for (const [value, label] of choices) {
    const button = el("button", { type: "button", className: "btn ghost tiny", disabled,
      onclick: () => onpick(value) }, label);
    button.setAttribute("aria-pressed", String(current === value));
    box.append(button);
  }
  return box;
}

function mappingsBlock(model) {
  const name = model.name;
  const box = el("details", { className: "provenance mappings" });
  const { doc, error } = state.mapIndex;
  if (!doc) {
    box.open = true;
    box.append(el("summary", {}, "mappings"), el("p", { className: "note-text" }, error
      ? (error.includes("404")
        ? "No mapping index yet. It appears after the next run publishes _pending/mappings.json "
          + "(./mapping_index.py --publish from a terminal)."
        : `Could not read the mapping index (${error}).`)
      : "Reading the mapping index..."));
    return box;
  }
  const { groups, card, other } = modelMappings(name);
  const lines = groups.reduce((n, g) => n + g.lines.length, 0);
  const parked = groups.reduce((n, g) => n + g.parked.length, 0);
  const drafts = mappingDraftCount(name);
  box.open = state.mapOpen.has(name) || drafts > 0;
  box.ontoggle = () => (box.open ? state.mapOpen.add(name) : state.mapOpen.delete(name));
  box.append(el("summary", {}, [
    "mappings",
    el("span", { className: "map-sum" }, [
      `${lines} name${lines === 1 ? "" : "s"} from ${groups.filter((g) => g.lines.length).length} source${groups.filter((g) => g.lines.length).length === 1 ? "" : "s"}`,
      parked ? ` · ${parked} parked look${parked === 1 ? "s" : ""} like it` : "",
      drafts ? ` · ${drafts} change${drafts === 1 ? "" : "s"} in this batch` : "",
    ].join("")),
  ]));
  box.append(el("p", { className: "note-text" },
    "Every name a source publishes that is mapped onto this model, and the columns that source "
    + "supplies to it now (read off the page each score is credited to). Park writes __unmappable__; "
    + "Remove takes the line out, so the queue asks about the name again; Move puts it onto another "
    + "model. Re-pointing a name does not move the scores already stored -- the next full run "
    + "re-reads the source."));

  const redraw = () => { render(); };
  const models = () => (state.llm?.models || []).map((m) => m.name);

  for (const g of groups) {
    const route = mapRoute(g.rid);
    const isAa = g.rid === AA_ROUTE_ID;
    const section = el("div", { className: "map-group" });
    section.append(el("div", { className: "map-head" }, [
      el("b", {}, mapSource(g.rid)),
      route.route_kind !== "*" ? el("span", { className: "map-kind" }, route.route_kind) : null,
      el("span", { className: "map-file mono" }, route.file),
    ]));
    if (g.supplies.length) {
      section.append(el("div", { className: "map-supplies" }, [
        el("span", { className: "map-label" }, "supplies"),
        ...g.supplies.map((key) => el("span", { className: "bench-tag", title: key }, benchShort(key))),
      ]));
    } else if (g.lines.length) {
      section.append(el("div", { className: "map-supplies" },
        el("span", { className: "map-label" }, "supplies no score right now")));
    }

    for (const line of g.lines) section.append(mapLineRow(g.rid, line, name, { isAa, models, redraw }));
    for (const line of g.parked) section.append(parkedRow(g.rid, line, name, redraw));
    for (const entry of g.ruled) section.append(ruledRow(g.rid, entry, name, isAa, redraw));
    box.append(section);
  }
  if (card.length || other.length) {
    const section = el("div", { className: "map-group" });
    section.append(el("div", { className: "map-head" }, el("b", {}, "no mapping")));
    if (card.length) {
      section.append(el("div", { className: "map-supplies" }, [
        el("span", { className: "map-label" }, "model card (the url field)"),
        ...card.map((key) => el("span", { className: "bench-tag", title: key }, benchShort(key))),
      ]));
    }
    if (other.length) {
      section.append(el("div", { className: "map-supplies" }, [
        el("span", { className: "map-label" }, "pages cited by hand"),
        ...other.map((key) => el("span", { className: "bench-tag", title: key }, benchShort(key))),
      ]));
    }
    box.append(section);
  }
  if (!groups.length && !card.length && !other.length) {
    box.append(el("p", { className: "note-text" }, "No source maps a name onto this model yet."));
  }

  box.append(addMappingForm(name, redraw), ruleOutForm(name, redraw));
  return box;
}

/* One line of a mapping file that names the model: Keep / Park / Remove /
   Move, or for the AA file (keyed by the model) the slug it reads. */
function mapLineRow(rid, line, name, { isAa, models, redraw }) {
  const key = MAP_EDIT_KEY(rid, line.subject);
  const record = state.answers.get(key);
  const sent = isSent(key);
  const row = el("div", { className: "score-row decision-row map-line" });
  const now = line.value ? line.value.join(", ") : "not in the file yet";
  const current = !record ? (state.mapMoving.has(key) ? "move" : "keep")
    : record.answer === null ? "remove"
      : record.answer === "__unmappable__" ? "park"
        : record.answer === name && !isAa ? "keep"
          : "move";
  const label = el("label", {}, [
    el("span", { className: "mono" }, line.subject),
    el("span", { className: "arrow" }, " → "),
    el("span", { className: "mono" + (line.added ? " good-text" : "") },
      line.added ? `${name} (added in this batch; now ${now})` : now),
  ]);
  const problem = el("p", { className: "note-text bad-text map-problem" });
  const choices = isAa
    ? [["keep", "Keep"], ["move", "Other slug"], ["park", "Park"], ["remove", "Remove"]]
    : [["keep", line.added ? "Undo" : "Keep"], ["move", "Move"], ["park", "Park"], ["remove", "Remove"]];
  const seg = segChoice(line.added ? [choices[0]] : choices, line.added ? "" : current, (value) => {
    if (value === "keep") setMapEdit(rid, line.subject, line.added ? undefined : (isAa ? undefined : name));
    else if (value === "park") setMapEdit(rid, line.subject, "__unmappable__");
    else if (value === "remove") setMapEdit(rid, line.subject, null);
    else if (value === "move") {
      /* Opens the box; nothing is drafted until a name is picked. */
      state.answers.delete(key);
      state.mapMoving.add(key);
    }
    if (value !== "move") state.mapMoving.delete(key);
    redraw();
  }, sent);
  row.append(label, seg);
  if (sent) row.append(el("p", { className: "note-text" }, "sent -- waiting for the run"));

  if (current === "move" || state.mapMoving.has(key)) {
    const pool = isAa ? () => state.aa.slugs || [] : () => models().filter((m) => m !== name);
    const input = slugInput({
      placeholder: isAa ? "AA slug..." : "the model it really is...",
      value: record && current === "move" ? record.answer : "",
      disabled: sent,
    });
    input.oninput = () => {
      const value = input.value.trim();
      const known = pool().includes(value);
      const clash = known ? exactClash(rid, line.subject, value) : "";
      input.classList.toggle("unknown", Boolean(value) && (!known || Boolean(clash)));
      problem.textContent = clash
        ? `${line.subject} normalizes to exactly ${clash}; the runner would refuse this move.`
        : "";
      if (known && !clash) setMapEdit(rid, line.subject, value);
      else state.answers.delete(key);
      row.classList.toggle("changed", state.answers.has(key));
      refreshFooter();
    };
    row.append(el("div", { className: "field picker map-move" },
      comboBox(input, pool, { min: 2, detail: isAa ? aaSlugDetail : () => "" })), problem);
  }
  row.classList.toggle("changed", Boolean(record));
  return row;
}

/* A name parked on a sentinel that looks like this model -- usually one a
   preview cleanup parked. Mapping it back is an edit of that line. */
function parkedRow(rid, line, name, redraw) {
  const key = MAP_EDIT_KEY(rid, line.subject);
  const record = state.answers.get(key);
  const clash = exactClash(rid, line.subject, name);
  const row = el("div", { className: "score-row decision-row map-line parked" });
  row.append(
    el("label", {}, [
      el("span", { className: "mono" }, line.subject),
      el("span", { className: "arrow" }, " → "),
      el("span", { className: "mono sentinel" }, (line.value || []).join(", ")),
    ]),
    segChoice([["leave", "Leave parked"], ["map", `Map onto ${name}`], ["remove", "Remove"]],
      !record ? "leave" : record.answer === null ? "remove" : "map",
      (value) => {
        setMapEdit(rid, line.subject, value === "map" ? name : value === "remove" ? null : undefined);
        redraw();
      }, isSent(key) || Boolean(clash)),
  );
  row.append(el("p", { className: "note-text" }, clash
    ? `normalizes to exactly ${clash}, so it can only map onto that model`
    : "parked, and looks like this model -- a cleanup parks a preview's names; map it back here"));
  row.classList.toggle("changed", Boolean(record));
  return row;
}

/* A name whose "not these" list rules this model out (for the AA file: the
   slugs ruled out for this model). Taking it off lets the queue offer it
   again. */
function ruledRow(rid, entry, name, isAa, redraw) {
  const row = el("div", { className: "score-row decision-row map-line ruled" });
  const sent = isSent(RULE_EDIT_KEY(rid, entry.subject));
  if (isAa) {
    row.append(el("label", {}, `AA slugs ruled out for ${name}`));
    const chips = el("div", { className: "seg" });
    for (const slug of entry.options) {
      const op = ruleOp(rid, name, slug);
      const button = el("button", { type: "button", className: "btn ghost tiny", disabled: sent,
        onclick: () => { setRuleEdit(rid, name, slug, op === "remove" ? null : "remove"); redraw(); },
      }, op === "remove" ? `${slug} (offered again)` : `not ${slug} ✕`);
      button.setAttribute("aria-pressed", String(op === "remove"));
      chips.append(button);
    }
    row.append(chips);
    return row;
  }
  const op = ruleOp(rid, entry.subject, name);
  row.append(
    el("label", {}, [el("span", { className: "mono" }, entry.subject), " is not this model"]),
    segChoice([["keep", "Keep"], ["remove", "Offer again"]], op === "remove" ? "remove" : "keep",
      (value) => { setRuleEdit(rid, entry.subject, name, value === "remove" ? "remove" : null); redraw(); }, sent),
  );
  if (entry.options.length > 1) {
    row.append(el("p", { className: "note-text" },
      `also ruled out for it: ${entry.options.filter((o) => o !== name).join(", ")}`));
  }
  row.classList.toggle("changed", Boolean(op));
  return row;
}

/* Route picker shared by the two forms below: every route the index covers,
   by source name. */
function routeSelect(value, onchange, { includeAa = true, routes = modelRoutes } = {}) {
  const select = el("select", { onchange: () => onchange(select.value) }, [
    el("option", { value: "" }, "source..."),
    ...routes().filter((r) => includeAa || r.id !== AA_ROUTE_ID).map((r) =>
      el("option", { value: r.id, selected: r.id === value },
        `${sourceOf(r)}${r.route_kind !== "*" ? ` (${r.route_kind})` : ""}`)),
  ]);
  return select;
}

/* The names a route knows: every line of its file, and whatever the queue is
   asking it about. */
function routeNames(rid) {
  const route = mapRoute(rid);
  if (!route) return [];
  const names = new Set(Object.keys(state.mapIndex.doc.files[rid] || {}));
  for (const q of state.questions) {
    /* llm-stats asks two kinds under one script: only this route's. */
    if (q.route === route.route && (route.route_kind === "*" || q.route_kind === route.route_kind)) names.add(q.subject);
  }
  return [...names].sort((a, b) => a.localeCompare(b));
}

/* Map a name onto this model: one already in the file (it moves here, from
   wherever it pointed, or out of its parking) or a new one. */
function addMappingForm(name, redraw) {
  const draft = state.mapAdd;
  const form = el("div", { className: "map-form" });
  const problem = el("p", { className: "note-text" });
  const input = slugInput({ placeholder: "the name as the source publishes it...", value: draft.name });
  const button = el("button", { type: "button", className: "btn ghost tiny" }, `Map onto ${name}`);
  const check = () => {
    const rid = draft.route;
    const subject = input.value.trim();
    draft.name = input.value;
    let why = "";
    let ok = Boolean(rid && subject);
    if (rid && subject) {
      const before = mapFileValue(rid, subject);
      const clash = exactClash(rid, subject, name);
      const queued = state.questions.some((q) => q.route === mapRoute(rid).route
        && (mapRoute(rid).route_kind === "*" || q.route_kind === mapRoute(rid).route_kind) && q.subject === subject);
      if (clash) { ok = false; why = `normalizes to exactly ${clash}; only that model can take it`; }
      else if (before && before.length === 1 && before[0] === name) { ok = false; why = "already maps onto this model"; }
      else if (queued) { ok = false; why = "the Queue is asking about this name: answer it there"; }
      else if (before) why = `now maps to ${before.join(", ")}; this moves it here`;
      else why = "not in the file: written as a new line (it only matters if the source lists this exact name)";
    }
    button.disabled = !ok;
    problem.textContent = why;
    problem.classList.toggle("bad-text", Boolean(rid && subject) && !ok);
  };
  input.oninput = check;
  button.onclick = () => {
    setMapEdit(draft.route, input.value.trim(), name);
    state.mapAdd = { route: draft.route, name: "" };
    redraw();
  };
  const select = routeSelect(draft.route, (value) => { draft.route = value; check(); }, { includeAa: false });
  form.append(
    el("div", { className: "field" }, el("label", {}, "add a mapping")),
    el("div", { className: "map-form-row" }, [select,
      el("div", { className: "grow" }, comboBox(input, () => routeNames(draft.route), {
        min: 2,
        detail: (subject) => {
          const value = mapFileValue(draft.route, subject);
          return value ? `→ ${value.join(", ")}` : "on the Queue";
        },
      })), button]),
    problem,
  );
  check();
  return form;
}

/* Rule this model out for one name: the queue stops offering it there. */
function ruleOutForm(name, redraw) {
  const draft = state.mapRule;
  const form = el("div", { className: "map-form" });
  const problem = el("p", { className: "note-text" });
  const input = slugInput({ placeholder: "the name it must not be offered for...", value: draft.name });
  const button = el("button", { type: "button", className: "btn ghost tiny" }, "Not this model");
  const check = () => {
    const rid = draft.route;
    const subject = input.value.trim();
    draft.name = input.value;
    let why = "";
    let ok = Boolean(rid && subject);
    if (ok && mapRejected(rid, subject).includes(name)) { ok = false; why = "already ruled out for that name"; }
    else if (ok && ruleOp(rid, subject, name) === "add") { ok = false; why = "already in this batch"; }
    else if (ok) why = "the queue stops offering this model for that name; the name itself stays unanswered";
    button.disabled = !ok;
    problem.textContent = why;
    problem.classList.toggle("bad-text", Boolean(rid && subject) && !ok);
  };
  input.oninput = check;
  button.onclick = () => {
    setRuleEdit(draft.route, input.value.trim(), name, "add");
    state.mapRule = { route: draft.route, name: "" };
    redraw();
  };
  const select = routeSelect(draft.route, (value) => { draft.route = value; check(); }, { includeAa: false });
  /* What is drafted already, so it can be taken back from here. */
  const pending = [...state.answers.values()].filter((r) => r.kind === "rejection-edit" && r.add.includes(name));
  form.append(
    el("div", { className: "field" }, el("label", {}, "rule this model out for a name")),
    el("div", { className: "map-form-row" }, [select,
      el("div", { className: "grow" }, comboBox(input, () => routeNames(draft.route), { min: 2 })), button]),
    problem,
    ...pending.map((r) => {
      const rid = `${r.route} ${r.route_kind}`;
      return el("div", { className: "score-row decision-row map-line changed" }, [
        el("label", {}, [mapSource(rid), ": ", el("span", { className: "mono" }, r.subject), " is not this model"]),
        el("button", { type: "button", className: "btn ghost tiny", disabled: isSent(RULE_EDIT_KEY(rid, r.subject)),
          onclick: () => { setRuleEdit(rid, r.subject, name, null); redraw(); } }, "Undo"),
      ]);
    }),
  );
  check();
  return form;
}

/* ── A column's label mappings ──
   The Benchmarks tab's side of the same index: every label a source prints
   over a column -- a Hugging Face card's heading, an llm-stats benchmark id --
   that is mapped onto this one, and, as pills, the model and score each label
   delivers right now. A score some other fetcher or AA has since replaced is
   not the label's any more and gets no pill (_mapping_index.received). A
   label's line is edited like a model mapping, as a `mapping-edit`. */

const PILL_LIMIT = 12;

function labelDraftCount(key) {
  let n = 0;
  for (const record of state.answers.values()) {
    if (record.kind !== "mapping-edit") continue;
    const rid = `${record.route} ${record.route_kind}`;
    if (!isLabelRoute(mapRoute(rid))) continue;
    if (record.answer === key || (mapFileValue(rid, record.subject) || []).includes(key)) n += 1;
  }
  return n;
}

const mapReceived = (rid, label) => state.mapIndex.doc?.received?.[rid]?.[label] || [];

function receivedPills(rid, label) {
  const entries = mapReceived(rid, label);
  if (!entries.length) {
    return el("div", { className: "map-supplies" },
      el("span", { className: "map-label" }, "delivers no score right now"));
  }
  const pill = ([model, value, shared]) => el("span", {
    className: `bench-tag pill${shared ? " shared" : ""}`,
    title: shared
      ? `${model}: ${value} -- the source fills this column from ${shared} labels and which one this score came from is not known`
      : `${model}: ${value}`,
  }, [el("span", { className: "pill-model" }, model), " ", el("b", {}, String(value)), shared ? " ≈" : ""]);
  const box = el("div", { className: "map-supplies" }, [
    el("span", { className: "map-label" }, `delivers ${entries.length}`),
    ...entries.slice(0, PILL_LIMIT).map(pill),
  ]);
  if (entries.length > PILL_LIMIT) {
    const more = el("button", { type: "button", className: "btn ghost tiny" }, `+${entries.length - PILL_LIMIT} more`);
    more.onclick = () => { more.replaceWith(...entries.slice(PILL_LIMIT).map(pill)); };
    box.append(more);
  }
  return box;
}

function labelMappingsBlock(key) {
  const box = el("details", { className: "provenance mappings" });
  const { doc, error } = state.mapIndex;
  if (!doc) {
    box.append(el("summary", {}, "label mappings"), el("p", { className: "note-text" }, error
      ? (error.includes("404")
        ? "No mapping index yet. It appears after the next run publishes _pending/mappings.json."
        : `Could not read the mapping index (${error}).`)
      : "Reading the mapping index..."));
    return box;
  }
  const groups = labelRoutes().map((route) => {
    const file = doc.files[route.id] || {};
    const labels = Object.entries(file).filter(([, value]) => value === key)
      .map(([label]) => ({ label, value: [key] }));
    /* Labels this batch moves onto the column, listed so Undo is where they are. */
    for (const record of state.answers.values()) {
      if (record.kind === "mapping-edit" && record.answer === key
        && `${record.route} ${record.route_kind}` === route.id
        && !labels.some((l) => l.label === record.subject)) {
        labels.push({ label: record.subject, value: mapFileValue(route.id, record.subject), added: true });
      }
    }
    return { route, labels };
  });
  const count = groups.reduce((n, g) => n + g.labels.length, 0);
  const models = new Set(groups.flatMap((g) => g.labels.flatMap((l) => mapReceived(g.route.id, l.label).map((e) => e[0]))));
  const drafts = labelDraftCount(key);
  const openKey = `labels ${key}`;
  box.open = state.mapOpen.has(openKey) || drafts > 0;
  box.ontoggle = () => (box.open ? state.mapOpen.add(openKey) : state.mapOpen.delete(openKey));
  box.append(el("summary", {}, [
    "label mappings",
    el("span", { className: "map-sum" }, [
      `${count} label${count === 1 ? "" : "s"}`,
      ` · ${models.size} model${models.size === 1 ? "" : "s"} fed`,
      drafts ? ` · ${drafts} change${drafts === 1 ? "" : "s"} in this batch` : "",
    ].join("")),
  ]));
  box.append(el("p", { className: "note-text" },
    "The headings a source prints that are filed under this column, and the model and score each "
    + "delivers now -- only where that score is still the one stored: a number Artificial Analysis "
    + "or another board has replaced gets no pill. ≈ marks a score the source could have read from "
    + "several of these labels, where which one is not known. Move files a label under "
    + "another column, Park stops it being read, Remove has the Queue ask about it again."));
  const redraw = () => render();
  for (const g of groups) {
    if (!g.labels.length) continue;
    const section = el("div", { className: "map-group" });
    section.append(el("div", { className: "map-head" }, [
      el("b", {}, sourceOf(g.route)),
      g.route.route_kind !== "*" ? el("span", { className: "map-kind" }, g.route.route_kind) : null,
      el("span", { className: "map-file mono" }, g.route.file),
    ]));
    for (const line of g.labels) section.append(labelRow(g.route.id, line, key, redraw));
    box.append(section);
  }
  if (!count) box.append(el("p", { className: "note-text" }, "No source label is filed under this column."));
  box.append(addLabelForm(key, redraw));
  return box;
}

function labelRow(rid, line, key, redraw) {
  const editKey = MAP_EDIT_KEY(rid, line.label);
  const record = state.answers.get(editKey);
  const sent = isSent(editKey);
  const row = el("div", { className: "score-row decision-row map-line" });
  const current = !record ? (state.mapMoving.has(editKey) ? "move" : "keep")
    : record.answer === null ? "remove"
      : record.answer === "__unmappable__" ? "park"
        : record.answer === key ? "keep" : "move";
  const now = line.value ? line.value.join(", ") : "not in the file yet";
  row.append(el("label", {}, [
    el("span", { className: "mono" }, line.label),
    line.added ? el("span", { className: "good-text" }, ` (added in this batch; now ${now})`) : null,
  ]));
  const choices = line.added ? [["keep", "Undo"]]
    : [["keep", "Keep"], ["move", "Move"], ["park", "Park"], ["remove", "Remove"]];
  row.append(segChoice(choices, line.added ? "" : current, (value) => {
    if (value === "keep") setMapEdit(rid, line.label, line.added ? undefined : key);
    else if (value === "park") setMapEdit(rid, line.label, "__unmappable__");
    else if (value === "remove") setMapEdit(rid, line.label, null);
    else { state.answers.delete(editKey); state.mapMoving.add(editKey); }
    if (value !== "move") state.mapMoving.delete(editKey);
    redraw();
  }, sent));
  if (sent) row.append(el("p", { className: "note-text" }, "sent -- waiting for the run"));
  if (!line.added) row.append(receivedPills(rid, line.label));
  if (current === "move") {
    const problem = el("p", { className: "note-text bad-text map-problem" });
    const pool = () => benchmarks().filter((k) => k !== key);
    const input = slugInput({ placeholder: "the column it really is...", value: record?.answer || "", disabled: sent });
    input.oninput = () => {
      const value = input.value.trim();
      const known = pool().includes(value);
      const clash = known ? exactClash(rid, line.label, value) : "";
      input.classList.toggle("unknown", Boolean(value) && (!known || Boolean(clash)));
      problem.textContent = clash ? `${line.label} normalizes to exactly ${clash}; the runner would refuse this move.` : "";
      if (known && !clash) setMapEdit(rid, line.label, value);
      else state.answers.delete(editKey);
      row.classList.toggle("changed", state.answers.has(editKey));
      refreshFooter();
    };
    row.append(el("div", { className: "field picker map-move" }, comboBox(input, pool, {
      min: 2,
      detail: (k) => {
        const name = state.llm?.benchmarks?.[k]?.name;
        return name && name !== k ? ` (${name})` : "";
      },
    })), problem);
  }
  row.classList.toggle("changed", Boolean(record));
  return row;
}

/* File a label under this column: one already in the file moves here from
   the column it was under, or out of its parking; a new one is a new line. */
function addLabelForm(key, redraw) {
  const draft = state.labelAdd;
  const form = el("div", { className: "map-form" });
  const problem = el("p", { className: "note-text" });
  const input = slugInput({ placeholder: "the label as the source prints it...", value: draft.name });
  const button = el("button", { type: "button", className: "btn ghost tiny" }, `File under ${key}`);
  const check = () => {
    const rid = draft.route;
    const label = input.value.trim();
    draft.name = input.value;
    let why = "";
    let ok = Boolean(rid && label);
    if (ok) {
      const before = mapFileValue(rid, label);
      const clash = exactClash(rid, label, key);
      const queued = state.questions.some((q) => q.route === mapRoute(rid).route
        && (q.route_kind === mapRoute(rid).route_kind || mapRoute(rid).route_kind === "*") && q.subject === label);
      if (clash) { ok = false; why = `normalizes to exactly ${clash}; only that column can take it`; }
      else if (before && before.length === 1 && before[0] === key) { ok = false; why = "already filed under this column"; }
      else if (queued) { ok = false; why = "the Queue is asking about this label: answer it there"; }
      else if (before) why = `now ${before.join(", ")}; this moves it here`;
      else why = "not in the file: written as a new line (it only matters if the source prints this exact label)";
    }
    button.disabled = !ok;
    problem.textContent = why;
    problem.classList.toggle("bad-text", Boolean(rid && label) && !ok);
  };
  input.oninput = check;
  button.onclick = () => {
    setMapEdit(draft.route, input.value.trim(), key);
    state.labelAdd = { route: draft.route, name: "" };
    redraw();
  };
  const select = routeSelect(draft.route, (value) => { draft.route = value; check(); }, { routes: labelRoutes });
  form.append(
    el("div", { className: "field" }, el("label", {}, "file a label under this column")),
    el("div", { className: "map-form-row" }, [select,
      el("div", { className: "grow" }, comboBox(input, () => routeNames(draft.route), {
        min: 2,
        detail: (label) => {
          const value = mapFileValue(draft.route, label);
          return value ? `→ ${value.join(", ")}` : "on the Queue";
        },
      })), button]),
    problem,
  );
  check();
  return form;
}

/* ── Benchmarks ──
   The columns themselves: llm.json's `benchmarks` object, which names each
   column, says which run of its benchmark it holds and what must not be filed
   in it, and links where to read about it. Those words are what a reader of the
   index sees in the column's dialog and what the Queue tab shows beside every
   mapping question, so a wrong one costs more than a typo.

   Two records: benchmark-edit changes what differs on one column, and
   benchmark-create adds one. answer.py holds both to the rules
   test_benchmark_settings.py holds the file to; the checks here only stop a
   half-typed form from taking the rest of a sitting down with it. A new column
   is filled by hand on the Models tab -- or by a mapping onto it -- until a
   scraper is written for it, and both may be in the same batch as the create. */

const BENCH_CREATE_KEY = (key) => `benchmark-create  ${key}`;
const BENCH_EDIT_KEY = (key) => `benchmark-edit  ${key}`;
/* One record for the whole order: _answers.BENCHMARK_ORDER. */
const BENCH_ORDER_KEY = "benchmark-order  columns";

/* _answers.BENCHMARK_KEY_RE: an identifier, since it becomes edit.py's --flag. */
const BENCH_KEY_RE = /^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$/;
const BENCH_KEY_MAX = 48;
/* edit.py's own options, which a column's flag would collide with. */
const BENCH_RESERVED = new Set(["json_file", "model", "missing", "benchmark", "field", "after",
  "help", "score_date", "score_url", ...META_FIELDS.map(([field]) => field)]);

/* [field, longest, placeholder] -- _answers.BENCHMARK_TEXT_FIELDS. */
const BENCH_TEXT = [
  ["name", 80, "SWE-bench Verified"],
  ["short_name", 24, "SWE-V"],
  ["category", 40, "Software Engineering"],
];
const BENCH_DESCRIPTION_MAX = 2000;
const BENCH_LISTS = [
  ["settings", "Resolved %\nagentic", "One tag per line: the metric, the subset, the tool mode, the harness. "
    + "At most 30 characters each; shown as chips."],
  ["excludes", "runs named for another harness", "Optional. One phrase per line: the runs that must not be filed here."],
  ["urls", "https://...", "One page per line: the leaderboard first, then the paper or the repository."],
];
const SETTING_MAX = 30;

const benchCategories = () => [...new Set(Object.values(state.llm?.benchmarks || {})
  .map((bench) => bench?.category).filter(Boolean))];

/* The batch's new columns, by key. Scores and mappings may name them: answer.py
   applies the creates first. */
const batchCreatedBenchmarks = () => [...state.answers.values()]
  .filter((record) => record.kind === "benchmark-create")
  .map((record) => record.key);

const flyingBenchmarks = () => (locked()
  ? state.sent.keys.filter((key) => key.startsWith("benchmark-create  "))
    .map((key) => key.slice("benchmark-create  ".length))
  : []);

/* One line per item, whitespace folded the way answer.py folds it. */
const textLines = (text) => String(text ?? "").split("\n")
  .map((line) => line.split(/\s+/).filter(Boolean).join(" "))
  .filter(Boolean);

/* What the inputs hold for a column: everything as text, so a half-typed
   number survives a redraw. */
const benchText = (bench = {}) => ({
  name: bench.name ?? "",
  short_name: bench.short_name ?? "",
  category: bench.category ?? "",
  description: bench.description ?? "",
  settings: (bench.settings || []).join("\n"),
  excludes: (bench.excludes || []).join("\n"),
  urls: (bench.urls || []).join("\n"),
  decimals: bench.decimals ?? "",
  range_low: bench.range?.[0] ?? "",
  range_high: bench.range?.[1] ?? "",
  round_to: bench.round_to ?? "",
  lower_is_better: bench.lower_is_better === true,
});

/* The record's fields from that text -- null where a field is cleared -- and
   what is wrong, by input. */
function benchParse(text, { derived = false } = {}) {
  const fields = {};
  const bad = {};
  for (const [field, max] of [...BENCH_TEXT, ["description", BENCH_DESCRIPTION_MAX]]) {
    const value = String(text[field] ?? "").trim();
    if (!value) bad[field] = "required";
    else if (value.length > max) bad[field] = `at most ${max} characters`;
    else if (field !== "description" && /[\r\n\t]/.test(value)) bad[field] = "one line";
    fields[field] = value;
  }
  for (const [field] of BENCH_LISTS) {
    const items = textLines(text[field]);
    if (new Set(items).size !== items.length) bad[field] = "an item is listed twice";
    if (items.length > 12) bad[field] = "at most 12";
    for (const item of items) {
      if (field === "urls") {
        if (!/^https?:\/\/\S+$/i.test(item)) bad[field] = `not a URL: ${item}`;
      } else if (item.endsWith(".")) {
        bad[field] = `a phrase, not a sentence: drop the full stop in "${item}"`;
      } else if (field === "settings" && item.length > SETTING_MAX) {
        bad[field] = `"${item}" is longer than ${SETTING_MAX} characters`;
      }
    }
    if (!items.length && field !== "excludes") bad[field] = "at least one";
    fields[field] = items.length ? items : null;
  }
  if (!derived) {
    const number = (raw) => (String(raw).trim() === "" ? null : Number(raw));
    const decimals = number(text.decimals);
    if (decimals !== null && !(Number.isInteger(decimals) && decimals >= 0 && decimals <= 4)) {
      bad.decimals = "a whole number from 0 to 4";
    }
    fields.decimals = decimals;
    const [low, high] = [number(text.range_low), number(text.range_high)];
    if ((low === null) !== (high === null)) bad.range_low = bad.range_high = "both, or neither";
    else if (low !== null && !(Number.isFinite(low) && Number.isFinite(high) && low < high)) {
      bad.range_low = bad.range_high = "low below high";
    }
    fields.range = low === null || high === null ? null : [low, high];
    const roundTo = number(text.round_to);
    if (roundTo !== null && !(Number.isFinite(roundTo) && roundTo > 0)) bad.round_to = "a positive number";
    fields.round_to = roundTo;
    fields.lower_is_better = text.lower_is_better ? true : null;
  }
  return { fields, bad };
}

/* The scores already stored in a column, for the range they must fit in. */
const storedScores = (key) => (state.llm?.models || [])
  .map((model) => model.scores?.[key])
  .filter((value) => typeof value === "number");

/* The form, shared by the edit and the add card. `onInput` runs on every
   keystroke without a redraw, so the caret stays where it is; `mark` flags the
   inputs a parse found wrong. */
/* The site's benchmark column: initialWidth 95 in index.html, and the most a
   reader can drag it to (.bench-head's max-width). */
const TABLE_COL_W = 95;
const TABLE_COL_MAX = 120;

/* The header cell the table will draw for this column, live: the short name,
   or the name when there is none, which is what getBenchmarkLabel falls back
   to. Measured rather than estimated, once the header face has loaded. */
function columnPreview(text, icon) {
  const label = el("span", { className: "th-sim-text" });
  /* The icon takes its 12px whether or not it loads, and the 12px is what
     matters to the fit. An inline SVG goes in as an image, so nothing in it can
     run here; a path is the site's own file, read where the data is read. */
  const src = typeof icon !== "string" || !icon.trim() ? ""
    : icon.trim().startsWith("<svg")
      ? `data:image/svg+xml;charset=utf-8,${encodeURIComponent(icon.trim())}`
      : `${dataBase() || ".."}/${icon.trim().replace(/^\/+/, "")}`;
  const iconNode = src
    ? el("img", { className: "th-sim-icon", alt: "", src, onerror() { this.style.visibility = "hidden"; } })
    : null;
  const cell = el("div", { className: "th-sim", ariaHidden: "true" },
    el("span", { className: "th-sim-label" }, [iconNode, label]));
  const verdict = el("span", { className: "th-sim-verdict" });
  const node = el("div", { className: "th-sim-row" }, [cell, verdict]);
  let pending = false;
  const update = () => {
    const short = String(text.short_name ?? "").trim();
    const value = short || String(text.name ?? "").trim();
    label.textContent = value || "\u2014";
    if (!node.isConnected) {
      /* Not laid out yet: measure on the first frame it is. */
      if (!pending) {
        pending = true;
        requestAnimationFrame(() => { pending = false; if (node.isConnected) update(); });
      }
      return;
    }
    const over = Math.ceil(label.scrollWidth - label.clientWidth);
    const source = short ? "" : value ? " (no short name: the table shows the name)" : "";
    verdict.classList.toggle("bad-text", over > 0);
    verdict.textContent = !value
      ? "In the table"
      : over <= 0
        ? `Fits the table's ${TABLE_COL_W}px column${source}`
        : over <= TABLE_COL_MAX - TABLE_COL_W
          ? `Cut off: ${over}px too wide for the ${TABLE_COL_W}px column; whole only if a reader widens it${source}`
          : `Cut off: ${over}px too wide, even at the widest the column goes${source}`;
  };
  document.fonts?.load('700 10.4px "JetBrains Mono"').then(update, () => {});
  update();
  return { node, update };
}

function benchForm(text, { derived = false, disabled = false, onInput, icon = null }) {
  const box = el("div", {});
  const inputs = {};
  const hints = {};
  const field = (name, control, hint = "") => {
    hints[name] = el("p", { className: "note-text field-hint" }, hint);
    hints[name].dataset.hint = hint;
    box.append(el("div", { className: "field" }, [el("label", {}, name.replace(/_/g, " ")), control, hints[name]]));
  };
  const wire = (name, input, read = () => input.value) => {
    inputs[name] = input;
    input.disabled = disabled;
    input.oninput = () => {
      text[name] = read();
      onInput();
      if (name === "short_name" || name === "name") preview.update();
    };
    return input;
  };
  const preview = columnPreview(text, icon);

  for (const [name, max, placeholder] of BENCH_TEXT) {
    const input = wire(name, el("input", { type: "text", maxLength: max, placeholder, value: text[name] }));
    let list = null;
    if (name === "category") {
      const listId = `c-${Math.random().toString(36).slice(2)}`;
      input.setAttribute("list", listId);
      list = el("datalist", { id: listId }, benchCategories().map((value) => el("option", { value })));
    }
    field(name, list ? el("div", {}, [input, list]) : input);
    if (name === "short_name") box.lastElementChild.insertBefore(preview.node, hints[name]);
  }
  field("description", wire("description", el("textarea", {
    rows: 4, maxLength: BENCH_DESCRIPTION_MAX, value: text.description,
    placeholder: "What it measures and how it is graded, and which run this column holds.",
  })));
  for (const [name, placeholder, hint] of BENCH_LISTS) {
    const area = wire(name, el("textarea", { rows: 3, placeholder, value: text[name] }));
    if (name === "urls") noAuto(area);
    field(name, area, hint);
  }

  if (!derived) {
    const scale = el("details", {
      open: Boolean(String(text.decimals) + String(text.range_low) + String(text.round_to))
        || text.lower_is_better,
    });
    scale.append(el("summary", { className: "note-text", style: "cursor:pointer" },
      "Scale (optional): decimals, range, rounding, direction"));
    const numberInput = (name, placeholder, step = "any") =>
      wire(name, el("input", { type: "number", step, inputMode: "decimal", placeholder, value: text[name] }));
    const row = (name, controls, hint) => {
      hints[name] = el("p", { className: "note-text field-hint" }, hint);
      hints[name].dataset.hint = hint;
      scale.append(el("div", { className: "field" }, [el("label", {}, name), controls, hints[name]]));
    };
    row("decimals", numberInput("decimals", "1", "1"), "Digits the site prints. Blank is 1.");
    row("range_low", el("div", { className: "range-pair" }, [
      numberInput("range_low", "0"), numberInput("range_high", "100"),
    ]), "Lowest and highest score this column can hold. Blank is 0 to 100, a percentage.");
    hints.range_high = hints.range_low;
    row("round_to", numberInput("round_to", "e.g. 5"),
      "Store scores on multiples of this instead, for a number that moves on its own (an Elo).");
    const lower = wire("lower_is_better", el("input", {
      type: "checkbox", checked: Boolean(text.lower_is_better),
    }), () => inputs.lower_is_better.checked);
    lower.onchange = lower.oninput;
    scale.append(el("label", { className: "check" }, [lower, " lower is better (a rate of failures, a cost)"]));
    box.append(scale);
  }

  const mark = (bad) => {
    for (const [name, input] of Object.entries(inputs)) {
      input.classList.toggle("unknown", Boolean(bad[name]));
    }
    for (const [name, hint] of Object.entries(hints)) {
      const problem = bad[name];
      hint.textContent = problem || hint.dataset.hint;
      hint.classList.toggle("bad-text", Boolean(problem));
    }
  };
  return { box, mark };
}

const sameValue = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

/* Chrome on Android scrolls a focused field into view as the keyboard opens,
   and on this page lands somewhere else -- the open card goes off screen and
   the cards below it come into view. So the page puts it back itself, once the
   keyboard has finished resizing the viewport (it does so in steps). */
let keepInView = null;
let keepTimer = 0;
function focusInView(field) {
  if (!field) return;
  field.focus({ preventScroll: true });
  field.scrollIntoView({ block: "center" });
  keepInView = { field, until: Date.now() + 1500 };
}
function settleFocused() {
  clearTimeout(keepTimer);
  keepTimer = setTimeout(() => {
    const field = document.activeElement;
    if (state.tab !== "benchmarks" || !field?.matches?.("#view input, #view textarea")) return;
    if (field.type === "search" || field.type === "checkbox") return;
    const box = field.getBoundingClientRect();
    const top = document.querySelector("header")?.offsetHeight || 0;
    const bottom = window.visualViewport?.height ?? window.innerHeight;
    const pinned = keepInView?.field === field && Date.now() < keepInView.until;
    if (pinned || box.top < top || box.bottom > bottom) field.scrollIntoView({ block: "center" });
  }, 80);
}
window.visualViewport?.addEventListener("resize", settleFocused);
window.addEventListener("resize", settleFocused);

/* A benchmark card's summary. Tapped open, the card takes the keyboard to its
   first field, and does it inside the tap: Chrome on Android raises the
   keyboard for a focus() only within the gesture, and a toggle event comes
   after it. Tapped while another field has the keyboard, the summary does not
   take focus on the way (mousedown), or the keyboard would drop between the
   two fields and focus would be left behind in the old card. */
const isTyping = () => document.activeElement?.matches?.(
  "input:not([type=checkbox], [type=radio], [type=button]), textarea, select");
function openToField(card, kids) {
  const summary = el("summary", {}, kids);
  summary.addEventListener("mousedown", (event) => { if (isTyping()) event.preventDefault(); });
  summary.addEventListener("click", (event) => {
    if (card.open) return;   // closing: the browser's own toggle
    event.preventDefault();
    card.open = true;
    focusInView(card.querySelector(".field input, .field textarea"));
  });
  return summary;
}

    + "holds, what must not be filed in it and where to read about it. The Queue "
    + "tab shows the same words beside every mapping question. A new column "
    + "starts empty: give it scores on the Models tab, in this batch if you like, "
    + "or map a source's label onto it from the Queue."));

  box.append(renderBenchmarkOrder());
