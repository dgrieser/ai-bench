     rather than rewriting innerHTML keeps them there to be swapped back. */
  for (const icon of button.querySelectorAll("svg")) {
    icon.classList.toggle("on", icon.classList.contains(`icon-${theme}`));
  }
  const label = theme === "system" ? "following the system" : theme;
  button.title = `Theme: ${label}`;
  button.setAttribute("aria-label", `Theme: ${label}. Change it.`);
}

function cycleTheme() {
  const next = THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length];
  try { localStorage.setItem("theme", next); } catch { /* not worth failing over */ }
  applyTheme(next);
}

/* ------------------------------------------------------ the drafted batch */

/* A sitting is typed on a phone, and a phone's browser drops a background tab
   whenever it likes: switching to GitHub to look at a run was enough to lose
   every answer picked so far. So the batch being drafted -- the records, the
   add-a-model cards and the run mode -- is kept in localStorage and restored on
   load. It is a draft, not a record of anything sent: Send and Clear empty it.

   A restored answer to a queue question the queue no longer asks is dropped
   on the first queue read (pruneDraft): answer.py would refuse it as a
   question nothing asked, and a batch is all or nothing. */
const DRAFT_KEY = "ai-bench-admin-draft";
const MODE_KEY = "ai-bench-admin-mode";
const MODES = ["full", "quick"];

function saveDraft() {
  try {
    const drafts = state.newModels.filter((d) => d.name.trim() || Object.keys(d.fields).length);
    const bench = state.benchDraft;
    const benchDraft = bench && (bench.key.trim() || bench.record
      || Object.values(bench.text).some((value) => value !== "" && value !== false))
      ? { key: bench.key, after: bench.after, text: bench.text, record: bench.record } : null;
    if (!state.answers.size && !drafts.length && !state.referenceDraft && !benchDraft) {
      localStorage.removeItem(DRAFT_KEY);
      return;
    }
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      answers: [...state.answers.entries()],
      newModels: drafts.map(({ id, name, fields, key, question, as }) => ({ id, name, fields, key, question, as })),
      referenceDraft: state.referenceDraft,
      benchDraft,
    }));
  } catch { /* private mode, a full quota: the draft is only a convenience */ }
}

function readDraft() {
  try {
    const stored = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (!stored) return;
    if (Array.isArray(stored.answers)) {
      for (const pair of stored.answers) {
        if (Array.isArray(pair) && typeof pair[0] === "string" && pair[1] && typeof pair[1] === "object") {
          state.answers.set(pair[0], pair[1]);
        }
      }
    }
    if (Array.isArray(stored.newModels)) {
      state.newModels = stored.newModels
        .filter((d) => d && typeof d.name === "string" && d.fields && typeof d.fields === "object")
        .map((d) => ({
          id: d.id || draftId(), name: d.name, fields: d.fields, key: d.key || "",
          question: typeof d.question === "string" ? d.question : "",
          as: d.as === "reference" ? "reference" : "open",
        }));
    }
    if (typeof stored.referenceDraft === "string") state.referenceDraft = stored.referenceDraft;
    const bench = stored.benchDraft;
    if (bench && typeof bench.key === "string" && bench.text && typeof bench.text === "object") {
      state.benchDraft = {
        key: bench.key,
        after: typeof bench.after === "string" ? bench.after : "",
        text: { ...benchText(), ...bench.text },
        record: typeof bench.record === "string" ? bench.record : "",
      };
    }
  } catch { /* a half-written value: start clean */ }
  try {
    const mode = localStorage.getItem(MODE_KEY);
    if (MODES.includes(mode)) state.mode = mode;
  } catch { /* follow the default */ }
}

/* The records that answer a question of the queue, as opposed to the ones that
   name a model -- the same split inferQueued draws for a sent batch. */
const isQueueKey = (key) =>
  !/^(model-(create|edit|rename|delete)|reference-(add|remove)|benchmark-(create|edit|order)|preview-(cleanup|watch)|mapping-edit|rejection-edit|model-hints) /.test(key);

function pruneDraft() {
  const asked = new Set(state.questions.map(KEY));
  let dropped = 0;
  for (const key of [...state.answers.keys()]) {
    if (isQueueKey(key) && !asked.has(key)) {
      state.answers.delete(key);
      dropped += 1;
    }
  }
  /* A model opened from a question's card goes with the question: it was only
     ever being added to answer it, and the card it lived on is gone. */
  for (const draft of state.newModels.filter((d) => d.question && !asked.has(d.question))) {
    if (draft.key) state.answers.delete(draft.key);
    state.newModels = state.newModels.filter((d) => d !== draft);
    dropped += 1;
  }
  dropped += dropOrphanMappings();
  if (dropped) saveDraft();
  return dropped;
}

/* A Queue mapping onto a model that is neither in llm.json nor added by this
   batch: what is left when the add it leaned on went -- a new release answered
   "Ignore it" after a board's name was mapped onto it, or one the queue stopped
   offering. answer.py would refuse it, and the whole batch with it. Only once
   llm.json has been read: before that every model looks unknown. */
function dropOrphanMappings() {
  if (!state.llm?.models) return 0;
  const known = new Set(models());
  let dropped = 0;
  for (const question of state.questions) {
    if (question.universe !== "models") continue;
    const record = state.answers.get(KEY(question));
    if (record?.kind !== "mapping" || /^__.*__$/.test(record.answer) || known.has(record.answer)) continue;
    state.answers.delete(KEY(question));
    dropped += 1;
  }
  return dropped;
}

const draftId = () => Math.random().toString(36).slice(2, 10);

function setMode(mode) {
  state.mode = mode;
  try { localStorage.setItem(MODE_KEY, mode); } catch { /* not worth failing over */ }
  /* A full render, not just the footer: the add cards' Quick tip reads it. */
  render();
}

/* What each mode costs, in the words the bar shows under the count. */
const MODE_HINTS = {
  full: "then refreshes every score (about 10 min)",
  quick: "then only re-asks the mapping questions, no scores (a couple of minutes)",
};

/* Whether the batch creates a model. A new model's mappings are the questions
   a Quick run exists to ask, so the page says so where it is added. */
const batchAddsModels = () => [...state.answers.keys()]
  .some((key) => /^(model-create|reference-add) /.test(key)
    || ["model-add", "reference-add"].includes(state.answers.get(key)?.kind));

function renderMode() {
  const box = document.getElementById("mode");
  const offered = MODES.filter((mode) => mode !== "quick" || state.quickOffered);
  if (!offered.includes(state.mode)) state.mode = "full";
  /* One choice is no choice: an api.php without `quick` gets no control. */
  box.hidden = offered.length < 2;
  const labels = { full: "Full", quick: "Quick" };
  box.replaceChildren(...offered.map((mode) => {
    const button = el("button", {
      type: "button",
      className: mode,
      title: `${labels[mode]}: ${MODE_HINTS[mode]}`,
      onclick: () => setMode(mode),
    }, labels[mode]);
    button.setAttribute("aria-pressed", String(state.mode === mode));
    return button;
  }));
}

/* --------------------------------------------------------- the run in flight */

/* A dispatched answer is not applied yet, and the question it answers is still
   in the queue: _pending/pending.json is only republished when the run pushes.
   So the page keeps showing a card that has already been answered, and the
   obvious thing to do is answer it again -- which is the one thing that must
   not happen. The second record carries the same `if_previous`, the run applies
   the first one, and answer.py then rejects the second as stale; a batch is all
   or nothing, so every other answer in that sitting goes down with it.
   The cards in flight are therefore disabled until the run they were sent to
   has finished.

   Kept in localStorage because the page's own advice is to reload after a run,
   and a reload must not hand the questions back. */
const SENT_KEY = "ai-bench-admin-sent";
const POLL_MS = 20000;
/* A dispatch answers 204 before the run exists. Until it shows up there is
   nothing in the list to wait for, which must not read as "finished". */
const GRACE_MS = 90000;
/* How long the Runs tab waits before re-reading the list once it has asked for
   a run of its own, for the same reason: the dispatch is answered before the
   run is created. One read, not a poll -- nothing depends on this run. */
const RUN_APPEARS_MS = 5000;
/* Clock skew between here and GitHub, so the run this batch created is not
   mistaken for one that predates it. */
const SKEW_MS = 60000;

/* The keys of batches a run has already applied.

   The lock above ends when that run reports completed -- and that is a few
   seconds after the run pushed the re-rendered queue, which is not long enough
   for raw.githubusercontent to be serving it. So the read that follows the run
   can still answer with the queue as it was before: every question the run just
   answered, listed again, with the in-flight lock now lifted. Answering one a
   second time is refused by answer.py as a question nothing asked, and a batch
   is all or nothing, so the whole next sitting goes down with it. That is not
   hypothetical -- it is what happened on 2026-09-10, six answers of one batch
   coming back in the next.

   So the keys outlive the lock. An entry is dropped when a queue read comes
   back without its question, which is the page seeing the run's own push; when
   a refresh has since republished a queue that still asks it, which is the site
   asking again; and otherwise only on the clocks below. */
const APPLIED_KEY = "ai-bench-admin-applied";
/* A new-model line is the one question the site means to keep asking: for a
   slug it has added, apply_decisions() clears the line without dismissing it,
   so the next run offers it again. Its lock has to expire by itself.

   Nothing else is asked twice, so nothing else expires by time: a record-only
   run does not republish the queue at all, and the next scheduled refresh can
   be hours away, which is exactly how long those answers stay listed. Expiring
   them on a clock would hand back the duplicate this whole mechanism exists to
   refuse. */
const RECURRING_TTL_MS = 30 * 60 * 1000;
/* Backstop for an entry nothing can clear -- a question that leaves the queue
   while the page is closed for a week, say. Long enough that it can only ever
   fire on a lock that is already wrong. */
const LOCK_MAX_MS = 7 * 24 * 60 * 60 * 1000;
/* A question the site asks again once its answer has landed is the case a
   missing question cannot cover: nothing ever drops the entry, so the card sits
   there reading "answered in an earlier batch" until the backstop above fires a
   week later. Not hypothetical either -- reopening the Vals names parked as
   __unmappable__ put three of them back in the queue on 2026-09-19, already
   answered and no longer answerable.

   A scheduled run is the proof that the queue in hand is newer than the answer.
   It always refreshes -- skip_refresh is only ever set on a batch dispatched
   by hand (this page no longer offers it) -- so it re-collects _pending/pending.json from the files as
   the answer left them. One of those has finished and the question is still
   listed: it is being asked again, and the lock is wrong.

   Only `schedule`, though a merge and a hand-asked refresh republish the queue
   just as well: a merge run is skipped unless the pull request was merged, and
   a dispatched one cannot be told from a record-only batch, which republishes
   nothing at all. Waiting for the next cron costs three hours at most. */
const REFRESH_EVENT = "schedule";
/* How long after that run started before it counts. The run list carries no
   finish time, and a run that has only just reported completed pushed its queue
   seconds ago -- which is the window where raw.githubusercontent is still
   serving the previous blob, the one that does list the answered question. A
   refresh takes about five minutes, so this lands a couple of minutes past its
   push, and the next cron is three hours out either way. */
const REFRESHED_SETTLE_MS = 10 * 60 * 1000;

/* Which of a batch's keys were the queue's own questions, decided when the
   batch is built rather than when it settles.

   Settling happens inside the run list read, which on a fresh page runs before
   the queue has been read at all -- so asking `state.questions` there found
   nothing, kept nothing, and dropped the lock on every answer of a batch that
   was dispatched before the page was last closed. The answer to which
   questions a batch answered is known at dispatch and is stored with it. */
const queueKeys = (keys) => {
  const asked = new Set(state.questions.map(KEY));
  return keys.filter((key) => asked.has(key));
};

/* A record written before `queued` existed. The three kinds that are not queue
   questions all name themselves, so the rest are the questions. */
const inferQueued = (keys) =>
  keys.filter((key) => !/^(model-(create|edit|rename|delete)|reference-(add|remove)|benchmark-(create|edit|order)|preview-(cleanup|watch)|mapping-edit|rejection-edit|model-hints) /.test(key));

function readSent() {
  try {
    const stored = JSON.parse(localStorage.getItem(SENT_KEY) || "null");
    if (!stored || !Number.isFinite(stored.at) || !Array.isArray(stored.keys)) return null;
    const keys = stored.keys.filter((k) => typeof k === "string");
    const queued = Array.isArray(stored.queued)
      ? stored.queued.filter((k) => typeof k === "string" && keys.includes(k))
      : inferQueued(keys);
    const skips = stored.skips && typeof stored.skips === "object" ? stored.skips : {};
    return { at: stored.at, keys, queued, mode: MODES.includes(stored.mode) ? stored.mode : "full", skips };
  } catch { return null; }   // private mode, blocked storage, half-written value
}

function writeSent(batch) {
  state.sent = batch;
  try {
    if (batch) localStorage.setItem(SENT_KEY, JSON.stringify(batch));
    else localStorage.removeItem(SENT_KEY);
  } catch { /* the lock still holds for this page; not worth failing over */ }
}

function readApplied() {
  try {
    const stored = JSON.parse(localStorage.getItem(APPLIED_KEY) || "null");
    if (!Array.isArray(stored)) return [];
    return stored.filter((e) => e && typeof e.key === "string" && Number.isFinite(e.at));
  } catch { return []; }   // private mode, blocked storage, half-written value
}

function writeApplied(entries) {
  state.applied = entries;
  try {
    if (entries.length) localStorage.setItem(APPLIED_KEY, JSON.stringify(entries));
    else localStorage.removeItem(APPLIED_KEY);
  } catch { /* the set still holds for this page; not worth failing over */ }
}

const isApplied = (key) => state.applied.some((entry) => entry.key === key);

/* The question kind the site asks again after it has been answered. Read off
   the key, whose first field is the route that asked. */
const isRecurring = (key) => key.startsWith(`${NEW_MODEL_ROUTE} `);

/* `skips` is key -> the candidates a "None of these" ruled out. Such a question
   is meant to come back once something new matches it, under the same key, so
   its lock needs its own way out -- see pruneApplied. */
function rememberApplied(keys, skips = {}) {
  if (!keys.length) return;
  const at = Date.now();
  writeApplied([
    ...state.applied.filter((entry) => !keys.includes(entry.key)),
    ...keys.map((key) => ({
      key, at, recurring: isRecurring(key),
      ...(Array.isArray(skips[key]) ? { skipped: skips[key] } : {}),
    })),
  ]);
}

/* A skipped question listed again without any of the candidates it skipped is
   the queue after the run, asking about a new candidate: answerable again. The
   queue before the run still offers the skipped ones, and stays locked. */
const askedAfresh = (entry, question) => Array.isArray(entry.skipped) && question
  && !(question.candidates || []).some((c) => entry.skipped.includes(c.option));

/* Whether a scheduled refresh has republished the queue since this answer
   settled. That run collects its questions from the files the answer wrote, so
   a question that survives one is a question being asked again -- see
   REFRESH_EVENT. */
const reopenedSince = (at) => state.runs.some((run) =>
  run.event === REFRESH_EVENT
  && run.status === "completed"
  && run.conclusion === "success"
  && Date.parse(run.created_at) >= at + SKEW_MS
  && Date.now() - Date.parse(run.created_at) >= REFRESHED_SETTLE_MS);

/* Called on every queue read. A question that is gone is the page seeing the
   run's push, and a question that outlived a scheduled refresh is the site
   asking it again; those are the only proofs there are. A clock is not proof,
   so only the kind that is deliberately asked again expires by one. */
function pruneApplied(questions) {
  const asked = new Map(questions.map((q) => [KEY(q), q]));
  const now = Date.now();
  const kept = state.applied.filter((entry) => asked.has(entry.key)
    && !askedAfresh(entry, asked.get(entry.key))
    && !reopenedSince(entry.at)
    && now - entry.at < (entry.recurring ? RECURRING_TTL_MS : LOCK_MAX_MS));
  if (kept.length !== state.applied.length) writeApplied(kept);
  return kept.length;
}

/* The run that carried the batch: still going, or the completed one it became.
   Runs arrive newest first. */
const batchRun = (unfinishedOnly = false) => state.sent && state.runs.find((run) =>
  (!unfinishedOnly || run.status !== "completed")
  && Date.parse(run.created_at) >= state.sent.at - SKEW_MS) || null;

const applyingRun = () => batchRun(true);

const locked = () => state.sent !== null;
const isSent = (key) => locked() && state.sent.keys.includes(key);

/* Whether the run wrote the batch: "yes", "no", or "unsure".

   The run's own conclusion cannot say. `Fail if a step of update-all failed`
   runs last, so a run that applied, committed and pushed a batch and then hit
   a dead scraper reports failure -- and reading that as "nothing landed" hands
   back every card of a batch that is already in main, which is the duplicate
   this mechanism exists to refuse. A batch answer.py refused also fails its
   run, and those cards do have to come back. Only the answer step's own
   outcome separates the two, which is what api.php's ?answered= serves.

   Unsure is the safe half everywhere it appears: an endpoint too old to answer,
   a read that failed, a run that carried no answer step at all. The cards stay
   locked and the queue clears them when it catches up. */
async function batchApplied(run) {
  if (!run) return "unsure";                        // never appeared: no outcome to read
  if (run.conclusion === "success") return "yes";
  if (!state.steps) return "unsure";                // endpoint predates ?answered=
  try {
    const response = await fetch(bust(`api.php?answered=${encodeURIComponent(run.id)}`),
      { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body.conclusion === "success" ? "yes"
      : body.conclusion === null ? "unsure"         // this run carried no answers
        : "no";
  } catch {
    return "unsure";
  }
}

/* Drops the lock once the run applying the batch is done with it. Called only
   from a fresh run list, never from a failed read: while the page cannot see
   GitHub it cannot know the run has finished, and unlocking on a network blip
   is how the same answer gets sent twice.

   Only the queue's own questions are remembered as applied: a model edit or a
   rename is not answered against the queue, so re-sending one is a second edit
   rather than a record answer.py refuses, and locking those cards would cost
   the person an edit for no gain. */
async function settleSent() {
  if (!state.sent || applyingRun()) return;
  if (Date.now() - state.sent.at < GRACE_MS) return;
  const run = batchRun();
  const applied = await batchApplied(run);
  if (applied !== "no") rememberApplied(state.sent.queued, state.sent.skips || {});
  state.settled = { run, applied, count: state.sent.keys.length, mode: state.sent.mode };
  noteSettled(state.settled);
  writeSent(null);
}

/* What became of the batch, in words. Set here rather than where the poll
   notices the lock lift, because a reload settles too -- and the reload after a
   run is the page's own advice. */
function noteSettled({ run, applied, count, mode }) {
  if (applied === "no") {
    /* Worth saying rather than leaving to the run log: a batch is all or
       nothing, so a refused record took every other answer of that sitting
       with it, and those questions are answerable again. */
    state.error = `The run carrying ${count} answer(s) refused the batch: its `
      + "own answer step failed, so nothing was written and those questions "
      + "are open again. Its log names the record it would not take.";
  } else if (run && run.conclusion !== "success") {
    /* The case that must not read as "nothing landed": the answers are
       applied, committed and pushed before update-all runs, and the workflow's
       last step reds the run when a scraper fell over. */
    /* Amber, not red: the answers are in main either way, so nothing here
       failed that this page can do anything about. */
    state.warn = applied === "yes"
      ? `That run applied its ${count} answer(s) and then ended as `
        + `${run.conclusion}: the refresh after them failed, not the answers. `
        + "Those questions stay locked -- they are answered."
      : `That run ended as ${run.conclusion}, and this page cannot tell whether `
        + "its answers were applied: api.php did not report the step outcome. "
        + "They stay locked until the queue stops listing them; the run's log "
        + "says what happened.";
  } else if (mode === "quick") {
    /* The whole point of the quick run: say where the questions it collected
       are, since that is what the person has been waiting on. */
    state.ok = "The quick run has finished and the queue has just been re-read. "
      + "Mapping questions for anything it added are on the Queue tab -- search it "
      + "for the model's name. Scores arrive with the next full run; send the "
      + "mappings with Full to have them sooner.";
  } else {
    /* It used to add that anything still listed is a question the run did not
       answer. That is only true once the queue it pushed has propagated, which
       is what the note under this one says when it has not. */
    state.ok = "That run has finished and the queue has just been re-read. Its "
      + "own summary is the record of what landed, not its colour: a failed "
      + "refresh reds a run whose answers applied perfectly.";
  }
}

let poll = null;

/* Idempotent, and called at the end of every render, so the timer exists
   exactly while something is in flight. */
function syncPolling() {
  if (locked() && poll === null) poll = setInterval(tick, POLL_MS);
  else if (!locked() && poll !== null) { clearInterval(poll); poll = null; }
}

async function tick() {
  const wasLocked = locked();
  if (!(await loadRuns())) {
    render();       // the note says why; the lock stays until GitHub answers
    return;
  }
  if (wasLocked && !locked()) {
    await loadData();
    return;
  }
  render();         // the pill moves from queued to in progress
}

/* --------------------------------------------------- artificial analysis */

/* Asked for once, and only when something needs it: this is the largest thing
   the page reads and most sittings never rename anything.

   Read from the repo, beside the queue and llm.json, rather than proxied live
   through api.php. The proxy had to exist while this came from the AA API --
   which authenticates with a header, so a browser request preflights and AA
   sends no CORS headers -- but the list is now committed on every refresh, so
   the page reads the file directly: no key, no proxy, and none of the four API
   requests a live read costs against a hundred-a-day budget. */
async function ensureAaSlugs() {
  // state.raw is api.php's answer to where the data lives, and loadRuns() is
  // awaited before anything renders -- but a render that beat it would fetch
  // "undefined/_aa/models.json" and cache the failure under asked.
  if (!state.raw || state.aa.asked) return;
  state.aa.asked = true;
  try {
    const response = await fetch(bust(`${dataBase()}/_aa/models.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const body = await response.json();
    const models = (body.models || []).filter((m) => m && typeof m.slug === "string");
    state.aa.models = new Map(models.map((m) => [m.slug, m]));
    state.aa.slugs = models.map((m) => m.slug);
  } catch (error) {
    state.aa.error = String(error.message);
  }
  render();
}

/* What is known about a slug beyond the slug itself, as a short trailing
   phrase -- the creator and the release date are what separate two slugs whose
   names read alike. Empty when the list carries neither. */
function aaSlugDetail(slug) {
  const model = state.aa.models && state.aa.models.get(slug);
  if (!model) return "";
  const parts = [model.creator, model.release_date].filter(Boolean);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

/* The same row in prose, for a card that is about the model rather than about
   a slug being suggested: AA's own name for it, then who made it and when.
   Empty when the published list has never heard of the slug, which for a
   reference model is worth saying out loud. */
function aaSlugSummary(slug) {
  const model = state.aa.models && state.aa.models.get(slug);
  if (!model) return "";
  const tail = [model.creator, model.release_date].filter(Boolean).join(", ");
  return [model.name || slug, tail].filter(Boolean).join(" -- ");
}

/* AA slugs worth offering for a model of this name, best first. The ranking is
   deliberately shallow -- these are suggestions to click, and the click sends a
   slug from AA's own list either way. */
function aaSuggestions(name, limit = 6) {
  const wanted = normSlug(name);
  const ranked = [];
  for (const slug of state.aa.slugs || []) {
    const norm = normSlug(slug);
    if (norm === wanted) ranked.push([0, "the same name bar punctuation", slug]);
    else if (norm.startsWith(`${wanted}-`)) ranked.push([1, "this name with a suffix", slug]);
    else if (wanted.startsWith(`${norm}-`)) ranked.push([2, "a shorter form of this name", slug]);
    else if (norm.includes(wanted) || wanted.includes(norm)) ranked.push([3, "an overlapping name", slug]);
  }
  ranked.sort((a, b) => a[0] - b[0] || a[2].length - b[2].length || a[2].localeCompare(b[2]));
  return ranked.slice(0, limit).map(([, why, slug]) => ({ slug, why }));
}

/* AA's own mark, inline: this directory serves nothing but this page and
   api.php, so icons/artificial-analysis.svg is not reachable from here. */
const AA_MARK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.79 19.17 220.42 191.04" aria-hidden="true">'
  + '<path fill="#1c369e" fill-rule="evenodd" d="M192.75,210.02h42.32l-55.89-97.25-21.29,36.87c11.62,20.13,23.24,40.25,34.86,60.38"/>'
  + '<polygon fill="#7870f2" fill-rule="evenodd" points="103.82 55.97 124.98 19.33 176.61 108.76 167.29 124.68 155.3 145.14 143.32 124.4 103.82 55.97"/>'
  + '<path fill="#1c369e" fill-rule="evenodd" d="M122.41,97.08l-21.13-36.71L14.93,209.94h42.32c78.9-136.66,14.79-25.62,65.16-112.86"/>'
  + '<polygon fill="#4378df" fill-rule="evenodd" points="176.52 190.68 155.36 154.03 123.04 210.02 165.35 210.02 176.52 190.68"/>'
  + "</svg>";
const AA_MODEL_PAGE = "https://artificialanalysis.ai/models/";

/* The mark for a model llm.json reads from Artificial Analysis -- the row
   carries aa_variant once update.py has matched it to an AA model -- linked to
   that model's AA page. Null for a model AA does not list. */
function aaMark(model) {
  const slug = model?.aa_variant?.slug;
  if (!slug) return null;
  const since = aaListedSince(model);
  const name = model.aa_variant.name;
  const title = `On Artificial Analysis as ${name ? `${name} (${slug})` : slug}`
    + (since ? `\nlisted ${since.seeded ? "by" : "since"} ${since.date}` : "");
  const link = el("a", {
    className: "aa-mark", href: AA_MODEL_PAGE + encodeURIComponent(slug),
    target: "_blank", rel: "noreferrer", title,
  });
  link.setAttribute("aria-label", title.replace("\n", ", "));
  link.innerHTML = AA_MARK_SVG;
  /* Inside a card's summary a click would also fold the card. */
  link.addEventListener("click", (event) => event.stopPropagation());
  return link;
}

/* The day a model's first score from an AA model page was written: when AA
   started listing it, as far as this index saw. `seeded` when that is older
   than history_since -- the index kept no history then, so the date is only
   the last write, and AA listed it on or before it. Null when no AA page has
   ever been recorded for it. */
function aaListedSince(model) {
  let first = "";
  for (const log of Object.values(model?.scores_history || {})) {
    if (!Array.isArray(log)) continue;
    for (const entry of log) {
      if (entry?.date && String(entry.source || "").startsWith(AA_MODEL_PAGE)
        && (!first || entry.date < first)) first = entry.date;
    }
  }
  if (!first) return null;
  const since = state.llm?.history_since || "";
  return { date: first, seeded: Boolean(since && first < since) };
}

/* ---------------------------------------------------------------- loading */

async function load() {
  /* First, because it says where everything else lives. Without it the page
     could not send either, so failing here is fatal rather than degraded. */
  if (!(await loadRuns())) {
    render();
    return;
  }

  await loadData();
}

/* Where to read the data: main as of its newest commit, by that commit's id.

   raw.githubusercontent caches a branch URL for five minutes and ignores the
   query string, so bust() never busted anything: a read made right after a run
   pushed was served the file as it was before the push, for up to five
   minutes. That is how a quick run's questions went missing -- the run had
   published them, and the page re-read the queue seconds later and got the old
   one. A URL naming a commit is a different URL for every push, so it is
   never stale.

   The commit id comes from GitHub's public API, which needs no token and sends
   CORS headers. When it cannot be had -- rate limited at 60 an hour per
   address, offline, a fork that is private -- the branch URL is still used, as
   before. */
async function resolveSha() {
  if (!state.repo) return null;
  const ref = state.ref || "main";
  try {
    const response = await fetch(`https://api.github.com/repos/${state.repo}/commits/${ref}`, {
      cache: "no-store",
      headers: { Accept: "application/vnd.github.sha" },
    });
    if (!response.ok) return null;
    const sha = (await response.text()).trim();
    return /^[0-9a-f]{40}$/.test(sha) ? sha : null;
  } catch {
    return null;
  }
}

const dataBase = () => (state.sha && state.repo
  ? `https://raw.githubusercontent.com/${state.repo}/${state.sha}`
  : state.raw);

async function loadData() {
  state.sha = await resolveSha();
  const base = dataBase();
  const json = (url) => fetch(bust(url), { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))));
  const [queue, llm, reference, previews, tests] = await Promise.allSettled([
    json(`${base}/_pending/pending.json`),
    json(`${base}/llm.json`),
    json(`${base}/reference-models.json`),
    json(`${base}/_pending/previews.json`),
    json(`${base}/_tests/report.json`),
  ]);

  if (queue.status === "fulfilled") {
    state.questions = queue.value.questions || [];
    state.stale = pruneApplied(state.questions);
    /* A restored draft may answer a question an earlier run has since
       answered; sending it would sink the batch. Said, not silently dropped. */
    const dropped = pruneDraft();
    if (dropped) {
      state.warn = `${dropped} drafted answer(s) were dropped: the queue no longer `
        + "asks those questions, so a run would have refused the whole batch.";
    }
  } else {
    /* Until the first refresh publishes it there is nothing to answer, which is
       a state worth naming rather than showing as a failure. */
    state.questions = [];
    /* No queue read means no proof either way, so the applied keys stay -- but
       there is nothing on the page for the note to point at. */
    state.stale = 0;
    state.error = String(queue.reason.message).includes("404")
      ? "No published queue yet. It appears after the next refresh run."
      : `Could not read the queue (${queue.reason.message}).`;
  }
  if (llm.status === "fulfilled") state.llm = llm.value;
  else state.error = `Could not read llm.json (${llm.reason.message}).`;

  /* Its own error rather than the page's: the list is one tab, and a
     repository that predates it should not red the whole page. */
  if (reference.status === "fulfilled" && Array.isArray(reference.value)) {
    state.reference = { slugs: reference.value.filter((s) => typeof s === "string"), error: "" };
  } else {
    const why = reference.status === "fulfilled"
      ? "the file is not a JSON array of slugs"
      : reference.reason.message;
    state.reference = { slugs: null, error: String(why) };
  }

  /* Its own error too: one tab, and a repository before the first run that
     publishes it simply has no report yet. */
  if (previews.status === "fulfilled" && Array.isArray(previews.value?.cases)) {
    state.previews = {
      cases: previews.value.cases.filter((c) => c && typeof c.name === "string"),
      done: Array.isArray(previews.value.done) ? previews.value.done.filter((d) => d && typeof d.name === "string") : [],
      error: "",
    };
    /* A fresh report may say something new about a case; a working copy
       nobody put in the batch is rebuilt from it. */
    for (const name of [...previewWork.keys()]) {
      if (!state.answers.has(PREVIEW_KEY(name))) previewWork.delete(name);
    }
    for (const name of [...watchWork.keys()]) {
      if (!state.answers.has(WATCH_KEY(name))) watchWork.delete(name);
    }
  } else {
    state.previews = {
      cases: null, done: [],
      error: previews.status === "fulfilled" ? "the file has no cases list" : String(previews.reason.message),
    };
  }

  /* Its own error as well: one tab, and no report exists before the first
     daily full test run. */
  if (tests.status === "fulfilled" && Array.isArray(tests.value?.failures)) {
    state.tests.report = tests.value;
    state.tests.error = "";
  } else {
    state.tests.report = null;
    state.tests.error = tests.status === "fulfilled"
      ? "the file has no failures list"
      : String(tests.reason.message);
  }

  render();
}

/* The mapping log, read once and only when the Updates tab wants it: it is the
   largest file here after llm.json, and most sittings never open that tab. */
async function ensureMapLog(force = false) {
  if (!state.raw || (state.mapLog.asked && !force)) return;
  state.mapLog.asked = true;
  try {
    const response = await fetch(bust(`${dataBase()}/_log/mappings.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const body = await response.json();
    state.mapLog = {
      entries: (body.entries || []).filter((e) => e && typeof e.at === "string"),
      error: "",
      asked: true,
    };
  } catch (error) {
    state.mapLog = { entries: null, error: String(error.message), asked: true };
  }
  if (state.tab === "updates") render();
}

async function loadRuns() {
  try {
    const response = await fetch(bust("api.php"), { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.runs = body.runs || [];
    /* Announced rather than required: an endpoint without an AA key -- or one
       older than this page -- costs the rename suggestions and nothing else. */
    /* Announced rather than required, like the AA key above: without it the
       page cannot tell an applied batch from a refused one and keeps every
       answered card locked, which costs a wait rather than a rejected batch.
       Read before settling, which is what asks. */
    state.steps = Boolean(body.steps);
    /* Announced too, so an older endpoint costs the Runs tab its button rather
       than offering one that 400s. */
    state.refreshable = Boolean(body.refresh);
    /* Announced as well: an older endpoint costs the Runs tab its warnings. */
    state.warningsOffered = Boolean(body.warnings);
    /* And the quick run: an older endpoint costs the bar its Quick choice. */
    state.quickOffered = Boolean(body.quick);
    loadRunWarnings();
    await settleSent();
    if (body.raw) state.raw = body.raw;
    if (body.repo) state.repo = body.repo;
    if (body.ref) state.ref = body.ref;
    if (!state.raw || (body.api || 1) < NEEDS_API) {
      state.error = "api.php answered, but it is older than this page: it did not "
        + "say which repository to read. Upload _admin/api.php alongside "
        + "index.html -- ./_admin/deploy sends both. Until then the queue cannot "
        + "be loaded and nothing can be sent.";
      return false;
    }
    return true;
  } catch (error) {
    state.runs = [];
    state.refreshable = false;
    state.error = `Could not reach api.php (${error.message}). `
      + "Nothing can be read or sent until it answers -- check the host config "
      + "and the error log; see _admin/README.md.";
    return false;
  }
}

/* A broken fetcher no longer reds a run -- it is a warning on it, so a green
   run may still have skipped a source. Asked for per finished run, in parallel
   and in the background: nothing waits on them, and each one re-renders the
   Runs tab when it lands. A read that fails is not remembered, so the next
   run list read asks again. */
function loadRunWarnings() {
  if (!state.warningsOffered) return;
  for (const run of state.runs) {
    if (run.status !== "completed" || state.runWarnings.has(run.id)) continue;
    state.runWarnings.set(run.id, { pending: true });
    fetch(bust(`api.php?warnings=${encodeURIComponent(run.id)}`), { cache: "no-store" })
      .then(async (response) => {
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        state.runWarnings.set(run.id, {
          warnings: Array.isArray(body.warnings) ? body.warnings : null,
          reason: body.reason || "",
        });
      })
      .catch(() => { state.runWarnings.delete(run.id); })
      .finally(() => { if (state.tab === "runs") render(); });
  }
}

/* The universes are derived here rather than shipped with the queue: the model
   list alone is hundreds of names and the AA list thousands, so committing them
   would rewrite pending.json on runs where no question changed. answer.py
   revalidates everything regardless, which is the check that counts. */
const models = () => [...new Set([
  ...(state.llm?.models || []).map((m) => m.name).filter(Boolean),
  ...batchCreated(),
])].sort();

/* The models this batch adds, by name. A mapping may answer with one of them --
   answer.py runs the creates first -- so they are searchable on every Queue
   card, and a second board listing the same release maps onto it too. */
const batchCreated = () => [...state.answers.values()]
  .filter((record) => ["model-create", "model-add", "reference-add"].includes(record.kind))
  .map((record) => record.name);

/* What llm.json records of one score's past, newest first, each entry saying
   what that write did. The kind is derived from the list rather than stored --
   the same rule _history.py writes by and llm.html reads by, so the three
   cannot drift: nothing before it is an arrival, a null is a withdrawal,
   anything else replaced the number in the entry before it. An entry older
   than history_since is a first sighting: the index kept no history then, so
   all that is known is the day the score was last written. */
function recordedHistory(model, key) {
  const log = model?.scores_history?.[key];
  if (!Array.isArray(log)) return [];
  const since = state.llm?.history_since || "";
  let previous = null;
  const events = log.filter((entry) => entry && entry.date).map((entry) => {
    const value = typeof entry.score === "number" ? entry.score : null;
    const seeded = previous === null && since && entry.date < since;
    const kind = value === null ? "withdrawn"
      : previous === null ? (seeded ? "first recorded" : "added")
      : `was ${previous}`;
    const event = { date: entry.date, value, kind };
    previous = value;
    return event;
  });
  return events.reverse();
}
const benchmarks = () => [...new Set([
  ...Object.entries(state.llm?.benchmarks || {})
    .filter(([, b]) => b?.derived !== true)
    .map(([key]) => key),
  ...batchCreatedBenchmarks(),
])].sort();

/* What a benchmark column actually holds -- which metric, which subset,
   whether tools were allowed, which harness -- and what must not be filed in
   it. The queue asks "is this label that column?", and llm.json is the only
   place that answers it: a key like `charxiv_reasoning` says nothing about the
   split or the tool mode, and the labels that turn up here
   ("CharXiv (descriptive)", "HLE w/ tools", "Terminal Bench 2.1 (best
   harness)") differ from the column by exactly that. */
function benchNote(key) {
  const bench = state.llm?.benchmarks?.[key];
  if (!bench) return null;
  const settings = Array.isArray(bench.settings)
    ? bench.settings.filter((tag) => typeof tag === "string" && tag.trim())
    : [];
  const excludes = Array.isArray(bench.excludes)
    ? bench.excludes.filter((item) => typeof item === "string" && item.trim())
    : [];
  /* The way to change those words from where they are read: the column's
     card on the Benchmarks tab, unfolded. A span, not a link -- this note sits
     inside an option button, and a link inside a button is not one. */
  const edit = el("span", {
    className: "edit-link link", role: "link", tabIndex: 0,
    title: "Edit this column's tags and its \"Not this\" list on the Benchmarks tab",
    onclick: (event) => { event.preventDefault(); event.stopPropagation(); openBenchmark(key); },
    onkeydown: (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault(); event.stopPropagation(); openBenchmark(key);
      }
    },
  }, settings.length || excludes.length ? "edit" : "add hints");
  return el("div", { className: "bench-note" }, [
    bench.name ? el("span", { className: "bench-note-name" }, bench.name) : null,
    settings.length
      ? el("span", { className: "bench-tags" },
          settings.map((tag) => el("span", { className: "bench-tag" }, tag.trim())))
      : null,
    excludes.length ? el("span", { className: "excludes" }, `Not this: ${excludes.join(" · ")}`) : null,
    edit,
  ]);
}

/* A model's "not this" hints (llm.json `excludes` on the entry), under the
   model wherever the Queue offers it -- the model-side twin of a column's
   note above. Edited on the model's card, which the link opens. Nothing is
   drawn for a model without hints but the link to add some. */
function modelNote(name) {
  const model = (state.llm?.models || []).find((m) => m.name === name);
  if (!model) return null;
  const hints = (model.excludes || []).filter((h) => typeof h === "string" && h.trim());
  const edit = el("span", {
    className: "edit-link link", role: "link", tabIndex: 0,
    title: "Edit this model's \"Not this\" hints on the Models tab",
    onclick: (event) => { event.preventDefault(); event.stopPropagation(); openModel(name); },
    onkeydown: (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault(); event.stopPropagation(); openModel(name);
      }
    },
  }, hints.length ? "edit" : "add hints");
  return el("div", { className: "bench-note model-note" }, [
    hints.length ? el("span", { className: "excludes" }, `Not this: ${hints.join(" · ")}`) : null,
    el("span", {}, edit),
  ]);
}

function openModel(name) {
  state.modelSearch = name;
  state.modelOpen.add(name);
  showTab("models");
}

function openBenchmark(key) {
  state.benchSearch = key;
  state.benchOpen.add(key);
  showTab("benchmarks");
}

/* Which list an answer must come from, as the queue states it.
   Never inferred from the kind: update_huggingface_mapping.py asks a plain
   "mapping" question whose answers are benchmark keys, so guessing from the
   kind string offered model slugs for every HuggingFace question. propose.ROUTES
   is where this is known, and pending.json now carries it.
   An older queue has no universe field; offering nothing beats offering the
   wrong list, and the next refresh restores it. */
const UNIVERSES = {
  models,
  benchmarks,
  /* The AA route asks which slug a model is, and its answers are AA's own
     names -- which the page can only offer now that api.php can list them.
     Empty without a key, which is the same as it has always been: the
     candidates the queue carries, and nothing to search. */
  "aa-slugs": () => state.aa.slugs || [],
};

/* What a question's answer has to be, in words, for the card's chip. */
const UNIVERSE_NOUNS = {
  models: ["a model", "models"],
  benchmarks: ["a benchmark", "benchmarks"],
  "aa-slugs": ["an Artificial Analysis slug", "AA slugs"],
};
const universeNoun = (question, plural = false) =>
  (UNIVERSE_NOUNS[question.universe] || UNIVERSE_NOUNS.models)[plural ? 1 : 0];

function universeFor(question) {
  const build = UNIVERSES[question.universe];
  return build ? build() : [];
}

/* ---------------------------------------------------------------- answers */

/* rerender:false is for the free-text box. render() rebuilds the whole view,
   which replaces the very input being typed into -- the caret, the value and
   the focus all went with it, so the box could only ever be filled by picking
   from the list in one shot. Typing now updates the batch and touches only the
   footer and this card. */
function setAnswer(question, record, rerender = true) {
  const key = KEY(question);
  if (record === null) state.answers.delete(key);
  else state.answers.set(key, record);
  if (rerender) render();
  else refreshFooter();
}

/* The count, and from CAP_NOTICE_AT on, how much room is left in the batch.
   Named before it runs out rather than after: past the cap the only way out is
   to un-answer cards, and the further in that is discovered the more of the
   sitting has to be undone. The room is in bytes, because that is what the
   workflow input is capped on -- a mapping answer is a couple of hundred, a
   benchmark-add with its description can be a few thousand. */
function refreshFooter() {
  const pending = state.answers.size;
  const bytes = pending ? batchBytes([...state.answers.values()]) : 0;
  const room = MAX_ANSWER_BYTES - bytes;
  const count = document.getElementById("count");
  const answers = `${pending} answer${pending === 1 ? "" : "s"}`;
  const text = !pending
    ? "Nothing to send yet"
    : room < 0
      ? `${answers}, ${kb(bytes)} -- ${kb(-room)} over the ${kb(MAX_ANSWER_BYTES)} `
        + "a batch holds; un-answer some to send"
      : bytes >= CAP_NOTICE_AT
        ? `${answers} ready to send, ${kb(bytes)} of ${kb(MAX_ANSWER_BYTES)} -- `
          + `room for ${kb(room)} more`
        : `${answers} ready to send`;
  /* The count, and under it what Send will do with them -- the choice beside
     it is three words, and the cost of each is worth reading before sending. */
  count.replaceChildren(text,
    pending ? el("span", { id: "mode-hint" }, `Send ${MODE_HINTS[state.mode]}`) : "");
  count.title = pending ? `${bytes} of ${MAX_ANSWER_BYTES} bytes` : "";
  renderMode();
  saveDraft();
  count.classList.toggle("ready", pending > 0 && bytes < CAP_NOTICE_AT);
  count.classList.toggle("near", bytes >= CAP_NOTICE_AT && room >= 0);
  count.classList.toggle("over", room < 0);
  const send = document.getElementById("send");
  /* Disabled rather than left to fail on the endpoint: the 413 comes back after
     the batch has been typed out in full, and says nothing about which answers
     to drop. */
  send.disabled = pending === 0 || room < 0;
  send.title = room < 0 ? `At most ${kb(MAX_ANSWER_BYTES)} of answers per batch.` : "";
  document.getElementById("clear").disabled = pending === 0;
}

const answerOf = (question) => state.answers.get(KEY(question));

function mappingRecord(question, value) {
  return {
    kind: "mapping",
    route: question.route,
    route_kind: question.route_kind,
    subject: question.subject,
    answer: value,
    /* What the queue said the file held. answer.py rejects the record if the
       file has since changed, rather than overwriting whoever answered first. */
    if_previous: question.if_previous ?? null,
  };
}

/* --------------------------------------------------------------- rendering */

/* The corner's GitHub button, pointed at whichever repository api.php names.
   Hidden until it does: a link to the wrong repository is worse than no link,
   and an endpoint that has not answered is a state the page already reports
   loudly enough elsewhere. */
function setRepoLink() {
  const link = document.getElementById("repoLink");
  link.href = state.repo ? `https://github.com/${state.repo}` : "#";
  link.hidden = !state.repo;
  if (state.repo) link.title = `Repository: ${state.repo}`;
}

function render() {
  /* Named, so it is obvious which repository a batch is about to be sent to. */
  /* With the commit the data was read at, so "is this the queue after the
     run?" can be answered by comparing it with the run's commit on GitHub. */
  document.getElementById("repo").textContent = state.repo
    ? `${state.repo}${state.sha ? ` @${state.sha.slice(0, 7)}` : ""}` : "";
  setRepoLink();
  renderTabs();

  const notice = document.getElementById("notice");
  notice.replaceChildren();
  if (state.error) notice.append(el("div", { className: "note bad" }, state.error));
  if (state.warn) notice.append(el("div", { className: "note busy" }, state.warn));
  if (state.ok) notice.append(el("div", { className: "note good" }, state.ok));
  if (locked()) notice.append(inFlightNote());
  else if (state.stale) notice.append(staleQueueNote());

  document.getElementById("view").replaceChildren(
    state.tab === "queue" ? renderQueue()
      : state.tab === "updates" ? renderUpdates()
      : state.tab === "cleanup" ? renderCleanup()
        : state.tab === "models" ? renderModels()
          : state.tab === "benchmarks" ? renderBenchmarks()
          : state.tab === "reference" ? renderReference()
            : state.tab === "tests" ? renderTests()
            : renderRuns()
  );

  refreshFooter();
  syncPolling();
}

/* Why those cards are disabled, and what to wait for. */
function inFlightNote() {
  const run = applyingRun();
  const count = state.sent.keys.length;
  return el("div", { className: "note busy" }, el("span", {}, [
    count === 1 ? "1 answer is on its way" : `${count} answers are on their way`,
    run ? " in " : ", but the run has not appeared on GitHub yet.",
    run ? el("a", { href: run.url, target: "_blank", rel: "noreferrer" }, run.name || String(run.id)) : null,
    run ? ` (${runLabel(run)}).` : "",
    " Until that run finishes, the questions it answers stay disabled: the queue "
    + "is only republished when the run pushes, so it still lists them, and "
    + "answering one twice would have the next batch rejected as stale. Checked "
    + `every ${POLL_MS / 1000} seconds.`,
  ]));
}

/* A card whose answer is in the run, or in one that has already applied it.
   Disabled after the fact rather than at every control, so one place locks
   every kind of card and one unlocks it. */
function lockCard(card, applied = false) {
  card.classList.add("sent");
  card.classList.remove("answered");
  card.querySelectorAll("button, input, select, textarea").forEach((node) => { node.disabled = true; });
  card.prepend(el("div", { className: "sent-mark" }, applied ? [
    el("span", { className: "pill success" }, [el("span", { className: "dot" }), "answered"]),
    "answered in an earlier batch -- the queue has not caught up yet",
  ] : [
    el("span", { className: "pill running" }, [el("span", { className: "dot" }), "sent"]),
    "the run is applying this answer",
  ]));
  return card;
}

const guard = (card, key) => (
  isSent(key) ? lockCard(card)
    : isApplied(key) ? lockCard(card, true)
      : card
);

/* Why a card is locked when nothing is in flight. Two ways the queue comes back
   still listing an answered question: the run pushes the re-rendered queue
   seconds before it reports completed and raw serves the previous blob for a
   while yet, and a record-only run does not republish it at all -- so this can
   mean a minute or the wait for the next scheduled refresh. */
function staleQueueNote() {
  return el("div", { className: "note busy" }, el("span", {}, [
    state.stale === 1
      ? "1 question below has already been answered and sent"
      : `${state.stale} questions below have already been answered and sent`,
    ", and the queue has not caught up: a run republishes it only after a "
    + "successful refresh, and a record-only run skips that entirely. They stay "
    + "locked until it does -- answering one again would be refused as a "
    + "question nothing asked, and a batch is all or nothing. A question the "
    + "site means to ask again unlocks itself once a scheduled run has "
    + "republished the queue still listing it.",
  ]));
}

/* New releases Artificial Analysis offers are Queue questions like any other
   now: answered beside the board names that list them, so a release and its
   mappings are one sitting. There is no New models tab any more; an old
   #new link lands on the Queue. */
const tabList = (queueCount = null) => [
  ["queue", "Queue", queueCount],
  /* Only the cases that look released: a preview with no sign of one yet, or
     one still waiting for the repo its release rule names, is nothing to do. */
  ["cleanup", "Cleanup", state.previews.cases?.filter((c) => c.evidence?.length).length || null],
  ["updates", "Updates", null],
  ["models", "Models", null],
  ["benchmarks", "Benchmarks", null],
  ["reference", "Reference", state.reference.slugs?.length ?? null],
  ["runs", "Runs", null],
  ["tests", "Tests", state.tests.report?.failures?.length || null],
];

/* The tab lives in the URL, so a reload lands where it was and a phone's back
   button steps back through the tabs instead of leaving the page. */
function showTab(id, { push = true } = {}) {
  if (!tabList().some(([tab]) => tab === id)) {
    id = "queue";
    /* An old #new bookmark, or a typo: say where it landed. */
    if (location.hash) history.replaceState(null, "", "#queue");
  }
  const changed = state.tab !== id;
  state.tab = id;
  if (push && location.hash !== `#${id}`) history.pushState(null, "", `#${id}`);
  render();
  if (changed) window.scrollTo({ top: 0 });
  /* The tab strip scrolls sideways on a phone; keep the chosen one in view. */
  document.querySelector('#tabs button[aria-selected="true"]')
    ?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderTabs() {
  document.getElementById("tabs").replaceChildren(
    ...tabList(state.questions.length).map(([id, label, n]) => {
      const button = el("button", {
        type: "button",
        onclick: () => showTab(id),
      }, label);
      button.setAttribute("aria-selected", String(state.tab === id));
      if (n !== null) button.append(el("span", { className: "badge" }, String(n)));
      return button;
    })
  );
}

function chip(label, value, { className = "", prose = false } = {}) {
  return el("span", { className: `chip ${className}`.trim() },
    [label ? el("b", {}, label) : null,
     el("span", { className: prose ? "prose" : "mono" }, value)]);
}

function option(text, why, { pressed, className = "", tag = "", note = null, onclick }) {
  const head = el("div", { className: "head" },
    [el("span", {}, text), tag ? el("span", { className: "tag" }, tag) : null]);
  const button = el("button", { type: "button", className: `opt ${className}`.trim(), onclick }, head);
  button.setAttribute("aria-pressed", String(pressed));
  button.append(el("span", { className: "why" }, why));
  if (note) button.append(note);
  button.append(el("span", { className: "tick" }, "✓"));
  return button;
}

const sourceOf = (question) => question.route.replace(/^update_/, "").replace(/_mapping\.py$/, "");

/* Where a queued name was read, for the "Source" link on its card. The asking
   script says so itself -- pending.json's `source_url`: the board a name was
   listed on, or its own page where the site has one (see _source_pages.py).
   This table is the fallback for a question queued before that, or carried
   over from such a queue: one page per source, the model's where the URL can
   be built from the name. test_answers.py checks every route in propose.ROUTES
   has an entry. */
const enc = (subject) => String(subject).split("/").map(encodeURIComponent).join("/");
const SOURCE_PAGES = {
  rebench: () => "https://swe-rebench.com/",
  osworld: () => "https://os-world.github.io/",
  deepswe: () => "https://deepswe.datacurve.ai/",
  frontierswe: () => "https://www.frontierswe.com/",
  frontiercode: () => "https://cognition.com/frontiercode",
  swe_atlas: () => "https://labs.scale.com/leaderboard/swe-atlas",
  tbench: () => "https://www.tbench.ai/leaderboard/terminal-bench/4.0",
  agents_last_exam: () => "https://agents-last-exam.org/leaderboard",
  aa_coding_agents: () => "https://artificialanalysis.ai/agents/coding-agents",
  evals_report: () => "https://evals.report/benchmarks",
  vals: () => "https://www.vals.ai/benchmarks",
  swe_marathon: () => "https://www.swe-marathon.org/",
  toolathlon: () => "https://toolathlon.xyz/docs/leaderboard",
  programbench: () => "https://programbench.com/extended/",
  kernelbench: () => "https://kernelbench.com/",
  real_swe: () => "https://realswe.withspecific.com/",
  zerobench: () => "https://zerobench.github.io",
  arena: () => "https://arena.ai/leaderboard",
  arc_prize: () => "https://arcprize.org/leaderboard",
  cybergym: () => "https://www.cybergym.io",
  sec_bench: () => "https://sec-bench.github.io",
  hle_diamond: () => "https://lastexam.ai/blog/hle-diamond",
  openrouter: (q) => `https://openrouter.ai/${enc(q.subject)}`,
  epoch: () => "https://epoch.ai/benchmarks",
  mcp_atlas: () => "https://labs.scale.com/leaderboard/mcp_atlas",
  swe_bench_pro_v2: () => "https://labs.scale.com/leaderboard/swe_bench_pro_public_v2",
  bfcl: () => "https://gorilla.cs.berkeley.edu/leaderboard.html",
  spheron: (q) => `https://www.spheron.network/tools/gpu-recommender/${enc(q.subject)}/`,
  /* A label read off model cards; which card is not in the queue. */
  huggingface: (q) => `https://huggingface.co/search/full-text?q=${encodeURIComponent(q.subject)}`,
  llmstats: (q) => (q.route_kind === "llmstats-model"
    ? `https://llm-stats.com/models/${enc(q.subject)}`
    : /^[a-z0-9_]+$/.test(q.subject)
      ? `https://llm-stats.com/benchmarks/${q.subject.replace(/_/g, "-")}`
      : "https://llm-stats.com/leaderboards/open-llm-leaderboard"),
  /* The subject is an llm.json name; what is asked is which AA slug it is. */
  artificialanalysis: () => "https://artificialanalysis.ai/models",
};

/* A new-release question names an AA slug, and an older one carries the model's
   AA page only at the end of its note. */
function sourceUrl(question) {
  if (/^https?:\/\//.test(question.source_url || "")) return question.source_url;
  if (question.route === NEW_MODEL_ROUTE) {
    const found = String(question.note || "").match(/https?:\/\/\S+/);
    return found ? found[0] : `https://artificialanalysis.ai/models/${enc(question.subject)}`;
  }
  const page = SOURCE_PAGES[sourceOf(question)];
  return page ? page(question) : null;
}

/* The card's name, with a link to where it was read beside it. A new tab: the
   answers drafted on this page live in it. */
function cardHead(question) {
  const url = sourceUrl(question);
  return el("div", { className: "card-head top" }, [
    el("div", { className: "subject" }, question.subject),
    url ? el("a", {
      className: "btn ghost tiny source",
      href: url,
      target: "_blank",
      rel: "noopener noreferrer",
      title: url,
    }, "Source ↗") : null,
  ]);
}

/* Whether a question is about `needle`: its subject, or any name offered as its
   answer. The second half is the one that matters after a quick run -- a model
   just added is a *candidate* on every board that lists it, not a subject, so
   typing its name here gathers exactly the questions it raised. */
const questionMatches = (question, needle) => !needle
  || question.subject.toLowerCase().includes(needle)
  || (question.candidates || []).some((c) => String(c.option).toLowerCase().includes(needle));

function renderQueue() {
  const offered = newQuestions();
  const questions = state.questions.filter((q) => q.route !== NEW_MODEL_ROUTE);
  if (offered.length || questions.some((q) => q.universe === "aa-slugs")) ensureAaSlugs();
  if (!questions.length && !offered.length) {
    return el("p", { className: "empty" },
      "Nothing pending. Every source name and benchmark label is mapped, and "
      + "Artificial Analysis has offered nothing this site does not already track.");
  }
  const box = el("div", { className: "stack" });
  if (offered.length) {
    box.append(renderNewReleases(offered));
    if (!questions.length) return box;
    box.append(el("h2", { className: "section-title" }, `Names to map (${questions.length})`));
  }
  const list = el("div", { className: "stack" });

  /* Filters, once there are enough questions to need them. Kept in state so
     answering a card -- which re-renders -- does not throw them away. */
  if (questions.length > 4) {
    const counts = new Map();
    for (const q of questions) counts.set(sourceOf(q), (counts.get(sourceOf(q)) || 0) + 1);
    const source = el("select", {
      onchange: () => { state.queueFilter.source = source.value; draw(); },
    }, [el("option", { value: "" }, `All sources (${questions.length})`),
      ...[...counts.entries()].sort().map(([name, n]) =>
        el("option", { value: name, selected: state.queueFilter.source === name }, `${name} (${n})`))]);
    const text = noAuto(el("input", {
      type: "search",
      placeholder: "Filter by name or candidate...",
      value: state.queueFilter.text,
      enterKeyHint: "search",
    }));
    text.oninput = () => { state.queueFilter.text = text.value; draw(); };
    const shown = el("span", { className: "count" });
    box.append(el("div", { className: "toolbar search" }, [
      el("div", { className: "grow" }, text), el("div", {}, source), shown]));

    const draw = () => {
      const needle = state.queueFilter.text.trim().toLowerCase();
      const found = questions.filter((q) => (!state.queueFilter.source
        || sourceOf(q) === state.queueFilter.source) && questionMatches(q, needle));
      shown.textContent = found.length === questions.length ? "" : `${found.length} shown`;
      list.replaceChildren(...(found.length
        ? found.map((question) => guard(renderQuestion(question), KEY(question)))
        : [el("p", { className: "empty" }, "No question matches that filter.")]));
    };
    draw();
  } else {
    list.append(...questions.map((question) => guard(renderQuestion(question), KEY(question))));
  }
  box.append(list);
  return box;
}

/* "New model" on a Queue card: a release a board lists before Artificial
   Analysis does, added and mapped in one sitting. The card opens the same form
   as the Models tab's "Add a model", pre-filled from the source's name, and
   while it is open it owns the question's answer -- its create record and the
   mapping onto it come and go together. answer.py runs creates first. */
const createDraftFor = (key) => state.newModels.find((d) => d.question === key);

function dropCreate(question) {
  const draft = createDraftFor(KEY(question));
  if (!draft) return false;
  if (draft.key) state.answers.delete(draft.key);
  state.answers.delete(KEY(question));
  state.newModels = state.newModels.filter((d) => d !== draft);
  return true;
}

/* The slug a source's name most likely wants: its last path segment, in the
   shape every llm.json name has. A guess to edit, not an answer -- a board's
   "stepfun/step-5-preview" is usually right, its "Step 5 (Preview)" less so. */
const guessName = (subject) => normSlug(String(subject).split("/").pop());

/* The creator, when the source names its org ("stepfun/...") and exactly one
   creator llm.json knows reads the same. Short names must match outright:
   "ai2" is a prefix of "ai21labs" and names somebody else. */
function guessCreator(subject) {
  const parts = String(subject).split("/");
  if (parts.length < 2) return null;
  const squash = (value) => normSlug(value).replace(/-/g, "");
  const head = squash(parts[0]);
  if (!head) return null;
  const hits = fieldSuggestions("creator").filter((name) => {
    const known = squash(name);
    if (known === head) return true;
    return Math.min(known.length, head.length) >= 4
      && (known.startsWith(head) || head.startsWith(known));
  });
  return hits.length === 1 ? hits[0] : null;
}

function openCreate(question) {
  state.answers.delete(KEY(question));
  const fields = {};
  const creator = guessCreator(question.subject);
  if (creator) {
    fields.creator = creator;
    const url = creatorUrl(creator);
    if (url) fields.creator_url = url;
  }
  state.newModels.push({
    id: draftId(), name: guessName(question.subject), fields, key: "", question: KEY(question),
  });
}

/* pending.json's `context` (pending_prompts.source_context): the source's
   other names that look like this one, each with what it is mapped to today,
   and the source names each candidate already answers. Folded: it is there to
   explain a choice -- "Mistral Large 4" already mapped, so this "Preview" is
   the old listing -- not to be a choice itself. */
function renderQuestionContext(question) {
  const ctx = question.context;
  if (!ctx) return null;
  const siblings = ctx.siblings || [];
  const mapped = Object.entries(ctx.mapped || {});
  if (!siblings.length && !mapped.length) return null;
  const candidates = new Set((question.candidates || []).map((c) => c.option));
  const source = sourceOf(question);
  const target = (value) => el("span", {
    className: "target mono" + (/^__.*__$/.test(value) ? " sentinel" : candidates.has(value) ? " cand" : ""),
  }, value);
  const targets = (values) => values.length
    ? values.flatMap((v, i) => (i ? [", ", target(v)] : [target(v)]))
    : [el("span", { className: "target none" }, "not mapped")];

  const parts = [];
  const summary = [];
  if (siblings.length) {
    summary.push(`${siblings.length} similar name${siblings.length === 1 ? "" : "s"}`);
    parts.push(el("h4", {}, `Similar names ${source} lists`
      + (ctx.known ? ` (of ${ctx.known} it has listed)` : "")));
    parts.push(el("ul", {}, siblings.map((s) => el("li", {}, [
      el("span", { className: "mono" }, s.name),
      el("span", { className: "arrow" }, "→"),
      el("span", {}, targets(s.mapped_to || [])),
    ]))));
  }
  const free = [...candidates].filter((c) => !(ctx.mapped || {})[c]);
  if (mapped.length || candidates.size) {
    summary.push(`${mapped.length} candidate${mapped.length === 1 ? "" : "s"} already mapped`);
    parts.push(el("h4", {}, `Candidates already fed from ${source}`));
    parts.push(el("ul", {}, [
      ...mapped.map(([option, names]) => el("li", {}, [
        target(option),
        el("span", { className: "arrow" }, "←"),
        el("span", {}, names.flatMap((n, i) => {
          const name = el("span", { className: "mono" }, n);
          return i ? [", ", name] : [name];
        })),
      ])),
      ...(free.length ? [el("li", {}, [
        el("span", { className: "target none" }, `no ${source} name yet: `),
        el("span", {}, free.flatMap((c, i) => (i ? [", ", target(c)] : [target(c)]))),
      ])] : []),
    ]));
  }
  return el("details", { className: "q-context" }, [
    el("summary", {}, `Context: ${summary.join(", ")}`),
    ...parts,
  ]);
}

function renderQuestion(question) {
  const chosen = answerOf(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  const creating = question.universe === "models" ? createDraftFor(KEY(question)) : null;
  /* Every other answer closes the form: one question, one answer. */
  const choose = (record) => {
    dropCreate(question);
    setAnswer(question, record);
  };
  card.append(cardHead(question));

  const chips = el("div", { className: "chips" }, [
    chip("source", sourceOf(question)),
    chip("answer", universeNoun(question), { prose: true }),
  ]);
  if (question.if_previous) {
    chips.append(chip("now", question.if_previous.join(", "), { className: "now" }));
  }
  if (question.ruled_out) {
    /* Back because something new matched: what is listed is what is left. */
    chips.append(chip("ruled out", `${question.ruled_out} earlier`, { prose: true }));
  }
  card.append(chips);
  if (question.note) card.append(el("div", { className: "note-text" }, question.note));
  const context = renderQuestionContext(question);
  if (context) card.append(context);

  const options = el("div", { className: "options" });
  for (const candidate of question.candidates || []) {
    const pressed = chosen?.answer === candidate.option;
    const exact = candidate.confidence === "exact";
    options.append(option(candidate.option, candidate.reason, {
      pressed,
      className: exact ? "exact" : "",
      tag: exact ? "best match" : "",
      note: question.universe === "benchmarks" ? benchNote(candidate.option)
        : question.universe === "models" ? modelNote(candidate.option) : null,
      onclick: () => choose(pressed ? null : mappingRecord(question, candidate.option)),
    }));
  }
  /* The releases Artificial Analysis offers that read like this name: not in
     llm.json yet, so the matcher never offered them, but picking one adds it
     (its question on this tab is answered with the suggested add) and maps
     this name onto it in the same batch. */
  const offeredNew = question.universe === "models" ? openNewSlugs() : [];
  const shownNew = new Set();
  if (offeredNew.length) {
    const listed = new Set((question.candidates || []).map((c) => c.option));
    for (const slug of offeredNew) {
      if (listed.has(slug)) continue;
      const why = nameLikeness(question.subject, slug);
      if (!why) continue;
      const pressed = chosen?.kind === "mapping" && chosen.answer === slug;
      shownNew.add(slug);
      const release = newQuestionFor(slug);
      const how = answerOf(release)?.kind === "reference-add" ? "as a reference model"
        : answerOf(release)?.kind === "model-add" ? "as an open model"
          : isClosedNew(release) ? "as a reference model" : "as an open model";
      options.append(option(slug,
        `${why}, new on Artificial Analysis: adds it ${how} and maps this name to it, in one batch`, {
          pressed,
          tag: "new on AA",
          onclick: () => {
            if (!pressed) ensureAdded(slug);
            choose(pressed ? null : mappingRecord(question, slug));
          },
        }));
    }
  }
  if (question.universe === "models") {
    options.append(option("New model…", creating
      ? `adds ${creating.name.trim() || "it"} and maps this name to it, in one batch`
      : "not tracked yet: add it here and map this name to it in one go", {
      pressed: Boolean(creating),
      className: "decline",
      onclick: () => {
        if (!dropCreate(question)) openCreate(question);
        render();
        /* Into view, not focused: the name is already filled in, and focus
           would open the keyboard over the rest of the form on a phone. */
        if (!creating) {
          document.querySelector(`#view [data-create="${CSS.escape(KEY(question))}"]`)
            ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      },
    }));
  }
  /* None of these: rule every candidate shown out, and answer nothing else.
     The name stays unreviewed, so it is asked again -- with only the new
     candidates -- once the matcher finds one that is not in this list. Only
     the candidates the queue graded against a real list: a "recorded" one was
     offered by the prompt alone, and the runner could not check it. */
  const skippable = (question.candidates || [])
    .filter((c) => c.confidence !== "recorded").map((c) => c.option);
  if (skippable.length) {
    const skipping = chosen?.kind === "candidates-skip" && chosen.answer !== ALL_KNOWN;
    options.append(option("None of these",
      skipping
        ? `rules out ${skippable.join(", ")}; asked again when a new candidate turns up`
        : "not a match, but not unmappable either: ask again when a new candidate turns up", {
        pressed: skipping,
        className: "decline",
        onclick: () => choose(skipping ? null : {
          kind: "candidates-skip",
          route: question.route,
          route_kind: question.route_kind,
          subject: question.subject,
          answer: skippable,
        }),
      }));
  }
  /* None of the current ones: the same answer, over the whole list instead of
     the five shown -- every model or slug known today is ruled out, so the name
     is asked again only once one added later matches it. The runner expands
     the sentinel against its own list; the page's copy is only the count. */
  const knownCount = universeFor(question).length;
  if (knownCount) {
    const all = chosen?.kind === "candidates-skip" && chosen.answer === ALL_KNOWN;
    options.append(option("None of the current ones",
      `rules out all ${knownCount} ${universeNoun(question, true)} known today: asked again only when a new one matches`, {
        pressed: all,
        className: "decline",
        onclick: () => choose(all ? null : {
          kind: "candidates-skip",
          route: question.route,
          route_kind: question.route_kind,
          subject: question.subject,
          answer: ALL_KNOWN,
        }),
      }));
  }
  const declined = chosen?.answer === "__unmappable__";
  options.append(option("__unmappable__", "reviewed, deliberately not mapped", {
    pressed: declined,
    className: "decline",
    onclick: () => choose(declined ? null : mappingRecord(question, "__unmappable__")),
  }));
  card.append(options);

  if (creating) {
    const form = renderAddModel(creating, 0, flyingCreates(), {
      question,
      onCommit: (ok) => card.classList.toggle("answered", ok),
    });
    form.dataset.create = KEY(question);
    card.append(form);
  }

  /* Anything the candidates missed. Filtered client-side purely so the control
     is usable; the value is checked again on the runner. A release Artificial
     Analysis offers is in the list too: picking it adds it. */
  const universe = offeredNew.length
    ? [...new Set([...universeFor(question), ...offeredNew])].sort()
    : universeFor(question);
  const isNewRelease = (value) => offeredNew.includes(value) && !models().includes(value);
  if (universe.length) {
    const freeform = chosen
      && !creating
      && chosen.kind === "mapping"
      && chosen.answer !== "__unmappable__"
      && !(question.candidates || []).some((c) => c.option === chosen.answer)
      && !shownNew.has(chosen.answer);
    const noun = universeNoun(question, true);
    const input = slugInput({
      placeholder: `Search all ${universe.length} ${noun}...`,
      value: freeform ? chosen.answer : "",
    });
    /* A list drawn by hand rather than a datalist: Android's datalist popup
       covers the keyboard's suggestion strip, cannot be scrolled past a few
       rows and does not match mid-word, which is how a slug is remembered. */
    const list = comboBox(input, () => universe, {
      min: 2,
      detail: question.universe === "aa-slugs" ? aaSlugDetail
        : question.universe === "benchmarks" ? (key) => {
          const name = state.llm?.benchmarks?.[key]?.name;
          return name && name !== key ? ` (${name})` : "";
        } : (name) => (isNewRelease(name) ? " (new on AA: picking it adds it)" : ""),
    });
    /* An answer typed here is an answer, and until now it was the only one
       that did not look like one: a button turns solid when it is chosen, and
       a filled box looked exactly like a half-typed one. So the field carries
       the state -- and, for a benchmark, the same terms the buttons carry,
       because a name typed in by hand is the answer most likely to be wrong:
       nothing offered it. */
    const picked = el("div", {});
    const field = el("div", { className: "field picker" }, [list, picked]);
    const drawPicked = () => {
      const value = input.value.trim();
      const known = universe.includes(value);
      field.classList.toggle("is-picked", known);
      // Half-typed is neither an answer nor an error; only a finished word
      // that names nothing is worth flagging.
      input.classList.toggle("unknown", Boolean(value) && !known);
      picked.replaceChildren();
      const note = !known ? null
        : question.universe === "benchmarks" ? benchNote(value)
          : question.universe === "models" ? modelNote(value) : null;
      if (note) picked.append(note);
    };
    input.oninput = () => {
      const value = input.value.trim();
      const known = universe.includes(value);
      /* Typing here is choosing another answer, so an open "New model" form
         goes -- taken out of the card by hand, since a render would replace
         the box being typed into. */
      if (value && dropCreate(question)) {
        card.querySelector(".add-model")?.remove();
      }
      /* Not re-rendered: that would replace the box being typed into. The
         release's own card catches up on the next render. */
      if (known && isNewRelease(value)) ensureAdded(value);
      setAnswer(question, known ? mappingRecord(question, value) : null, false);
      card.classList.toggle("answered", Boolean(answerOf(question)));
      if (value) {
        card.querySelectorAll('.opt[aria-pressed="true"]')
          .forEach((button) => button.setAttribute("aria-pressed", "false"));
      }
      drawPicked();
    };
    drawPicked();
    card.append(field);
  }
  return card;
}

/* The record that carries a closed release, keyed by its question like every
   other answer here so it is locked, sent and pruned with the question. One
   the Reference tab already queued for the same slug is dropped: a batch may
   touch a model once. */
const referenceRecord = (question) => {
  state.answers.delete(REFERENCE_ADD_KEY(question.subject));
  return { kind: "reference-add", name: question.subject };
};

/* A closed release added as an open-weight model anyway: the explicit
   override answer.py asks for, so a plain model-add can never do it. */
const openRecord = (question) => {
  state.answers.delete(REFERENCE_ADD_KEY(question.subject));
  return { kind: "model-add", name: question.subject, open_weights: true };
};
