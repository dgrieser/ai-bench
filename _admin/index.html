<style>
/* ==========================================================================
   Tokens. llm.html's warm greys and blue, restated as a smaller, flatter set
   so every surface, line and state here comes from one place.

   Three states, in this order, because the last one to define a token wins:
   the bare :root is light; the media query darkens it unless the reader has
   explicitly chosen light; the [data-theme] rules then beat both, so the
   toggle works in either direction. Nothing gets its only definition inside a
   media query -- that was the old bug, where <html data-theme="light"> was
   hardcoded and the dark block could never match.
   ========================================================================== */
:root {
  color-scheme: light;

  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #f1efea;
  --sunken: #eceae4;
  --text: #17150f;
  --muted: #6b6759;
  --faint: #9a9587;
  --line: #e4e1d8;
  --line-strong: #d3cfc3;

  --accent: #2647c9;
  --accent-hover: #1c37a6;
  --on-accent: #ffffff;
  --accent-soft: #e9edfc;
  --accent-line: #b9c6f5;

  --good: #1a6b3c;
  --good-soft: #e4f3e9;
  --good-line: #a8d8bc;
  --bad: #a32229;
  --bad-soft: #fbe9e9;
  --bad-line: #eeb6b6;
  --warn: #8a5a00;
  --warn-soft: #fbf1dc;
  --warn-line: #e9cf95;

  --focus: #2647c9;

  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(23, 21, 15, .05);
  --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(23, 21, 15, .06);

  --gutter: clamp(.75rem, 3vw, 1.5rem);
  --tap: 2.75rem;              /* never smaller than a fingertip */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --bg: #121110;
    --surface: #1b1a18;
    --surface-2: #232120;
    --sunken: #100f0e;
    --text: #f2f0ec;
    --muted: #a9a49a;
    --faint: #78736a;
    --line: #302e2b;
    --line-strong: #423f3a;

    --accent: #8aa5ff;
    --accent-hover: #a3b8ff;
    --on-accent: #0e1424;
    --accent-soft: #1c2340;
    --accent-line: #33406e;

    --good: #7ddba2;
    --good-soft: #16281d;
    --good-line: #2c4d38;
    --bad: #ff9d9d;
    --bad-soft: #2c1717;
    --bad-line: #562b2b;
    --warn: #f0c268;
    --warn-soft: #2b2113;
    --warn-line: #4d3c1c;

    --focus: #8aa5ff;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1b1a18;
  --surface-2: #232120;
  --sunken: #100f0e;
  --text: #f2f0ec;
  --muted: #a9a49a;
  --faint: #78736a;
  --line: #302e2b;
  --line-strong: #423f3a;
  --accent: #8aa5ff;
  --accent-hover: #a3b8ff;
  --on-accent: #0e1424;
  --accent-soft: #1c2340;
  --accent-line: #33406e;
  --good: #7ddba2;
  --good-soft: #16281d;
  --good-line: #2c4d38;
  --bad: #ff9d9d;
  --bad-soft: #2c1717;
  --bad-line: #562b2b;
  --warn: #f0c268;
  --warn-soft: #2b2113;
  --warn-line: #4d3c1c;
  --focus: #8aa5ff;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .45);
}

/* ------------------------------------------------------------------ base */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font-ui);
  /* The action bar is fixed; leave room for it -- three lines on a phone, with
     the run mode's hint -- and for the home indicator. */
  padding-bottom: calc(9.5rem + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}

:where(button, input, select, a):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.wrap {
  max-width: 54rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.mono { font-family: var(--font-mono); }

/* ---------------------------------------------------------------- header */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: max(.6rem, env(safe-area-inset-top));
}

.brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  min-width: 0;                 /* lets the repo name truncate, not push */
  padding-block: .3rem .55rem;
}

h1 {
  font-size: 1.0625rem;
  font-weight: 650;
  letter-spacing: -.015em;
  white-space: nowrap;
}
h1 .light { color: var(--muted); font-weight: 400; }

#repo {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: .75rem;
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;               /* keeps the repo name, drops the owner */
  text-align: left;
}

/* The corner: source, site, theme. Copied from llm.html's hero buttons so the
   two pages wear the same control -- 36px circles, line-art icons, a nudge of
   scale on hover -- with the tokens of this page's palette standing in for
   that one's. */
.corner {
  flex: none;
  display: flex;
  align-items: center;
  gap: .625rem;
  margin-right: -.15rem;
}

.icon-btn {
  width: 36px;
  height: 36px;
  /* Inert here -- nothing in this file gives a bare button a minimum -- and
     kept anyway, so the rule stays a copy of llm.html's rather than a variant
     of it that has to be diffed by eye. */
  min-width: unset;
  min-height: unset;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  /* The two links are <a>, so the UA underline has to go for them to read as
     buttons. */
  text-decoration: none;
  transition: background-color 120ms ease, color 120ms ease,
              border-color 120ms ease, transform 120ms ease;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--line-strong);
  transform: scale(1.08);
}

.icon-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* The GitHub mark is a solid glyph, not the line art the others are drawn in,
   so it fills instead of strokes. */
.icon-btn.repo svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
  stroke: none;
}

/* Only the chosen state's icon is drawn; see applyTheme(). */
#theme svg { display: none; }
#theme svg.on { display: block; }

/* Tabs scroll sideways rather than wrapping onto a second ragged line. */
nav {
  display: flex;
  gap: .375rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: .7rem;
  margin-inline: calc(var(--gutter) * -1);
  padding-inline: var(--gutter);
  scroll-padding-inline: var(--gutter);
  /* Fades the ends, so a strip scrolled off-screen reads as more-to-come
     rather than as a tab chopped in half by the viewport. */
  mask-image: linear-gradient(90deg, transparent, #000 var(--gutter),
                              #000 calc(100% - var(--gutter)), transparent);
}
nav::-webkit-scrollbar { display: none; }

nav button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 2.25rem;
  padding: 0 .85rem;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--muted);
  font: 500 .875rem/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
nav button:hover { border-color: var(--line-strong); color: var(--text); }
nav button[aria-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.badge {
  min-width: 1.375rem;
  padding: .05rem .35rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
nav button[aria-selected="true"] .badge {
  background: color-mix(in srgb, var(--on-accent) 22%, transparent);
  color: var(--on-accent);
}

/* ------------------------------------------------------------------ main */

main { padding-block: 1rem; }

.stack > * + * { margin-top: .625rem; }

/* ------------------------------------------------------------------ card */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: .9rem 1rem 1rem;
}
/* Answered and gone to a run: still readable -- it is the record of what is
   being applied -- but plainly not something to answer again. */
.card.sent { border-style: dashed; background: var(--surface-2); }
/* "New model" opened inside a Queue card: a card in a card, so flatter. */
.card.add-model.nested {
  margin-top: .75rem;
  background: var(--surface-2);
  box-shadow: none;
}
.card.sent .opt, .card.sent input, .card.sent select { opacity: .55; cursor: not-allowed; }
.sent-mark {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-wrap: wrap;
  margin-bottom: .55rem;
  color: var(--muted);
  font-size: .8125rem;
}
.card.answered {
  border-color: var(--accent-line);
  background: linear-gradient(var(--accent-soft), var(--accent-soft)) left / 3px 100% no-repeat,
              var(--surface);
}

.subject {
  font-family: var(--font-mono);
  font-size: .9375rem;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -.01em;
  overflow-wrap: anywhere;      /* long slugs break cleanly, never overflow */
}

/* Facts as chips rather than one sentence strung together with dashes -- that
   is what wrapped into an unreadable ribbon on a phone. */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-top: .5rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  max-width: 100%;
  padding: .12rem .45rem;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.chip b { font-weight: 500; color: var(--faint); }
.chip .prose { font-family: var(--font-ui); }
.chip.now { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip .mono { font-size: .95em; }

.note-text {
  margin-top: .5rem;
  color: var(--muted);
  font-size: .875rem;
}

/* --------------------------------------------------------------- options */

/* One per line on a phone, two up once there is room. Equal height, so the
   reasons line up instead of staggering. */
.options {
  display: grid;
  gap: .4rem;
  margin-top: .75rem;
}

.opt {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: .1rem .6rem;
  min-height: var(--tap);
  padding: .5rem .75rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface-2);
  color: var(--text);
  font: 500 .875rem/1.35 var(--font-mono);
  text-align: left;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:hover { border-color: var(--accent-line); background: var(--surface); }
.opt .why {
  grid-column: 1;
  font: 400 .75rem/1.35 var(--font-ui);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.opt .tick {
  grid-row: 1 / -1;
  grid-column: 2;
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  color: transparent;
  font-size: .7rem;
}
.opt.exact {
  border-color: var(--good-line);
  background: var(--good-soft);
}
/* The column's own terms, under the option that would file a label into it.
   Quiet, because it is reference rather than the answer -- but always there,
   because the key alone does not say which run the column holds. */
.bench-note {
  grid-column: 1;
  display: grid;
  gap: .15rem;
  margin-top: .4rem;
  font: 400 .72rem/1.45 var(--font-ui);
  color: var(--muted);
  white-space: normal;
}
.bench-note-name { font-weight: 600; color: var(--text); }
.bench-tags { display: flex; flex-wrap: wrap; gap: .25rem; }
.bench-tag {
  padding: 0 .4rem;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  font: 400 .7rem/1.6 var(--font-mono);
  color: var(--text);
  white-space: nowrap;
}
.bench-note .excludes { opacity: .85; }
.field .bench-note { margin-top: .5rem; }

/* The free-text picker, once it names something real. Green rather than the
   buttons' solid accent, because the text has to stay readable inside it --
   and a tick on the right, so the state survives being read at a glance. */
.field.picker { position: relative; }
.field.is-picked > input {
  border-color: var(--good-line);
  background: var(--good-soft);
  font-weight: 600;
}
/* The tick goes on the panel, not in the box: Chrome draws its own arrow at
   the right edge of an input with a datalist, and two marks in one corner
   read as a glitch. */
.field.is-picked .bench-note-name::before {
  content: "\2713\00a0";
  color: var(--good);
}
/* What was picked, boxed under the box: the same card the buttons draw, so
   choosing from the list and typing a name end in the same place. */
.field.is-picked .bench-note {
  padding: .5rem .6rem;
  border: 1px solid var(--good-line);
  border-radius: var(--r);
  background: var(--good-soft);
}

.opt.exact .why { color: var(--good); }
.opt.decline { background: var(--surface); border-style: dashed; }

/* After the variants, so choosing one always looks chosen. */
.opt[aria-pressed="true"],
.opt.exact[aria-pressed="true"],
.opt.decline[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  border-style: solid;
  color: var(--on-accent);
}
.opt[aria-pressed="true"] .why { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
.opt[aria-pressed="true"] .tag { background: color-mix(in srgb, var(--on-accent) 22%, transparent); color: var(--on-accent); }
.opt[aria-pressed="true"] .tick {
  background: var(--on-accent);
  border-color: var(--on-accent);
  color: var(--accent);
}

/* The pipeline graded this one an exact match; say so rather than relying on a
   pale tint nobody would decode. */
.tag {
  padding: .05rem .35rem;
  border-radius: var(--r-sm);
  background: var(--good-line);
  color: var(--good);
  font: 600 .625rem/1.6 var(--font-ui);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.opt .head { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; min-width: 0; }
.opt .head > span:first-child { overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- fields */

.field { display: grid; gap: .3rem; margin-top: .6rem; }
.field > label {
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
  font-family: var(--font-mono);
  overflow-wrap: anywhere;
}

input[type="text"], input[type="number"], input[type="search"],
input[type="date"], input[type="url"], select {
  width: 100%;                  /* fills the line -- these used to sit stranded */
  min-height: var(--tap);
  padding: .5rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--text);
  font: 400 .9375rem/1.4 var(--font-ui);
}
input::placeholder { color: var(--faint); }
/* Inert rather than merely inactive: a field is disabled here because
   something else in the card has taken the record -- a drafted rename, or a
   batch already on its way to a run. */
input:disabled, select:disabled {
  background: var(--surface-2);
  color: var(--faint);
  cursor: not-allowed;
}
input.unknown { border-color: var(--bad); background: var(--bad-soft); }

/* The Benchmarks tab: descriptions and lists are paragraphs, not one line. */
textarea {
  width: 100%;
  min-height: calc(var(--tap) * 1.6);
  padding: .5rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--text);
  font: 400 1rem/1.45 var(--font-ui);
  resize: vertical;
}
textarea:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
textarea.unknown { border-color: var(--bad); background: var(--bad-soft); }
.field-hint { margin-top: 0; font-size: .8125rem; }
.note-text.bad-text { color: var(--bad); }
.range-pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
label.check { display: flex; align-items: center; gap: .5rem; margin-top: .6rem; font-size: .875rem; }
label.check input { width: 1.1rem; height: 1.1rem; }
details.card > summary { cursor: pointer; }
details.card > summary .chips { margin-top: .3rem; }
details.card > details { margin-top: .6rem; }
.card-foot { display: flex; justify-content: flex-end; margin-top: .7rem; }

/* The add card's name field: a list drawn by hand rather than a datalist,
   because a datalist cannot be told to wait for three letters, to match
   anywhere in a slug, or to stop at fifty. */
.combo { position: relative; }
.combo-list {
  position: absolute;
  z-index: 20;
  top: calc(100% + .25rem);
  left: 0;
  right: 0;
  max-height: 18rem;
  overflow-y: auto;
  margin: 0;
  padding: .25rem;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  box-shadow: var(--shadow-1), 0 8px 24px rgba(0, 0, 0, .12);
}
.combo-list[hidden] { display: none; }
.combo-list li {
  padding: .45rem .6rem;
  border-radius: var(--r-sm);
  cursor: pointer;
  font: 400 .875rem/1.35 var(--font-mono);
  overflow-wrap: anywhere;
}
.combo-list li .detail { color: var(--muted); font-family: var(--font-ui); }
.combo-list li mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
.combo-list li[aria-selected="true"], .combo-list li:hover { background: var(--surface-2); }
.combo-list li.more { cursor: default; color: var(--faint); font-family: var(--font-ui); }
.combo-list li.more:hover { background: none; }

select {
  appearance: none;
  padding-right: 2rem;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 1.1rem) 55%, calc(100% - .75rem) 55%;
  background-size: .35rem .35rem;
  background-repeat: no-repeat;
}

/* The date and the page every score in one edit is stamped with. Set apart
   from the score rows above rather than added to them, because it describes
   them: one sitting, one leaderboard, one day. */
.provenance {
  margin-top: .75rem;
  padding: .65rem .75rem .75rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r);
  background: var(--surface-2);
}
.provenance .field { margin-top: 0; }
.provenance .fields { display: grid; gap: .5rem; }
.provenance .note-text { margin-top: .55rem; font-size: .8125rem; }
.provenance > .field > label { font-size: .8125rem; color: var(--faint); }
.provenance .options { margin-top: .5rem; }
.note-text.good-text { color: var(--good); }
@media (min-width: 30rem) {
  .provenance .fields { grid-template-columns: minmax(0, 10rem) minmax(0, 1fr); }
}

/* label / input / remove, aligned in a column on a phone and a row when wide */
.score-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: .3rem .5rem;
  margin-top: .6rem;
}
.score-row > label {
  grid-column: 1 / -1;
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
  font-family: var(--font-mono);
  overflow-wrap: anywhere;
}
@media (min-width: 30rem) {
  .score-row {
    grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr) auto;
    align-items: center;
    gap: .5rem;
  }
  .score-row > label { grid-column: 1; }
}

/* What is already recorded for the score above: a hint, not a control, so it
   is set back in the muted ink the labels use and never takes the eye off the
   box being typed into. Spans the row in both layouts -- it belongs to the
   whole row rather than to any one of its columns. */
.score-past {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: .15rem 1.1rem;
  font-family: var(--font-mono);
  font-size: .7rem;
  color: var(--muted);
}
.score-past > .more { opacity: .7; }

/* The Models tab lists every column: an empty one is dashed so the gaps read
   at a glance, and one about to be written is marked like an answered card. */
.model-scores .score-row.missing input { border-style: dashed; }
.model-scores .score-row.changed > label { color: var(--good); }
.model-scores .score-row .btn[disabled] { visibility: hidden; }

/* --------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  min-height: var(--tap);
  padding: 0 1rem;
  border: 1px solid transparent;
  border-radius: var(--r);
  font: 500 .9375rem/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s, border-color .12s, opacity .12s;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not([disabled]) { background: var(--accent-hover); }
.btn.primary[disabled] {
  background: var(--surface-2);
  border-color: var(--line);
  color: var(--faint);
  cursor: not-allowed;
}
.btn.ghost { background: var(--surface); border-color: var(--line-strong); color: var(--muted); }
.btn.ghost:hover:not([disabled]) { color: var(--text); border-color: var(--faint); }
.btn.ghost[disabled] { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.btn.tiny { min-height: 2.25rem; padding: 0 .7rem; font-size: .8125rem; }

/* ------------------------------------------------------------ action bar */

.bar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 10;
  background: var(--surface);
  box-shadow: var(--shadow-2);
  padding-block: .7rem;
  padding-bottom: calc(.7rem + env(safe-area-inset-bottom));
}

/* Two rows on a phone, one when there is room. The old flex-wrap let the
   status text collapse to a three-line sliver beside the controls. */
.bar .wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "status status" "opts actions";
  align-items: center;
  gap: .55rem .75rem;
}
@media (min-width: 34rem) {
  .bar .wrap {
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-areas: "status opts actions";
  }
}

#count {
  grid-area: status;
  font-size: .875rem;
  font-weight: 500;
  color: var(--muted);
}
#count.ready { color: var(--accent); }
#count.near { color: var(--warn); }
#count.over { color: var(--bad); }

.bar .opts { grid-area: opts; }
.bar .actions { grid-area: actions; display: flex; gap: .5rem; justify-content: flex-end; }

.switch {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  color: var(--muted);
  font-size: .8125rem;
  cursor: pointer;
  user-select: none;
}
.switch input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); flex: none; }

/* --------------------------------------------------------------- notices */

.note {
  display: flex;
  gap: .6rem;
  padding: .7rem .85rem;
  margin-bottom: .75rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .875rem;
  line-height: 1.5;
}
.note::before { content: "i"; font-weight: 700; font-style: italic; flex: none; }
.note.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.note.bad::before { content: "!"; }
.note.good { background: var(--good-soft); border-color: var(--good-line); color: var(--good); }
.note.good::before { content: "\2713"; font-style: normal; }
.note.busy { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.note.busy::before { content: "\21BB"; font-style: normal; font-weight: 500; }
.note.busy a { color: inherit; font-weight: 500; }

.search { position: sticky; top: 0; z-index: 1; padding-bottom: .1rem; }

/* ----------------------------------------------------------------- empty */

.empty {
  padding: 3.5rem 1.5rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-lg);
  color: var(--muted);
  text-align: center;
  font-size: .9375rem;
  text-wrap: balance;
}

/* ------------------------------------------------------------------ runs */

/* The bar above the list: one button, and the sentence saying what it will do
   or why it will not. */
.runs-bar {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  margin-bottom: .75rem;
}
.runs-bar p {
  flex: 1 1 16rem;
  min-width: 0;
  color: var(--muted);
  font-size: .8125rem;
  line-height: 1.45;
}

ul.runs { list-style: none; }
ul.runs li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: .2rem .65rem;
  padding: .7rem 0;
  border-bottom: 1px solid var(--line);
}
ul.runs li:last-child { border-bottom: 0; }
ul.runs a {
  color: var(--text);
  font-weight: 500;
  font-size: .9375rem;
  text-decoration: none;
  overflow-wrap: anywhere;
}
ul.runs a:hover { color: var(--accent); text-decoration: underline; }
ul.runs time {
  grid-column: 2;
  color: var(--faint);
  font-size: .8125rem;
  font-variant-numeric: tabular-nums;
}
@media (min-width: 36rem) {
  ul.runs li { grid-template-columns: auto minmax(0, 1fr) auto; }
  ul.runs time { grid-column: 3; white-space: nowrap; }
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .15rem .5rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  font-weight: 500;
  white-space: nowrap;
}
.pill .dot { width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; flex: none; }
.pill.success { background: var(--good-soft); color: var(--good); }
.pill.failure, .pill.cancelled { background: var(--bad-soft); color: var(--bad); }
.pill.running { background: var(--warn-soft); color: var(--warn); }
.pill.running .dot { animation: pulse 1.4s ease-in-out infinite; }
.pill.warned { background: var(--warn-soft); color: var(--warn); margin-left: .5rem; vertical-align: .1em; }

/* A run's fetcher warnings: under its row, across every column. */
.run-warnings { grid-column: 1 / -1; font-size: .8125rem; color: var(--muted); }
.run-warnings summary { cursor: pointer; color: var(--warn); width: fit-content; }
.run-warnings ul { list-style: none; margin-top: .35rem; padding-left: .9rem; border-left: 2px solid var(--warn-line); }
ul.runs .run-warnings li { display: flex; gap: 0 .5rem; flex-wrap: wrap; padding: .25rem 0; border-bottom: 0; min-width: 0; }
.run-warnings strong { color: var(--text); font-weight: 500; }
.run-warnings span { overflow-wrap: anywhere; min-width: 0; }

/* --------------------------------------------------------------- phones */

/* A tap is a tap: no 300ms wait for a double-tap zoom, and no grey flash on
   Android over every control touched. */
button, .opt, a, label.switch { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
/* 16px text in a field is what keeps a mobile browser from zooming the page in
   when the field is focused -- and a field is focused on every answer typed. */
input[type="text"], input[type="number"], input[type="search"],
input[type="date"], input[type="url"], select { font-size: 1rem; }

/* The run mode in the action bar: three choices, one line, fingertip-sized. */
.seg {
  display: inline-flex;
  padding: 2px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface-2);
}
.seg[hidden] { display: none; }
.seg button {
  min-height: 2.35rem;
  padding: 0 .6rem;
  border: 0;
  border-radius: calc(var(--r) - 3px);
  background: none;
  color: var(--muted);
  font: 500 .8125rem/1 var(--font-ui);
  cursor: pointer;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.seg button[aria-pressed="true"].quick { color: var(--accent); }
#mode-hint { display: block; font-size: .75rem; font-weight: 400; color: var(--faint); }

/* The header's reload: the same round control, spinning while it reads. */
#reload.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* A row of small actions over a list: bulk answers, filters. */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem;
  margin-bottom: .1rem;
}
.toolbar .grow { flex: 1 1 12rem; min-width: 0; }
.toolbar select, .toolbar input { min-height: 2.5rem; }
.toolbar .count { color: var(--faint); font-size: .8125rem; }

/* The queued items in a multi-add card: one line each, removable. */
.queued { display: grid; gap: .3rem; margin-top: .6rem; }
.queued-row {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .35rem .35rem .35rem .65rem;
  border: 1px solid var(--accent-line);
  border-radius: var(--r);
  background: var(--accent-soft);
  font: 500 .875rem/1.35 var(--font-mono);
}
.queued-row > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.queued-row .detail { display: block; font: 400 .72rem/1.35 var(--font-ui); color: var(--muted); }
.queued-row.sent { border-style: dashed; border-color: var(--line-strong); background: var(--surface-2); color: var(--muted); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.tip-text { margin-top: .5rem; font-size: .8125rem; color: var(--accent); }

/* ------------------------------------------------------------------ updates */

.day { margin-top: 1.1rem; }
.day:first-of-type { margin-top: .4rem; }
.day-head {
  position: sticky;
  top: var(--header-h, 6.5rem);
  z-index: 2;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: .15rem .6rem;
  padding: .45rem .1rem;
  margin-bottom: .4rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  font-size: .9375rem;
  font-weight: 650;
}
.day-head .age { color: var(--muted); font-weight: 400; font-size: .8125rem; }
.day-head .tally { margin-left: auto; color: var(--faint); font-weight: 400; font-size: .75rem; }

.upd {
  padding: .6rem .75rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
}
.upd + .upd, .upd + details, details + .upd { margin-top: .4rem; }
.upd-head { display: flex; align-items: center; flex-wrap: wrap; gap: .3rem .5rem; }
.upd-name {
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  font: 600 .9rem/1.35 var(--font-mono);
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.upd-name:hover { color: var(--accent); text-decoration: underline; }
.upd-note { color: var(--muted); font-size: .8125rem; }
.upd-new { background: var(--bad-soft); color: var(--bad); }

.score-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .45rem; }
.score-chip {
  display: inline-flex;
  align-items: baseline;
  gap: .3rem;
  max-width: 100%;
  padding: .15rem .5rem;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: .75rem;
  color: var(--muted);
  text-decoration: none;
}
a.score-chip:hover { border-color: var(--accent-line); }
.score-chip .bench { font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
.score-chip .val { font: 600 .78rem/1 var(--font-mono); color: var(--text); }
.score-chip .was { font-family: var(--font-mono); color: var(--faint); text-decoration: line-through; }
.score-chip.gone .val { color: var(--bad); }

.map-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: .15rem .55rem;
  align-items: start;
}
.map-row .pill { margin-top: .1rem; }
.map-row .what { font: 500 .8125rem/1.45 var(--font-mono); overflow-wrap: anywhere; }
.map-row .what .src { font-family: var(--font-ui); color: var(--muted); font-weight: 400; }
.map-row .what .arrow { color: var(--faint); }
.map-row .what .was { color: var(--faint); text-decoration: line-through; }
.map-row .meta { grid-column: 2; color: var(--faint); font-size: .75rem; overflow-wrap: anywhere; }
.map-row .meta a { color: inherit; }
.pill.by-admin { background: var(--accent-soft); color: var(--accent); }
.pill.by-auto { background: var(--warn-soft); color: var(--warn); }
.pill.by-proposal { background: var(--good-soft); color: var(--good); }
.pill.by-hand { background: var(--surface-2); color: var(--muted); }

details.more-entries > summary {
  margin-top: .4rem;
  padding: .45rem .75rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r);
  color: var(--muted);
  font-size: .8125rem;
  cursor: pointer;
  list-style: none;
}
details.more-entries > summary::-webkit-details-marker { display: none; }
details.more-entries[open] > summary { display: none; }

@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>OpenBench <span class="light">Admin</span></h1>
      <span id="repo"></span>
      <div class="corner">
        <!-- Href set from api.php's `repo`, which is the one place the
             repository is named; hidden until it answers rather than
             hardcoded here a second time. See setRepoLink(). -->
        <a class="icon-btn repo" id="repoLink" href="#" target="_blank" rel="noreferrer"
           title="Repository" aria-label="Open the GitHub repository (new tab)" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <!-- The published site, per the repository's CNAME. This page is served
             from another host entirely, so there is nothing to derive it from. -->
        <a class="icon-btn" href="https://openbench.david-grieser.de/" target="_blank"
           rel="noreferrer" title="The index" aria-label="Open the published index (new tab)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3.3 9h17.4M3.3 15h17.4"/>
            <path d="M12 3c2.5 2.4 3.8 5.5 3.8 9S14.5 18.6 12 21C9.5 18.6 8.2 15.5 8.2 12S9.5 5.4 12 3z"/>
          </svg>
        </a>
        <!-- Re-reads the queue, llm.json and the runs without reloading the
             page, so a drafted batch survives it. On a phone this is the
             refresh; a browser reload is the heavier one. -->
        <button class="icon-btn" id="reload" type="button" title="Re-read the data" aria-label="Re-read the queue, the index and the runs">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
          </svg>
        </button>
        <button class="icon-btn" id="theme" type="button" title="Theme" aria-label="Change theme">
          <!-- `on` on the default state, so the button is never blank before
               applyTheme() has run. -->
          <svg class="icon-system on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4.5h18v11H3z"/><path d="M8 20h8M12 15.5V20"/>
          </svg>
          <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M19.78 4.22l-1.42 1.42M5.64 18.36l-1.42 1.42"/>
          </svg>
          <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <div id="view"></div>
</main>

<div class="bar">
  <div class="wrap">
    <span id="count"></span>
    <!-- What the run does after applying the batch. Filled by renderMode():
         Quick is offered only when api.php announces it. -->
    <span class="seg opts" id="mode" role="group" aria-label="What the run does after the answers"></span>
    <span class="actions">
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <button class="btn primary" id="send" type="button" disabled>Send</button>
    </span>
  </div>
</div>

<script>
"use strict";

/* No URL is configured here. api.php derives it from the one repo name in its
   config and hands it over, so there is a single place to change and no chance
   of the two disagreeing.

   Both files come from raw.githubusercontent rather than the published site.
   The site serves llm.json, but only under its custom domain: the github.io
   form 301s to it, and a cross-origin redirect carries no CORS headers. Reading
   from raw also means the page sees main as the last run left it, rather than
   whatever the Pages build has caught up with. Reads need no credential either
   way -- raw sends Access-Control-Allow-Origin: *. */
const bust = (u) => `${u}${u.includes("?") ? "&" : "?"}t=${Date.now()}`;

const state = {
  tab: "queue",
  raw: null,        // where to read the data, per api.php
  repo: null,
  questions: [],
  llm: null,
  runs: [],
  answers: new Map(),   // key -> record
  sent: null,           // the batch a run is applying: { at, keys }
  applied: [],          // answered keys: [{ key, at, recurring }] -- see APPLIED_KEY
  stale: 0,             // questions the queue still lists that are already answered
  settled: null,        // the batch whose run just finished: { run, applied, count }
  warn: "",             // something to know about, but nothing that failed here
  steps: false,         // whether api.php can report a run's answer step
  refreshable: false,   // whether api.php can dispatch a run that carries no answers
  refreshing: false,    // a hand-asked run is being dispatched right now
  /* The fetchers each finished run could not read, per api.php's ?warnings=.
     Keyed by run id; a finished run's annotations never change, so each is
     asked for once per page load. A value is { warnings: [...] }, or
     { warnings: null, reason } when the token cannot read them. */
  runWarnings: new Map(),
  warningsOffered: false,  // whether api.php can report them at all
  /* Artificial Analysis model slugs, for renaming a hand-added entry onto one.
     `offered` is what api.php says it can serve; the list itself is fetched
     once, and only when the Models tab is opened. */
  aa: { slugs: null, models: null, error: "", asked: false },
  modelSearch: "",      // kept here so a re-render does not empty the tab
  modelSort: "least",   // see MODEL_SORTS
  modelOpen: new Set(), // the unfolded model cards, by name
  /* The hand-added models being typed, one card each: [{ id, name, fields,
     key, question }], where `key` is the record the card last put in the batch,
     so a card can take back its own record without touching its neighbours'.
     `question` is set on the ones opened from a Queue card's "New model": the
     KEY of that question, whose mapping the card also writes. */
  newModels: [],
  /* What the run does after the batch: "full" refreshes every score, "quick"
     only re-collects the mapping queue. The workflow's skip_refresh (answers
     and nothing else) is not offered: Quick costs a minute more and, unlike
     it, republishes the queue. It is still there for a dispatch by hand. */
  mode: "full",
  quickOffered: false,  // whether api.php understands {"quick": true}
  quicking: false,      // a bare quick run is being dispatched right now
  /* The Updates tab. The mapping log is read once, when the tab is opened. */
  mapLog: { entries: null, error: "", asked: false },
  updates: { days: 30, show: "all", search: "" },
  queueFilter: { source: "", text: "" },
  /* The closed models the index carries for reference: reference-models.json,
     read from the repository like everything else. null until it is read, and
     [] is a state the file cannot be in -- the list may never be emptied. */
  reference: { slugs: null, error: "" },
  /* The commit of main the data was read at, when it could be resolved; see
     dataBase(). null reads through the branch name instead. */
  sha: null,
  ref: null,            // the branch api.php reads from, per its answer
  referenceDraft: "",   // the slug being typed into "carry another model"
  /* The Benchmarks tab: the search, which cards are unfolded (by key; "" is
     the add card), and the column being added -- { key, after, text, record },
     where `record` is the batch key it last wrote. */
  benchSearch: "",
  benchOpen: new Set(),
  benchDraft: null,
  error: "",
  ok: "",
};

/* The api.php contract this page needs. An older endpoint answers without a
   `raw`, so the page has nowhere to read the queue from -- which used to show
   as an empty Queue with no explanation, because the two files are deployed
   separately and nothing checked that they matched. */
const NEEDS_API = 2;

const KEY = (q) => `${q.route} ${q.route_kind} ${q.subject}`;
const NEW_MODEL_ROUTE = "check_new.py";

/* What one dispatch may carry: _answers.MAX_RECORDS, which api.php restates and
   answer.py enforces. The reason is the workflow's concurrency group -- one run
   may be running and one queued, so a sitting that needed a second run would
   evict its own successor. Repeated here only so the page can say so while the
   answers are being picked rather than at the end, when the choice of which 25
   to send has already been made; both of those still refuse an oversized batch,
   which is the check that counts. */
const MAX_RECORDS = 25;

/* Where the footer stops just counting and starts naming the cap. Ten short of
   it, so there is still room to decide what belongs in this sitting. */
const CAP_NOTICE_AT = MAX_RECORDS - 10;

/* Today where the person is, not in UTC: an evening in Berlin is already
   tomorrow by toISOString(), and this date is what the site prints as a
   score's age. Sending it explicitly rather than letting the runner stamp its
   own today is the point -- the run can start hours later, on the other side
   of midnight. */
const today = () => {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

/* A page a score can be credited to. Blank is a real answer -- it means the
   number came from a person and nothing may be cited -- so only a non-empty
   value that is not a URL is wrong. */
const badUrl = (raw) => {
  const value = String(raw ?? "").trim();
  return Boolean(value) && !/^https?:\/\//i.test(value);
};

/* A score's page: required when the edit writes a number. */
const badScoreUrl = (raw, writes) => {
  const value = String(raw ?? "").trim();
  return (writes && !value) || badUrl(value);
};

/* The shape every name in llm.json has. Checked here so a name that could not
   become an entry is caught while it is being typed rather than on the runner,
   where the whole batch would go down with it. */
const SLUG_RE = /^[a-z0-9]+(?:[.-][a-z0-9]+)*$/;

/* _matching.normalize_slug, in JavaScript. Only used to rank suggestions: the
   answer is checked against the real list, never against this. */
const normSlug = (value) => String(value ?? "").toLowerCase()
  .replace(/'/g, "")
  .replace(/[^a-z0-9]+/g, "-")
  .replace(/-+/g, "-")
  .replace(/^-|-$/g, "");

/* The six fields add.py asks for, which are exactly the ones edit.py can change
   afterwards. Two of them live inside the creator object, so nothing may read
   model[key] blindly. */
const META_FIELDS = [
  ["params", "text", "123B, or 230B-A10B"],
  ["context", "text", "256k"],
  ["url", "url", "https://huggingface.co/..."],
  ["creator", "text", "Mistral"],
  ["creator_url", "url", "https://mistral.ai/"],
  ["date_added", "date", ""],
];

const readField = (model, key) => (
  key === "creator" ? model?.creator?.name
    : key === "creator_url" ? model?.creator?.url
      : model?.[key]
) ?? "";

/* Three of those fields say the same handful of things over and over -- 44
   creators and 11 context lengths across hundreds of models -- and typing
   "Mistral " with a trailing space, or "1M" for "1m", makes a second value
   nothing else in llm.json shares. So the values already on file are offered.
   `url` gets no list: it names this one release, and every entry's is
   different. `creator_url` gets none either, because it is filled from the
   creator rather than searched for.

   The comparator is per field because these read as sizes, not as words: sorted
   as text, 10m leads the context lengths and the biggest model on file,
   1.6T-A48B, lands fourth in the params, between 1.3B and 100B-A12B. */
const SIZE_SUFFIX = { k: 1e3, m: 1e6, b: 1e9, t: 1e12 };
const magnitude = (value) => {
  const match = /^([\d.]+)\s*([kmbt])/i.exec(String(value).trim());
  return match ? Number(match[1]) * SIZE_SUFFIX[match[2].toLowerCase()] : NaN;
};
const bySize = (a, b) => {
  const [x, y] = [magnitude(a), magnitude(b)];
  // Anything unparseable keeps its alphabetical place rather than sinking to
  // one end: NaN comparisons are all false, which sorts by nothing at all.
  return Number.isNaN(x) || Number.isNaN(y) || x === y ? a.localeCompare(b) : x - y;
};
const SUGGESTED = {
  params: bySize,
  context: bySize,
  creator: (a, b) => a.localeCompare(b),
};

const fieldSuggestions = (field) => {
  const sort = SUGGESTED[field];
  if (!sort) return [];
  const seen = new Set();
  for (const model of state.llm?.models || []) {
    const value = String(readField(model, field)).trim();
    if (value) seen.add(value);
  }
  return [...seen].sort(sort);
};

/* A datalist, not a <select>: llm.json's own list is where these values come
   from, so a creator or a size that is new to the site still has to be typeable.
   Returns the list to append, or nothing when there is nothing to offer -- a
   page that could not read llm.json still has a working form. */
const suggestList = (field, input) => {
  const values = fieldSuggestions(field);
  if (!values.length) return null;
  const listId = `s-${Math.random().toString(36).slice(2)}`;
  input.setAttribute("list", listId);
  return el("datalist", { id: listId }, values.map((value) => el("option", { value })));
};

/* The page on file for a creator: the one most of its models point at, and the
   shorter on a tie, which is the creator's own front page rather than one
   release's announcement. Nine creators in llm.json have two. */
const creatorUrl = (name) => {
  const counts = new Map();
  for (const model of state.llm?.models || []) {
    if (readField(model, "creator") !== name) continue;
    const url = readField(model, "creator_url").trim();
    if (url) counts.set(url, (counts.get(url) || 0) + 1);
  }
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0]?.[0] ?? "";
};

/* Naming a creator the site already knows fills its page in too: the URL is a
   property of the creator, not of this release, and re-typing it from memory is
   how a second spelling of one creator's page gets into llm.json.

   `spare` is what may be overwritten: an empty field, what this card started
   with, and whatever was filled the last time a creator was named. A page typed
   by hand is in none of those, so picking a creator leaves it alone.

   Wired by driving the URL field's own oninput rather than writing the draft
   here: the two cards disagree about what an unchanged value means (the edit
   card drops it, the add card keeps it) and only that handler knows which. */
const creatorUrlFiller = (inputs, initial) => {
  const spare = new Set(["", initial]);
  return (name) => {
    const input = inputs.creator_url;
    const url = creatorUrl(name);
    if (!input || !url || !spare.has(input.value.trim())) return;
    spare.add(url);
    input.value = url;
    input.oninput();
  };
};

/* A free-text field with a list under it: from `min` letters on, up to `max`
   of `values()` that contain what is typed, anywhere and ignoring case. The
   field stays the answer -- picking a row only writes it in and fires the
   field's own oninput, so typed and picked names take the same road. */
const COMBO_MIN = 3;
const COMBO_MAX = 50;
function comboBox(input, values, {
  detail = () => "", min = COMBO_MIN, max = COMBO_MAX, onPick = null,
  match = (value, needle) => value.toLowerCase().includes(needle),
  toValue = (value) => value,
} = {}) {
  const listId = `c-${Math.random().toString(36).slice(2)}`;
  const list = el("ul", { id: listId, className: "combo-list", hidden: true });
  list.setAttribute("role", "listbox");
  input.setAttribute("role", "combobox");
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-controls", listId);
  input.setAttribute("aria-expanded", "false");
  input.autocomplete = "off";
  let rows = [];
  let active = -1;

  const close = () => {
    list.hidden = true;
    input.setAttribute("aria-expanded", "false");
    active = -1;
  };
  const highlight = (index) => {
    active = index;
    rows.forEach((row, i) => row.setAttribute("aria-selected", String(i === index)));
    if (rows[index]) rows[index].scrollIntoView({ block: "nearest" });
  };
  const pick = (value) => {
    input.value = toValue(value);
    close();
    if (input.oninput) input.oninput();
    /* After oninput, so a caller that acts on a pick sees the field's own
       handling of the value first. A pick is a choice; typing is not yet. */
    if (onPick) onPick(value);
  };
  const withMark = (value, needle) => {
    const at = value.toLowerCase().indexOf(needle);
    if (at < 0) return [value];
    return [value.slice(0, at), el("mark", {}, value.slice(at, at + needle.length)),
      value.slice(at + needle.length)];
  };
  const draw = () => {
    const needle = input.value.trim().toLowerCase();
    rows = [];
    if (needle.length < min || input.disabled) { close(); return; }
    const hits = [];
    let total = 0;
    for (const value of values()) {
      if (!match(value, needle)) continue;
      total += 1;
      if (hits.length < max) hits.push(value);
    }
    // Nothing to offer, or only what is already typed: the list would only
    // sit over the status line below.
    if (!hits.length || (hits.length === 1 && toValue(hits[0]) === input.value.trim())) {
      close();
      return;
    }
    rows = hits.map((value) => {
      const row = el("li", {}, [
        ...withMark(value, needle),
        detail(value) ? el("span", { className: "detail" }, detail(value)) : null,
      ].filter(Boolean));
      row.setAttribute("role", "option");
      row.dataset.value = value;
      // mousedown, not click: a click lands after the blur that closes the list.
      row.onmousedown = (event) => { event.preventDefault(); pick(value); };
      return row;
    });
    const more = total > hits.length
      ? el("li", { className: "more" }, `${total - hits.length} more -- keep typing to narrow it`)
      : null;
    list.replaceChildren(...rows, ...(more ? [more] : []));
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
    active = -1;
  };

  input.addEventListener("input", draw);
  input.addEventListener("focus", draw);
  input.addEventListener("blur", close);
  input.addEventListener("keydown", (event) => {
    if (list.hidden) {
      if (event.key === "ArrowDown") { draw(); if (!list.hidden) event.preventDefault(); }
      return;
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      highlight(Math.min(active + 1, rows.length - 1));
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      highlight(Math.max(active - 1, 0));
    } else if (event.key === "Enter" && active >= 0) {
      event.preventDefault();
      pick(rows[active].dataset.value);
    } else if (event.key === "Escape") {
      event.preventDefault();
      close();
    }
  });
  const box = el("div", { className: "combo" }, [input, list]);
  /* For a list that arrives later than the keystroke: redrawn only while the
     field still has focus, so an answer landing after a tap elsewhere does not
     pop a list open over the next field. */
  box.redraw = () => { if (document.activeElement === input) draw(); };
  return box;
}

/* --------------------------------------------------- Hugging Face lookup */

/* The url field searches the Hub when what is typed is a name rather than a
   URL: "glm 5.3" lists repos, picking one writes https://huggingface.co/<repo>.
   A URL typed or pasted is left alone, and a bare "org/repo" becomes its URL
   when the field is left.

   Straight from the browser: the Hub's API answers any origin with CORS
   headers and needs no token for public repos, so nothing goes through
   api.php. Ranked here rather than by the API, because every release is
   buried under its own quants and fine-tunes: the original repos come first,
   by likes, and anything that reads like a derivative after them. */
const HF_API = "https://huggingface.co/api/models";
const HF_BASE = "https://huggingface.co/";
const HF_DERIVATIVE = /gguf|awq|gptq|fp8|fp4|int[48]\b|w[48]a\d+|\dbits?\b|bnb|exl\d|mlx|onnx|abliterat|uncensor|heretic|lora|quant/i;
const HF_REPO_RE = /^[A-Za-z0-9][\w.-]*\/[\w.-]+$/;
const hfCache = new Map();   // query -> [repo id, ...], ranked
const hfMeta = new Map();    // repo id -> { likes, downloads, pipeline_tag }

const looksLikeUrl = (value) => /^(https?:|\w+:\/\/|(www\.)?(huggingface|hf)\.co\b)/i.test(value);
const hfTokens = (needle) => needle.toLowerCase().split(/\s+/).filter(Boolean);
const hfMatch = (id, needle) => hfTokens(needle).every((token) => id.toLowerCase().includes(token));
const compact = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n));
const hfDetail = (id) => {
  const meta = hfMeta.get(id);
  if (!meta) return "";
  return " " + [meta.pipeline_tag, `♥ ${compact(meta.likes || 0)}`, `↓ ${compact(meta.downloads || 0)}`]
    .filter(Boolean).join(" · ");
};

async function hfSearch(query, signal) {
  const key = query.toLowerCase();
  if (hfCache.has(key)) return hfCache.get(key);
  const url = `${HF_API}?search=${encodeURIComponent(query)}&sort=likes&direction=-1&limit=50`;
  const response = await fetch(url, { signal });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const found = (await response.json()).filter((m) => m && typeof m.id === "string");
  for (const m of found) {
    hfMeta.set(m.id, { likes: m.likes, downloads: m.downloads, pipeline_tag: m.pipeline_tag });
  }
  const original = (m) => !HF_DERIVATIVE.test(m.id);
  const ranked = [...found.filter(original), ...found.filter((m) => !original(m))].map((m) => m.id);
  hfCache.set(key, ranked);
  return ranked;
}

/* Wraps a url input. `shown` is the last answer for what is typed; the
   combo filters it as typing narrows, and redraws when a fresh one lands. */
function hfUrlBox(input) {
  input.placeholder = "https://huggingface.co/... or a name to search";
  let shown = [];
  let timer = 0;
  let controller = null;
  const box = comboBox(input, () => shown, {
    min: 2, max: 12, match: hfMatch, detail: hfDetail, toValue: (id) => HF_BASE + id,
  });
  input.addEventListener("input", () => {
    const query = input.value.trim();
    clearTimeout(timer);
    controller?.abort();
    if (query.length < 2 || looksLikeUrl(query)) { shown = []; return; }
    timer = setTimeout(async () => {
      controller = new AbortController();
      try {
        const ranked = await hfSearch(query, controller.signal);
        if (input.value.trim() !== query) return;
        shown = ranked;
        box.redraw();
      } catch { /* offline, rate-limited, aborted: the field still takes a URL */ }
    }, 250);
  });
  /* "zai-org/GLM-5.3", typed or pasted and left: that is a repo, not a search. */
  input.addEventListener("change", () => {
    const value = input.value.trim();
    if (HF_REPO_RE.test(value)) {
      input.value = HF_BASE + value;
      input.oninput?.();
    }
  });
  return box;
}

/* The control for one metadata field: the input, plus what helps fill it. */
const fieldControl = (field, input) => (field === "url"
  ? [hfUrlBox(input)]
  : [input, suggestList(field, input)]);

/* A field that holds a slug or a URL. A phone keyboard capitalises the first
   letter and "corrects" the rest by default, which turns gpt-6-sol into
   "Gpt-6-sol" and a slug into a word -- neither of which names anything. */
const noAuto = (input) => {
  input.autocapitalize = "none";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.setAttribute("autocorrect", "off");
  return input;
};
const slugInput = (props = {}) => noAuto(el("input", { type: "text", enterKeyHint: "done", ...props }));

const el = (tag, props = {}, kids = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of [].concat(kids)) {
    if (kid === 0 || kid) node.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return node;
};

/* ------------------------------------------------------------------ theme */

/* Three states, not two: following the system is the default and has to stay
   reachable, so the button cycles rather than flips. The same three values
   under the same key, drawn with the same round button, as llm.html -- that
   page resolves "system" in JS because its dark rules hang off
   [data-theme="dark"] alone; here the stylesheet has a
   prefers-color-scheme block of its own, so "system" is simply the absence of
   the attribute and needs no listener to follow a change. */
const THEMES = ["system", "light", "dark"];

function readTheme() {
  try {
    const stored = localStorage.getItem("theme");
    return THEMES.includes(stored) ? stored : "system";
  } catch { return "system"; }   // private mode, blocked storage: just follow the system
}

function applyTheme(theme) {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.setAttribute("data-theme-choice", theme);
  const button = document.getElementById("theme");
  /* The three icons are in the markup; only one is shown. Swapping a class
     rather than rewriting innerHTML keeps them there to be swapped back. */
  for (const icon of button.querySelectorAll("svg")) {
    icon.classList.toggle("on", icon.classList.contains(`icon-${theme}`));
  }
  const label = theme === "system" ? "following the system" : theme;
  button.title = `Theme: ${label}`;
  button.setAttribute("aria-label", `Theme: ${label}. Change it.`);
}

function cycleTheme() {
  const next = THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length];
  try { localStorage.setItem("theme", next); } catch { /* not worth failing over */ }
  applyTheme(next);
}

/* ------------------------------------------------------ the drafted batch */

/* A sitting is typed on a phone, and a phone's browser drops a background tab
   whenever it likes: switching to GitHub to look at a run was enough to lose
   every answer picked so far. So the batch being drafted -- the records, the
   add-a-model cards and the run mode -- is kept in localStorage and restored on
   load. It is a draft, not a record of anything sent: Send and Clear empty it.

   A restored answer to a queue question the queue no longer asks is dropped
   on the first queue read (pruneDraft): answer.py would refuse it as a
   question nothing asked, and a batch is all or nothing. */
const DRAFT_KEY = "ai-bench-admin-draft";
const MODE_KEY = "ai-bench-admin-mode";
const MODES = ["full", "quick"];

function saveDraft() {
  try {
    const drafts = state.newModels.filter((d) => d.name.trim() || Object.keys(d.fields).length);
    const bench = state.benchDraft;
    const benchDraft = bench && (bench.key.trim() || bench.record
      || Object.values(bench.text).some((value) => value !== "" && value !== false))
      ? { key: bench.key, after: bench.after, text: bench.text, record: bench.record } : null;
    if (!state.answers.size && !drafts.length && !state.referenceDraft && !benchDraft) {
      localStorage.removeItem(DRAFT_KEY);
      return;
    }
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      answers: [...state.answers.entries()],
      newModels: drafts.map(({ id, name, fields, key, question }) => ({ id, name, fields, key, question })),
      referenceDraft: state.referenceDraft,
      benchDraft,
    }));
  } catch { /* private mode, a full quota: the draft is only a convenience */ }
}

function readDraft() {
  try {
    const stored = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (!stored) return;
    if (Array.isArray(stored.answers)) {
      for (const pair of stored.answers) {
        if (Array.isArray(pair) && typeof pair[0] === "string" && pair[1] && typeof pair[1] === "object") {
          state.answers.set(pair[0], pair[1]);
        }
      }
    }
    if (Array.isArray(stored.newModels)) {
      state.newModels = stored.newModels
        .filter((d) => d && typeof d.name === "string" && d.fields && typeof d.fields === "object")
        .map((d) => ({
          id: d.id || draftId(), name: d.name, fields: d.fields, key: d.key || "",
          question: typeof d.question === "string" ? d.question : "",
        }));
    }
    if (typeof stored.referenceDraft === "string") state.referenceDraft = stored.referenceDraft;
    const bench = stored.benchDraft;
    if (bench && typeof bench.key === "string" && bench.text && typeof bench.text === "object") {
      state.benchDraft = {
        key: bench.key,
        after: typeof bench.after === "string" ? bench.after : "",
        text: { ...benchText(), ...bench.text },
        record: typeof bench.record === "string" ? bench.record : "",
      };
    }
  } catch { /* a half-written value: start clean */ }
  try {
    const mode = localStorage.getItem(MODE_KEY);
    if (MODES.includes(mode)) state.mode = mode;
  } catch { /* follow the default */ }
}

/* The records that answer a question of the queue, as opposed to the ones that
   name a model -- the same split inferQueued draws for a sent batch. */
const isQueueKey = (key) =>
  !/^(model-(create|edit|rename)|reference-(add|remove)|benchmark-(create|edit)) /.test(key);

function pruneDraft() {
  const asked = new Set(state.questions.map(KEY));
  let dropped = 0;
  for (const key of [...state.answers.keys()]) {
    if (isQueueKey(key) && !asked.has(key)) {
      state.answers.delete(key);
      dropped += 1;
    }
  }
  /* A model opened from a question's card goes with the question: it was only
     ever being added to answer it, and the card it lived on is gone. */
  for (const draft of state.newModels.filter((d) => d.question && !asked.has(d.question))) {
    if (draft.key) state.answers.delete(draft.key);
    state.newModels = state.newModels.filter((d) => d !== draft);
    dropped += 1;
  }
  if (dropped) saveDraft();
  return dropped;
}

const draftId = () => Math.random().toString(36).slice(2, 10);

function setMode(mode) {
  state.mode = mode;
  try { localStorage.setItem(MODE_KEY, mode); } catch { /* not worth failing over */ }
  /* A full render, not just the footer: the add cards' Quick tip reads it. */
  render();
}

/* What each mode costs, in the words the bar shows under the count. */
const MODE_HINTS = {
  full: "then refreshes every score (about 10 min)",
  quick: "then only re-asks the mapping questions, no scores (a couple of minutes)",
};

/* Whether the batch creates a model. A new model's mappings are the questions
   a Quick run exists to ask, so the page says so where it is added. */
const batchAddsModels = () => [...state.answers.keys()]
  .some((key) => /^(model-create|reference-add) /.test(key)
    || state.answers.get(key)?.kind === "model-add");

function renderMode() {
  const box = document.getElementById("mode");
  const offered = MODES.filter((mode) => mode !== "quick" || state.quickOffered);
  if (!offered.includes(state.mode)) state.mode = "full";
  /* One choice is no choice: an api.php without `quick` gets no control. */
  box.hidden = offered.length < 2;
  const labels = { full: "Full", quick: "Quick" };
  box.replaceChildren(...offered.map((mode) => {
    const button = el("button", {
      type: "button",
      className: mode,
      title: `${labels[mode]}: ${MODE_HINTS[mode]}`,
      onclick: () => setMode(mode),
    }, labels[mode]);
    button.setAttribute("aria-pressed", String(state.mode === mode));
    return button;
  }));
}

/* --------------------------------------------------------- the run in flight */

/* A dispatched answer is not applied yet, and the question it answers is still
   in the queue: _pending/pending.json is only republished when the run pushes.
   So the page keeps showing a card that has already been answered, and the
   obvious thing to do is answer it again -- which is the one thing that must
   not happen. The second record carries the same `if_previous`, the run applies
   the first one, and answer.py then rejects the second as stale; a batch is all
   or nothing, so every other answer in that sitting goes down with it.
   The cards in flight are therefore disabled until the run they were sent to
   has finished.

   Kept in localStorage because the page's own advice is to reload after a run,
   and a reload must not hand the questions back. */
const SENT_KEY = "ai-bench-admin-sent";
const POLL_MS = 20000;
/* A dispatch answers 204 before the run exists. Until it shows up there is
   nothing in the list to wait for, which must not read as "finished". */
const GRACE_MS = 90000;
/* How long the Runs tab waits before re-reading the list once it has asked for
   a run of its own, for the same reason: the dispatch is answered before the
   run is created. One read, not a poll -- nothing depends on this run. */
const RUN_APPEARS_MS = 5000;
/* Clock skew between here and GitHub, so the run this batch created is not
   mistaken for one that predates it. */
const SKEW_MS = 60000;

/* The keys of batches a run has already applied.

   The lock above ends when that run reports completed -- and that is a few
   seconds after the run pushed the re-rendered queue, which is not long enough
   for raw.githubusercontent to be serving it. So the read that follows the run
   can still answer with the queue as it was before: every question the run just
   answered, listed again, with the in-flight lock now lifted. Answering one a
   second time is refused by answer.py as a question nothing asked, and a batch
   is all or nothing, so the whole next sitting goes down with it. That is not
   hypothetical -- it is what happened on 2026-09-10, six answers of one batch
   coming back in the next.

   So the keys outlive the lock. An entry is dropped when a queue read comes
   back without its question, which is the page seeing the run's own push; when
   a refresh has since republished a queue that still asks it, which is the site
   asking again; and otherwise only on the clocks below. */
const APPLIED_KEY = "ai-bench-admin-applied";
/* A new-model line is the one question the site means to keep asking: for a
   slug it has added, apply_decisions() clears the line without dismissing it,
   so the next run offers it again. Its lock has to expire by itself.

   Nothing else is asked twice, so nothing else expires by time: a record-only
   run does not republish the queue at all, and the next scheduled refresh can
   be hours away, which is exactly how long those answers stay listed. Expiring
   them on a clock would hand back the duplicate this whole mechanism exists to
   refuse. */
const RECURRING_TTL_MS = 30 * 60 * 1000;
/* Backstop for an entry nothing can clear -- a question that leaves the queue
   while the page is closed for a week, say. Long enough that it can only ever
   fire on a lock that is already wrong. */
const LOCK_MAX_MS = 7 * 24 * 60 * 60 * 1000;
/* A question the site asks again once its answer has landed is the case a
   missing question cannot cover: nothing ever drops the entry, so the card sits
   there reading "answered in an earlier batch" until the backstop above fires a
   week later. Not hypothetical either -- reopening the Vals names parked as
   __unmappable__ put three of them back in the queue on 2026-09-19, already
   answered and no longer answerable.

   A scheduled run is the proof that the queue in hand is newer than the answer.
   It always refreshes -- skip_refresh is only ever set on a batch dispatched
   by hand (this page no longer offers it) -- so it re-collects _pending/pending.json from the files as
   the answer left them. One of those has finished and the question is still
   listed: it is being asked again, and the lock is wrong.

   Only `schedule`, though a merge and a hand-asked refresh republish the queue
   just as well: a merge run is skipped unless the pull request was merged, and
   a dispatched one cannot be told from a record-only batch, which republishes
   nothing at all. Waiting for the next cron costs three hours at most. */
const REFRESH_EVENT = "schedule";
/* How long after that run started before it counts. The run list carries no
   finish time, and a run that has only just reported completed pushed its queue
   seconds ago -- which is the window where raw.githubusercontent is still
   serving the previous blob, the one that does list the answered question. A
   refresh takes about five minutes, so this lands a couple of minutes past its
   push, and the next cron is three hours out either way. */
const REFRESHED_SETTLE_MS = 10 * 60 * 1000;

/* Which of a batch's keys were the queue's own questions, decided when the
   batch is built rather than when it settles.

   Settling happens inside the run list read, which on a fresh page runs before
   the queue has been read at all -- so asking `state.questions` there found
   nothing, kept nothing, and dropped the lock on every answer of a batch that
   was dispatched before the page was last closed. The answer to which
   questions a batch answered is known at dispatch and is stored with it. */
const queueKeys = (keys) => {
  const asked = new Set(state.questions.map(KEY));
  return keys.filter((key) => asked.has(key));
};

/* A record written before `queued` existed. The three kinds that are not queue
   questions all name themselves, so the rest are the questions. */
const inferQueued = (keys) =>
  keys.filter((key) => !/^(model-(create|edit|rename)|reference-(add|remove)|benchmark-(create|edit)) /.test(key));

function readSent() {
  try {
    const stored = JSON.parse(localStorage.getItem(SENT_KEY) || "null");
    if (!stored || !Number.isFinite(stored.at) || !Array.isArray(stored.keys)) return null;
    const keys = stored.keys.filter((k) => typeof k === "string");
    const queued = Array.isArray(stored.queued)
      ? stored.queued.filter((k) => typeof k === "string" && keys.includes(k))
      : inferQueued(keys);
    const skips = stored.skips && typeof stored.skips === "object" ? stored.skips : {};
    return { at: stored.at, keys, queued, mode: MODES.includes(stored.mode) ? stored.mode : "full", skips };
  } catch { return null; }   // private mode, blocked storage, half-written value
}

function writeSent(batch) {
  state.sent = batch;
  try {
    if (batch) localStorage.setItem(SENT_KEY, JSON.stringify(batch));
    else localStorage.removeItem(SENT_KEY);
  } catch { /* the lock still holds for this page; not worth failing over */ }
}

function readApplied() {
  try {
    const stored = JSON.parse(localStorage.getItem(APPLIED_KEY) || "null");
    if (!Array.isArray(stored)) return [];
    return stored.filter((e) => e && typeof e.key === "string" && Number.isFinite(e.at));
  } catch { return []; }   // private mode, blocked storage, half-written value
}

function writeApplied(entries) {
  state.applied = entries;
  try {
    if (entries.length) localStorage.setItem(APPLIED_KEY, JSON.stringify(entries));
    else localStorage.removeItem(APPLIED_KEY);
  } catch { /* the set still holds for this page; not worth failing over */ }
}

const isApplied = (key) => state.applied.some((entry) => entry.key === key);

/* The question kind the site asks again after it has been answered. Read off
   the key, whose first field is the route that asked. */
const isRecurring = (key) => key.startsWith(`${NEW_MODEL_ROUTE} `);

/* `skips` is key -> the candidates a "None of these" ruled out. Such a question
   is meant to come back once something new matches it, under the same key, so
   its lock needs its own way out -- see pruneApplied. */
function rememberApplied(keys, skips = {}) {
  if (!keys.length) return;
  const at = Date.now();
  writeApplied([
    ...state.applied.filter((entry) => !keys.includes(entry.key)),
    ...keys.map((key) => ({
      key, at, recurring: isRecurring(key),
      ...(Array.isArray(skips[key]) ? { skipped: skips[key] } : {}),
    })),
  ]);
}

/* A skipped question listed again without any of the candidates it skipped is
   the queue after the run, asking about a new candidate: answerable again. The
   queue before the run still offers the skipped ones, and stays locked. */
const askedAfresh = (entry, question) => Array.isArray(entry.skipped) && question
  && !(question.candidates || []).some((c) => entry.skipped.includes(c.option));

/* Whether a scheduled refresh has republished the queue since this answer
   settled. That run collects its questions from the files the answer wrote, so
   a question that survives one is a question being asked again -- see
   REFRESH_EVENT. */
const reopenedSince = (at) => state.runs.some((run) =>
  run.event === REFRESH_EVENT
  && run.status === "completed"
  && run.conclusion === "success"
  && Date.parse(run.created_at) >= at + SKEW_MS
  && Date.now() - Date.parse(run.created_at) >= REFRESHED_SETTLE_MS);

/* Called on every queue read. A question that is gone is the page seeing the
   run's push, and a question that outlived a scheduled refresh is the site
   asking it again; those are the only proofs there are. A clock is not proof,
   so only the kind that is deliberately asked again expires by one. */
function pruneApplied(questions) {
  const asked = new Map(questions.map((q) => [KEY(q), q]));
  const now = Date.now();
  const kept = state.applied.filter((entry) => asked.has(entry.key)
    && !askedAfresh(entry, asked.get(entry.key))
    && !reopenedSince(entry.at)
    && now - entry.at < (entry.recurring ? RECURRING_TTL_MS : LOCK_MAX_MS));
  if (kept.length !== state.applied.length) writeApplied(kept);
  return kept.length;
}

/* The run that carried the batch: still going, or the completed one it became.
   Runs arrive newest first. */
const batchRun = (unfinishedOnly = false) => state.sent && state.runs.find((run) =>
  (!unfinishedOnly || run.status !== "completed")
  && Date.parse(run.created_at) >= state.sent.at - SKEW_MS) || null;

const applyingRun = () => batchRun(true);

const locked = () => state.sent !== null;
const isSent = (key) => locked() && state.sent.keys.includes(key);

/* Whether the run wrote the batch: "yes", "no", or "unsure".

   The run's own conclusion cannot say. `Fail if a step of update-all failed`
   runs last, so a run that applied, committed and pushed a batch and then hit
   a dead scraper reports failure -- and reading that as "nothing landed" hands
   back every card of a batch that is already in main, which is the duplicate
   this mechanism exists to refuse. A batch answer.py refused also fails its
   run, and those cards do have to come back. Only the answer step's own
   outcome separates the two, which is what api.php's ?answered= serves.

   Unsure is the safe half everywhere it appears: an endpoint too old to answer,
   a read that failed, a run that carried no answer step at all. The cards stay
   locked and the queue clears them when it catches up. */
async function batchApplied(run) {
  if (!run) return "unsure";                        // never appeared: no outcome to read
  if (run.conclusion === "success") return "yes";
  if (!state.steps) return "unsure";                // endpoint predates ?answered=
  try {
    const response = await fetch(bust(`api.php?answered=${encodeURIComponent(run.id)}`),
      { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body.conclusion === "success" ? "yes"
      : body.conclusion === null ? "unsure"         // this run carried no answers
        : "no";
  } catch {
    return "unsure";
  }
}

/* Drops the lock once the run applying the batch is done with it. Called only
   from a fresh run list, never from a failed read: while the page cannot see
   GitHub it cannot know the run has finished, and unlocking on a network blip
   is how the same answer gets sent twice.

   Only the queue's own questions are remembered as applied: a model edit or a
   rename is not answered against the queue, so re-sending one is a second edit
   rather than a record answer.py refuses, and locking those cards would cost
   the person an edit for no gain. */
async function settleSent() {
  if (!state.sent || applyingRun()) return;
  if (Date.now() - state.sent.at < GRACE_MS) return;
  const run = batchRun();
  const applied = await batchApplied(run);
  if (applied !== "no") rememberApplied(state.sent.queued, state.sent.skips || {});
  state.settled = { run, applied, count: state.sent.keys.length, mode: state.sent.mode };
  noteSettled(state.settled);
  writeSent(null);
}

/* What became of the batch, in words. Set here rather than where the poll
   notices the lock lift, because a reload settles too -- and the reload after a
   run is the page's own advice. */
function noteSettled({ run, applied, count, mode }) {
  if (applied === "no") {
    /* Worth saying rather than leaving to the run log: a batch is all or
       nothing, so a refused record took every other answer of that sitting
       with it, and those questions are answerable again. */
    state.error = `The run carrying ${count} answer(s) refused the batch: its `
      + "own answer step failed, so nothing was written and those questions "
      + "are open again. Its log names the record it would not take.";
  } else if (run && run.conclusion !== "success") {
    /* The case that must not read as "nothing landed": the answers are
       applied, committed and pushed before update-all runs, and the workflow's
       last step reds the run when a scraper fell over. */
    /* Amber, not red: the answers are in main either way, so nothing here
       failed that this page can do anything about. */
    state.warn = applied === "yes"
      ? `That run applied its ${count} answer(s) and then ended as `
        + `${run.conclusion}: the refresh after them failed, not the answers. `
        + "Those questions stay locked -- they are answered."
      : `That run ended as ${run.conclusion}, and this page cannot tell whether `
        + "its answers were applied: api.php did not report the step outcome. "
        + "They stay locked until the queue stops listing them; the run's log "
