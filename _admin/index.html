<style>
/* ==========================================================================
   Tokens. llm.html's warm greys and blue, restated as a smaller, flatter set
   so every surface, line and state here comes from one place.

   Three states, in this order, because the last one to define a token wins:
   the bare :root is light; the media query darkens it unless the reader has
   explicitly chosen light; the [data-theme] rules then beat both, so the
   toggle works in either direction. Nothing gets its only definition inside a
   media query -- that was the old bug, where <html data-theme="light"> was
   hardcoded and the dark block could never match.
   ========================================================================== */
:root {
  color-scheme: light;

  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #f1efea;
  --sunken: #eceae4;
  --text: #17150f;
  --muted: #6b6759;
  --faint: #9a9587;
  --line: #e4e1d8;
  --line-strong: #d3cfc3;

  --accent: #2647c9;
  --accent-hover: #1c37a6;
  --on-accent: #ffffff;
  --accent-soft: #e9edfc;
  --accent-line: #b9c6f5;

  --good: #1a6b3c;
  --good-soft: #e4f3e9;
  --good-line: #a8d8bc;
  --bad: #a32229;
  --bad-soft: #fbe9e9;
  --bad-line: #eeb6b6;
  --warn: #8a5a00;
  --warn-soft: #fbf1dc;
  --warn-line: #e9cf95;

  --focus: #2647c9;

  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(23, 21, 15, .05);
  --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(23, 21, 15, .06);

  --gutter: clamp(.75rem, 3vw, 1.5rem);
  --tap: 2.75rem;              /* never smaller than a fingertip */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --bg: #121110;
    --surface: #1b1a18;
    --surface-2: #232120;
    --sunken: #100f0e;
    --text: #f2f0ec;
    --muted: #a9a49a;
    --faint: #78736a;
    --line: #302e2b;
    --line-strong: #423f3a;

    --accent: #8aa5ff;
    --accent-hover: #a3b8ff;
    --on-accent: #0e1424;
    --accent-soft: #1c2340;
    --accent-line: #33406e;

    --good: #7ddba2;
    --good-soft: #16281d;
    --good-line: #2c4d38;
    --bad: #ff9d9d;
    --bad-soft: #2c1717;
    --bad-line: #562b2b;
    --warn: #f0c268;
    --warn-soft: #2b2113;
    --warn-line: #4d3c1c;

    --focus: #8aa5ff;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1b1a18;
  --surface-2: #232120;
  --sunken: #100f0e;
  --text: #f2f0ec;
  --muted: #a9a49a;
  --faint: #78736a;
  --line: #302e2b;
  --line-strong: #423f3a;
  --accent: #8aa5ff;
  --accent-hover: #a3b8ff;
  --on-accent: #0e1424;
  --accent-soft: #1c2340;
  --accent-line: #33406e;
  --good: #7ddba2;
  --good-soft: #16281d;
  --good-line: #2c4d38;
  --bad: #ff9d9d;
  --bad-soft: #2c1717;
  --bad-line: #562b2b;
  --warn: #f0c268;
  --warn-soft: #2b2113;
  --warn-line: #4d3c1c;
  --focus: #8aa5ff;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .45);
}

/* ------------------------------------------------------------------ base */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font-ui);
  /* The action bar is fixed; leave room for it and for the home indicator. */
  padding-bottom: calc(6.5rem + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}

:where(button, input, select, a):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.wrap {
  max-width: 54rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.mono { font-family: var(--font-mono); }

/* ---------------------------------------------------------------- header */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: max(.6rem, env(safe-area-inset-top));
}

.brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  min-width: 0;                 /* lets the repo name truncate, not push */
  padding-block: .3rem .55rem;
}

h1 {
  font-size: 1.0625rem;
  font-weight: 650;
  letter-spacing: -.015em;
  white-space: nowrap;
}
h1 .light { color: var(--muted); font-weight: 400; }

#repo {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: .75rem;
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;               /* keeps the repo name, drops the owner */
  text-align: left;
}

#theme {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  margin-right: -.4rem;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--muted);
  cursor: pointer;
}
#theme:hover { background: var(--surface-2); color: var(--text); }
#theme svg { width: 1.15rem; height: 1.15rem; }

/* Tabs scroll sideways rather than wrapping onto a second ragged line. */
nav {
  display: flex;
  gap: .375rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: .7rem;
  margin-inline: calc(var(--gutter) * -1);
  padding-inline: var(--gutter);
  scroll-padding-inline: var(--gutter);
  /* Fades the ends, so a strip scrolled off-screen reads as more-to-come
     rather than as a tab chopped in half by the viewport. */
  mask-image: linear-gradient(90deg, transparent, #000 var(--gutter),
                              #000 calc(100% - var(--gutter)), transparent);
}
nav::-webkit-scrollbar { display: none; }

nav button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 2.25rem;
  padding: 0 .85rem;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--muted);
  font: 500 .875rem/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
nav button:hover { border-color: var(--line-strong); color: var(--text); }
nav button[aria-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.badge {
  min-width: 1.375rem;
  padding: .05rem .35rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
nav button[aria-selected="true"] .badge {
  background: color-mix(in srgb, var(--on-accent) 22%, transparent);
  color: var(--on-accent);
}

/* ------------------------------------------------------------------ main */

main { padding-block: 1rem; }

.stack > * + * { margin-top: .625rem; }

/* ------------------------------------------------------------------ card */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: .9rem 1rem 1rem;
}
/* Answered and gone to a run: still readable -- it is the record of what is
   being applied -- but plainly not something to answer again. */
.card.sent { border-style: dashed; background: var(--surface-2); }
.card.sent .opt, .card.sent input, .card.sent select { opacity: .55; cursor: not-allowed; }
.sent-mark {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-wrap: wrap;
  margin-bottom: .55rem;
  color: var(--muted);
  font-size: .8125rem;
}
.card.answered {
  border-color: var(--accent-line);
  background: linear-gradient(var(--accent-soft), var(--accent-soft)) left / 3px 100% no-repeat,
              var(--surface);
}

.subject {
  font-family: var(--font-mono);
  font-size: .9375rem;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -.01em;
  overflow-wrap: anywhere;      /* long slugs break cleanly, never overflow */
}

/* Facts as chips rather than one sentence strung together with dashes -- that
   is what wrapped into an unreadable ribbon on a phone. */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-top: .5rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  max-width: 100%;
  padding: .12rem .45rem;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.chip b { font-weight: 500; color: var(--faint); }
.chip .prose { font-family: var(--font-ui); }
.chip.now { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip .mono { font-size: .95em; }

.note-text {
  margin-top: .5rem;
  color: var(--muted);
  font-size: .875rem;
}

/* --------------------------------------------------------------- options */

/* One per line on a phone, two up once there is room. Equal height, so the
   reasons line up instead of staggering. */
.options {
  display: grid;
  gap: .4rem;
  margin-top: .75rem;
}

.opt {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: .1rem .6rem;
  min-height: var(--tap);
  padding: .5rem .75rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface-2);
  color: var(--text);
  font: 500 .875rem/1.35 var(--font-mono);
  text-align: left;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.opt:hover { border-color: var(--accent-line); background: var(--surface); }
.opt .why {
  grid-column: 1;
  font: 400 .75rem/1.35 var(--font-ui);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.opt .tick {
  grid-row: 1 / span 2;
  grid-column: 2;
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  color: transparent;
  font-size: .7rem;
}
.opt.exact {
  border-color: var(--good-line);
  background: var(--good-soft);
}
.opt.exact .why { color: var(--good); }
.opt.decline { background: var(--surface); border-style: dashed; }

/* After the variants, so choosing one always looks chosen. */
.opt[aria-pressed="true"],
.opt.exact[aria-pressed="true"],
.opt.decline[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  border-style: solid;
  color: var(--on-accent);
}
.opt[aria-pressed="true"] .why { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
.opt[aria-pressed="true"] .tag { background: color-mix(in srgb, var(--on-accent) 22%, transparent); color: var(--on-accent); }
.opt[aria-pressed="true"] .tick {
  background: var(--on-accent);
  border-color: var(--on-accent);
  color: var(--accent);
}

/* The pipeline graded this one an exact match; say so rather than relying on a
   pale tint nobody would decode. */
.tag {
  padding: .05rem .35rem;
  border-radius: var(--r-sm);
  background: var(--good-line);
  color: var(--good);
  font: 600 .625rem/1.6 var(--font-ui);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.opt .head { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; min-width: 0; }
.opt .head > span:first-child { overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- fields */

.field { display: grid; gap: .3rem; margin-top: .6rem; }
.field > label {
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
  font-family: var(--font-mono);
  overflow-wrap: anywhere;
}

input[type="text"], input[type="number"], input[type="search"],
input[type="date"], input[type="url"], select {
  width: 100%;                  /* fills the line -- these used to sit stranded */
  min-height: var(--tap);
  padding: .5rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--text);
  font: 400 .9375rem/1.4 var(--font-ui);
}
input::placeholder { color: var(--faint); }
/* Inert rather than merely inactive: a field is disabled here because
   something else in the card has taken the record -- a drafted rename, or a
   batch already on its way to a run. */
input:disabled, select:disabled {
  background: var(--surface-2);
  color: var(--faint);
  cursor: not-allowed;
}
input.unknown { border-color: var(--bad); background: var(--bad-soft); }

select {
  appearance: none;
  padding-right: 2rem;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 1.1rem) 55%, calc(100% - .75rem) 55%;
  background-size: .35rem .35rem;
  background-repeat: no-repeat;
}

/* The date and the page every score in one edit is stamped with. Set apart
   from the score rows above rather than added to them, because it describes
   them: one sitting, one leaderboard, one day. */
.provenance {
  margin-top: .75rem;
  padding: .65rem .75rem .75rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r);
  background: var(--surface-2);
}
.provenance .field { margin-top: 0; }
.provenance .fields { display: grid; gap: .5rem; }
.provenance .note-text { margin-top: .55rem; font-size: .8125rem; }
.provenance > .field > label { font-size: .8125rem; color: var(--faint); }
.provenance .options { margin-top: .5rem; }
.note-text.good-text { color: var(--good); }
@media (min-width: 30rem) {
  .provenance .fields { grid-template-columns: minmax(0, 10rem) minmax(0, 1fr); }
}

/* label / input / remove, aligned in a column on a phone and a row when wide */
.score-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: .3rem .5rem;
  margin-top: .6rem;
}
.score-row > label {
  grid-column: 1 / -1;
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
  font-family: var(--font-mono);
  overflow-wrap: anywhere;
}
@media (min-width: 30rem) {
  .score-row {
    grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr) auto;
    align-items: center;
    gap: .5rem;
  }
  .score-row > label { grid-column: 1; }
}

/* --------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  min-height: var(--tap);
  padding: 0 1rem;
  border: 1px solid transparent;
  border-radius: var(--r);
  font: 500 .9375rem/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background .12s, border-color .12s, opacity .12s;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not([disabled]) { background: var(--accent-hover); }
.btn.primary[disabled] {
  background: var(--surface-2);
  border-color: var(--line);
  color: var(--faint);
  cursor: not-allowed;
}
.btn.ghost { background: var(--surface); border-color: var(--line-strong); color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--faint); }
.btn.tiny { min-height: 2.25rem; padding: 0 .7rem; font-size: .8125rem; }

/* ------------------------------------------------------------ action bar */

.bar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 10;
  background: var(--surface);
  box-shadow: var(--shadow-2);
  padding-block: .7rem;
  padding-bottom: calc(.7rem + env(safe-area-inset-bottom));
}

/* Two rows on a phone, one when there is room. The old flex-wrap let the
   status text collapse to a three-line sliver beside the controls. */
.bar .wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "status status" "opts actions";
  align-items: center;
  gap: .55rem .75rem;
}
@media (min-width: 34rem) {
  .bar .wrap {
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-areas: "status opts actions";
  }
}

#count {
  grid-area: status;
  font-size: .875rem;
  font-weight: 500;
  color: var(--muted);
}
#count.ready { color: var(--accent); }
#count.near { color: var(--warn); }
#count.over { color: var(--bad); }

.bar .opts { grid-area: opts; }
.bar .actions { grid-area: actions; display: flex; gap: .5rem; justify-content: flex-end; }

.switch {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  color: var(--muted);
  font-size: .8125rem;
  cursor: pointer;
  user-select: none;
}
.switch input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); flex: none; }

/* --------------------------------------------------------------- notices */

.note {
  display: flex;
  gap: .6rem;
  padding: .7rem .85rem;
  margin-bottom: .75rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .875rem;
  line-height: 1.5;
}
.note::before { content: "i"; font-weight: 700; font-style: italic; flex: none; }
.note.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.note.bad::before { content: "!"; }
.note.good { background: var(--good-soft); border-color: var(--good-line); color: var(--good); }
.note.good::before { content: "\2713"; font-style: normal; }
.note.busy { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.note.busy::before { content: "\21BB"; font-style: normal; font-weight: 500; }
.note.busy a { color: inherit; font-weight: 500; }

.search { position: sticky; top: 0; z-index: 1; padding-bottom: .1rem; }

/* ----------------------------------------------------------------- empty */

.empty {
  padding: 3.5rem 1.5rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-lg);
  color: var(--muted);
  text-align: center;
  font-size: .9375rem;
  text-wrap: balance;
}

/* ------------------------------------------------------------------ runs */

ul.runs { list-style: none; }
ul.runs li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: .2rem .65rem;
  padding: .7rem 0;
  border-bottom: 1px solid var(--line);
}
ul.runs li:last-child { border-bottom: 0; }
ul.runs a {
  color: var(--text);
  font-weight: 500;
  font-size: .9375rem;
  text-decoration: none;
  overflow-wrap: anywhere;
}
ul.runs a:hover { color: var(--accent); text-decoration: underline; }
ul.runs time {
  grid-column: 2;
  color: var(--faint);
  font-size: .8125rem;
  font-variant-numeric: tabular-nums;
}
@media (min-width: 36rem) {
  ul.runs li { grid-template-columns: auto minmax(0, 1fr) auto; }
  ul.runs time { grid-column: 3; white-space: nowrap; }
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .15rem .5rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  font-weight: 500;
  white-space: nowrap;
}
.pill .dot { width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; flex: none; }
.pill.success { background: var(--good-soft); color: var(--good); }
.pill.failure, .pill.cancelled { background: var(--bad-soft); color: var(--bad); }
.pill.running { background: var(--warn-soft); color: var(--warn); }
.pill.running .dot { animation: pulse 1.4s ease-in-out infinite; }

@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>OpenBench <span class="light">admin</span></h1>
      <span id="repo"></span>
      <button id="theme" type="button" title="Theme" aria-label="Change theme"></button>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <div id="view"></div>
</main>

<div class="bar">
  <div class="wrap">
    <span id="count"></span>
    <label class="switch opts">
      <input type="checkbox" id="skip"> record only
    </label>
    <span class="actions">
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <button class="btn primary" id="send" type="button" disabled>Send</button>
    </span>
  </div>
</div>

<script>
"use strict";

/* No URL is configured here. api.php derives it from the one repo name in its
   config and hands it over, so there is a single place to change and no chance
   of the two disagreeing.

   Both files come from raw.githubusercontent rather than the published site.
   The site serves llm.json, but only under its custom domain: the github.io
   form 301s to it, and a cross-origin redirect carries no CORS headers. Reading
   from raw also means the page sees main as the last run left it, rather than
   whatever the Pages build has caught up with. Reads need no credential either
   way -- raw sends Access-Control-Allow-Origin: *. */
const bust = (u) => `${u}${u.includes("?") ? "&" : "?"}t=${Date.now()}`;

const state = {
  tab: "queue",
  raw: null,        // where to read the data, per api.php
  repo: null,
  questions: [],
  llm: null,
  runs: [],
  answers: new Map(),   // key -> record
  sent: null,           // the batch a run is applying: { at, keys }
  applied: [],          // answered keys: [{ key, at, recurring }] -- see APPLIED_KEY
  stale: 0,             // questions the queue still lists that are already answered
  settled: null,        // the batch whose run just finished: { run, applied, count }
  warn: "",             // something to know about, but nothing that failed here
  steps: false,         // whether api.php can report a run's answer step
  /* Artificial Analysis model slugs, for renaming a hand-added entry onto one.
     `offered` is what api.php says it can serve; the list itself is fetched
     once, and only when the Models tab is opened. */
  aa: { slugs: null, models: null, error: "", asked: false },
  modelSearch: "",      // kept here so a re-render does not empty the tab
  newModel: null,       // the hand-added model being typed: { name, fields }
  error: "",
  ok: "",
};

/* The api.php contract this page needs. An older endpoint answers without a
   `raw`, so the page has nowhere to read the queue from -- which used to show
   as an empty Queue with no explanation, because the two files are deployed
   separately and nothing checked that they matched. */
const NEEDS_API = 2;

const KEY = (q) => `${q.route} ${q.route_kind} ${q.subject}`;
const NEW_MODEL_ROUTE = "check_new.py";

/* What one dispatch may carry: _answers.MAX_RECORDS, which api.php restates and
   answer.py enforces. The reason is the workflow's concurrency group -- one run
   may be running and one queued, so a sitting that needed a second run would
   evict its own successor. Repeated here only so the page can say so while the
   answers are being picked rather than at the end, when the choice of which 25
   to send has already been made; both of those still refuse an oversized batch,
   which is the check that counts. */
const MAX_RECORDS = 25;

/* Where the footer stops just counting and starts naming the cap. Ten short of
   it, so there is still room to decide what belongs in this sitting. */
const CAP_NOTICE_AT = MAX_RECORDS - 10;

/* Today where the person is, not in UTC: an evening in Berlin is already
   tomorrow by toISOString(), and this date is what the site prints as a
   score's age. Sending it explicitly rather than letting the runner stamp its
   own today is the point -- the run can start hours later, on the other side
   of midnight. */
const today = () => {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

/* A page a score can be credited to. Blank is a real answer -- it means the
   number came from a person and nothing may be cited -- so only a non-empty
   value that is not a URL is wrong. */
const badUrl = (raw) => {
  const value = String(raw ?? "").trim();
  return Boolean(value) && !/^https?:\/\//i.test(value);
};

/* The shape every name in llm.json has. Checked here so a name that could not
   become an entry is caught while it is being typed rather than on the runner,
   where the whole batch would go down with it. */
const SLUG_RE = /^[a-z0-9]+(?:[.-][a-z0-9]+)*$/;

/* _matching.normalize_slug, in JavaScript. Only used to rank suggestions: the
   answer is checked against the real list, never against this. */
const normSlug = (value) => String(value ?? "").toLowerCase()
  .replace(/'/g, "")
  .replace(/[^a-z0-9]+/g, "-")
  .replace(/-+/g, "-")
  .replace(/^-|-$/g, "");

/* The six fields add.py asks for, which are exactly the ones edit.py can change
   afterwards. Two of them live inside the creator object, so nothing may read
   model[key] blindly. */
const META_FIELDS = [
  ["params", "text", "123B, or 230B-A10B"],
  ["context", "text", "256k"],
  ["url", "url", "https://huggingface.co/..."],
  ["creator", "text", "Mistral"],
  ["creator_url", "url", "https://mistral.ai/"],
  ["date_added", "date", ""],
];

const readField = (model, key) => (
  key === "creator" ? model?.creator?.name
    : key === "creator_url" ? model?.creator?.url
      : model?.[key]
) ?? "";

/* Three of those fields say the same handful of things over and over -- 44
   creators and 11 context lengths across hundreds of models -- and typing
   "Mistral " with a trailing space, or "1M" for "1m", makes a second value
   nothing else in llm.json shares. So the values already on file are offered.
   `url` gets no list: it names this one release, and every entry's is
   different. `creator_url` gets none either, because it is filled from the
   creator rather than searched for.

   The comparator is per field because these read as sizes, not as words: sorted
   as text, 10m leads the context lengths and the biggest model on file,
   1.6T-A48B, lands fourth in the params, between 1.3B and 100B-A12B. */
const SIZE_SUFFIX = { k: 1e3, m: 1e6, b: 1e9, t: 1e12 };
const magnitude = (value) => {
  const match = /^([\d.]+)\s*([kmbt])/i.exec(String(value).trim());
  return match ? Number(match[1]) * SIZE_SUFFIX[match[2].toLowerCase()] : NaN;
};
const bySize = (a, b) => {
  const [x, y] = [magnitude(a), magnitude(b)];
  // Anything unparseable keeps its alphabetical place rather than sinking to
  // one end: NaN comparisons are all false, which sorts by nothing at all.
  return Number.isNaN(x) || Number.isNaN(y) || x === y ? a.localeCompare(b) : x - y;
};
const SUGGESTED = {
  params: bySize,
  context: bySize,
  creator: (a, b) => a.localeCompare(b),
};

const fieldSuggestions = (field) => {
  const sort = SUGGESTED[field];
  if (!sort) return [];
  const seen = new Set();
  for (const model of state.llm?.models || []) {
    const value = String(readField(model, field)).trim();
    if (value) seen.add(value);
  }
  return [...seen].sort(sort);
};

/* A datalist, not a <select>: llm.json's own list is where these values come
   from, so a creator or a size that is new to the site still has to be typeable.
   Returns the list to append, or nothing when there is nothing to offer -- a
   page that could not read llm.json still has a working form. */
const suggestList = (field, input) => {
  const values = fieldSuggestions(field);
  if (!values.length) return null;
  const listId = `s-${Math.random().toString(36).slice(2)}`;
  input.setAttribute("list", listId);
  return el("datalist", { id: listId }, values.map((value) => el("option", { value })));
};

/* The page on file for a creator: the one most of its models point at, and the
   shorter on a tie, which is the creator's own front page rather than one
   release's announcement. Nine creators in llm.json have two. */
const creatorUrl = (name) => {
  const counts = new Map();
  for (const model of state.llm?.models || []) {
    if (readField(model, "creator") !== name) continue;
    const url = readField(model, "creator_url").trim();
    if (url) counts.set(url, (counts.get(url) || 0) + 1);
  }
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0]?.[0] ?? "";
};

/* Naming a creator the site already knows fills its page in too: the URL is a
   property of the creator, not of this release, and re-typing it from memory is
   how a second spelling of one creator's page gets into llm.json.

   `spare` is what may be overwritten: an empty field, what this card started
   with, and whatever was filled the last time a creator was named. A page typed
   by hand is in none of those, so picking a creator leaves it alone.

   Wired by driving the URL field's own oninput rather than writing the draft
   here: the two cards disagree about what an unchanged value means (the edit
   card drops it, the add card keeps it) and only that handler knows which. */
const creatorUrlFiller = (inputs, initial) => {
  const spare = new Set(["", initial]);
  return (name) => {
    const input = inputs.creator_url;
    const url = creatorUrl(name);
    if (!input || !url || !spare.has(input.value.trim())) return;
    spare.add(url);
    input.value = url;
    input.oninput();
  };
};

const el = (tag, props = {}, kids = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of [].concat(kids)) {
    if (kid === 0 || kid) node.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return node;
};

/* ------------------------------------------------------------------ theme */

/* Three states, not two: following the system is the default and has to stay
   reachable, so the button cycles rather than flips. Stored under llm.html's
   key and applied the same way, so both pages agree on one device. */
const THEMES = ["system", "light", "dark"];
const ICONS = {
  system: '<path d="M3 4.5h18v11H3zM8 20h8M12 15.5V20"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  dark: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
};

function readTheme() {
  try {
    const stored = localStorage.getItem("theme");
    return THEMES.includes(stored) ? stored : "system";
  } catch { return "system"; }   // private mode, blocked storage: just follow the system
}

function applyTheme(theme) {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  const button = document.getElementById("theme");
  button.innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">${ICONS[theme]}</svg>`;
  button.title = `Theme: ${theme}`;
  button.setAttribute("aria-label", `Theme: ${theme}. Change it.`);
}

function cycleTheme() {
  const next = THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length];
  try { localStorage.setItem("theme", next); } catch { /* not worth failing over */ }
  applyTheme(next);
}

/* --------------------------------------------------------- the run in flight */

/* A dispatched answer is not applied yet, and the question it answers is still
   in the queue: _pending/pending.json is only republished when the run pushes.
   So the page keeps showing a card that has already been answered, and the
   obvious thing to do is answer it again -- which is the one thing that must
   not happen. The second record carries the same `if_previous`, the run applies
   the first one, and answer.py then rejects the second as stale; a batch is all
   or nothing, so every other answer in that sitting goes down with it.
   The cards in flight are therefore disabled until the run they were sent to
   has finished.

   Kept in localStorage because the page's own advice is to reload after a run,
   and a reload must not hand the questions back. */
const SENT_KEY = "ai-bench-admin-sent";
const POLL_MS = 20000;
/* A dispatch answers 204 before the run exists. Until it shows up there is
   nothing in the list to wait for, which must not read as "finished". */
const GRACE_MS = 90000;
/* Clock skew between here and GitHub, so the run this batch created is not
   mistaken for one that predates it. */
const SKEW_MS = 60000;

/* The keys of batches a run has already applied.

   The lock above ends when that run reports completed -- and that is a few
   seconds after the run pushed the re-rendered queue, which is not long enough
   for raw.githubusercontent to be serving it. So the read that follows the run
   can still answer with the queue as it was before: every question the run just
   answered, listed again, with the in-flight lock now lifted. Answering one a
   second time is refused by answer.py as a question nothing asked, and a batch
   is all or nothing, so the whole next sitting goes down with it. That is not
   hypothetical -- it is what happened on 2026-09-10, six answers of one batch
   coming back in the next.

   So the keys outlive the lock. An entry is dropped when a queue read comes
   back without its question, which is the page seeing the run's own push, and
   otherwise only on the clocks below. */
const APPLIED_KEY = "ai-bench-admin-applied";
/* A new-model line is the one question the site means to keep asking: for a
   slug it has added, apply_decisions() clears the line without dismissing it,
   so the next run offers it again. Its lock has to expire by itself.

   Nothing else is asked twice, so nothing else expires by time: a record-only
   run does not republish the queue at all, and the next scheduled refresh can
   be hours away, which is exactly how long those answers stay listed. Expiring
   them on a clock would hand back the duplicate this whole mechanism exists to
   refuse. */
const RECURRING_TTL_MS = 30 * 60 * 1000;
/* Backstop for an entry nothing can clear -- a question that leaves the queue
   while the page is closed for a week, say. Long enough that it can only ever
   fire on a lock that is already wrong. */
const LOCK_MAX_MS = 7 * 24 * 60 * 60 * 1000;

/* Which of a batch's keys were the queue's own questions, decided when the
   batch is built rather than when it settles.

   Settling happens inside the run list read, which on a fresh page runs before
   the queue has been read at all -- so asking `state.questions` there found
   nothing, kept nothing, and dropped the lock on every answer of a batch that
   was dispatched before the page was last closed. The answer to which
   questions a batch answered is known at dispatch and is stored with it. */
const queueKeys = (keys) => {
  const asked = new Set(state.questions.map(KEY));
  return keys.filter((key) => asked.has(key));
};

/* A record written before `queued` existed. The three kinds that are not queue
   questions all name themselves, so the rest are the questions. */
const inferQueued = (keys) => keys.filter((key) => !/^model-(create|edit|rename) /.test(key));

function readSent() {
  try {
    const stored = JSON.parse(localStorage.getItem(SENT_KEY) || "null");
    if (!stored || !Number.isFinite(stored.at) || !Array.isArray(stored.keys)) return null;
    const keys = stored.keys.filter((k) => typeof k === "string");
    const queued = Array.isArray(stored.queued)
      ? stored.queued.filter((k) => typeof k === "string" && keys.includes(k))
      : inferQueued(keys);
    return { at: stored.at, keys, queued };
  } catch { return null; }   // private mode, blocked storage, half-written value
}

function writeSent(batch) {
  state.sent = batch;
  try {
    if (batch) localStorage.setItem(SENT_KEY, JSON.stringify(batch));
    else localStorage.removeItem(SENT_KEY);
  } catch { /* the lock still holds for this page; not worth failing over */ }
}

function readApplied() {
  try {
    const stored = JSON.parse(localStorage.getItem(APPLIED_KEY) || "null");
    if (!Array.isArray(stored)) return [];
    return stored.filter((e) => e && typeof e.key === "string" && Number.isFinite(e.at));
  } catch { return []; }   // private mode, blocked storage, half-written value
}

function writeApplied(entries) {
  state.applied = entries;
  try {
    if (entries.length) localStorage.setItem(APPLIED_KEY, JSON.stringify(entries));
    else localStorage.removeItem(APPLIED_KEY);
  } catch { /* the set still holds for this page; not worth failing over */ }
}

const isApplied = (key) => state.applied.some((entry) => entry.key === key);

/* The question kind the site asks again after it has been answered. Read off
   the key, whose first field is the route that asked. */
const isRecurring = (key) => key.startsWith(`${NEW_MODEL_ROUTE} `);

function rememberApplied(keys) {
  if (!keys.length) return;
  const at = Date.now();
  writeApplied([
    ...state.applied.filter((entry) => !keys.includes(entry.key)),
    ...keys.map((key) => ({ key, at, recurring: isRecurring(key) })),
  ]);
}

/* Called on every queue read. A question that is gone is the page seeing the
   run's push, which is the only proof there is; a clock is not proof, so only
   the kind that is deliberately asked again expires by one. */
function pruneApplied(questions) {
  const asked = new Set(questions.map(KEY));
  const now = Date.now();
  const kept = state.applied.filter((entry) => asked.has(entry.key)
    && now - entry.at < (entry.recurring ? RECURRING_TTL_MS : LOCK_MAX_MS));
  if (kept.length !== state.applied.length) writeApplied(kept);
  return kept.length;
}

/* The run that carried the batch: still going, or the completed one it became.
   Runs arrive newest first. */
const batchRun = (unfinishedOnly = false) => state.sent && state.runs.find((run) =>
  (!unfinishedOnly || run.status !== "completed")
  && Date.parse(run.created_at) >= state.sent.at - SKEW_MS) || null;

const applyingRun = () => batchRun(true);

const locked = () => state.sent !== null;
const isSent = (key) => locked() && state.sent.keys.includes(key);

/* Whether the run wrote the batch: "yes", "no", or "unsure".

   The run's own conclusion cannot say. `Fail if a step of update-all failed`
   runs last, so a run that applied, committed and pushed a batch and then hit
   a dead scraper reports failure -- and reading that as "nothing landed" hands
   back every card of a batch that is already in main, which is the duplicate
   this mechanism exists to refuse. A batch answer.py refused also fails its
   run, and those cards do have to come back. Only the answer step's own
   outcome separates the two, which is what api.php's ?answered= serves.

   Unsure is the safe half everywhere it appears: an endpoint too old to answer,
   a read that failed, a run that carried no answer step at all. The cards stay
   locked and the queue clears them when it catches up. */
async function batchApplied(run) {
  if (!run) return "unsure";                        // never appeared: no outcome to read
  if (run.conclusion === "success") return "yes";
  if (!state.steps) return "unsure";                // endpoint predates ?answered=
  try {
    const response = await fetch(bust(`api.php?answered=${encodeURIComponent(run.id)}`),
      { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body.conclusion === "success" ? "yes"
      : body.conclusion === null ? "unsure"         // this run carried no answers
        : "no";
  } catch {
    return "unsure";
  }
}

/* Drops the lock once the run applying the batch is done with it. Called only
   from a fresh run list, never from a failed read: while the page cannot see
   GitHub it cannot know the run has finished, and unlocking on a network blip
   is how the same answer gets sent twice.

   Only the queue's own questions are remembered as applied: a model edit or a
   rename is not answered against the queue, so re-sending one is a second edit
   rather than a record answer.py refuses, and locking those cards would cost
   the person an edit for no gain. */
async function settleSent() {
  if (!state.sent || applyingRun()) return;
  if (Date.now() - state.sent.at < GRACE_MS) return;
  const run = batchRun();
  const applied = await batchApplied(run);
  if (applied !== "no") rememberApplied(state.sent.queued);
  state.settled = { run, applied, count: state.sent.keys.length };
  noteSettled(state.settled);
  writeSent(null);
}

/* What became of the batch, in words. Set here rather than where the poll
   notices the lock lift, because a reload settles too -- and the reload after a
   run is the page's own advice. */
function noteSettled({ run, applied, count }) {
  if (applied === "no") {
    /* Worth saying rather than leaving to the run log: a batch is all or
       nothing, so a refused record took every other answer of that sitting
       with it, and those questions are answerable again. */
    state.error = `The run carrying ${count} answer(s) refused the batch: its `
      + "own answer step failed, so nothing was written and those questions "
      + "are open again. Its log names the record it would not take.";
  } else if (run && run.conclusion !== "success") {
    /* The case that must not read as "nothing landed": the answers are
       applied, committed and pushed before update-all runs, and the workflow's
       last step reds the run when a scraper fell over. */
    /* Amber, not red: the answers are in main either way, so nothing here
       failed that this page can do anything about. */
    state.warn = applied === "yes"
      ? `That run applied its ${count} answer(s) and then ended as `
        + `${run.conclusion}: the refresh after them failed, not the answers. `
        + "Those questions stay locked -- they are answered."
      : `That run ended as ${run.conclusion}, and this page cannot tell whether `
        + "its answers were applied: api.php did not report the step outcome. "
        + "They stay locked until the queue stops listing them; the run's log "
        + "says what happened.";
  } else {
    /* It used to add that anything still listed is a question the run did not
       answer. That is only true once the queue it pushed has propagated, which
       is what the note under this one says when it has not. */
    state.ok = "That run has finished and the queue has just been re-read. Its "
      + "own summary is the record of what landed, not its colour: a dead "
      + "scraper reds a run whose answers applied perfectly.";
  }
}

let poll = null;

/* Idempotent, and called at the end of every render, so the timer exists
   exactly while something is in flight. */
function syncPolling() {
  if (locked() && poll === null) poll = setInterval(tick, POLL_MS);
  else if (!locked() && poll !== null) { clearInterval(poll); poll = null; }
}

async function tick() {
  const wasLocked = locked();
  if (!(await loadRuns())) {
    render();       // the note says why; the lock stays until GitHub answers
    return;
  }
  if (wasLocked && !locked()) {
    await loadData();
    return;
  }
  render();         // the pill moves from queued to in progress
}

/* --------------------------------------------------- artificial analysis */

/* Asked for once, and only when something needs it: this is the largest thing
   the page reads and most sittings never rename anything.

   Read from the repo, beside the queue and llm.json, rather than proxied live
   through api.php. The proxy had to exist while this came from the AA API --
   which authenticates with a header, so a browser request preflights and AA
   sends no CORS headers -- but the list is now committed on every refresh, so
   the page reads the file directly: no key, no proxy, and none of the four API
   requests a live read costs against a hundred-a-day budget. */
async function ensureAaSlugs() {
  // state.raw is api.php's answer to where the data lives, and loadRuns() is
  // awaited before anything renders -- but a render that beat it would fetch
  // "undefined/_aa/models.json" and cache the failure under asked.
  if (!state.raw || state.aa.asked) return;
  state.aa.asked = true;
  try {
    const response = await fetch(bust(`${state.raw}/_aa/models.json`), { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const body = await response.json();
    const models = (body.models || []).filter((m) => m && typeof m.slug === "string");
    state.aa.models = new Map(models.map((m) => [m.slug, m]));
    state.aa.slugs = models.map((m) => m.slug);
  } catch (error) {
    state.aa.error = String(error.message);
  }
  render();
}

/* What is known about a slug beyond the slug itself, as a short trailing
   phrase -- the creator and the release date are what separate two slugs whose
   names read alike. Empty when the list carries neither. */
function aaSlugDetail(slug) {
  const model = state.aa.models && state.aa.models.get(slug);
  if (!model) return "";
  const parts = [model.creator, model.release_date].filter(Boolean);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

/* AA slugs worth offering for a model of this name, best first. The ranking is
   deliberately shallow -- these are suggestions to click, and the click sends a
   slug from AA's own list either way. */
function aaSuggestions(name, limit = 6) {
  const wanted = normSlug(name);
  const ranked = [];
  for (const slug of state.aa.slugs || []) {
    const norm = normSlug(slug);
    if (norm === wanted) ranked.push([0, "the same name bar punctuation", slug]);
    else if (norm.startsWith(`${wanted}-`)) ranked.push([1, "this name with a suffix", slug]);
    else if (wanted.startsWith(`${norm}-`)) ranked.push([2, "a shorter form of this name", slug]);
    else if (norm.includes(wanted) || wanted.includes(norm)) ranked.push([3, "an overlapping name", slug]);
  }
  ranked.sort((a, b) => a[0] - b[0] || a[2].length - b[2].length || a[2].localeCompare(b[2]));
  return ranked.slice(0, limit).map(([, why, slug]) => ({ slug, why }));
}

/* ---------------------------------------------------------------- loading */

async function load() {
  /* First, because it says where everything else lives. Without it the page
     could not send either, so failing here is fatal rather than degraded. */
  if (!(await loadRuns())) {
    render();
    return;
  }

  await loadData();
}

async function loadData() {
  const json = (url) => fetch(bust(url), { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))));
  const [queue, llm] = await Promise.allSettled([
    json(`${state.raw}/_pending/pending.json`),
    json(`${state.raw}/llm.json`),
  ]);

  if (queue.status === "fulfilled") {
    state.questions = queue.value.questions || [];
    state.stale = pruneApplied(state.questions);
  } else {
    /* Until the first refresh publishes it there is nothing to answer, which is
       a state worth naming rather than showing as a failure. */
    state.questions = [];
    /* No queue read means no proof either way, so the applied keys stay -- but
       there is nothing on the page for the note to point at. */
    state.stale = 0;
    state.error = String(queue.reason.message).includes("404")
      ? "No published queue yet. It appears after the next refresh run."
      : `Could not read the queue (${queue.reason.message}).`;
  }
  if (llm.status === "fulfilled") state.llm = llm.value;
  else state.error = `Could not read llm.json (${llm.reason.message}).`;

  render();
}

async function loadRuns() {
  try {
    const response = await fetch(bust("api.php"), { cache: "no-store" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.runs = body.runs || [];
    /* Announced rather than required: an endpoint without an AA key -- or one
       older than this page -- costs the rename suggestions and nothing else. */
    /* Announced rather than required, like the AA key above: without it the
       page cannot tell an applied batch from a refused one and keeps every
       answered card locked, which costs a wait rather than a rejected batch.
       Read before settling, which is what asks. */
    state.steps = Boolean(body.steps);
    await settleSent();
    if (body.raw) state.raw = body.raw;
    if (body.repo) state.repo = body.repo;
    if (!state.raw || (body.api || 1) < NEEDS_API) {
      state.error = "api.php answered, but it is older than this page: it did not "
        + "say which repository to read. Upload _admin/api.php alongside "
        + "index.html -- ./_admin/deploy sends both. Until then the queue cannot "
        + "be loaded and nothing can be sent.";
      return false;
    }
    return true;
  } catch (error) {
    state.runs = [];
    state.error = `Could not reach api.php (${error.message}). `
      + "Nothing can be read or sent until it answers -- check the host config "
      + "and the error log; see _admin/README.md.";
    return false;
  }
}

/* The universes are derived here rather than shipped with the queue: the model
   list alone is hundreds of names and the AA list thousands, so committing them
   would rewrite pending.json on runs where no question changed. answer.py
   revalidates everything regardless, which is the check that counts. */
const models = () => (state.llm?.models || []).map((m) => m.name).filter(Boolean).sort();
const benchmarks = () =>
  Object.entries(state.llm?.benchmarks || {})
    .filter(([, b]) => b?.derived !== true)
    .map(([key]) => key)
    .sort();

/* Which list an answer must come from, as the queue states it.
   Never inferred from the kind: update_huggingface_mapping.py asks a plain
   "mapping" question whose answers are benchmark keys, so guessing from the
   kind string offered model slugs for every HuggingFace question. propose.ROUTES
   is where this is known, and pending.json now carries it.
   An older queue has no universe field; offering nothing beats offering the
   wrong list, and the next refresh restores it. */
const UNIVERSES = {
  models,
  benchmarks,
  /* The AA route asks which slug a model is, and its answers are AA's own
     names -- which the page can only offer now that api.php can list them.
     Empty without a key, which is the same as it has always been: the
     candidates the queue carries, and nothing to search. */
  "aa-slugs": () => state.aa.slugs || [],
};

/* What a question's answer has to be, in words, for the card's chip. */
const UNIVERSE_NOUNS = {
  models: ["a model", "models"],
  benchmarks: ["a benchmark", "benchmarks"],
  "aa-slugs": ["an Artificial Analysis slug", "AA slugs"],
};
const universeNoun = (question, plural = false) =>
  (UNIVERSE_NOUNS[question.universe] || UNIVERSE_NOUNS.models)[plural ? 1 : 0];

function universeFor(question) {
  const build = UNIVERSES[question.universe];
  return build ? build() : [];
}

/* ---------------------------------------------------------------- answers */

/* rerender:false is for the free-text box. render() rebuilds the whole view,
   which replaces the very input being typed into -- the caret, the value and
   the focus all went with it, so the box could only ever be filled by picking
   from the list in one shot. Typing now updates the batch and touches only the
   footer and this card. */
function setAnswer(question, record, rerender = true) {
  const key = KEY(question);
  if (record === null) state.answers.delete(key);
  else state.answers.set(key, record);
  if (rerender) render();
  else refreshFooter();
}

/* The count, and from CAP_NOTICE_AT on, how much room is left in the batch.
   Named before it runs out rather than after: past the cap the only way out is
   to un-answer cards, and the further in that is discovered the more of the
   sitting has to be undone. */
function refreshFooter() {
  const pending = state.answers.size;
  const room = MAX_RECORDS - pending;
  const count = document.getElementById("count");
  count.textContent = !pending
    ? "Nothing to send yet"
    : room < 0
      ? `${pending} answers -- ${-room} over the ${MAX_RECORDS} a batch holds; `
        + `un-answer ${-room} to send`
      : room === 0
        ? `${MAX_RECORDS} of ${MAX_RECORDS} ready to send -- a batch is full`
        : pending >= CAP_NOTICE_AT
          ? `${pending} of ${MAX_RECORDS} ready to send -- room for ${room} more`
          : `${pending} answer${pending === 1 ? "" : "s"} ready to send`;
  count.classList.toggle("ready", pending > 0 && pending < CAP_NOTICE_AT);
  count.classList.toggle("near", pending >= CAP_NOTICE_AT && room >= 0);
  count.classList.toggle("over", room < 0);
  const send = document.getElementById("send");
  /* Disabled rather than left to fail on the endpoint: the 400 comes back after
     the batch has been typed out in full, and says nothing about which answers
     to drop. */
  send.disabled = pending === 0 || room < 0;
  send.title = room < 0 ? `At most ${MAX_RECORDS} answers per batch.` : "";
  document.getElementById("clear").disabled = pending === 0;
}

const answerOf = (question) => state.answers.get(KEY(question));

function mappingRecord(question, value) {
  return {
    kind: "mapping",
    route: question.route,
    route_kind: question.route_kind,
    subject: question.subject,
    answer: value,
    /* What the queue said the file held. answer.py rejects the record if the
       file has since changed, rather than overwriting whoever answered first. */
    if_previous: question.if_previous ?? null,
  };
}

/* --------------------------------------------------------------- rendering */

function render() {
  /* Named, so it is obvious which repository a batch is about to be sent to. */
  document.getElementById("repo").textContent = state.repo || "";
  renderTabs();

  const notice = document.getElementById("notice");
  notice.replaceChildren();
  if (state.error) notice.append(el("div", { className: "note bad" }, state.error));
  if (state.warn) notice.append(el("div", { className: "note busy" }, state.warn));
  if (state.ok) notice.append(el("div", { className: "note good" }, state.ok));
  if (locked()) notice.append(inFlightNote());
  else if (state.stale) notice.append(staleQueueNote());

  document.getElementById("view").replaceChildren(
    state.tab === "queue" ? renderQueue()
      : state.tab === "new" ? renderNew()
        : state.tab === "models" ? renderModels()
          : renderRuns()
  );

  refreshFooter();
  syncPolling();
}

/* Why those cards are disabled, and what to wait for. */
function inFlightNote() {
  const run = applyingRun();
  const count = state.sent.keys.length;
  return el("div", { className: "note busy" }, el("span", {}, [
    count === 1 ? "1 answer is on its way" : `${count} answers are on their way`,
    run ? " in " : ", but the run has not appeared on GitHub yet.",
    run ? el("a", { href: run.url, target: "_blank", rel: "noreferrer" }, run.name || String(run.id)) : null,
    run ? ` (${runLabel(run)}).` : "",
    " Until that run finishes, the questions it answers stay disabled: the queue "
    + "is only republished when the run pushes, so it still lists them, and "
    + "answering one twice would have the next batch rejected as stale. Checked "
    + `every ${POLL_MS / 1000} seconds.`,
  ]));
}

/* A card whose answer is in the run, or in one that has already applied it.
   Disabled after the fact rather than at every control, so one place locks
   every kind of card and one unlocks it. */
function lockCard(card, applied = false) {
  card.classList.add("sent");
  card.classList.remove("answered");
  card.querySelectorAll("button, input, select").forEach((node) => { node.disabled = true; });
  card.prepend(el("div", { className: "sent-mark" }, applied ? [
    el("span", { className: "pill success" }, [el("span", { className: "dot" }), "answered"]),
    "answered in an earlier batch -- the queue has not caught up yet",
  ] : [
    el("span", { className: "pill running" }, [el("span", { className: "dot" }), "sent"]),
    "the run is applying this answer",
  ]));
  return card;
}

const guard = (card, key) => (
  isSent(key) ? lockCard(card)
    : isApplied(key) ? lockCard(card, true)
      : card
);

/* Why a card is locked when nothing is in flight. Two ways the queue comes back
   still listing an answered question: the run pushes the re-rendered queue
   seconds before it reports completed and raw serves the previous blob for a
   while yet, and a record-only run does not republish it at all -- so this can
   mean a minute or the wait for the next scheduled refresh. */
function staleQueueNote() {
  return el("div", { className: "note busy" }, el("span", {}, [
    state.stale === 1
      ? "1 question below has already been answered and sent"
      : `${state.stale} questions below have already been answered and sent`,
    ", and the queue has not caught up: a run republishes it only after a "
    + "successful refresh, and a record-only run skips that entirely. They stay "
    + "locked until it does -- answering one again would be refused as a "
    + "question nothing asked, and a batch is all or nothing.",
  ]));
}

function renderTabs() {
  const mappingCount = state.questions.filter((q) => q.route !== NEW_MODEL_ROUTE).length;
  const newCount = state.questions.filter((q) => q.route === NEW_MODEL_ROUTE).length;
  const tabs = [
    ["queue", "Queue", mappingCount],
    ["new", "New models", newCount],
    ["models", "Models", null],
    ["runs", "Runs", null],
  ];
  document.getElementById("tabs").replaceChildren(
    ...tabs.map(([id, label, n]) => {
      const button = el("button", {
        type: "button",
        onclick: () => { state.tab = id; render(); },
      }, label);
      button.setAttribute("aria-selected", String(state.tab === id));
      if (n !== null) button.append(el("span", { className: "badge" }, String(n)));
      return button;
    })
  );
}

function chip(label, value, { className = "", prose = false } = {}) {
  return el("span", { className: `chip ${className}`.trim() },
    [label ? el("b", {}, label) : null,
     el("span", { className: prose ? "prose" : "mono" }, value)]);
}

function option(text, why, { pressed, className = "", tag = "", onclick }) {
  const head = el("div", { className: "head" },
    [el("span", {}, text), tag ? el("span", { className: "tag" }, tag) : null]);
  const button = el("button", { type: "button", className: `opt ${className}`.trim(), onclick }, head);
  button.setAttribute("aria-pressed", String(pressed));
  button.append(el("span", { className: "why" }, why), el("span", { className: "tick" }, "✓"));
  return button;
}

function renderQueue() {
  const questions = state.questions.filter((q) => q.route !== NEW_MODEL_ROUTE);
  if (questions.some((q) => q.universe === "aa-slugs")) ensureAaSlugs();
  if (!questions.length) {
    return el("p", { className: "empty" },
      "Nothing pending. Every source name and benchmark label is mapped.");
  }
  return el("div", { className: "stack" },
    questions.map((question) => guard(renderQuestion(question), KEY(question))));
}

function renderQuestion(question) {
  const chosen = answerOf(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  card.append(el("div", { className: "subject" }, question.subject));

  const source = question.route.replace(/^update_/, "").replace(/_mapping\.py$/, "");
  const chips = el("div", { className: "chips" }, [
    chip("source", source),
    chip("answer", universeNoun(question), { prose: true }),
  ]);
  if (question.if_previous) {
    chips.append(chip("now", question.if_previous.join(", "), { className: "now" }));
  }
  card.append(chips);
  if (question.note) card.append(el("div", { className: "note-text" }, question.note));

  const options = el("div", { className: "options" });
  for (const candidate of question.candidates || []) {
    const pressed = chosen?.answer === candidate.option;
    const exact = candidate.confidence === "exact";
    options.append(option(candidate.option, candidate.reason, {
      pressed,
      className: exact ? "exact" : "",
      tag: exact ? "best match" : "",
      onclick: () => setAnswer(question, pressed ? null : mappingRecord(question, candidate.option)),
    }));
  }
  const declined = chosen?.answer === "__unmappable__";
  options.append(option("__unmappable__", "reviewed, deliberately not mapped", {
    pressed: declined,
    className: "decline",
    onclick: () => setAnswer(question, declined ? null : mappingRecord(question, "__unmappable__")),
  }));
  card.append(options);

  /* Anything the candidates missed. Filtered client-side purely so the control
     is usable; the value is checked again on the runner. */
  const universe = universeFor(question);
  if (universe.length) {
    const listId = `u-${Math.random().toString(36).slice(2)}`;
    const freeform = chosen
      && chosen.answer !== "__unmappable__"
      && !(question.candidates || []).some((c) => c.option === chosen.answer);
    const noun = universeNoun(question, true);
    const input = el("input", {
      type: "text",
      placeholder: `Search all ${universe.length} ${noun}...`,
      value: freeform ? chosen.answer : "",
    });
    input.setAttribute("list", listId);
    input.oninput = () => {
      const value = input.value.trim();
      const known = universe.includes(value);
      setAnswer(question, known ? mappingRecord(question, value) : null, false);
      // Half-typed is neither an answer nor an error; only a finished word that
      // names nothing is worth flagging.
      input.classList.toggle("unknown", Boolean(value) && !known);
      card.classList.toggle("answered", Boolean(answerOf(question)));
      if (value) {
        card.querySelectorAll('.opt[aria-pressed="true"]')
          .forEach((button) => button.setAttribute("aria-pressed", "false"));
      }
    };
    const list = el("datalist", { id: listId },
      universe.slice(0, 2000).map((value) => el("option", { value })));
    card.append(el("div", { className: "field" }, [input, list]));
  }
  return card;
}

function renderNew() {
  ensureAaSlugs();
  const questions = state.questions.filter((q) => q.route === NEW_MODEL_ROUTE);
  const box = el("div", { className: "stack" }, renderAddModel());
  if (!questions.length) {
    box.append(el("p", { className: "empty" },
      "No new models waiting. Artificial Analysis has offered nothing this site "
      + "does not already track."));
    return box;
  }
  box.append(...questions.map(renderNewQuestion));
  return box;
}

/* A model nothing offered. check_new.py finds the ones Artificial Analysis
   publishes; this is the other direction -- a release AA does not track, or
   does not track yet -- so there is no question to answer and no slug to
   accept. add.py builds the entry from what is typed here, filling anything
   left blank from AA if it happens to know the name. */
function renderAddModel() {
  const draft = state.newModel || (state.newModel = { name: "", fields: {} });
  const card = el("div", { className: "card" });
  /* Locked only while the model *in the form* is the one in flight, so
     "Add another" -- which clears the name -- hands the form back. */
  const sentKey = `model-create  ${draft.name.trim()}`;
  const sent = Boolean(draft.name.trim()) && isSent(sentKey);

  card.append(el("div", { className: "subject" }, "Add a model"));
  const known = new Set((state.llm?.models || []).map((m) => m.name));

  const status = el("div", { className: "chips" });
  const commit = () => {
    for (const answerKey of [...state.answers.keys()]) {
      if (answerKey.startsWith("model-create  ")) state.answers.delete(answerKey);
    }
    const name = draft.name.trim();
    const shaped = SLUG_RE.test(name);
    const taken = known.has(name);
    const broken = META_FIELDS.some(([f, type]) => type === "url" && badUrl(draft.fields[f]));
    /* Typed back in after being sent: the run is creating it, and a second
       record would have add.py refuse the whole batch for a duplicate name. */
    const inFlight = isSent(`model-create  ${name}`);

    status.replaceChildren(...(!name ? [] : [
      !shaped
        ? chip("", "not a slug: lowercase words joined by single dots or dashes",
          { prose: true, className: "now" })
        : taken
          ? chip("", "already tracked -- edit it on the Models tab", { prose: true, className: "now" })
          : inFlight
            ? chip("", "already sent -- the run is creating it", { prose: true, className: "now" })
            : state.aa.slugs === null
              ? chip("", "adding it as a new entry", { prose: true })
              : state.aa.slugs.includes(name)
                ? chip("", "an Artificial Analysis slug: its scores arrive on the next refresh",
                  { prose: true })
                : chip("", "not an AA slug: AA scores will need a mapping or a rename later",
                  { prose: true }),
    ]));

    if (shaped && !taken && !broken && !inFlight) {
      const fields = Object.fromEntries(
        Object.entries(draft.fields).filter(([, value]) => value !== null)
      );
      state.answers.set(`model-create  ${name}`, { kind: "model-create", name, fields });
    }
    card.classList.toggle("answered", shaped && !taken && !broken);
    refreshFooter();
  };

  const nameInput = el("input", {
    type: "text", placeholder: "acme-model-1", value: draft.name, disabled: sent,
  });
  nameInput.oninput = () => {
    draft.name = nameInput.value;
    nameInput.classList.toggle("unknown",
      Boolean(draft.name.trim()) && !SLUG_RE.test(draft.name.trim()));
    commit();
  };
  card.append(el("div", { className: "field" }, [el("label", {}, "name"), nameInput]), status);

  /* Held so the creator field can reach the creator url field below it: the
     handler runs long after the loop, by which time both are in here. */
  const inputs = {};
  const fillCreatorUrl = creatorUrlFiller(inputs, "");
  for (const [field, type, placeholder] of META_FIELDS) {
    if (field === "date_added") continue;   // add.py stamps the day it runs
    const input = el("input", {
      type, placeholder, value: draft.fields[field] ?? "", disabled: sent,
    });
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === "") delete draft.fields[field];
      else draft.fields[field] = value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    card.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), input, suggestList(field, input)]));
  }

  card.append(el("p", { className: "note-text" },
    "Anything left blank is filled from Artificial Analysis when it knows the "
    + "name, and stays empty when it does not. Scores land on the next refresh; "
    + "type them in on the Models tab if they are not coming from anywhere."));

  if (sent) {
    /* Appended after the lock, not before it: lockCard() disables every control
       it finds, and this one is the way out of the locked state. */
    const locked = guard(card, sentKey);
    const another = el("button", { className: "btn ghost tiny", type: "button" }, "Add another");
    another.onclick = () => { state.newModel = { name: "", fields: {} }; render(); };
    locked.append(el("div", { className: "field" }, another));
    return locked;
  }
  commit();
  return card;
}

function renderNewQuestion(question) {
  const chosen = answerOf(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  card.append(el("div", { className: "subject" }, question.subject));
  if (question.note) {
    card.append(el("div", { className: "chips" }, chip("", question.note, { prose: true })));
  }

  /* "Yes" is a model-add, not an __added__ decision. apply_decisions() keeps
     __added__ only for an entry already in llm.json; for a new slug it clears
     the line without dismissing it, so the model is offered again on every
     run after this one. */
  const adding = chosen?.kind === "model-add";
  const ignoring = chosen?.kind === "new-model";
  card.append(el("div", { className: "options" }, [
    option("Add it", "adds the entry; scores land on the next refresh", {
      pressed: adding,
      className: "exact",
      onclick: () => setAnswer(question, adding ? null
        : { kind: "model-add", name: question.subject }),
    }),
    option("Ignore it", "never offer this slug again", {
      pressed: ignoring,
      className: "decline",
      onclick: () => setAnswer(question, ignoring ? null
        : { kind: "new-model", subject: question.subject, answer: "__ignored__" }),
    }),
  ]));
  return guard(card, KEY(question));
}

function renderModels() {
  ensureAaSlugs();
  const box = el("div", { className: "stack" });
  const search = el("input", {
    type: "search",
    placeholder: "Find a model by name...",
    value: state.modelSearch,
  });
  const results = el("div", { className: "stack" });
  const draw = () => {
    const needle = state.modelSearch.trim().toLowerCase();
    const found = needle
      ? (state.llm?.models || []).filter((m) => m.name.toLowerCase().includes(needle))
      : [];
    results.replaceChildren(
      ...(needle
        ? (found.length
          ? found.slice(0, 20).map(renderModelCard)
          : [el("p", { className: "empty" }, `No model matches "${state.modelSearch.trim()}".`)])
        : [el("p", { className: "empty" },
          `Type to find one of ${(state.llm?.models || []).length} models to edit.`)])
    );
  };
  /* Held in state, not in the input: a rename is drafted with a click, which
     re-renders the whole view, and a needle that lived only in the DOM would
     take the card being worked on with it. */
  search.oninput = () => { state.modelSearch = search.value; draw(); };
  box.append(el("div", { className: "search" }, search), results);
  draw();
  return box;
}

function renderModelCard(model) {
  const key = `model-edit  ${model.name}`;
  const renameKey = `model-rename  ${model.name}`;
  const rename = state.answers.get(renameKey);
  const existing = state.answers.get(key);
  const card = el("div", { className: `card${existing || rename ? " answered" : ""}` });
  card.append(el("div", { className: "subject" }, model.name));
  card.append(el("div", { className: "chips" }, [
    chip("", model.creator?.name || "unknown", { prose: true }),
    chip("added", model.date_added || "?"),
  ]));

  const draft = {
    fields: { ...(existing?.fields || {}) },
    scores: { ...(existing?.scores || {}) },
    score_date: existing?.score_date ?? today(),
    score_url: existing?.score_url ?? "",
  };
  const commit = () => {
    const scored = Object.keys(draft.scores).length > 0;
    /* A batch is all or nothing on the runner, so a half-typed page must not
       reach it: it would refuse this record and take every other answer in the
       sitting down with it. The card simply stops counting as answered until
       the URL is one. */
    const broken = META_FIELDS.some(([field, type]) => type === "url" && badUrl(draft.fields[field]))
      || (scored && badUrl(draft.score_url));
    const empty = !Object.keys(draft.fields).length && !scored;
    if (empty || broken) state.answers.delete(key);
    else {
      /* The provenance travels with the scores or not at all: answer.py refuses
         a date or a page with nothing to stamp it on, and a params-only edit
         has nothing. A blank date leaves the stamping to the runner, which is
         still "now", just its own. */
      const record = { kind: "model-edit", name: model.name, fields: draft.fields, scores: draft.scores };
      if (scored) {
        if (draft.score_date) record.score_date = draft.score_date;
        record.score_url = draft.score_url.trim() || null;
      }
      state.answers.set(key, record);
    }
    /* Same reason the queue's search box does not re-render: a full rebuild
       would replace the input being typed into. */
    card.classList.toggle("answered", !empty && !broken);
    refreshFooter();
  };

  /* Every field add.py asks for, so nothing is enterable once and then frozen.
     Anything outside this list exits 2 out of edit.py's argparse. */
  const fields = el("div", {});
  const inputs = {};
  const fillCreatorUrl = creatorUrlFiller(inputs, readField(model, "creator_url"));
  for (const [field, type, placeholder] of META_FIELDS) {
    const current = readField(model, field);
    const input = el("input", {
      type,
      placeholder,
      value: draft.fields[field] ?? current,
      disabled: Boolean(rename),
    });
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === current) delete draft.fields[field];
      else draft.fields[field] = value === "" ? null : value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    fields.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), input, suggestList(field, input)]));
  }
  card.append(fields);

  /* One date and one page for the whole edit rather than per score: a sitting
     is one leaderboard read on one day, and edit.py stamps what that run
     changes. Two dates means two batches. */
  const dateInput = el("input", {
    type: "date", value: draft.score_date, max: today(), disabled: Boolean(rename),
  });
  dateInput.oninput = () => { draft.score_date = dateInput.value; commit(); };
  const urlInput = el("input", {
    type: "url",
    inputMode: "url",
    placeholder: "https://... (blank credits nobody)",
    value: draft.score_url,
    disabled: Boolean(rename),
  });
  urlInput.oninput = () => {
    draft.score_url = urlInput.value;
    urlInput.classList.toggle("unknown", badUrl(draft.score_url));
    commit();
  };
  const provenance = el("div", { className: "provenance" }, [
    el("div", { className: "fields" }, [
      el("div", { className: "field" }, [el("label", {}, "score date"), dateInput]),
      el("div", { className: "field" }, [el("label", {}, "score url"), urlInput]),
    ]),
    el("p", { className: "note-text" },
      "Stamped on every score changed above. A page moves the value onto that "
      + "page's rung of the source precedence, where only that page or a better "
      + "one may overwrite it; left blank it counts as hand-entered, which any "
      + "scraper may replace."),
  ]);

  const scores = el("div", {});
  const drawScores = () => {
    provenance.hidden = !Object.keys(draft.scores).length;
    scores.replaceChildren(...Object.keys(draft.scores).sort().map((bench) => {
      const input = el("input", {
        type: "number", step: "0.1", inputMode: "decimal",
        value: draft.scores[bench] ?? "",
        disabled: Boolean(rename),
      });
      input.oninput = () => {
        draft.scores[bench] = input.value === "" ? null : Number(input.value);
        commit();
      };
      const drop = el("button", {
        type: "button",
        className: "btn ghost tiny",
        disabled: Boolean(rename),
        onclick: () => { delete draft.scores[bench]; drawScores(); commit(); },
      }, "Remove");
      return el("div", { className: "score-row" }, [el("label", {}, bench), input, drop]);
    }));
  };

  const picker = el("select", { disabled: Boolean(rename) },
    [el("option", { value: "" }, "Add a score...")]
      .concat(benchmarks().map((b) => el("option", { value: b }, b))));
  picker.onchange = () => {
    if (!picker.value) return;
    draft.scores[picker.value] = model.scores?.[picker.value] ?? null;
    picker.value = "";
    drawScores();
    commit();
  };
  card.append(scores, provenance, el("div", { className: "field" }, picker));
  drawScores();
  card.append(renameBlock(model, renameKey, rename));
  return guard(card, isSent(renameKey) ? renameKey : key);
}

/* Which Artificial Analysis slug this entry answers to -- and, when the answer
   is "none of them", the way to change that.

   update.resolve_aa_slugs() reads AA for a model whose *name* is a slug there,
   byte for byte. So an entry added by hand before AA tracked it starts
   collecting AA scores by itself the day AA publishes the same slug, and needs
   nothing here. When AA publishes it under a different slug there are two ways
   out: map the name to the slug (the Queue tab asks exactly that, once a
   refresh has noticed), or take the slug as the entry's name, which leaves
   nothing to maintain afterwards. This is the second. */
function renameBlock(model, renameKey, rename) {
  const block = el("div", { className: "provenance aa" });
  block.append(el("div", { className: "field" }, el("label", {}, "artificial analysis")));

  if (rename) {
    block.append(
      el("div", { className: "chips" }, chip("rename to", rename.new_name)),
      el("div", { className: "options" }, option("Cancel the rename", "keep this name", {
        pressed: false,
        className: "decline",
        onclick: () => { state.answers.delete(renameKey); render(); },
      })),
      el("p", { className: "note-text" },
        `${model.name} becomes ${rename.new_name} in llm.json and in every mapping `
        + "file that names it -- rename.py does both, because a name left behind in "
        + "one of them does not fail, it just stops matching. The fields above are "
        + "not sent with it: one record per model per run."),
    );
    return block;
  }

  if (state.aa.error) {
    block.append(el("p", { className: "note-text" },
      String(state.aa.error).includes("404")
        ? "No published Artificial Analysis list yet. It appears after the next "
          + "refresh run. ./rename.py does the same job from a terminal."
        : `Could not read the Artificial Analysis slugs (${state.aa.error}).`));
    return block;
  }
  if (state.aa.slugs === null) {
    block.append(el("p", { className: "note-text" }, "Reading the Artificial Analysis slugs..."));
    return block;
  }
  if (state.aa.slugs.includes(model.name)) {
    block.append(el("p", { className: "note-text good-text" },
      "Artificial Analysis publishes this exact slug, so update.py reads it "
      + "directly. Nothing to map and nothing to rename."));
    return block;
  }

  const suggestions = aaSuggestions(model.name);
  const options = el("div", { className: "options" });
  for (const { slug, why } of suggestions) {
    options.append(option(slug, `rename to this -- ${why}${aaSlugDetail(slug)}`, {
      pressed: false,
      className: why.startsWith("the same name") ? "exact" : "",
      tag: why.startsWith("the same name") ? "best match" : "",
      onclick: () => setRename(model, renameKey, slug),
    }));
  }
  if (suggestions.length) block.append(options);

  const listId = `aa-${Math.random().toString(36).slice(2)}`;
  const input = el("input", { type: "text", placeholder: "type to search" });
  input.setAttribute("list", listId);
  const apply = el("button", { className: "btn ghost tiny", type: "button" }, "Rename");
  apply.onclick = () => {
    const value = input.value.trim();
    if (!state.aa.slugs.includes(value)) {
      input.classList.add("unknown");
      return;
    }
    setRename(model, renameKey, value);
  };
  input.oninput = () => input.classList.remove("unknown");
  block.append(
    el("div", { className: "score-row" }, [
      el("label", {}, `or one of ${state.aa.slugs.length} AA slugs`),
      input,
      apply,
      el("datalist", { id: listId },
        state.aa.slugs.slice(0, 2000).map((value) =>
          el("option", { value, label: `${value}${aaSlugDetail(value)}` }))),
    ]),
    el("p", { className: "note-text" },
      suggestions.length
        ? "Renaming is what makes AA read this model without a mapping. Keeping the "
          + "name instead is the Queue tab's job: it asks which slug this model is."
        : "No slug looks like this name. If AA does track the model under an "
          + "unrelated slug, map it from the Queue tab rather than renaming."),
  );
  return block;
}

function setRename(model, renameKey, slug) {
  /* One record per model per run: the batch applies in order and rolls back
     together, so an edit sent alongside a rename would be looking for a name
     that is no longer there. The edit loses, because the rename is the thing
     just clicked. */
  state.answers.delete(`model-edit  ${model.name}`);
  state.answers.set(renameKey, { kind: "model-rename", name: model.name, new_name: slug });
  render();
}

const runLabel = (run) => (run.status === "completed"
  ? (run.conclusion || "done")
  : run.status.replace(/_/g, " "));

function renderRuns() {
  if (!state.runs.length) return el("p", { className: "empty" }, "No runs to show.");
  return el("ul", { className: "runs" }, state.runs.map((run) => {
    const shade = run.status !== "completed" ? "running" : (run.conclusion || "");
    const when = new Date(run.created_at);
    return el("li", {}, [
      el("span", { className: `pill ${shade}` }, [el("span", { className: "dot" }), runLabel(run)]),
      el("a", { href: run.url, target: "_blank", rel: "noreferrer" }, run.name || String(run.id)),
      el("time", { dateTime: run.created_at }, when.toLocaleString()),
    ]);
  }));
}

/* ---------------------------------------------------------------- sending */

async function send() {
  const answers = [...state.answers.values()];
  const keys = [...state.answers.keys()];
  document.getElementById("send").disabled = true;
  state.error = state.warn = state.ok = "";
  try {
    const response = await fetch("api.php", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AI-Bench-Admin": "1" },
      body: JSON.stringify({ answers, skip_refresh: document.getElementById("skip").checked }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    state.answers.clear();
    /* Before the run list is refreshed, so nothing can settle the batch before
       it is even recorded. */
    /* `queued` is read off the queue as it stands now, because settling cannot:
       it happens inside the run list read, which on a fresh page runs before
       the queue has been read at all. */
    writeSent({ at: Date.now(), keys, queued: queueKeys(keys) });
    state.ok = `Dispatched ${body.dispatched} answer(s). The run applies and pushes them. `
      + "Watch it under Runs; the questions it answers are disabled until it "
      + "finishes, and its own summary is what counts, not its colour, since a "
      + "dead scraper reds a run whose answers landed perfectly well.";
  } catch (error) {
    state.error = `Could not send: ${error.message}`;
  }
  await loadRuns();
  render();
}

applyTheme(readTheme());
/* Before the first read, so a reload mid-run renders the cards it answers as
   locked rather than offering them again for one paint. */
state.sent = readSent();
state.applied = readApplied();
document.getElementById("theme").onclick = cycleTheme;
document.getElementById("send").onclick = send;
document.getElementById("clear").onclick = () => { state.answers.clear(); render(); };
load();
</script>
</body>
</html>
