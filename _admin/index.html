/* Models nothing offered. check_new.py finds the ones Artificial Analysis
   publishes; this is the other direction -- a release AA does not track, or
   does not track yet -- so there is no question to answer and no slug to
   accept. add.py builds each entry from what is typed here, filling anything
   left blank from AA if it happens to know the name.

   One card per model, as many as a sitting needs: a family released together
   is one batch, and one run adds them all. Each card owns one record in the
   batch, remembered as the draft's `key`, so editing one never disturbs
   another's. */
const MODEL_CREATE_KEY = (name) => `model-create  ${name}`;

/* What is already on its way, from the batch that was sent rather than from
   the cards: a card is gone once sent, so a reload shows the same thing. */
const flyingCreates = () => (locked()
  ? state.sent.keys.filter((key) => key.startsWith("model-create  "))
    .map((key) => key.slice("model-create  ".length))
  : []);

function renderAddModels() {
  /* The cards opened from a Queue question live on that question's card. */
  const standalone = () => state.newModels.filter((d) => !d.question);
  if (!standalone().length) state.newModels.push({ id: draftId(), name: "", fields: {}, key: "", question: "" });
  const box = el("div", { className: "stack" });

  const flying = flyingCreates();
  if (flying.length) {
    const card = el("div", { className: "card" }, [
      el("div", { className: "subject" }, flying.length === 1 ? "Being added" : `Being added (${flying.length})`),
      el("div", { className: "queued" }, flying.map((name) =>
        el("div", { className: "queued-row sent" }, el("span", {}, name)))),
    ]);
    box.append(lockCard(card));
  }

  standalone().forEach((draft, index) => box.append(renderAddModel(draft, index, flying)));

  const another = el("button", { className: "btn ghost", type: "button" }, "+ Add another model");
  another.onclick = () => {
    state.newModels.push({ id: draftId(), name: "", fields: {}, key: "", question: "" });
    render();
    /* The new card is the last; put its name box under the thumb. */
    const inputs = document.querySelectorAll("#view .add-model input");
    inputs[inputs.length - 1]?.focus();
  };
  box.append(el("div", {}, another));
  return box;
}

/* `question` is set when the form is opened from a Queue card: it then also
   writes that question's mapping onto the model it adds, and `onCommit` tells
   the card whether the pair is in the batch. */
function renderAddModel(draft, index, flying, { question = null, onCommit = null } = {}) {
  const card = el("div", { className: `card add-model${question ? " nested" : ""}` });
  const known = new Set((state.llm?.models || []).map((m) => m.name));

  const discard = el("button", { className: "btn ghost tiny", type: "button" },
    question ? "Cancel" : "Discard");
  discard.onclick = () => {
    if (question) {
      dropCreate(question);
    } else {
      if (draft.key) state.answers.delete(draft.key);
      state.newModels = state.newModels.filter((d) => d !== draft);
    }
    render();
  };
  const hasContent = draft.name.trim() || Object.keys(draft.fields).length;
  card.append(el("div", { className: "card-head" }, [
    el("div", { className: "subject" },
      question ? "Add it as a new model" : index === 0 ? "Add a model" : "Add another model"),
    question || state.newModels.filter((d) => !d.question).length > 1 || hasContent ? discard : null,
  ]));

  const status = el("div", { className: "chips" });
  const tip = el("p", { className: "tip-text", hidden: true });
  /* Only for an Artificial Analysis slug, and only off the Queue: a closed
     model is carried as a reference model, which is AA's slug by definition. */
  const carryBox = el("input", { type: "checkbox", checked: draft.as === "reference" });
  const carry = el("label", { className: "check", hidden: true }, [carryBox,
    " carry it as a reference model (closed weights) rather than an open-weight one"]);
  carryBox.onchange = () => { draft.as = carryBox.checked ? "reference" : "open"; commit(); };
  /* Assigned below, once built; commit() only runs after that. */
  let more = null;
  const commit = () => {
    if (draft.key) state.answers.delete(draft.key);
    draft.key = "";
    const name = draft.name.trim();
    const shaped = SLUG_RE.test(name);
    const taken = known.has(name);
    const broken = META_FIELDS.some(([f, type]) => type === "url" && badUrl(draft.fields[f]));
    /* Typed back in after being sent: the run is creating it, and a second
       record would have add.py refuse the whole batch for a duplicate name. */
    const inFlight = flying.includes(name);
    /* The same name on two cards is one entry twice, which answer.py refuses --
       and so is one the Queue is already adding from AA's offer. */
    const twice = state.newModels.some((d) => d !== draft && d.name.trim() === name)
      || batchCreated().includes(name);
    /* A release Artificial Analysis offers on the Queue is answered there: its
       card is where the open/reference/ignore choice and the board names that
       list it are, and a create here beside an answer there would be the same
       entry twice. */
    const offered = !twice && Boolean(newQuestionFor(name));
    const aaSlug = Boolean(state.aa.slugs?.includes(name));
    const asReference = !question && aaSlug && draft.as === "reference";
    carry.hidden = question !== null || !aaSlug || !shaped || taken;
    carryBox.checked = asReference;
    if (more) more.hidden = asReference;

    status.replaceChildren(...(!name ? [] : [
      !shaped
        ? chip("", "not a slug: lowercase words joined by single dots or dashes",
          { prose: true, className: "now" })
        : taken
          ? chip("", question ? "already tracked -- pick it in the search box below"
            : "already tracked -- it is in the list below", { prose: true, className: "now" })
          : offered
            ? el("span", { className: "chip now" }, [
              el("span", { className: "prose" }, question
                ? "a new release Artificial Analysis offers -- close this and pick it among the answers above, or in the search box below"
                : "a new release Artificial Analysis offers -- answer it on the Queue, with the board names that list it"),
              question ? null : el("button", {
                type: "button", className: "btn ghost tiny",
                onclick: () => { state.queueFilter.text = name; showTab("queue"); },
              }, "Open it"),
            ])
          : inFlight
            ? chip("", "already sent -- the run is creating it", { prose: true, className: "now" })
            : twice
              ? chip("", question
                ? "already being added in this batch -- close this and pick it in the search box below"
                : "already being added in this batch (another card, the Queue or the Reference tab) -- one entry per name",
                { prose: true, className: "now" })
              : state.aa.slugs === null
                ? chip("", "adding it as a new entry", { prose: true })
                : state.aa.slugs.includes(name)
                  ? chip("", `an Artificial Analysis slug${aaSlugDetail(name)}: `
                    + (asReference ? "carried as a reference model; " : "")
                    + "its scores arrive on the next refresh", { prose: true })
                  : chip("", "not an AA slug: AA scores will need a mapping or a rename later",
                    { prose: true }),
    ]));

    const ok = shaped && !taken && (asReference || !broken) && !inFlight && !twice && !offered;
    if (ok) {
      const fields = Object.fromEntries(
        Object.entries(draft.fields).filter(([, value]) => value !== null)
      );
      draft.key = MODEL_CREATE_KEY(name);
      /* A reference model is the slug on reference-models.json plus the entry
         behind it, filled from AA; nothing typed here goes with it. */
      state.answers.set(draft.key, asReference
        ? { kind: "reference-add", name }
        : { kind: "model-create", name, fields });
    }
    if (question) {
      /* The pair goes in together or not at all: a mapping onto a name that is
         not being created would be refused, and take the batch with it. */
      if (ok) state.answers.set(KEY(question), mappingRecord(question, name));
      else state.answers.delete(KEY(question));
      onCommit?.(ok);
    }
    card.classList.toggle("answered", ok && !question);
    if (question) {
      tip.hidden = !ok;
      tip.textContent = `Two records: adds ${name}, then maps ${question.subject} to it. `
        + "Full scores it in this run; Quick asks every other board about it first.";
    } else {
      tip.hidden = !ok || state.mode === "quick" || !state.quickOffered;
      tip.textContent = "Tip: send with Quick and the run asks every board about this "
        + "model in a couple of minutes, so its mappings can be answered in this sitting.";
    }
    refreshFooter();
  };

  const nameInput = slugInput({ placeholder: "acme-model-1", value: draft.name });
  nameInput.oninput = () => {
    draft.name = nameInput.value;
    nameInput.classList.toggle("unknown",
      Boolean(draft.name.trim()) && !SLUG_RE.test(draft.name.trim()));
    commit();
  };
  /* The AA slugs the site does not carry yet: the names most likely to be
     wanted here, and the ones whose scores arrive without a mapping. Picking
     one also fills the creator, when AA names it and nothing is typed. */
  /* And the Hub's repos for what is typed, after them: "ling 3.2 air" lists
     inclusionAI/Ling-3.2-Air, and picking it writes the slug it reads as
     (ling-3-2-air), the repo as the model's url and, when the org names one
     creator the site knows, the creator. Searched the way the url field
     searches (hfSearch: originals first, quants and fine-tunes after), only
     while what is typed is not a URL. */
  let hubIds = [];
  let hubTimer = 0;
  let hubController = null;
  const offered = () => [
    ...(state.aa.slugs || []).filter((slug) => !known.has(slug)),
    ...hubIds,
  ];
  const isRepo = (value) => value.includes("/");
  /* Dots read as dashes, the way Artificial Analysis spells its slugs, so a
     model added from its repo is the name AA will publish scores under. */
  const repoSlug = (id) => normSlug(id.split("/").pop());
  const nameBox = comboBox(nameInput, offered, {
    min: 2,
    max: 16,
    match: (value, needle) => (isRepo(value)
      ? hfMatch(value, needle) || normSlug(value).includes(normSlug(needle))
      : value.includes(needle) || value.includes(normSlug(needle))),
    detail: (value) => (isRepo(value)
      ? `${known.has(repoSlug(value)) ? "already tracked · " : ""}Hugging Face${hfDetail(value).replace(/^ /, " · ")}`
      : `AA${aaSlugDetail(value)}`),
    toValue: (value) => (isRepo(value) ? repoSlug(value) : value),
    onPick: (value) => {
      const fill = (field, text) => {
        if (!text || !inputs[field] || draft.fields[field]) return;
        inputs[field].value = text;
        inputs[field].oninput();
      };
      if (isRepo(value)) {
        /* The repo is the url; the creator only when its org reads as exactly
           one creator llm.json knows, the same guess a Queue card makes. */
        if (inputs.url) {
          inputs.url.value = HF_BASE + value;
          inputs.url.oninput();
        }
        fill("creator", guessCreator(value));
        if (more) more.open = true;
        urlPicker?.draw();
      } else {
        fill("creator", state.aa.models?.get(value)?.creator);
      }
      lookUp();
    },
  });
  nameInput.placeholder = "acme-model-1, or a name to search AA and Hugging Face";
  nameInput.addEventListener("input", () => {
    const query = nameInput.value.trim();
    clearTimeout(hubTimer);
    hubController?.abort();
    if (query.length < 2 || looksLikeUrl(query)) { hubIds = []; return; }
    hubTimer = setTimeout(async () => {
      hubController = new AbortController();
      try {
        /* A slug typed as such, "ling-3-2-air", is not how the repo is
           spelled: asked again with "3-2" read as "3.2" when it finds nothing. */
        let ranked = await hfSearch(query, hubController.signal);
        const dotted = query.replace(/(\d)-(?=\d)/g, "$1.");
        if (!ranked.length && dotted !== query) ranked = await hfSearch(dotted, hubController.signal);
        if (nameInput.value.trim() !== query) return;
        hubIds = ranked.slice(0, 12);
        nameBox.redraw();
      } catch { /* offline, rate-limited, aborted: AA's slugs are still offered */ }
    }, 250);
  });
  /* The url picker asks the Hub about the name a moment after typing stops,
     and again when the field is left changed. */
  let lookTimer = 0;
  let looked = draft.name.trim();
  const lookUp = () => {
    clearTimeout(lookTimer);
    const name = draft.name.trim();
    if (name === looked) return;
    looked = name;
    urlPicker?.refresh();
  };
  nameInput.addEventListener("input", () => {
    clearTimeout(lookTimer);
    lookTimer = setTimeout(lookUp, 700);
  });
  nameInput.addEventListener("change", lookUp);
  card.append(el("div", { className: "field" }, [el("label", {}, "name"), nameBox]), status, carry);

  /* Held so the creator field can reach the creator url field below it: the
     handler runs long after the loop, by which time both are in here. */
  const inputs = {};
  let urlPicker = null;
  const fillCreatorUrl = creatorUrlFiller(inputs, "");
  /* Only the name is needed; the rest folds away on a phone, where six empty
     fields per card is a lot of scrolling for what add.py fills from AA. */
  more = el("details", { open: Object.keys(draft.fields).length > 0 });
  more.append(el("summary", { className: "note-text", style: "cursor:pointer" },
    "Details (optional): params, context, url, creator"));
  for (const [field, type, placeholder] of META_FIELDS) {
    if (field === "date_added") continue;   // add.py stamps the day it runs
    const input = el("input", { type, placeholder, value: draft.fields[field] ?? "" });
    if (type === "url") { input.inputMode = "url"; noAuto(input); }
    inputs[field] = input;
    input.oninput = () => {
      const value = input.value.trim();
      if (value === "") delete draft.fields[field];
      else draft.fields[field] = value;
      if (type === "url") input.classList.toggle("unknown", badUrl(value));
      if (field === "creator") fillCreatorUrl(value);
      commit();
    };
    if (field === "url") {
      urlPicker = hfUrlPicker(input, {
        fixed: () => [["", "leave it blank: filled from Artificial Analysis when it knows the name"]],
        search: modelUrlSearch(() => draft.name, () => draft.fields.creator_url),
      });
    }
    more.append(el("div", { className: "field" },
      [el("label", {}, field.replace(/_/g, " ")), ...fieldControl(field, input, field === "url" ? urlPicker : null)]));
  }
  urlPicker?.refresh();
  more.append(el("p", { className: "note-text" },
    "Anything left blank is filled from Artificial Analysis when it knows the "
    + "name, and stays empty when it does not. Scores land on the next refresh; "
    + "type them in on the Models tab if they are not coming from anywhere."));
  card.append(more, tip);

  commit();
  return card;
}

/* ── New on Artificial Analysis ──
   check_new.py's questions: a release AA lists that llm.json does not carry.
   They sit at the top of the Queue rather than on a tab of their own, because
   the usual reason to add one is that a board already lists it -- and that
   board's name is a question on this same tab. Each card offers the three
   answers whatever AA's verdict on the weights (AA says closed until the
   weights are on Hugging Face, and a closed model may still be wanted as an
   open row for its first days, or an open one as a yardstick), with AA's own
   verdict outlined as the suggestion. Under the answers are the queued board
   names that look like the release: ticking one maps it onto the model in the
   same batch, which answer.py accepts because the add runs first. */
const newQuestions = () => state.questions.filter((q) => q.route === NEW_MODEL_ROUTE);
const newQuestionFor = (slug) => newQuestions().find((q) => q.subject === slug);
const isAdding = (record) => record?.kind === "model-add" || record?.kind === "reference-add";
const ignoreRecord = (question) => ({ kind: "new-model", subject: question.subject, answer: "__ignored__" });
/* "Add as open model": a plain model-add, or the explicit override answer.py
   asks for when AA called the release closed. */
const openAddRecord = (question) => (isClosedNew(question)
  ? openRecord(question) : { kind: "model-add", name: question.subject });
/* What AA's verdict suggests: open releases as open rows, closed ones carried
   for reference. */
const suggestedAdd = (question) => (isClosedNew(question)
  ? referenceRecord(question) : openAddRecord(question));

/* Whether a board's name reads as a release's slug, and how, or null. Only
   used to offer the pairing -- the mapping is checked on the runner against
   the batch's own adds either way. "inclusionai/Ling-3.2-Air" is the same name
   as ling-3-2-air; "Ling 3.2 Air (thinking)" is that name with more to it. */
const nameTokens = (value) => normSlug(value).split("-").filter(Boolean);
function nameLikeness(subject, slug) {
  const last = String(subject).split("/").pop();
  const squash = (value) => normSlug(value).replace(/-/g, "");
  const target = squash(slug);
  if (!target) return null;
  if (squash(last) === target || squash(subject) === target) return "the same name";
  const within = (short, long) => short.length >= 2
    && long.some((_, i) => short.every((token, j) => long[i + j] === token));
  const name = nameTokens(last);
  const wanted = nameTokens(slug);
  if (within(wanted, name)) return "this name with more to it";
  if (within(name, wanted)) return "a shorter form of this name";
  return null;
}

/* The queued board names that look like a new release. */
const mappingQuestionsLike = (slug) => state.questions
  .filter((q) => q.universe === "models" && q.route !== NEW_MODEL_ROUTE)
  .map((q) => [q, nameLikeness(q.subject, slug)])
  .filter(([, why]) => why);

/* The new releases still open to answer: one already sent or applied is the
   run's now, and mapping onto it would lean on an add this batch does not
   carry. */
const openNewSlugs = () => newQuestions()
  .filter((q) => !isSent(KEY(q)) && !isApplied(KEY(q)))
  .map((q) => q.subject);

/* Mapping onto a new release means adding it: answer its question with the
   suggested add unless the batch already adds it one way or the other. */
function ensureAdded(slug) {
  const question = newQuestionFor(slug);
  if (!question || isAdding(answerOf(question))) return;
  state.answers.set(KEY(question), suggestedAdd(question));
}

/* A release's add taken back: the board names mapped onto it go too, since
   answer.py would refuse them and the whole batch with them. */
function dropMappingsOnto(slug) {
  for (const question of state.questions) {
    if (question.universe !== "models" || question.route === NEW_MODEL_ROUTE) continue;
    const record = answerOf(question);
    if (record?.kind === "mapping" && record.answer === slug) state.answers.delete(KEY(question));
  }
}

function answerNew(question, record) {
  if (record === null) state.answers.delete(KEY(question));
  else state.answers.set(KEY(question), record);
  if (!isAdding(record)) dropMappingsOnto(question.subject);
  render();
}

function renderNewReleases(offered) {
  const box = el("div", { className: "stack" });
  const needle = state.queueFilter.text.trim().toLowerCase();
  const shown = needle ? offered.filter((q) => q.subject.toLowerCase().includes(needle)) : offered;
  box.append(el("h2", { className: "section-title" },
    `New on Artificial Analysis (${offered.length})`));
  box.append(renderNewBulk(offered));
  box.append(...(shown.length ? shown.map(renderNewQuestion)
    : [el("p", { className: "empty" }, "No new release matches the filter below.")]));
  return box;
}

/* Every offered release answered the same way in one tap -- a release week can
   put a dozen here. "Add all" follows AA's verdict: open releases as open
   rows, closed ones carried for reference. Only the cards still open: one
   already sent or answered elsewhere stays as it is. */
function renderNewBulk(questions) {
  const open = questions.filter((q) => !isSent(KEY(q)) && !isApplied(KEY(q)));
  const all = (record) => {
    for (const question of open) {
      const chosen = record(question);
      if (chosen === null) state.answers.delete(KEY(question));
      else state.answers.set(KEY(question), chosen);
      if (!isAdding(chosen)) dropMappingsOnto(question.subject);
    }
    render();
  };
  const closed = questions.filter(isClosedNew).length;
  return el("div", { className: "toolbar" }, [
    el("span", { className: "count grow" }, closed
      ? `${questions.length - closed} open, ${closed} closed`
      : `${questions.length} open-weight`),
    el("button", {
      type: "button", className: "btn ghost tiny", disabled: !open.length,
      title: "Open releases as open models, closed ones as reference models",
      onclick: () => all(suggestedAdd),
    }, `Add all ${open.length}`),
    el("button", {
      type: "button", className: "btn ghost tiny", disabled: !open.length,
      onclick: () => all(ignoreRecord),
    }, "Ignore all"),
    el("button", {
      type: "button", className: "btn ghost tiny",
      disabled: !open.some((q) => answerOf(q)),
      onclick: () => all(() => null),
    }, "Reset"),
  ]);
}

function renderNewQuestion(question) {
  const chosen = answerOf(question);
  const closed = isClosedNew(question);
  const card = el("div", { className: `card${chosen ? " answered" : ""}` });
  card.append(cardHead(question));
  const chips = el("div", { className: "chips" }, [
    chip("source", "new on Artificial Analysis", { prose: true }),
    chip("weights", closed ? "closed" : "open"),
  ]);
  if (question.note) chips.append(chip("", question.note, { prose: true }));
  card.append(chips);

  /* "Add" is a model-add, not an __added__ decision. apply_decisions() keeps
     __added__ only for an entry already in llm.json; for a new slug it clears
     the line without dismissing it, so the model is offered again on every
     run after this one. */
  const asOpen = chosen?.kind === "model-add";
  const asReference = chosen?.kind === "reference-add";
  const ignoring = chosen?.kind === "new-model";
  const openOption = option("Add as open model", closed
    ? "AA calls it closed, but its weights are coming: add it like any open release"
    : "adds the entry; scores land on the next refresh", {
    pressed: asOpen,
    className: closed ? "" : "exact",
    onclick: () => answerNew(question, asOpen ? null : openAddRecord(question)),
  });
  const referenceOption = option("Add as reference", closed
    ? "carries it beside the open models; scores land on the next refresh"
    : "a closed yardstick rather than an open-weight row: put on the reference list", {
    pressed: asReference,
    className: closed ? "exact" : "",
    onclick: () => answerNew(question, asReference ? null : referenceRecord(question)),
  });
  card.append(el("div", { className: "options" }, [
    ...(closed ? [referenceOption, openOption] : [openOption, referenceOption]),
    option("Ignore it", "never offer this slug again", {
      pressed: ignoring,
      className: "decline",
      onclick: () => answerNew(question, ignoring ? null : ignoreRecord(question)),
    }),
  ]));

  /* The double step: board names in the queue that read as this release,
     mapped onto it in the same batch. Ticking one answers that name's card
     too; ticking one before an add is chosen picks the suggested add. */
  const alike = mappingQuestionsLike(question.subject);
  if (alike.length) {
    const adding = isAdding(chosen);
    const along = el("div", { className: "map-along" }, el("div", { className: "note-text" },
      adding
        ? `Map these queued names onto ${question.subject} in the same batch:`
        : `Queued names that look like it -- ticking one adds it (${closed ? "as reference" : "as an open model"}) and maps the name, in one batch:`));
    for (const [other, why] of alike) {
      const key = KEY(other);
      const current = answerOf(other);
      const on = current?.kind === "mapping" && current.answer === question.subject;
      const locked = isSent(key) || isApplied(key);
      const box = el("input", { type: "checkbox", checked: on, disabled: locked || ignoring });
      box.onchange = () => {
        if (box.checked) {
          ensureAdded(question.subject);
          dropCreate(other);
          state.answers.set(key, mappingRecord(other, question.subject));
        } else {
          state.answers.delete(key);
        }
        render();
      };
      const elsewhere = current && !on
        ? ` -- answered ${current.answer ? `"${current.answer}"` : "otherwise"} on its card; ticking replaces that`
        : "";
      along.append(el("label", { className: "check" }, [
        box,
        el("span", {}, [
          el("b", {}, sourceOf(other)), " ",
          el("span", { className: "mono" }, other.subject),
          el("span", { className: "why" }, ` -- ${why}${locked ? ", already sent" : ""}${elsewhere}`),
        ]),
      ]));
    }
    card.append(along);
  }
  return guard(card, KEY(question));
}

/* ── Reference models ──
   The closed frontier models the index carries as a yardstick for the open
   field (reference-models.json). The list is Artificial Analysis slugs, which
   is what makes them resolvable: the llm.json entry is named after the slug,
   so every source's mapping lands on it without one being written.

   Three things can be done to a row, and they are three different records.
   Adding one carries the slug *and* creates the entry behind it; removing one
   drops both, because an entry left behind is a closed model the table shows
   as an open-weight one; renaming one is the ordinary model-rename the Models
   tab sends, which moves the name through every mapping file and the list with
   it -- and keeps the scores, which remove-then-add would not. */

const REFERENCE_ADD_KEY = (slug) => `reference-add  ${slug}`;
const REFERENCE_REMOVE_KEY = (slug) => `reference-remove  ${slug}`;

const answerKeys = (prefix) => [...state.answers.keys()].filter((key) => key.startsWith(prefix));

/* How many reference models this batch would leave behind. The floor is
   answer.py's (at least one), applied here as well so the last Remove is
   simply not offered rather than taking a whole sitting down with it. */
const referenceRemaining = () => (state.reference.slugs?.length || 0)
  - answerKeys("reference-remove  ").length
  + answerKeys("reference-add  ").length;

/* ------------------------------------------------------------- previews */

/* A preview entry whose model has been released: hy4-preview once Tencent
   ships Hy4. The release's boards get mapped onto the preview entry, which
   keeps its scores -- but whether a release's number then replaces a
   preview's is decided by each source's rung in _precedence.py, not by which
   is newer, so the entry is left half-cleaned until somebody sorts it out by
   hand. _preview_cleanup.py finds these and publishes _pending/previews.json;
   this tab turns each case into one `preview-cleanup` record carrying every
   decision: rename, URL, each score, each mapping. Or checks it off. */

const PREVIEW_KEY = (name) => `preview-cleanup  ${name}`;

/* The working copy of each card's decisions, by model name. Not the record:
   a card is a page of choices, and only "Clean up" puts one in the batch.
   Once it is in, every change rewrites the record. */
const previewWork = new Map();

const ERA_LABELS = {
  preview: ["preview", "now"],
  either: ["preview or release", "now"],
  release: ["release", ""],
  unknown: ["unclear", ""],
};

function previewDefaults(c, { fresh = false } = {}) {
  const sent = fresh ? null : state.answers.get(PREVIEW_KEY(c.name));
  if (sent?.action === "apply") {
    return {
      rename: sent.rename ?? null,
      renameCustom: sent.rename && !(c.renames || []).some((r) => r.name === sent.rename) ? sent.rename : "",
      url: sent.fields?.url ?? c.url ?? "",
      urlTyped: !c.url || !previewUrlOffered(c, sent.fields?.url ?? c.url ?? ""),
      urlAuto: false,
      scores: Object.fromEntries(Object.entries(sent.scores || {})
        .map(([key, d]) => [key, { do: d.do, url: d.url || "" }])),
      parks: new Set((sent.park || []).map((p) => `${p.route}\t${p.route_kind || "*"}\t${p.subject}`)),
    };
  }
  const free = (c.renames || []).find((r) => !r.taken);
  return {
    rename: free ? free.name : null,
    renameCustom: "",
    url: c.url || "",
    urlTyped: !c.url,
    /* The URL without its preview word is only a guess: the card keeps the URL
       it has and moves to that one only once the Hub says the repo is there. */
    urlAuto: Boolean(c.new_url),
    scores: Object.fromEntries((c.scores || []).filter((s) => s.suggest !== "keep")
      .map((s) => [s.key, { do: s.suggest, url: s.recredit_to || "" }])),
    parks: new Set((c.mappings || []).filter((m) => m.suggest === "park")
      .map((m) => `${m.route}\t${m.route_kind}\t${m.subject}`)),
  };
}

/* The URLs the card offers as one tap each, before any lookup: the one it has
   now, the same without its preview word, and any repo of the same owner on
   Hugging Face. Anything else was typed. */
const previewUrlOffered = (c, url) => {
  const value = String(url || "").trim();
  if (!value || value === (c.url || "") || value === (c.new_url || "")) return true;
  const owner = hfRepoOf(c.url)?.[1];
  return Boolean(owner) && hfRepoOf(value)?.[1].toLowerCase() === owner.toLowerCase();
};

/* The names a released repo might go by, to search the owner's repos with: the
   slugs the card would rename to, the name and the repo, each without its
   preview word. "tencent" and "hy4" -> tencent/Hy4, tencent/Hy4-Instruct... */
const PREVIEW_WORD = /(^|[-_.\s])prev(?:i(?:ew?)?)?(?=$|[-_.\s])/gi;
const unpreview = (text) => String(text || "").replace(PREVIEW_WORD, "").replace(/^[-_.\s]+|[-_.\s]+$/g, "");
const previewTerms = (c) => {
  const terms = new Map();
  const add = (text) => {
    const term = unpreview(text);
    if (term.length >= 2 && !terms.has(term.toLowerCase())) terms.set(term.toLowerCase(), term);
  };
  for (const r of c.renames || []) add(r.name);
  add(c.name);
  add(hfRepoOf(c.url)?.[2]);
  return [...terms.values()];
};

/* The owner's repos that match one of those names, originals first. Searched
   as "owner/name", which the Hub matches against the whole repo id. */
async function previewUrlCandidates(c) {
  const repo = hfRepoOf(c.url);
  if (!repo) return [];
  const owner = repo[1].toLowerCase();
  const now = `${repo[1]}/${repo[2]}`.toLowerCase();
  const found = [];
  let answered = false;
  for (const term of previewTerms(c)) {
    let ids = [];
    try { ids = await hfSearch(`${repo[1]}/${term}`); } catch { continue; }
    answered = true;
    for (const id of ids) {
      const lower = id.toLowerCase();
      if (!lower.startsWith(`${owner}/`) || lower === now || HF_DERIVATIVE.test(id)) continue;
      if (!found.some((f) => f.toLowerCase() === lower)) found.push(id);
    }
  }
  return answered ? found.slice(0, 8) : null;
}

const workFor = (c) => {
  if (!previewWork.has(c.name)) previewWork.set(c.name, previewDefaults(c));
  return previewWork.get(c.name);
};

/* The page a re-credited score points at. A score credited to the model's own
   card follows the URL field, so changing the URL above moves those too --
   unless one was typed by hand. */
const recreditUrl = (c, row, work) => {
  const typed = work.scores[row.key]?.url;
  if (row.follows_url && (!typed || typed === (row.recredit_to || ""))) return work.url;
  return typed ?? row.recredit_to ?? "";
};

/* What would be sent, and whether it can be: [record, problem]. */
function previewRecord(c, work) {
  const names = new Set(models());
  const rename = work.rename === "__custom__" ? work.renameCustom.trim() : work.rename;
  if (rename) {
    if (!SLUG_RE.test(rename)) return [null, `${rename} is not a slug`];
    if (rename !== c.name && names.has(rename)) return [null, `${rename} is already a model`];
  }
  const record = { kind: "preview-cleanup", name: c.name, action: "apply" };
  if (rename && rename !== c.name) record.rename = rename;
  const url = String(work.url || "").trim();
  if (url && url !== (c.url || "")) {
    if (badUrl(url)) return [null, "the url is not one"];
    record.fields = { url };
  }
  const scores = {};
  for (const row of c.scores || []) {
    const decision = work.scores[row.key];
    if (!decision || decision.do === "keep") continue;
    if (decision.do === "clear") scores[row.key] = { do: "clear", was: row.value };
    else {
      const target = recreditUrl(c, row, work).trim();
      if (!/^https?:\/\/\S+$/i.test(target)) return [null, `re-credit ${row.key}: name the release's page`];
      if (target === row.source) return [null, `${row.key} is already credited to ${target}`];
      scores[row.key] = { do: "recredit", url: target, was: row.value };
    }
  }
  if (Object.keys(scores).length) record.scores = scores;
  const park = [...work.parks].map((k) => {
    const [route, route_kind, subject] = k.split("\t");
    return { route, route_kind, subject };
  });
  if (park.length) record.park = park;
  if (!record.rename && !record.fields && !record.scores && !record.park) {
    return [null, "nothing chosen: pick something to change, or check the case off"];
  }
  return [record, ""];
}

/* Keeps the record in step with the card while it is in the batch. */
function syncPreview(c) {
  const key = PREVIEW_KEY(c.name);
  const current = state.answers.get(key);
  if (current?.action !== "apply") return;
  const [record] = previewRecord(c, workFor(c));
  if (record) state.answers.set(key, record);
  else state.answers.delete(key);
}

/* The Cleanup tab: maintenance the pipeline cannot finish on its own, one
   section per kind. Released previews is the first. */
function renderCleanup() {
  const box = el("div", { className: "stack" });
  box.append(el("h2", { className: "section-title" }, "Released previews"), renderPreviews());
  return box;
}

function renderPreviews() {
  const report = state.previews;
  const box = el("div", { className: "stack" });
  if (report.cases === null) {
    box.append(el("p", { className: "empty" }, !report.error
      ? "The preview report has not been read yet."
      : report.error.includes("404")
        ? "No preview report yet. It appears after the next run publishes _pending/previews.json."
        : `Could not read the preview report (${report.error}).`));
    return box;
  }
  box.append(el("p", { className: "note-text" },
    "Preview entries whose model looks released. Each card is every decision a cleanup "
    + "needs: the name, the URL, what happens to each score the preview left behind, and "
    + "which preview mappings to park so only the release is read. One record per model, "
    + "applied all at once. A case that is not a release, or was cleaned up by hand, can be "
    + "checked off; it is not listed again."));

  const released = report.cases.filter((c) => c.evidence?.length);
  const quiet = report.cases.filter((c) => !c.evidence?.length);
  if (!released.length) {
    box.append(el("p", { className: "empty" }, "No preview entry shows a sign of a release."));
  }
  box.append(...released.map(renderPreviewCard));
  if (quiet.length) {
    const more = el("details", { className: "q-context" },
      el("summary", {}, `${quiet.length} preview entr${quiet.length === 1 ? "y" : "ies"} with no sign of a release yet`));
    more.append(el("div", { className: "stack" }, quiet.map(renderPreviewCard)));
    more.open = quiet.some((c) => state.answers.has(PREVIEW_KEY(c.name)) || state.previewOpen.has(c.name));
    box.append(more);
  }
  if (report.done?.length) box.append(renderPreviewDone(report.done));
  return box;
}

function renderPreviewCard(c) {
  const key = PREVIEW_KEY(c.name);
  const record = state.answers.get(key);
  const card = el("details", { className: `card model-card${record ? " answered" : ""}` });
  const previewScores = (c.scores || []).filter((s) => s.era === "preview" || s.era === "either");
  const parks = (c.mappings || []).filter((m) => m.preview);
  card.append(el("summary", {}, [
    el("span", { className: "subject" }, c.name),
    el("div", { className: "chips" }, [
      c.creator ? chip("", c.creator, { prose: true }) : null,
      c.released ? chip("released", c.released, { className: "now" })
        : c.evidence?.length ? chip("", "looks released", { prose: true, className: "now" })
          : chip("", c.watch ? "its release repo is not out yet" : "no sign of a release", { prose: true }),
      c.watch ? chip("waits for", "a Hugging Face repo", { prose: true }) : null,
      state.answers.has(WATCH_KEY(c.name)) ? chip("", "release rule changes on the next run", { prose: true, className: "now" }) : null,
      chip("preview scores", `${previewScores.length} / ${(c.scores || []).length}`),
      parks.length ? chip("preview mappings", String(parks.length)) : null,
      c.queue?.length ? chip("queued", String(c.queue.length)) : null,
      record?.action === "dismiss" ? chip("", "checked off on the next run", { prose: true, className: "now" })
        : record ? chip("", "cleaned up on the next run", { prose: true, className: "now" }) : null,
    ]),
  ]));
  let built = false;
  const build = () => {
    if (built) return;
    built = true;
    fillPreviewCard(card, c);
  };
  card.open = state.previewOpen.has(c.name) || Boolean(record);
  card.ontoggle = () => {
    if (card.open) { state.previewOpen.add(c.name); build(); }
    else state.previewOpen.delete(c.name);
  };
  const locked = isSent(key) || isApplied(key);
  if (card.open || locked) build();
  return guard(card, key);
}

function fillPreviewCard(card, c) {
  const key = PREVIEW_KEY(c.name);
  const work = workFor(c);
  const record = state.answers.get(key);
  const dismissing = record?.action === "dismiss";

  if (c.evidence?.length) {
    card.append(el("div", { className: "q-context" }, [
      el("h4", {}, "Why it looks released"),
      el("ul", {}, c.evidence.map((e) => el("li", {}, e.url
        ? el("a", { href: e.url, target: "_blank", rel: "noopener noreferrer" }, e.text)
        : el("span", {}, e.text)))),
    ]));
  }
  if (c.hints?.length) {
    card.append(el("div", { className: "q-context" }, [
      el("h4", {}, c.watch ? "Other signs -- not counted under the release rule" : "Not counted"),
      el("ul", {}, c.hints.map((e) => el("li", {}, el("span", { style: "color:var(--muted)" }, e.text)))),
    ]));
  }

  if (dismissing) {
    card.append(
      el("p", { className: "note-text" },
        `${c.name} is checked off on the next run: nothing in llm.json or a mapping file changes, `
        + "and the case is not listed again. Bring it back from the list at the foot of this tab."),
      el("div", { className: "options" }, option("Keep it listed", "take the check-off out of the batch", {
        pressed: false, onclick: () => { state.answers.delete(key); render(); },
      })),
    );
    return;
  }

  /* -- what counts as the release */
  card.append(renderWatch(c));

  const problem = el("p", { className: "note-text bad-text" });
  const commit = () => {
    const [built, why] = previewRecord(c, work);
    problem.textContent = state.answers.has(key) && !built ? `Not in the batch: ${why}` : "";
    syncPreview(c);
    card.classList.toggle("answered", state.answers.has(key));
    refreshFooter();
  };

  /* -- the name */
  const renameBox = el("div", { className: "provenance" });
  renameBox.append(el("div", { className: "field" }, el("label", {}, "rename")));
  const custom = el("input", {
    type: "text", placeholder: "another slug", value: work.renameCustom,
    autocapitalize: "off", spellcheck: false,
  });
  const renameOptions = el("div", { className: "options" });
  const drawRename = () => {
    renameOptions.replaceChildren(
      option("Keep the name", c.name, {
        pressed: work.rename === null,
        onclick: () => { work.rename = null; drawRename(); commit(); },
      }),
      ...(c.renames || []).map((r) => {
        const button = option(r.name, r.taken ? `${r.why} -- already a model, merge by hand` : r.why, {
          pressed: work.rename === r.name,
          className: r.taken ? "decline" : "",
          onclick: () => { if (r.taken) return; work.rename = r.name; drawRename(); commit(); },
        });
        button.disabled = r.taken;
        return button;
      }),
      option("Another name", "type it below", {
        pressed: work.rename === "__custom__",
        onclick: () => { work.rename = "__custom__"; drawRename(); commit(); custom.focus(); },
      }),
    );
    custom.hidden = work.rename !== "__custom__";
  };
  custom.oninput = () => {
    work.renameCustom = custom.value;
    custom.classList.toggle("unknown", Boolean(custom.value.trim()) && !SLUG_RE.test(custom.value.trim()));
    commit();
  };
  drawRename();
  renameBox.append(renameOptions, el("div", { className: "field" }, custom),
    el("p", { className: "note-text" },
      "A rename moves the slug through llm.json, every mapping file and the AA mapping at "
      + "once, and keeps every score and its history."));
  card.append(renameBox);

  /* -- the URL: one tap for what Hugging Face has, or typed (and searched) */
  const urlBox = el("div", { className: "provenance" });
  urlBox.append(el("div", { className: "field" }, el("label", {}, "url")));
  const urlInput = el("input", { type: "url", inputMode: "url", value: work.url, enterKeyHint: "done" });
  const urlNote = el("p", { className: "note-text" });
  const checkUrl = debounceHf(urlNote);
  urlInput.oninput = () => {
    work.url = urlInput.value.trim();
    urlInput.classList.toggle("unknown", badUrl(work.url));
    drawScores();
    checkUrl(work.url, c.url);
    commit();
  };
  const newId = hfRepoOf(c.new_url);
  const hasNew = (found) => Boolean(found && newId)
    && found.some((f) => f.toLowerCase() === `${newId[1]}/${newId[2]}`.toLowerCase());
  const owner = hfRepoOf(c.url)?.[1];
  const picker = hfUrlPicker(urlInput, {
    typed: work.urlTyped,
    onTyped: (typed) => { work.urlTyped = typed; },
    onUser: () => { work.urlAuto = false; },
    fixed: (found) => [
      ...(c.url ? [[c.url, "keep the URL it has now"]] : []),
      /* only once the Hub lists it: a guessed URL that does not resolve is no choice */
      ...(c.new_url && hasNew(found) ? [[c.new_url, "the URL without 'preview'"
        + hfDetail(`${newId[1]}/${newId[2]}`).replace(/^ /, " · ")]] : []),
    ],
    search: owner ? () => previewUrlCandidates(c).then((ids) => ({
      ids,
      note: ids === null ? "could not reach Hugging Face to look for the release"
        : ids.length ? `${owner}'s repos named like ${previewTerms(c).join(", ")}, quants and fine-tunes left out.`
          : `No other repo of ${owner} is named like ${previewTerms(c).join(", ")}.`,
    })) : null,
    onFound: (found) => {
      if (!work.urlAuto) return;
      work.urlAuto = false;
      if (hasNew(found) && !work.urlTyped && work.url === c.url) {
        urlInput.value = c.new_url;
        urlInput.oninput();
      }
    },
  });
  urlBox.append(picker.node, urlNote);
  if (c.url) urlBox.append(el("p", { className: "note-text" }, `Now: ${c.url}`));
  card.append(urlBox);
  checkUrl(work.url, c.url);
  picker.refresh();

  /* -- the scores, preview ones first */
  const order = { preview: 0, either: 1, unknown: 2, release: 3 };
  const rows = [...(c.scores || [])].sort((a, b) => order[a.era] - order[b.era] || a.key.localeCompare(b.key));
  const scoreBox = el("div", { className: "provenance" });
  const scoreList = el("div", {});
  const releaseList = el("details", { className: "q-context" });
  const setAll = (pick) => {
    for (const row of rows) {
      if (row.era === "release") continue;
      const choice = pick(row);
      if (choice === "keep") delete work.scores[row.key];
      else work.scores[row.key] = { do: choice, url: work.scores[row.key]?.url ?? row.recredit_to ?? "" };
    }
    drawScores();
    commit();
  };
  const drawScores = () => {
    const later = rows.filter((r) => r.era === "release");
    scoreList.replaceChildren(...rows.filter((r) => r.era !== "release").map((row) => scoreDecision(c, row, work, () => { drawScores(); commit(); })));
    releaseList.replaceChildren(
      el("summary", {}, `${later.length} score${later.length === 1 ? "" : "s"} read from the release -- nothing to do`),
      ...later.map((row) => scoreDecision(c, row, work, () => { drawScores(); commit(); })),
    );
    releaseList.hidden = !later.length;
  };
  scoreBox.append(
    el("div", { className: "field" }, el("label", {}, "scores")),
    el("p", { className: "note-text" },
      "Keep a preview number until the release is measured, re-credit it to the release's page "
      + "so a fill-only source (a model card, llm-stats) may replace it, or clear it. The stored "
      + "number's date stays; a re-credit rewrites the page its history entry names."),
    el("div", { className: "card-foot", style: "gap:.4rem;flex-wrap:wrap;justify-content:flex-start" }, [
      el("button", { type: "button", className: "btn ghost tiny", onclick: () => {
        const defaults = previewDefaults(c, { fresh: true });
        setAll((row) => defaults.scores[row.key]?.do || "keep");
      } }, "Suggested"),
      el("button", { type: "button", className: "btn ghost tiny", onclick: () => setAll(() => "keep") }, "Keep all"),
      el("button", { type: "button", className: "btn ghost tiny", onclick: () => setAll((row) => (row.era === "preview" ? "clear" : "keep")) }, "Clear every preview score"),
    ]),
    scoreList, releaseList,
  );
  drawScores();
  card.append(scoreBox);

  /* -- the mappings */
  if (c.mappings?.length) {
    const mapBox = el("div", { className: "provenance" });
    mapBox.append(el("div", { className: "field" }, el("label", {}, "mappings onto this entry")),
      el("p", { className: "note-text" },
        "Parking writes __unmappable__: the source's row stops being read, and the name is not "
        + "asked about again. Park a preview row once the release is mapped from the same source."));
    for (const m of c.mappings) {
      const id = `${m.route}\t${m.route_kind}\t${m.subject}`;
      const row = el("div", { className: "score-row decision-row" });
      const choices = el("div", { className: "seg" });
      const draw = () => {
        choices.replaceChildren(...[["keep", "Keep"], ["park", "Park"]].map(([value, label]) => {
          const button = el("button", { type: "button", className: "btn ghost tiny", onclick: () => {
            if (value === "park") work.parks.add(id); else work.parks.delete(id);
            draw(); commit();
          } }, label);
          button.setAttribute("aria-pressed", String(work.parks.has(id) === (value === "park")));
          return button;
        }));
      };
      draw();
      row.append(
        el("label", {}, [`${m.source}: `, el("span", { className: m.preview ? "era-preview" : "" }, m.subject)]),
        el("span", { className: "note-text", style: "margin:0" }, m.why),
        choices,
      );
      mapBox.append(row);
    }
    card.append(mapBox);
  }

  /* -- questions waiting that offer this entry */
  if (c.queue?.length) {
    const qBox = el("div", { className: "provenance" });
    qBox.append(el("div", { className: "field" }, el("label", {}, "waiting on the Queue")),
      el("p", { className: "note-text" },
        `Names a board lists that the matcher offered ${c.name} for. Mapping one here is the same `
        + "answer as on the Queue tab; it is written before the rename, which carries it along."));
    const asked = new Map(state.questions.map((q) => [`${q.route}\t${q.subject}`, q]));
    for (const entry of c.queue) {
      const question = asked.get(`${entry.route}\t${entry.subject}`);
      const answered = question && answerOf(question)?.answer === c.name;
      const button = option(`${sourceOf(entry)}: ${entry.subject}`,
        !question ? "no longer on the queue" : answered ? `mapped onto ${c.name}` : `map it onto ${c.name}`, {
          pressed: Boolean(answered),
          onclick: () => {
            if (!question) return;
            setAnswer(question, answered ? null : mappingRecord(question, c.name));
          },
        });
      button.disabled = !question;
      qBox.append(el("div", { className: "options" }, button));
    }
    card.append(qBox);
  }

  /* -- the decision */
  const inBatch = state.answers.get(key)?.action === "apply";
  card.append(problem, el("div", { className: "options" }, [
    option(inBatch ? "In the batch" : "Clean up with these decisions",
      inBatch ? "every change above updates it; tap to take it out" : "one record: rename, url, scores and mappings together", {
        pressed: inBatch,
        onclick: () => {
          if (state.answers.get(key)?.action === "apply") { state.answers.delete(key); render(); return; }
          const [built, why] = previewRecord(c, work);
          if (!built) { problem.textContent = why; return; }
          state.answers.set(key, built);
          render();
        },
      }),
    option("Check it off", "not a release, or already cleaned up by hand: stop listing it", {
      pressed: false,
      className: "decline",
      onclick: () => { state.answers.set(key, { kind: "preview-cleanup", name: c.name, action: "dismiss" }); render(); },
    }),
  ]));
  commit();
}

/* ------------------------------------------------- release rules */

/* What a case waits for, when its name cannot say. The default -- a source
   listing the model without "preview" -- fails for a preview served by an
   API only: the entry points at a checkpoint the lab did publish (ERNIE 5.5
   Flash's -Base), and that repo's name never had the word in it. A release
   rule names the Hugging Face repo instead, as conditions on its id that must
   all hold; _preview_cleanup.py matches it against the Hub on every run, and
   until a repo matches, the case is not counted as released. One
   `preview-watch` record per change; choosing the default again drops the
   rule. Matched the way the Python side matches: case-insensitively, a pasted
   https://huggingface.co/ prefix ignored. */

const WATCH_KEY = (name) => `preview-watch  ${name}`;
const watchWork = new Map();
const WATCH_OPS = [
  ["starts_with", "starts with"],
  ["ends_with", "ends with"],
  ["contains", "contains"],
  ["equals", "is exactly"],
  ["regex", "matches regex"],
];
const WATCH_MAX = 8;
const WATCH_PATTERN_MAX = 120;
const HF_PREFIX = /^(?:https?:\/\/)?(?:www\.)?(?:huggingface\.co|hf\.co)\//i;
/* The same refusals as _preview_cleanup.normalize_rule: a quantified group
   holding a quantifier backtracks for ever, and Python's re has no timeout. */
const NESTED_QUANTIFIER = /\((?:[^()\\]|\\.)*[+*}](?:[^()\\]|\\.)*\)\s*[+*{?]/;
const REGEX_EXTRAS = /\\[1-9]|\(\?[=!<]/;

const watchRuleOf = (c) => (c.watch ? { all: c.watch.all || [], ...(c.watch.owner ? { owner: c.watch.owner } : {}) } : null);
const sameRule = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* A first guess at the rule: the owner's repo named like the URL now, without
   its preview word and without a -Base suffix -- and nothing with Base in it,
   when the stand-in is a base checkpoint. */
function suggestedConditions(c) {
  const repo = hfRepoOf(c.url);
  const stem = unpreview(repo ? repo[2] : (c.renames?.[0]?.name || c.name)).replace(/[-_.]base$/i, "");
  const conds = [{ op: "starts_with", value: repo ? `${repo[1]}/${stem}` : stem, not: false }];
  if (repo && /base/i.test(repo[2])) conds.push({ op: "contains", value: "Base", not: true });
  return conds;
}

function watchWorkFor(c) {
  if (watchWork.has(c.name)) return watchWork.get(c.name);
  const sent = state.answers.get(WATCH_KEY(c.name));
  const rule = sent ? sent.watch : watchRuleOf(c);
  const work = rule
    ? { mode: "hf", conds: rule.all.map((x) => ({ op: x.op, value: x.value, not: Boolean(x.not) })), owner: rule.owner || "" }
    : { mode: "default", conds: suggestedConditions(c), owner: "" };
  watchWork.set(c.name, work);
  return work;
}

/* [rule, problem] for the hf mode, checked as the server will check it. */
function watchRule(work) {
  const all = [];
  for (const cond of work.conds) {
    let value = String(cond.value || "").trim();
    if (!value) return [null, "every condition needs a value"];
    if (value.length > WATCH_PATTERN_MAX) return [null, `a value is at most ${WATCH_PATTERN_MAX} characters`];
    if (cond.op === "regex") {
      if (NESTED_QUANTIFIER.test(value) || REGEX_EXTRAS.test(value)) {
        return [null, "the regex nests a quantifier, refers back or looks around; say it with plainer conditions"];
      }
      try { new RegExp(value, "i"); } catch (e) { return [null, `the regex does not compile: ${e.message}`]; }
    } else {
      value = value.replace(HF_PREFIX, "");
      if (!value) return [null, "a value needs more than the Hugging Face host"];
    }
    all.push({ op: cond.op, value, ...(cond.not ? { not: true } : {}) });
  }
  if (!all.length) return [null, "add a condition"];
  if (all.length > WATCH_MAX) return [null, `at most ${WATCH_MAX} conditions`];
  if (!all.some((x) => !x.not)) return [null, "one condition has to say what to look for, not only what to rule out"];
  const owner = work.owner.trim();
  if (owner && !/^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$/.test(owner)) return [null, "the owner is not a Hugging Face account name"];
  return [{ all, ...(owner ? { owner } : {}) }, ""];
}

function watchMatches(rule, id) {
  if (!id || id.length > 96) return false;
  const subject = id.toLowerCase();
  return rule.all.every((x) => {
    const v = x.value.toLowerCase();
    const hit = x.op === "regex" ? new RegExp(x.value, "i").test(id)
      : x.op === "starts_with" ? subject.startsWith(v)
        : x.op === "ends_with" ? subject.endsWith(v)
          : x.op === "contains" ? subject.includes(v)
            : subject === v;
    return hit !== Boolean(x.not);
  });
}

function watchOwner(rule, c) {
  if (rule.owner) return rule.owner;
  const repo = hfRepoOf(c.url);
  if (repo) return repo[1];
  const lead = rule.all.find((x) => !x.not && (x.op === "starts_with" || x.op === "equals") && x.value.includes("/"));
  return lead ? lead.value.split("/")[0] : "";
}

/* The owner's newest repos and those named like the rule's longest literal --
   what the run asks the Hub, so the check here shows what it will find. */
async function watchCandidates(rule, owner) {
  const base = `${HF_API}?author=${encodeURIComponent(owner)}&limit=100`;
  const literals = rule.all.filter((x) => !x.not && x.op !== "regex")
    .map((x) => (x.value.includes("/") ? x.value.split("/").slice(1).join("/") : x.value))
    .filter((v) => v.length >= 2).sort((a, b) => b.length - a.length);
  const urls = [`${base}&sort=createdAt&direction=-1`, ...(literals[0] ? [`${base}&search=${encodeURIComponent(literals[0])}`] : [])];
  const ids = new Set();
  for (const url of urls) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    for (const m of await response.json()) if (m && typeof m.id === "string") ids.add(m.id);
  }
  return [...ids];
}

/* Keeps the batch in step: a rule that differs from the stored one is a
   record; the stored one, or the default when there is none, is nothing. */
function syncWatch(c, work) {
  const key = WATCH_KEY(c.name);
  const stored = watchRuleOf(c);
  if (work.mode === "default") {
    if (stored) state.answers.set(key, { kind: "preview-watch", name: c.name, watch: null });
    else state.answers.delete(key);
    return "";
  }
  const [rule, problem] = watchRule(work);
  if (!rule || sameRule(rule, stored)) state.answers.delete(key);
  else state.answers.set(key, { kind: "preview-watch", name: c.name, watch: rule });
  return problem;
}

function renderWatch(c) {
  const key = WATCH_KEY(c.name);
  const work = watchWorkFor(c);
  const box = el("div", { className: "provenance" });
  box.append(el("div", { className: "field" }, el("label", {}, "looks released when")));
  const modes = el("div", { className: "options" });
  const editor = el("div", {});
  const status = el("p", { className: "note-text" });
  const problem = el("p", { className: "note-text bad-text" });
  const result = el("div", {});

  const commit = () => {
    problem.textContent = syncWatch(c, work);
    const pending = state.answers.get(key);
    const stored = watchRuleOf(c);
    status.textContent = pending
      ? (pending.watch ? "This rule is in the batch; it replaces " + (stored ? "the stored one" : "the default") + " on the next run."
        : "Back to the default on the next run: the stored rule is dropped.")
      : stored ? (work.mode === "hf" ? "The stored rule." : "") : "";
    status.className = pending ? "note-text good-text" : "note-text";
    box.classList.toggle("answered", Boolean(pending));
    refreshFooter();
  };

  const drawModes = () => modes.replaceChildren(
    option("Default", "a source lists it without 'preview': Artificial Analysis, a board, the Queue", {
      pressed: work.mode === "default",
      onclick: () => { work.mode = "default"; draw(); commit(); },
    }),
    option("A Hugging Face repo", "say what the release's repo looks like -- for a preview whose weights are not out", {
      pressed: work.mode === "hf",
      onclick: () => { work.mode = "hf"; draw(); commit(); },
    }),
  );

  const drawEditor = () => {
    if (work.mode !== "hf") { editor.replaceChildren(); return; }
    const rows = work.conds.map((cond, i) => {
      const op = el("select", { onchange: () => { cond.op = op.value; commit(); } },
        WATCH_OPS.map(([value, label]) => el("option", { value, selected: value === cond.op }, label)));
      const negate = el("button", { type: "button", className: "btn ghost tiny", title: "turn this condition around",
        onclick: () => { cond.not = !cond.not; negate.setAttribute("aria-pressed", String(cond.not)); commit(); } }, "not");
      negate.setAttribute("aria-pressed", String(cond.not));
      const value = el("input", { type: "text", value: cond.value, placeholder: "owner/Repo-Name, or part of it",
        autocapitalize: "off", spellcheck: false, maxLength: WATCH_PATTERN_MAX });
      value.oninput = () => { cond.value = value.value; commit(); };
      const remove = el("button", { type: "button", className: "btn ghost tiny", title: "remove this condition",
        onclick: () => { work.conds.splice(i, 1); drawEditor(); commit(); } }, "✕");
      remove.disabled = work.conds.length === 1;
      return el("div", { className: "watch-cond" }, [el("div", { className: "seg" }, negate), op, value, remove]);
    });
    const add = el("button", { type: "button", className: "btn ghost tiny", onclick: () => {
      work.conds.push({ op: "contains", value: "", not: false }); drawEditor(); commit();
    } }, "+ condition");
    add.disabled = work.conds.length >= WATCH_MAX;
    const owner = el("input", { type: "text", value: work.owner, autocapitalize: "off", spellcheck: false,
      placeholder: `owner to search (default: ${hfRepoOf(c.url)?.[1] || "from the first condition"})` });
    owner.oninput = () => { work.owner = owner.value; commit(); };
    const check = el("button", { type: "button", className: "btn ghost tiny", onclick: async () => {
      const [rule, why] = watchRule(work);
      if (!rule) { result.replaceChildren(el("p", { className: "note-text bad-text" }, why)); return; }
      const who = watchOwner(rule, c);
      if (!who) { result.replaceChildren(el("p", { className: "note-text bad-text" }, "name an owner to search")); return; }
      result.replaceChildren(el("p", { className: "note-text" }, `asking Hugging Face for ${who}'s repos...`));
      let ids;
      try { ids = await watchCandidates(rule, who); } catch (e) {
        result.replaceChildren(el("p", { className: "note-text" }, `could not reach Hugging Face (${e.message})`));
        return;
      }
      const own = hfRepoOf(c.url) ? `${hfRepoOf(c.url)[1]}/${hfRepoOf(c.url)[2]}`.toLowerCase() : "";
      const hits = ids.filter((id) => id.toLowerCase().startsWith(`${who.toLowerCase()}/`) && watchMatches(rule, id));
      const counted = hits.filter((id) => id.toLowerCase() !== own);
      result.replaceChildren(
        el("p", { className: `note-text ${counted.length ? "bad-text" : "good-text"}` }, counted.length
          ? `${counted.length} of ${ids.length} repos of ${who} match already -- the case would look released now. Tighten the rule unless one of these is the release:`
          : `None of ${ids.length} repos of ${who} matches yet: the case stays quiet until one does.`),
        counted.length ? el("ul", {}, counted.slice(0, 12).map((id) => el("li", {},
          el("a", { href: HF_BASE + id, target: "_blank", rel: "noopener noreferrer" }, id)))) : "",
        hits.length > counted.length ? el("p", { className: "note-text" },
          "The URL it has now matches too; that one is never counted.") : "",
      );
    } }, "Check against Hugging Face now");
    editor.replaceChildren(
      el("p", { className: "note-text" },
        "Every condition must hold, matched case-insensitively against the repo id (owner/Name); "
        + "a pasted https://huggingface.co/ prefix is fine. Until a repo of the owner matches, the "
        + "case does not count as released, whatever else lists it. The URL the entry has now never counts."),
      ...rows,
      el("div", { className: "card-foot", style: "gap:.4rem;flex-wrap:wrap;justify-content:flex-start" }, [add, check]),
      el("div", { className: "field" }, owner),
      result,
    );
  };

  const draw = () => { drawModes(); drawEditor(); result.replaceChildren(); };
  draw();
  if (c.watch) {
    box.append(el("p", { className: "note-text" }, [
      `Stored${c.watch.date ? ` ${c.watch.date}` : ""}: waits for ${c.watch.describe || "a Hugging Face repo"}. `,
      c.watch.hub === "checked" ? "The last run asked the Hub."
        : c.watch.hub === "carried over" ? "The last run could not ask the Hub; this is the answer before."
          : "Not asked of the Hub yet: the next run does.",
    ]));
  }
  box.append(modes, editor, problem, status);
  commit();
  return box;
}

/* One score's row: what it is, why it reads as the preview's, and the choice. */
function scoreDecision(c, row, work, onChange) {
  const decision = work.scores[row.key]?.do || "keep";
  const bench = state.llm?.benchmarks?.[row.key];
  const [eraLabel, eraClass] = ERA_LABELS[row.era] || [row.era, ""];
  const box = el("div", { className: "score-row decision-row preview-score" });
  const choices = el("div", { className: "seg" });
  for (const [value, label] of [["keep", "Keep"], ["recredit", "Re-credit"], ["clear", "Clear"]]) {
    const button = el("button", { type: "button", className: "btn ghost tiny", onclick: () => {
      if (value === "keep") delete work.scores[row.key];
      else work.scores[row.key] = { do: value, url: work.scores[row.key]?.url ?? row.recredit_to ?? "" };
      onChange();
    } }, label);
    button.setAttribute("aria-pressed", String(decision === value));
    choices.append(button);
  }
  let host = "";
  try { host = row.source ? new URL(row.source).host : ""; } catch { host = row.source || ""; }
  box.append(
    el("label", { title: row.key }, [bench?.name || row.key, " ", el("b", {}, String(row.value))]),
    el("div", { className: "chips", style: "margin:0" }, [
      chip("", eraLabel, { prose: true, className: eraClass }),
      chip("", row.rank_label, { prose: true }),
    ]),
    choices,
    el("div", { className: "score-past" }, [
      el("span", {}, row.date || "no date"),
      row.source ? el("a", { href: row.source, target: "_blank", rel: "noopener noreferrer", title: row.source }, host) : el("span", {}, "no page"),
      el("span", {}, row.why),
    ]),
  );
  if (row.note) box.append(el("div", { className: "score-past" }, el("span", {}, row.note)));
  if (decision === "recredit") {
    const input = el("input", { type: "url", inputMode: "url", value: recreditUrl(c, row, work), placeholder: "the release's page" });
    input.oninput = () => {
      work.scores[row.key] = { do: "recredit", url: input.value.trim() };
      input.classList.toggle("unknown", !/^https?:\/\/\S+$/i.test(input.value.trim()));
      syncPreview(c);
      refreshFooter();
    };
    box.append(el("div", { className: "field", style: "grid-column:1/-1;margin:0" }, input));
  }
  return box;
}

/* Whether the URL is a Hugging Face repo that exists, asked of the Hub's
   public API (any origin, no token) a moment after typing stops. */
function debounceHf(note) {
  let timer = 0;
  let asked = "";
  return (url, current) => {
    clearTimeout(timer);
    const match = /^https:\/\/huggingface\.co\/([^/?#]+\/[^/?#]+)\/?$/.exec(String(url || "").trim());
    if (!match) { note.textContent = ""; return; }
    if (url === current) { note.textContent = "unchanged"; note.className = "note-text"; return; }
    timer = setTimeout(async () => {
      asked = url;
      note.textContent = "checking Hugging Face...";
      note.className = "note-text";
      try {
        const response = await fetch(`${HF_API}/${match[1]}`);
        if (asked !== url) return;
        if (response.ok) {
          note.textContent = `${match[1]} exists on Hugging Face`;
          note.className = "note-text good-text";
        } else {
          note.textContent = response.status === 401 || response.status === 404
            ? `${match[1]} is not a public Hugging Face repo (HTTP ${response.status}) -- check the name`
            : `Hugging Face answered HTTP ${response.status}`;
          note.className = "note-text bad-text";
        }
      } catch {
        if (asked === url) { note.textContent = "could not reach Hugging Face to check"; note.className = "note-text"; }
      }
    }, 500);
  };
}

/* The cases checked off or cleaned up: a misclick is one tap from undone. */
function renderPreviewDone(done) {
  const box = el("details", { className: "q-context" },
    el("summary", {}, `${done.length} checked off or cleaned up`));
  const list = el("div", { className: "stack" });
  for (const entry of done) {
    const key = PREVIEW_KEY(entry.name);
    const restoring = state.answers.get(key)?.action === "restore";
    const card = el("div", { className: `card${restoring ? " answered" : ""}` }, [
      el("div", { className: "subject" }, entry.name),
      el("div", { className: "chips" }, [
        chip("", entry.how || "checked off", { prose: true }),
        entry.date ? chip("on", entry.date) : null,
        entry.was ? chip("was", entry.was) : null,
      ]),
      el("div", { className: "options" }, option(restoring ? "Listed again on the next run" : "Bring it back",
        restoring ? "tap to take it out of the batch" : "list it again if it still looks like a preview", {
          pressed: restoring,
          onclick: () => {
            if (restoring) state.answers.delete(key);
            else state.answers.set(key, { kind: "preview-cleanup", name: entry.name, action: "restore" });
            render();
          },
        })),
    ]);
    list.append(guard(card, key));
  }
  box.append(list);
  box.open = done.some((entry) => state.answers.has(PREVIEW_KEY(entry.name)));
  return box;
}

function renderReference() {
  ensureAaSlugs();
  const box = el("div", { className: "stack" });

  if (state.reference.slugs === null) {
    box.append(el("p", { className: "empty" },
      !state.reference.error
        ? "The reference list has not been read yet."
        : state.reference.error.includes("404")
          ? "This repository has no reference-models.json yet."
          : `Could not read the reference list (${state.reference.error}).`));
    return box;
  }

  box.append(el("p", { className: "note-text" },
    "The closed models the index carries so the open field has something to be "
    + "measured against. The table hides them behind its Closed models "
    + "checkbox; a model's own page and a comparison always offer them. Each is "
    + "named after an Artificial Analysis slug, which is what lets every "
    + "source's scores find it. There is always at least one."));

  box.append(renderReferenceAdd());
  box.append(...state.reference.slugs.map(renderReferenceCard));
  return box;
}

/* Carry more. Each slug has to be one AA publishes -- answer.py checks the
   same thing on the runner -- because a name AA does not know collects nothing
   and would sit in the table empty forever.

   As many as a sitting needs: a slug picked from the list, or typed and added
   with the button, joins the batch and the box empties for the next one. The
   queued ones are listed in the card, each removable. */
function renderReferenceAdd() {
  const card = el("div", { className: "card" });
  card.append(el("div", { className: "subject" }, "Carry more models"));

  const queued = answerKeys("reference-add  ").map((key) => key.slice("reference-add  ".length));
  const flying = locked()
    ? state.sent.keys.filter((key) => key.startsWith("reference-add  "))
      .map((key) => key.slice("reference-add  ".length))
    : [];
  const carried = new Set(state.reference.slugs || []);
  /* Releases answered "Add as reference" on the Queue, or carried from the
     Models tab's "Add a model": keyed by their question or their card, so not in `queued`, but the same record all the same. */
  const fromNew = [...state.answers.entries()]
    .filter(([key, record]) => !key.startsWith("reference-add  ") && record.kind === "reference-add")
    .map(([, record]) => record.name);

  /* Why a slug cannot be added, or "" when it can. */
  const refusal = (slug) => {
    if (!SLUG_RE.test(slug)) return "not a slug: lowercase words joined by single dots or dashes";
    if (carried.has(slug)) return "already carried -- it is one of the cards below";
    if (queued.includes(slug)) return "already in this batch";
    if (fromNew.includes(slug)) return "already in this batch, from the Queue or the Models tab";
    if (flying.includes(slug)) return "already sent -- the run is adding it";
    if (state.aa.slugs !== null && !state.aa.slugs.includes(slug)) {
      return "Artificial Analysis does not publish this slug, so nothing would find the model";
    }
    return "";
  };

  const status = el("div", { className: "chips" });
  const input = slugInput({ placeholder: "gpt-6-astra", value: state.referenceDraft });
  const add = el("button", { className: "btn ghost tiny", type: "button" }, "Add");
  const draw = () => {
    const slug = state.referenceDraft.trim();
    const why = slug ? refusal(slug) : "";
    add.disabled = !slug || Boolean(why);
    status.replaceChildren(...(!slug ? [] : [why
      ? chip("", why, { prose: true, className: "now" })
      : chip("", [aaSlugSummary(slug), "Add puts it in this batch"].filter(Boolean).join(" -- "),
        { prose: true })]));
  };
  const take = () => {
    const slug = state.referenceDraft.trim();
    if (!slug || refusal(slug)) { input.classList.add("unknown"); return; }
    state.answers.set(REFERENCE_ADD_KEY(slug), { kind: "reference-add", name: slug });
    state.referenceDraft = "";
    render();
    /* Straight back into the box for the next one. */
    document.querySelector("#view .reference-add input")?.focus();
  };
  input.oninput = () => {
    state.referenceDraft = input.value;
    input.classList.remove("unknown");
    draw();
    saveDraft();
  };
  add.onclick = take;
  const offered = () => (state.aa.slugs || []).filter((slug) => !carried.has(slug) && !queued.includes(slug));
  const box = comboBox(input, offered, { detail: aaSlugDetail, min: 2, onPick: take });
  /* After the list's own handler, which takes an Enter on a highlighted row
     and marks it handled; a bare Enter adds what is typed. */
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.defaultPrevented) { event.preventDefault(); take(); }
  });
  card.classList.add("reference-add");
  card.append(el("div", { className: "field" }, [
    el("label", {}, "artificial analysis slug"),
    el("div", { className: "score-row" }, [box, add]),
  ]), status);

  const rows = [
    ...queued.map((slug) => el("div", { className: "queued-row" }, [
      el("span", {}, [slug, aaSlugSummary(slug) ? el("span", { className: "detail" }, aaSlugSummary(slug)) : null]),
      el("button", {
        type: "button", className: "btn ghost tiny",
        onclick: () => { state.answers.delete(REFERENCE_ADD_KEY(slug)); render(); },
      }, "Remove"),
    ])),
    ...flying.map((slug) => el("div", { className: "queued-row sent" }, [
      el("span", {}, [slug, el("span", { className: "detail" }, "sent -- the run is adding it")]),
    ])),
  ];
  if (rows.length) card.append(el("div", { className: "queued" }, rows));
  if (queued.length) {
    card.classList.add("answered");
    card.append(el("p", { className: "note-text" },
      `${queued.length} to carry: each entry is created with its slug and its `
      + "scores land on the next refresh."));
  }

  if (state.aa.error) {
    card.append(el("p", { className: "note-text" },
      `The slug list could not be read (${state.aa.error}), so nothing is suggested `
      + "here. A slug typed in full is still checked on the runner."));
  }
  draw();
  return card;
}

function renderReferenceCard(slug) {
  const removeKey = REFERENCE_REMOVE_KEY(slug);
  const renameKey = `model-rename  ${slug}`;
  const removing = state.answers.has(removeKey);
  const rename = state.answers.get(renameKey);
  const card = el("div", { className: `card${removing || rename ? " answered" : ""}` });
  const model = (state.llm?.models || []).find((m) => m.name === slug);

  card.append(el("div", { className: "subject" }, slug));
  const summary = aaSlugSummary(slug);
  card.append(el("div", { className: "chips" }, [
    chip("", summary || (state.aa.slugs === null
      ? "reading the Artificial Analysis list..."
      : "Artificial Analysis no longer publishes this slug"),
      { prose: true, className: summary || state.aa.slugs === null ? "" : "now" }),
    model
      ? chip("scores", String(Object.values(model.scores || {}).filter((v) => v !== null).length))
      : chip("", "no llm.json entry yet -- the next refresh cannot fill one either",
        { prose: true, className: "now" }),
  ]));

  if (rename) {
    card.append(
      el("div", { className: "chips" }, chip("rename to", rename.new_name)),
      el("div", { className: "options" }, option("Cancel the rename", "keep this slug", {
        pressed: false,
        className: "decline",
        onclick: () => { state.answers.delete(renameKey); render(); },
      })),
      el("p", { className: "note-text" },
        `${slug} becomes ${rename.new_name} in llm.json, in the reference list and in `
        + "every mapping file that names it. The scores come along; a different model "
        + "is Stop carrying plus Carry another instead."),
    );
    return guard(card, renameKey);
  }

  const last = referenceRemaining() <= 1 && !removing;
  card.append(el("div", { className: "options" }, [
    option("Stop carrying it", removing
      ? "the slug and its entry go on the next run"
      : last
        ? "not while it is the only one left -- add its replacement first"
        : "drops the slug and its llm.json entry, scores and all", {
      pressed: removing,
      className: "decline",
      onclick: () => {
        if (removing) state.answers.delete(removeKey);
        else {
          /* One record per entry per run: a rename of a model this batch also
             removes is refused on the runner, and the removal is the thing
             just clicked. */
          state.answers.delete(renameKey);
          state.answers.set(removeKey, { kind: "reference-remove", name: slug });
        }
        render();
      },
    }),
  ]));
  if (last) {
    card.querySelectorAll(".options button").forEach((button) => { button.disabled = true; });
  }

  card.append(referenceRenameBlock(slug, renameKey));
  /* Whichever of the two is in flight: a reload drops the drafted record but
     not the lock, and a rename sent from here has to keep its card disabled
     just as a removal does. Same choice renderModelCard makes. */
  return guard(card, isSent(renameKey) ? renameKey : removeKey);
}

/* Rename, for the slug that moved rather than the model that did: AA renames
   one of these now and then, and the entry has to follow or its scores stop
   arriving. Simpler than the Models tab's block, which also has to work out
   whether AA knows the name at all -- here it does, by construction. */
function referenceRenameBlock(slug, renameKey) {
  const block = el("div", { className: "provenance aa" });
  block.append(el("div", { className: "field" }, el("label", {}, "rename")));

  if (state.aa.slugs === null) {
    block.append(el("p", { className: "note-text" },
      state.aa.error
        ? `The Artificial Analysis slugs could not be read (${state.aa.error}).`
        : "Reading the Artificial Analysis slugs..."));
    return block;
  }

  const input = slugInput({ placeholder: "the slug AA uses now" });
  const apply = el("button", { className: "btn ghost tiny", type: "button" }, "Rename");
  apply.onclick = () => {
    const value = input.value.trim();
    const taken = (state.llm?.models || []).some((m) => m.name === value);
    if (value === slug || taken || !state.aa.slugs.includes(value)) {
      input.classList.add("unknown");
      return;
    }
    state.answers.delete(REFERENCE_REMOVE_KEY(slug));
    state.answers.delete(`model-edit  ${slug}`);
    state.answers.set(renameKey, { kind: "model-rename", name: slug, new_name: value });
    render();
  };
  input.oninput = () => input.classList.remove("unknown");

  block.append(
    el("div", { className: "score-row" }, [
      el("label", {}, `one of ${state.aa.slugs.length} AA slugs`),
      comboBox(input, () => state.aa.slugs.filter((value) => !(state.reference.slugs || []).includes(value)),
        { detail: aaSlugDetail, min: 2 }),
      apply,
    ]),
    el("p", { className: "note-text" },
      "For the same model under a new slug -- the name moves through llm.json, the "
      + "reference list and every mapping file at once, and the scores stay."),
  );
  return block;
}

/* How the Models tab orders its list. "least" puts the emptiest rows first --
   the ones a sitting is most likely to be filling in -- and "newest" the
   models added last, which are usually the same thing a week later. */
const MODEL_SORTS = [
  ["least", "Least scored first"],
  ["newest", "Last added first"],
];

/* The scores a model carries, out of the columns a hand edit can write: a
   derived index is computed, so counting it would only flatter every row. */
const scoredCount = (model) =>
  benchmarks().filter((bench) => model.scores?.[bench] != null).length;

function sortedModels(models, sort) {
  const added = (m) => m.date_added || "";
  const byNewest = (a, b) => added(b).localeCompare(added(a)) || a.name.localeCompare(b.name);
  if (sort === "newest") return [...models].sort(byNewest);
  const counts = new Map(models.map((m) => [m, scoredCount(m)]));
