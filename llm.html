      <div class="field">
        <label for="sortMode">Sort</label>
        <select id="sortMode"></select>
      </div>
      <div class="field">
        <label for="modelCompare">Compare Models</label>
        <div class="select-wrap">
          <div id="modelCompare" class="model-compare-widget" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Compare models"></div>
          <button id="clearCompare" class="clear-compare" type="button" title="Unselect all">×</button>
        </div>
      </div>
      <div class="field">
        <label for="benchmarkPick">Benchmarks</label>
        <div class="select-wrap">
          <div id="benchmarkPick" class="model-compare-widget" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Visible benchmarks"></div>
          <button id="clearBenchmarks" class="clear-compare" type="button" title="Show all benchmarks">×</button>
        </div>
      </div>
      <div class="field field-full">
        <label for="search">Search</label>
        <div class="select-wrap">
          <input id="search" type="text" placeholder="Model or creator">
          <button id="clearSearch" class="clear-compare" type="button" title="Clear search">×</button>
        </div>
      </div>
        </div>
        <section class="toolbar" id="toolbar">
          <span class="pill" id="resultCount">0 models</span>
          <span class="pill" id="creatorCount">0 creators</span>
          <span class="pill" id="benchmarkCount">0 benchmarks</span>
          <button id="resetBtn" type="button">Reset Filters</button>
          <button style="display: none" id="importBtn" type="button">Import llm.json</button>
          <input id="importFile" class="file-input-offscreen" type="file" accept="application/json,.json">
        </section>
        </div>
      </div>
    </section>

    <section id="content">
      <div class="status" id="status">Loading benchmark data...</div>
    </section>
  </main>

  <script>
    (function () {
      const state = {
        data: null,
        benchmarkKeys: [],
        sortGroups: [],
        headerWidthsByKey: {},
        filteredModels: [],
        filters: {
          search: "",
          selectedModels: [],
          // Benchmarks are opt-out: an empty list means every column shows, so
          // benchmarks added to llm.json later appear without extra bookkeeping.
          hiddenBenchmarks: []
        },
        sort: {
          key: null,
          direction: "desc"
        },
        eventsBound: false,
        columnWidths: {},
        gpu: {
          list: [],
          visible: [],
          vendor: "all",
          selected: null,
          count: 1,
          custom: false,
          budget: null,
          // Fraction of total VRAM to keep free (KV cache, activations, desktop)
          reserve: 0,
          activeIndex: -1,
          eventsBound: false
        }
      };

      // Fixed (non-benchmark) table columns. Only layout lives here — labels,
      // sort-option labels and tooltips come from data.columns in llm.json.
      // Order must match the cell order in renderRow.
      const FIXED_COLUMNS = [
        { key: "name", className: "col-model", minWidth: 100 },
        { key: "creator", minWidth: 90, initialWidth: 90 },
        { key: "params", className: "mono head-right", minWidth: 100, initialWidth: 100 },
        { key: "context", className: "mono head-right", minWidth: 100, initialWidth: 100 },
        { key: "vram_fp16", className: "mono head-right", minWidth: 90, initialWidth: 90 },
        { key: "vram_int8", className: "mono head-right", minWidth: 90, initialWidth: 90 },
        { key: "vram_int4", className: "mono head-right", minWidth: 90, initialWidth: 90 }
      ];

      function columnMeta(key) {
        const column = state.data?.columns?.[key];
        return column && typeof column === "object" ? column : {};
      }

      function columnLabel(key) {
        return columnMeta(key).label || key;
      }

      function columnSortLabel(key) {
        const meta = columnMeta(key);
        return meta.sortLabel || meta.label || key;
      }

      function getHeaderWidthConfig(key, th = null) {
        const config = state.headerWidthsByKey[key] || {};
        const fallbackMin = th?.dataset.minWidth ? Number(th.dataset.minWidth) : 75;
        const fallbackMax = th?.dataset.maxWidth ? Number(th.dataset.maxWidth) : Infinity;
        const fallbackInitial = th?.dataset.initialWidth ? Number(th.dataset.initialWidth) : undefined;
        return {
          minWidth: config.minWidth ?? fallbackMin,
          maxWidth: config.maxWidth ?? fallbackMax,
          initialWidth: config.initialWidth ?? fallbackInitial
        };
      }

      function syncTableWidth(table) {
        if (!table) return;
        const totalWidth = [...table.querySelectorAll("thead th")].reduce((sum, th) => {
          const width = Number.parseFloat(th.style.width);
          return sum + (Number.isFinite(width) ? width : th.getBoundingClientRect().width);
        }, 0);
        table.style.width = totalWidth + "px";
      }

      const ui = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        filtersPanel: document.getElementById("filtersPanel"),
        filtersToggle: document.getElementById("filtersToggle"),
        filtersCount: document.getElementById("filtersCount"),
        controlsCollapse: document.getElementById("controlsCollapse"),
        controls: document.getElementById("controls"),
        toolbar: document.getElementById("toolbar"),
        content: document.getElementById("content"),
        status: document.getElementById("status"),
        search: document.getElementById("search"),
        modelCompare: document.getElementById("modelCompare"),
        benchmarkPick: document.getElementById("benchmarkPick"),
        sortMode: document.getElementById("sortMode"),
        resultCount: document.getElementById("resultCount"),
        creatorCount: document.getElementById("creatorCount"),
        benchmarkCount: document.getElementById("benchmarkCount"),
        importBtn: document.getElementById("importBtn"),
        importFile: document.getElementById("importFile"),
        resetBtn: document.getElementById("resetBtn"),
        clearCompare: document.getElementById("clearCompare"),
        clearBenchmarks: document.getElementById("clearBenchmarks"),
        clearSearch: document.getElementById("clearSearch"),
        gpuBar: document.getElementById("gpuBar"),
        gpuVendor: document.getElementById("gpuVendor"),
        gpuModel: document.getElementById("gpuModel"),
        gpuModelList: document.getElementById("gpuModelList"),
        gpuClear: document.getElementById("gpuClear"),
        gpuStepper: document.getElementById("gpuStepper"),
        gpuCount: document.getElementById("gpuCount"),
        gpuCountDown: document.getElementById("gpuCountDown"),
        gpuCountUp: document.getElementById("gpuCountUp"),
        gpuVram: document.getElementById("gpuVram"),
        gpuTotal: document.getElementById("gpuTotal"),
        gpuReserve: document.getElementById("gpuReserve"),
        gpuReserveDown: document.getElementById("gpuReserveDown"),
        gpuReserveUp: document.getElementById("gpuReserveUp")
      };

      bindImportEvents();
      loadData();

      // Theme toggle
      document.getElementById("themeToggle").addEventListener("click", () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        document.documentElement.classList.add("theme-transitioning");
        setTimeout(() => document.documentElement.classList.remove("theme-transitioning"), 400);
        if (isDark) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        }
      });

      async function loadData() {
        try {
          const cacheBustedUrl = `https://dgrieser.github.io/ai-bench/llm.json?t=${Date.now()}`;
          const response = await fetch(cacheBustedUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Request failed (${response.status})`);
          }
          const data = await response.json();
          validateData(data);
          init(data);
        } catch (err) {
          showImportOnly(`Unable to load llm.json automatically. ${err.message}`);
        }
      }

      function showImportOnly(message) {
        // The toolbar now lives inside the filters panel, so keep the panel
        // visible and hide only the toggle and filter fields — otherwise the
        // import pills/button would be hidden along with the panel.
        ui.filtersPanel.hidden = false;
        ui.filtersToggle.style.display = "none";
        ui.controls.style.display = "none";
        ui.toolbar.hidden = false;
        ui.status.classList.add("error");
        ui.status.textContent = message;
        ui.resultCount.textContent = "No data loaded";
        ui.benchmarkCount.textContent = "Import required";
      }

      // Collapse/expand the filter fields. overflow on the collapse wrapper is
      // hidden while animating (so the 0fr squeeze clips) and set visible once
      // open, so field dropdowns (GPU combo, compare list) aren't clipped.
      function setFiltersCollapsed(collapsed, animate) {
        ui.filtersPanel.classList.toggle("collapsed", collapsed);
        ui.filtersToggle.setAttribute("aria-expanded", String(!collapsed));

        if (collapsed) {
          ui.controlsCollapse.classList.remove("is-open");
          return;
        }
        if (animate && !prefersReducedMotion()) {
          ui.controlsCollapse.addEventListener("transitionend", function onEnd(e) {
            if (e.propertyName !== "grid-template-rows") return;
            ui.controlsCollapse.removeEventListener("transitionend", onEnd);
            if (!ui.filtersPanel.classList.contains("collapsed")) {
              ui.controlsCollapse.classList.add("is-open");
            }
          });
        } else {
          ui.controlsCollapse.classList.add("is-open");
        }
      }

      // Narrowest a filter slot may get before dropping a column.
      const FILTER_SLOT_MIN = 215;

      // Rows are always evenly filled: the column count is the largest divisor
      // of the slot count that still fits the width, and never the whole set on
      // one line. Six slots therefore go 3/3, 2/2/2 or 1×6 — never 5+1. Fields
      // flow in DOM order; none is pinned to a row.
      function updateFilterColumns() {
        // One slot per top-level field; a field cluster counts once, not once
        // per member.
        const slots = [...ui.controls.querySelectorAll(".field, .field-cluster")]
          .filter((el) => !el.closest("[hidden]") && !el.parentElement.closest(".field-cluster"));
        // Full-width fields bring their own row, so they don't count toward the
        // split of the regular slots.
        const inlineSlots = slots.filter((el) => !el.classList.contains("field-full"));
        if (!inlineSlots.length) {
          return;
        }

        const styles = getComputedStyle(ui.controls);
        const gap = parseFloat(styles.columnGap) || 0;
        const available = ui.controls.getBoundingClientRect().width
          - (parseFloat(styles.paddingLeft) || 0)
          - (parseFloat(styles.paddingRight) || 0);
        const fits = Math.max(1, Math.floor((available + gap) / (FILTER_SLOT_MIN + gap)));
        const limit = Math.min(fits, Math.ceil(inlineSlots.length / 2));

        let columns = 1;
        for (let candidate = limit; candidate >= 1; candidate -= 1) {
          if (inlineSlots.length % candidate === 0) {
            columns = candidate;
            break;
          }
        }
        ui.controls.style.setProperty("--filter-cols", String(columns));
      }

      function prefersReducedMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function validateData(data) {
        if (!data || typeof data !== "object") {
          throw new Error("Invalid JSON root.");
        }
        if (!Array.isArray(data.models) || !data.benchmarks || typeof data.benchmarks !== "object") {
          throw new Error("Expected models[] and benchmarks{}.");
        }
      }

      function init(data) {
        state.data = data;
        state.benchmarkKeys = getOrderedBenchmarkKeys(data.benchmarks);
        state.sortGroups = Array.isArray(data.sortGroups) ? data.sortGroups : [];
        // Drop hidden keys that no longer exist in the freshly loaded data.
        state.filters.hiddenBenchmarks = state.filters.hiddenBenchmarks
          .filter((key) => state.benchmarkKeys.includes(key));
        state.sort.key = defaultSortKey();
        state.sort.direction = "desc";
        ensureSortVisible();

        const title = data.title || "OpenBench Index";
        ui.title.textContent = title;
        document.title = title;
        ui.subtitle.textContent = data.subtitle || "";
        ui.subtitle.hidden = !data.subtitle;
        ui.filtersPanel.hidden = false;
        // Collapsed on mobile by default, expanded on desktop.
        setFiltersCollapsed(window.matchMedia("(max-width: 860px)").matches, false);
        // Enable collapse/chevron transitions only after the initial state paints.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => ui.filtersPanel.classList.add("ready"));
        });
        ui.toolbar.hidden = false;
        ui.status.classList.remove("error");

        populateFilters();
        updateFilterColumns();
        if (!state.eventsBound) {
          bindEvents();
          state.eventsBound = true;
        }
        applyAndRender();
        loadGpuData();
      }

      // Open/close plumbing shared by the checkbox-list widgets (model compare,
      // benchmark visibility). onToggle gets the clicked item's data-value.
      function bindMultiSelectWidget(el, onToggle) {
        let widgetWasOpen = false;
        el.addEventListener("mousedown", () => {
          widgetWasOpen = el.classList.contains("open");
        });

        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const item = e.target.closest(".model-compare-item");
          if (item) {
            onToggle(item.dataset.value);
            return;
          }
          // Opening is handled by the focus event; only close here if it was already open
          if (widgetWasOpen) {
            el.classList.remove("open");
          }
        });

        el.addEventListener("focus", () => {
          el.classList.add("open");
        });

        el.addEventListener("blur", (e) => {
          if (!el.contains(e.relatedTarget)) {
            el.classList.remove("open");
          }
        });

        el.addEventListener("keydown", (e) => {
          if (e.key === "Escape") el.classList.remove("open");
        });

        let hoverOpenTimer = null;
        el.addEventListener("mouseenter", () => {
          if (!el.classList.contains("open")) {
            hoverOpenTimer = setTimeout(() => {
              el.classList.add("open");
            }, 1000);
          }
        });
        el.addEventListener("mouseleave", () => {
          clearTimeout(hoverOpenTimer);
        });

        el.addEventListener("wheel", (e) => {
          if (!el.classList.contains("open")) {
            e.preventDefault();
            el.classList.add("open");
            el.focus();
          }
        }, { passive: false });

        document.addEventListener("click", () => {
          el.classList.remove("open");
        });
      }

      function bindImportEvents() {
        bindMultiSelectWidget(ui.modelCompare, (name) => {
          const idx = state.filters.selectedModels.indexOf(name);
          if (idx >= 0) {
            state.filters.selectedModels.splice(idx, 1);
          } else {
            state.filters.selectedModels.push(name);
          }
          updateCompareWidget();
          applyAndRender();
        });

        bindMultiSelectWidget(ui.benchmarkPick, (key) => {
          toggleBenchmark(key);
        });

        ui.importBtn.addEventListener("click", () => {
          ui.importFile.click();
        });

        ui.importFile.addEventListener("change", async (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          try {
            const text = await file.text();
            const imported = JSON.parse(text);
            validateData(imported);
            state.filters.search = "";
            state.filters.selectedModels = [];
            state.filters.hiddenBenchmarks = [];
            state.sort.key = defaultSortKey();
            state.sort.direction = "desc";
            ui.search.value = "";
            ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
            init(imported);
          } catch (err) {
            ui.content.innerHTML = `<div class="status error">Import failed: ${escapeHtml(err.message || "Invalid JSON file.")}</div>`;
          } finally {
            ui.importFile.value = "";
          }
        });
      }

      function populateFilters() {
        const modelNames = [...new Set(state.data.models.map((m) => m.name || "Unknown"))].sort((a, b) => a.localeCompare(b));
        ui.modelCompare.innerHTML = modelNames.map((name) => {
          const sel = state.filters.selectedModels.includes(name);
          return `<div class="model-compare-item${sel ? " selected" : ""}" data-value="${escapeHtml(name)}" role="option" aria-selected="${sel}">
            <span class="model-compare-check"></span>
            <span>${escapeHtml(name)}</span>
          </div>`;
        }).join("");

        const summaryEl = document.createElement("div");
        summaryEl.className = "model-compare-summary";
        ui.modelCompare.insertBefore(summaryEl, ui.modelCompare.firstChild);
        updateCompareSummary();

        populateBenchmarkPicker();

        populateSortOptions();
      }

      // Sort options cover the fixed columns, the sort groups and every
      // *visible* benchmark — hidden benchmarks drop out so the dropdown can't
      // sort on a column that isn't on screen.
      function populateSortOptions() {
        const fixedSortOptions = FIXED_COLUMNS.map((column) => ({
          key: column.key,
          label: columnSortLabel(column.key)
        }));

        const groupSortOptions = (state.sortGroups || []).map((group) => ({
          key: groupSortKey(group.key),
          label: group.label || group.key
        }));

        const benchmarkSortOptions = visibleBenchmarkKeys().map((key) => ({
          key,
          label: getBenchmarkLabel(key)
        }));

        const sortOptions = [...fixedSortOptions, ...groupSortOptions, ...benchmarkSortOptions];
        ui.sortMode.innerHTML = sortOptions.map((option) => {
          const ascLabel = `${option.label} ↑`;
          const descLabel = `${option.label} ↓`;
          return [
            `<option value="${escapeHtml(sortModeValue(option.key, "desc"))}">${escapeHtml(descLabel)}</option>`,
            `<option value="${escapeHtml(sortModeValue(option.key, "asc"))}">${escapeHtml(ascLabel)}</option>`
          ].join("");
        }).join("");

        ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
      }

      /* ── Benchmark visibility ─────────────────────── */

      function isBenchmarkVisible(key) {
        return !state.filters.hiddenBenchmarks.includes(key);
      }

      function visibleBenchmarkKeys() {
        return state.benchmarkKeys.filter(isBenchmarkVisible);
      }

      function populateBenchmarkPicker() {
        ui.benchmarkPick.innerHTML = state.benchmarkKeys.map((key) => {
          const sel = isBenchmarkVisible(key);
          const name = getBenchmarkFullName(key);
          return `<div class="model-compare-item${sel ? " selected" : ""}" data-value="${escapeHtml(key)}" role="option" aria-selected="${sel}" title="${escapeHtml(name)}">
            <span class="model-compare-check"></span>
            <span>${escapeHtml(name)}</span>
          </div>`;
        }).join("");

        const summaryEl = document.createElement("div");
        summaryEl.className = "model-compare-summary";
        ui.benchmarkPick.insertBefore(summaryEl, ui.benchmarkPick.firstChild);
        updateBenchmarkWidget();
      }

      function updateBenchmarkWidget() {
        ui.benchmarkPick.querySelectorAll(".model-compare-item").forEach((item) => {
          const selected = isBenchmarkVisible(item.dataset.value);
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });

        const summary = ui.benchmarkPick.querySelector(".model-compare-summary");
        if (!summary) return;
        const visible = visibleBenchmarkKeys();
        const allShown = visible.length === state.benchmarkKeys.length;
        if (allShown) {
          summary.textContent = `All ${state.benchmarkKeys.length} benchmarks`;
        } else if (!visible.length) {
          summary.textContent = "No benchmark columns";
        } else {
          summary.textContent = visible.map((key) => getBenchmarkFullName(key)).join(", ");
        }
        summary.classList.toggle("is-hint", allShown);
      }

      function toggleBenchmark(key) {
        if (!state.benchmarkKeys.includes(key)) {
          return;
        }
        const hidden = state.filters.hiddenBenchmarks;
        const idx = hidden.indexOf(key);
        if (idx >= 0) {
          hidden.splice(idx, 1);
        } else {
          hidden.push(key);
        }
        onBenchmarkVisibilityChanged();
      }

      function showAllBenchmarks() {
        if (!state.filters.hiddenBenchmarks.length) {
          return;
        }
        state.filters.hiddenBenchmarks = [];
        onBenchmarkVisibilityChanged();
      }

      function onBenchmarkVisibilityChanged() {
        // Stored benchmark column widths are dropped so the remaining columns
        // re-measure and re-share the freed space instead of compounding.
        state.benchmarkKeys.forEach((key) => delete state.columnWidths[key]);
        ensureSortVisible();
        updateBenchmarkWidget();
        populateSortOptions();
        applyAndRender();
      }

      // A hidden column can't stay the sort key: fall back to the default sort,
      // and if that is hidden too, to the first visible benchmark.
      function ensureSortVisible() {
        if (!state.benchmarkKeys.includes(state.sort.key) || isBenchmarkVisible(state.sort.key)) {
          return;
        }
        state.sort.key = defaultSortKey();
        state.sort.direction = "desc";
        if (state.benchmarkKeys.includes(state.sort.key) && !isBenchmarkVisible(state.sort.key)) {
          state.sort.key = visibleBenchmarkKeys()[0] || "name";
        }
      }

      function updateCompareWidget() {
        ui.modelCompare.querySelectorAll(".model-compare-item").forEach((item) => {
          const selected = state.filters.selectedModels.includes(item.dataset.value);
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        updateCompareSummary();
      }

      function updateCompareSummary() {
        const summary = ui.modelCompare.querySelector(".model-compare-summary");
        if (!summary) return;
        if (state.filters.selectedModels.length === 0) {
          summary.textContent = "Pick models to compare";
          summary.classList.add("is-hint");
        } else {
          summary.textContent = state.filters.selectedModels.join(", ");
          summary.classList.remove("is-hint");
        }
      }

      function bindEvents() {
        ui.filtersToggle.addEventListener("click", () => {
          setFiltersCollapsed(!ui.filtersPanel.classList.contains("collapsed"), true);
        });

        ui.search.addEventListener("input", debounce((event) => {
          state.filters.search = event.target.value.trim().toLowerCase();
          applyAndRender();
        }, 100));

        ui.clearCompare.addEventListener("mousedown", (e) => {
          e.preventDefault(); // prevents blur on modelCompare, keeping it open
          e.stopPropagation();
          state.filters.selectedModels = [];
          updateCompareWidget();
          applyAndRender();
        });

        ui.clearBenchmarks.addEventListener("mousedown", (e) => {
          e.preventDefault(); // prevents blur on benchmarkPick, keeping it open
          e.stopPropagation();
          showAllBenchmarks();
        });

        ui.clearSearch.addEventListener("click", () => {
          ui.search.value = "";
          state.filters.search = "";
          applyAndRender();
        });

        window.addEventListener("resize", debounce(() => updateFilterColumns(), 150));

        ui.sortMode.addEventListener("change", (event) => {
          const nextSort = parseSortModeValue(event.target.value);
          state.sort.key = nextSort.key;
          state.sort.direction = nextSort.direction;
          applyAndRender();
        });

        ui.resetBtn.addEventListener("click", () => {
          if (!state.data) {
            return;
          }

          state.filters.search = "";
          state.filters.selectedModels = [];
          state.filters.hiddenBenchmarks = [];
          state.benchmarkKeys.forEach((key) => delete state.columnWidths[key]);
          state.sort.key = defaultSortKey();
          state.sort.direction = "desc";

          ui.search.value = "";

          ui.modelCompare.classList.remove("open");
          ui.benchmarkPick.classList.remove("open");
          updateCompareWidget();
          updateBenchmarkWidget();
          populateSortOptions();

          gpuResetBar();
          applyAndRender();
        });
      }

      function applyAndRender() {
        if (!state.data) {
          return;
        }

        const models = state.data.models
          .map((model) => {
            return {
              ...model,
              creatorName: model.creator?.name || "Unknown"
            };
          })
          .filter((model) => modelPassesFilters(model));

        sortModels(models);
        state.filteredModels = models;

        renderTable();
        updateMeta();
        updateFilterGlow();
      }

      // Marks controls that currently constrain the table so CSS can
      // highlight them (gradient border / glow).
      function updateFilterGlow() {
        const searchOn = Boolean(state.filters.search);
        const compareOn = state.filters.selectedModels.length > 0;
        const benchmarksOn = state.filters.hiddenBenchmarks.length > 0;
        const gpuOn = Boolean(state.gpu.budget);
        const sortOn = state.sort.key !== defaultSortKey() || state.sort.direction !== "desc";
        const vendorOn = state.gpu.vendor !== "all";
        const reserveOn = state.gpu.reserve > 0;

        ui.search.closest(".field")?.classList.toggle("filter-on", searchOn);
        ui.modelCompare.closest(".field")?.classList.toggle("filter-on", compareOn);
        ui.benchmarkPick.closest(".field")?.classList.toggle("filter-on", benchmarksOn);
        ui.sortMode.closest(".field")?.classList.toggle("filter-on", sortOn);
        ui.gpuVendor.closest(".field")?.classList.toggle("filter-on", vendorOn);
        ui.gpuModel.closest(".field")?.classList.toggle("filter-on", gpuOn && Boolean(state.gpu.selected));
        ui.gpuVram.closest(".field")?.classList.toggle("filter-on", gpuOn);
        ui.gpuReserve?.closest(".field")?.classList.toggle("filter-on", reserveOn);
        ui.resetBtn.classList.toggle("filter-on", searchOn || compareOn || benchmarksOn || gpuOn || sortOn || vendorOn || reserveOn);
        updateReserveHint();

        // Active-constraint count, surfaced in the toggle bar when collapsed.
        const activeCount = [searchOn, compareOn, benchmarksOn, sortOn, gpuOn || vendorOn || reserveOn].filter(Boolean).length;
        ui.filtersCount.textContent = `${activeCount} active`;
        ui.filtersCount.hidden = activeCount === 0;
      }

      function modelPassesFilters(model) {
        if (state.filters.search) {
          const haystack = `${model.name || ""} ${model.creatorName}`.toLowerCase();
          if (!haystack.includes(state.filters.search)) {
            return false;
          }
        }

        if (state.filters.selectedModels.length && !state.filters.selectedModels.includes(model.name || "Unknown")) {
          return false;
        }

        // GPU VRAM budget: keep a model only if it fits at some quantization
        // level (int4 is the smallest, so min of the present values decides).
        const usableVram = gpuUsableBudget();
        if (usableVram) {
          const vram = model.vram || {};
          const requirements = [vram.int4, vram.int8, vram.fp16]
            .map(toNumber)
            .filter((value) => Number.isFinite(value));
          if (!requirements.length || Math.min(...requirements) > usableVram) {
            return false;
          }
        }

        return true;
      }

      function sortModels(models) {
        const directionFactor = state.sort.direction === "asc" ? 1 : -1;

        // Grouped sort: collapse several benchmarks into one priority-weighted
        // composite computed over the current (filtered) model set, then sort
        // on that single number. Computed once per sort, not per comparison.
        const group = getSortGroup(state.sort.key);
        const composite = group ? computeGroupComposite(models, group) : null;

        models.sort((a, b) => {
          const left = composite ? composite.get(a) : valueForSort(a, state.sort.key);
          const right = composite ? composite.get(b) : valueForSort(b, state.sort.key);

          const leftMissing = left == null || Number.isNaN(left);
          const rightMissing = right == null || Number.isNaN(right);

          if (leftMissing && rightMissing) {
            return String(a.name || "").localeCompare(String(b.name || ""));
          }
          if (leftMissing) {
            return 1;
          }
          if (rightMissing) {
            return -1;
          }

          if (typeof left === "number" && typeof right === "number") {
            return (left - right) * directionFactor;
          }

          return String(left).localeCompare(String(right)) * directionFactor;
        });
      }

      function groupSortKey(key) {
        return `group:${key}`;
      }

      // Default sort comes from llm.json: data.defaultSort names either a
      // sort-group key or a plain column/benchmark key. Falls back to the
      // first sort group, then the first benchmark column.
      function defaultSortKey() {
        const groups = state.sortGroups || [];
        const configured = state.data?.defaultSort;
        if (typeof configured === "string" && configured) {
          const group = groups.find((g) => g.key === configured);
          return group ? groupSortKey(group.key) : configured;
        }
        if (groups.length) {
          return groupSortKey(groups[0].key);
        }
        return state.benchmarkKeys[0] || "name";
      }

      function getSortGroup(key) {
        if (typeof key !== "string" || !key.startsWith("group:")) {
          return null;
        }
        return (state.sortGroups || []).find((group) => groupSortKey(group.key) === key) || null;
      }

      // Per-benchmark percentile rank in [0,1] over present models. Ties share
      // the average rank. Returns null when fewer than 2 models have a score
      // (can't rank a single point — e.g. a benchmark only one model ran).
      function percentileMap(models, key) {
        const entries = [];
        models.forEach((model) => {
          const value = toNumber(model.scores?.[key]);
          if (Number.isFinite(value)) {
            entries.push({ model, value });
          }
        });
        if (entries.length < 2) {
          return null;
        }
        entries.sort((a, b) => a.value - b.value);
        const n = entries.length;
        const map = new Map();
        let i = 0;
        while (i < n) {
          let j = i;
          while (j + 1 < n && nearlyEqual(entries[j + 1].value, entries[i].value)) {
            j += 1;
          }
          const pct = ((i + j) / 2) / (n - 1); // average rank of the tie group
          for (let k = i; k <= j; k += 1) {
            map.set(entries[k].model, pct);
          }
          i = j + 1;
        }
        return map;
      }

      // Group benchmark entries may be plain keys or { key, weight } objects.
      // Explicit weights express benchmark reliability; entries without one
      // fall back to geometric decay by list position (decay^i).
      function groupBenchmarkEntries(group) {
        const raw = Array.isArray(group.benchmarks) ? group.benchmarks : [];
        const decay = Number.isFinite(group.decay) ? group.decay : 0.6;
        return raw.map((entry, i) => {
          const obj = typeof entry === "string" ? { key: entry } : entry || {};
          const weight = Number.isFinite(obj.weight) ? obj.weight : Math.pow(decay, i);
          return { key: obj.key, weight };
        });
      }

      // Reliability-weighted normalized composite for a sort group.
      // - Each benchmark normalized to a percentile rank (kills scale differences).
      // - Each benchmark's weight comes from groupBenchmarkEntries (explicit
      //   weight, or decay^i by position), so the most reliable benchmarks lead
      //   and lower-weighted ones fill gaps / break ties.
      // - Missing benchmarks are imputed, not skipped: absence is ignorance, not
      //   evidence of a bottom rank. The fill starts at percentile 0.5 (median
      //   model) and slides toward the level the model has actually demonstrated
      //   as its coverage grows -- fill = 0.5 + (own - 0.5) * coverageShare -- so
      //   the composite reduces to own*(1 - m^2) + 0.5*m^2 for missing share m.
      //   The penalty for a blank therefore scales with m^2 rather than m: a model
      //   measured on almost everything is barely docked for the rest, while one
      //   measured on almost nothing is still pinned near 0.5, so a single lucky
      //   score cannot top a well-tested model. Every model divides by the same
      //   total weight, which keeps composites comparable and the ranking
      //   invariant to rescaling all weights (coverageShare is a ratio, so no
      //   absolute weight magnitude leaks into the fill).
      // - Benchmarks nobody can be ranked on (fewer than 2 scored models) are
      //   left out of the total so they don't dilute anyone.
      // - A model measured on less than group.minScoredFraction of the total
      //   weight is left unranked rather than scored: its composite would be
      //   mostly imputation, and reporting that as a rank implies evidence that
      //   does not exist.
      // Returns a Map(model -> composite|null); null sinks to the bottom like a
      // missing value (model had no scores in the group, or too few to rank).
      function computeGroupComposite(models, group) {
        const entries = groupBenchmarkEntries(group);
        const pctMaps = entries.map((entry) => percentileMap(models, entry.key));
        const weights = entries.map((entry, i) => (pctMaps[i] ? entry.weight : 0));
        const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
        const minScoredFraction = Number.isFinite(group.minScoredFraction)
          ? group.minScoredFraction
          : 0;
        const minScoredWeight = minScoredFraction * totalWeight;

        const result = new Map();
        models.forEach((model) => {
          let sumWeight = 0;
          let sumWeighted = 0;
          entries.forEach((entry, i) => {
            const pctMap = pctMaps[i];
            if (!pctMap) return;
            const pct = pctMap.get(model);
            if (pct === undefined) return;
            sumWeight += weights[i];
            sumWeighted += weights[i] * pct;
          });
          if (sumWeight <= 0 || sumWeight < minScoredWeight) {
            result.set(model, null);
            return;
          }
          const missingWeight = totalWeight - sumWeight;
          const own = sumWeighted / sumWeight;
          const fill = 0.5 + (own - 0.5) * (sumWeight / totalWeight);
          result.set(model, (sumWeighted + fill * missingWeight) / totalWeight);
        });
        return result;
      }

      function valueForSort(model, key) {
        if (key === "name") {
          return model.name || "";
        }
        if (key === "creator") {
          return model.creatorName || "";
        }
        if (key === "params") {
          return parseUnitNumber(model.params);
        }
        if (key === "context") {
          return parseUnitNumber(model.context);
        }
        if (key === "vram_fp16") {
          return model.vram?.fp16 ?? NaN;
        }
        if (key === "vram_int8") {
          return model.vram?.int8 ?? NaN;
        }
        if (key === "vram_int4") {
          return model.vram?.int4 ?? NaN;
        }
        return toNumber(model.scores?.[key]);
      }

      function measureModelColumnInitialWidth(models) {
        if (window.innerWidth <= 860) return 150;
        const probe = document.createElement("span");
        probe.className = "model-name-label";
        probe.style.position = "absolute";
        probe.style.visibility = "hidden";
        probe.style.pointerEvents = "none";
        probe.style.whiteSpace = "nowrap";
        document.body.appendChild(probe);

        const probeStyles = window.getComputedStyle(probe);
        const context = document.createElement("canvas").getContext("2d");
        const font = probeStyles.font || [
          probeStyles.fontStyle,
          probeStyles.fontVariant,
          probeStyles.fontWeight,
          probeStyles.fontSize,
          probeStyles.fontFamily
        ].filter(Boolean).join(" ");

        let widestLabel = 0;
        if (context) {
          context.font = font;
          models.forEach((model) => {
            const textWidth = context.measureText(model.name || "Unknown").width;
            const badgeWidth = isRecentModel(model) ? 22 : 0;
            widestLabel = Math.max(widestLabel, textWidth + badgeWidth);
          });
        }

        document.body.removeChild(probe);
        return Math.ceil(widestLabel + 6);
      }

      function renderTable() {
        if (!state.filteredModels.length) {
          ui.content.innerHTML = `
            <div class="empty">No models match your filters.</div>
            ${renderBenchmarkDirectory()}
            ${renderSourcesDirectory()}
          `;
          return;
        }

        const benchKeys = visibleBenchmarkKeys();
        const headers = [
          ...FIXED_COLUMNS.map((column) => ({
            ...column,
            label: columnLabel(column.key),
            title: columnMeta(column.key).description,
            initialWidth: column.key === "name"
              ? measureModelColumnInitialWidth(state.filteredModels)
              : column.initialWidth
          })),
          ...benchKeys.map((key) => {
            const bench = state.data.benchmarks[key] || {};
            const fullName = bench.name || getBenchmarkLabel(key);
            const description = bench.description || "";
            // Tooltip: full benchmark name on the first line, description below.
            return {
              key,
              label: getBenchmarkLabel(key),
              title: description ? `${fullName}\n${description}` : fullName,
              className: "num bench-head head-right",
              minWidth: 95,
              initialWidth: 95
            };
          })
        ];
        state.headerWidthsByKey = Object.fromEntries(headers.map((header) => [header.key, {
          minWidth: header.minWidth,
          maxWidth: header.maxWidth,
          initialWidth: header.initialWidth
        }]));

        const bestInTableByModel = getBestInTableByModel(state.filteredModels);
        const scoreRanges = getScoreRangesByBenchmark(state.filteredModels);

        const tableHtml = `
          <div class="table-shell">
            <table aria-label="LLM benchmark table">
              <thead>
                <tr>
                  ${headers.map((header) => renderHeaderCell(header)).join("")}
                </tr>
              </thead>
              <tbody>
                ${state.filteredModels.map((model) => renderRow(model, bestInTableByModel.get(model) || new Set(), scoreRanges, benchKeys)).join("")}
              </tbody>
            </table>
          </div>
          ${renderBenchmarkDirectory()}
          ${renderSourcesDirectory()}
        `;

        ui.content.innerHTML = tableHtml;

        ui.content.querySelectorAll("th[data-sort-key]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sortKey;
            if (!key) {
              return;
            }
            if (state.sort.key === key) {
              state.sort.direction = state.sort.direction === "desc" ? "asc" : "desc";
            } else {
              state.sort.key = key;
              state.sort.direction = (key === "name" || key === "creator" ||
                key === "vram_fp16" || key === "vram_int8" || key === "vram_int4") ? "asc" : "desc";
            }

            ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
            applyAndRender();
          });
        });

        initColumnResize();
      }

      function renderBenchmarkDirectory() {
        const items = visibleBenchmarkKeys().map((key) => {
          const benchmark = state.data?.benchmarks?.[key] || {};
          const name = benchmark.name || getBenchmarkLabel(key);
          const category = benchmark.category || "";
          const description = benchmark.description || "";
          const links = benchmarkLinks(benchmark);

          return `
            <article class="benchmark-item">
              <div class="benchmark-head">
                <span class="benchmark-name">${renderBenchmarkIcon(key)}${escapeHtml(name)}</span>
                ${category ? `<span class="benchmark-category">${escapeHtml(category)}</span>` : ""}
              </div>
              ${description ? `<p class="benchmark-desc">${escapeHtml(description)}</p>` : ""}
              ${links.length ? `<div class="benchmark-links">${links.map((url) => `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`).join("")}</div>` : ""}
            </article>
          `;
        }).join("");

        return `
          <section class="benchmarks-panel" aria-label="Benchmark details">
            <h2>Benchmarks</h2>
            <div class="benchmarks-list">${items}</div>
          </section>
        `;
      }

      function renderSourcesDirectory() {
        const sources = [
          ...(Array.isArray(state.data?.sources) ? state.data.sources : []),
          ...((state.data?.models || []).map((model) => model?.url))
        ]
          .filter((url) => typeof url === "string" && url.trim().length > 0);

        if (!sources.length) {
          return "";
        }

        const links = [...new Set(sources)]
          .sort((a, b) => a.localeCompare(b))
          .map((url) => `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`)
          .join("");

        return `
          <section class="sources-panel" aria-label="Sources">
            <h2>Sources</h2>
            <div class="sources-list">${links}</div>
          </section>
        `;
      }

      function benchmarkLinks(benchmark) {
        if (!benchmark || typeof benchmark !== "object") {
          return [];
        }
        if (Array.isArray(benchmark.urls)) {
          return benchmark.urls.filter((url) => typeof url === "string" && url.trim().length > 0);
        }
        if (typeof benchmark.url === "string" && benchmark.url.trim().length > 0) {
          return [benchmark.url];
        }
        return [];
      }

      function initColumnResize() {
        const table = ui.content.querySelector("table");
        if (!table) return;
        const ths = table.querySelectorAll("thead th");
        const shell = table.parentElement;

        // Capture initial widths for columns not yet stored, bounded by configured min/max widths.
        ths.forEach((th) => {
          const key = th.dataset.sortKey;
          const { minWidth, maxWidth, initialWidth: configuredInitialWidth } = getHeaderWidthConfig(key, th);
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(maxWidth) ? maxWidth + "px" : "none";
          if (key && !state.columnWidths[key]) {
            const initialWidth = configuredInitialWidth ?? th.getBoundingClientRect().width;
            state.columnWidths[key] = Math.max(minWidth, Math.min(initialWidth, maxWidth));
          }
        });

        const benchmarkHeaders = [...ths].filter((th) => state.benchmarkKeys.includes(th.dataset.sortKey));
        if (shell && benchmarkHeaders.length > 0) {
          const shellWidth = shell.getBoundingClientRect().width;
          const totalWidth = [...ths].reduce((sum, th) => {
            const key = th.dataset.sortKey;
            return sum + (key ? (state.columnWidths[key] || 0) : 0);
          }, 0);
          const extraWidth = Math.floor(shellWidth - totalWidth);
          if (extraWidth > 0) {
            const extraPerBenchmark = Math.floor(extraWidth / benchmarkHeaders.length);
            const remainder = extraWidth % benchmarkHeaders.length;
            benchmarkHeaders.forEach((th, index) => {
              const key = th.dataset.sortKey;
              if (!key) return;
              const bonus = extraPerBenchmark + (index < remainder ? 1 : 0);
              state.columnWidths[key] = (state.columnWidths[key] || 0) + bonus;
            });
          }
        }

        // Switch to fixed layout and apply stored widths
        table.style.tableLayout = "fixed";
        ths.forEach((th) => {
          const key = th.dataset.sortKey;
          if (key && state.columnWidths[key]) {
            const { minWidth, maxWidth } = getHeaderWidthConfig(key, th);
            const clampedWidth = Math.max(minWidth, Math.min(state.columnWidths[key], maxWidth));
            state.columnWidths[key] = clampedWidth;
            th.style.width = clampedWidth + "px";
            th.style.maxWidth = Number.isFinite(maxWidth) ? maxWidth + "px" : "none";
          }
        });
        syncTableWidth(table);

        // Attach mousedown listeners to resize handles
        table.querySelectorAll(".col-resize-handle").forEach((handle) => {
          handle.addEventListener("mousedown", onResizeMouseDown);
        });
      }

      function onResizeMouseDown(e) {
        e.preventDefault();
        e.stopPropagation();

        const handle = e.currentTarget;
        const th = handle.closest("th");
        const key = handle.dataset.resizeKey;
        if (!th || !key) return;

        const startX = e.clientX;
        const startWidth = th.getBoundingClientRect().width;
        const { minWidth, maxWidth } = getHeaderWidthConfig(key, th);
        const table = th.closest("table");
        const shell = table?.parentElement || null;
        const tableWidth = table ? table.getBoundingClientRect().width : Infinity;
        const shellWidth = shell ? shell.getBoundingClientRect().width : tableWidth;
        const availableWidth = Math.max(tableWidth, shellWidth);
        let otherColumnsMinWidth = 0;
        if (table) {
          table.querySelectorAll("thead th").forEach((otherTh) => {
            const otherKey = otherTh.dataset.sortKey;
            if (!otherKey || otherKey === key) return;
            const { minWidth: otherMinWidth } = getHeaderWidthConfig(otherKey, otherTh);
            otherColumnsMinWidth += otherMinWidth;
          });
        }
        const effectiveMaxWidth = Math.min(maxWidth, availableWidth - otherColumnsMinWidth);

        document.body.classList.add("col-resizing");

        function onMouseMove(e) {
          const newWidth = Math.max(minWidth, Math.min(startWidth + (e.clientX - startX), effectiveMaxWidth));
          th.style.width = newWidth + "px";
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(effectiveMaxWidth) ? effectiveMaxWidth + "px" : "none";
          syncTableWidth(table);
        }

        function onMouseUp(e) {
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
          document.body.classList.remove("col-resizing");

          const finalWidth = Math.max(minWidth, Math.min(startWidth + (e.clientX - startX), effectiveMaxWidth));
          state.columnWidths[key] = finalWidth;
          th.style.width = finalWidth + "px";
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(effectiveMaxWidth) ? effectiveMaxWidth + "px" : "none";
          syncTableWidth(table);

          // Swallow the click event the browser fires after mouseup so sort doesn't trigger
          th.addEventListener("click", (ev) => ev.stopPropagation(), { capture: true, once: true });
        }

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      }

      function renderHeaderCell(header) {
        const isSorted = state.sort.key === header.key;

        // When a grouped sort is active, every benchmark in the group is marked
        // with a diamond, so the contributing columns are visible at a glance
        // even though no single column "is" the sort key.
        const group = getSortGroup(state.sort.key);
        const groupEntries = group ? groupBenchmarkEntries(group) : [];
        const groupEntry = groupEntries.find((entry) => entry.key === header.key);
        const inGroup = groupEntry !== undefined;

        let indicator = "";
        if (isSorted) {
          const sortSymbol = state.sort.direction === "desc" ? "▼" : "▲";
          indicator = `<span class="sort-indicator">${sortSymbol}</span>`;
        } else if (inGroup) {
          indicator = `<span class="sort-indicator group-indicator">◆</span>`;
        }

        const className = header.className ? ` ${header.className}` : "";
        const titleParts = [];
        if (header.title) titleParts.push(header.title);
        if (inGroup) {
          titleParts.push(`Sorted in “${group.label || group.key}” · weight ${groupEntry.weight}`);
        }
        const title = titleParts.length ? ` title="${escapeHtml(titleParts.join("\n"))}"` : "";

        const resizeHandle = `<div class="col-resize-handle" data-resize-key="${escapeHtml(header.key)}"></div>`;
        const icon = renderBenchmarkIcon(header.key);
        const labelContent = `${icon}<span class="th-label-text">${escapeHtml(header.label)}</span>`;
        const minWidthAttr = header.minWidth != null ? ` data-min-width="${header.minWidth}"` : "";
        const maxWidthAttr = header.maxWidth != null ? ` data-max-width="${header.maxWidth}"` : "";
        const initialWidthAttr = header.initialWidth != null ? ` data-initial-width="${header.initialWidth}"` : "";
        return `<th class="${className.trim()}" data-sort-key="${escapeHtml(header.key)}"${title}${minWidthAttr}${maxWidthAttr}${initialWidthAttr}><span class="th-label">${labelContent}</span>${indicator}${resizeHandle}</th>`;
      }

      function isRecentModel(model) {
        if (!model.date_added) return false;
        const added = new Date(model.date_added + "T00:00:00");
        const now = new Date();
        const diffMs = now.getTime() - added.getTime();
        return diffMs >= 0 && diffMs < 7 * 24 * 60 * 60 * 1000;
      }

      function renderNewBadge(dateAdded) {
        const pts = "100,10 118.1,32.4 145,22 149.5,50.5 177.9,55 167.6,81.9 190,100 167.6,118.1 177.9,145 149.5,149.5 145,177.9 118.1,167.6 100,190 81.9,167.6 55,177.9 50.5,149.5 22.1,145 32.4,118.1 10,100 32.4,81.9 22.1,55 50.5,50.5 55,22 81.9,32.4";
        const label = dateAdded ? `Added ${escapeHtml(dateAdded)}` : "Recently added";
        return (
          `<span class="new-badge" title="${label}">` +
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="22" height="22" aria-label="New model">` +
          `<g transform="rotate(-12 100 100)">` +
          `<polygon points="${pts}" fill="url(#new-badge-grad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" filter="url(#new-badge-shadow)"/>` +
          `<text x="100" y="116" font-family="'Impact','Arial Black',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NEW</text>` +
          `</g>` +
          `</svg>` +
          `</span>`
        );
      }

      function renderRow(model, bestInTable, scoreRanges, benchKeys) {
        const modelName = escapeHtml(model.name || "Unknown");
        const modelUrl = model.url || "";
        const creatorName = escapeHtml(model.creatorName);
        const creatorUrl = model.creator?.url || "";
        const isNew = isRecentModel(model);
        const newLabel = isNew ? (model.date_added ? `Added ${escapeHtml(model.date_added)}` : "Recently added") : "";
        const addedLabel = model.date_added ? `Added ${escapeHtml(model.date_added)}` : "Unknown";
        const scoreCells = benchKeys.map((key) => {
          const value = toNumber(model.scores?.[key]);
          const updated = model.scores_updated?.[key];
          const titleAttr = updated ? ` title="Updated ${escapeHtml(updated)}"` : "";
          const isTop = bestInTable.has(key);
          if (isTop) {
            return `<td class="num top-score"${titleAttr}><span class="top-score-mark">${formatScore(value)}</span></td>`;
          }
          const grey = Number.isFinite(value) ? scoreToGrey(value, scoreRanges[key]) : null;
          const style = grey ? ` style="color:${grey}"` : "";
          return `<td class="num"${style}${titleAttr}>${formatScore(value)}</td>`;
        }).join("");

        return `
          <tr>
            <td class="col-model"><span class="model-name-wrap">${isNew ? renderNewBadge(model.date_added) : ""}${modelUrl ? `<a href="${escapeAttr(modelUrl)}" target="_blank" rel="noopener noreferrer" title="${addedLabel}" class="model-name-label${isNew ? ' model-new' : ""}">${modelName}</a>` : `<span class="model-name-label${isNew ? ' model-new' : ""}" title="${addedLabel}">${modelName}</span>`}</span></td>
            <td class="creator">${creatorUrl ? `<a href="${escapeAttr(creatorUrl)}" target="_blank" rel="noopener noreferrer">${creatorName}</a>` : creatorName}</td>
            <td class="mono">${formatParams(model.params)}</td>
            <td class="mono">${formatContext(model.context)}</td>
            ${renderVramCell(model.vram?.fp16)}
            ${renderVramCell(model.vram?.int8)}
            ${renderVramCell(model.vram?.int4)}
            ${scoreCells}
          </tr>
        `;
      }

      /* ── GPU VRAM filter ─────────────────────────── */

      async function loadGpuData() {
        if (state.gpu.list.length) {
          return;
        }
        const urls = ["gpu.json", `https://dgrieser.github.io/ai-bench/gpu.json?t=${Date.now()}`];
        for (const url of urls) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              continue;
            }
            const list = await response.json();
            if (Array.isArray(list) && list.length) {
              initGpuBar(list);
              return;
            }
          } catch (err) {
            // try next source; the GPU filter is optional
          }
        }
      }

      function initGpuBar(list) {
        state.gpu.list = list
          .filter((gpu) => gpu && gpu.model && Number.isFinite(Number(gpu.vram_gb)))
          .map((gpu) => ({
            manufacturer: String(gpu.manufacturer || ""),
            model: String(gpu.model),
            vram_gb: Number(gpu.vram_gb),
            release: typeof gpu.release === "string" ? gpu.release : ""
          }))
          .sort((a, b) =>
            a.manufacturer.localeCompare(b.manufacturer) ||
            a.model.localeCompare(b.model, undefined, { numeric: true }));

        if (!state.gpu.list.length) {
          return;
        }
        ui.gpuBar.hidden = false;
        ui.controls.classList.add("has-gpu");
        updateFilterColumns();
        if (!state.gpu.eventsBound) {
          bindGpuEvents();
          state.gpu.eventsBound = true;
        }
      }

      function bindGpuEvents() {
        ui.gpuVendor.addEventListener("change", (event) => {
          const vendor = event.target.value;
          state.gpu.vendor = vendor;
          if (vendor === "custom") {
            state.gpu.custom = true;
            state.gpu.selected = null;
            ui.gpuModel.value = "";
            setGpuCountDisabled(true);
            closeGpuList();
            updateFilterGlow();
            ui.gpuVram.focus();
            return;
          }
          state.gpu.custom = false;
          setGpuCountDisabled(false);
          if (state.gpu.selected && vendor !== "all" && state.gpu.selected.manufacturer !== vendor) {
            state.gpu.selected = null;
            ui.gpuModel.value = "";
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          updateFilterGlow();
          if (!ui.gpuModelList.hidden || document.activeElement === ui.gpuModel) {
            openGpuList();
          }
        });

        ui.gpuModel.addEventListener("focus", () => {
          const keepAll = Boolean(state.gpu.selected && ui.gpuModel.value === state.gpu.selected.model);
          openGpuList(keepAll);
        });

        ui.gpuModel.addEventListener("input", () => {
          if (state.gpu.selected && ui.gpuModel.value !== state.gpu.selected.model) {
            state.gpu.selected = null;
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          openGpuList();
        });

        ui.gpuModel.addEventListener("blur", () => {
          closeGpuList();
          if (state.gpu.selected) {
            ui.gpuModel.value = state.gpu.selected.model;
          }
        });

        ui.gpuModel.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeGpuList();
            return;
          }
          if (ui.gpuModelList.hidden && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
            event.preventDefault();
            openGpuList();
            return;
          }
          const count = state.gpu.visible.length;
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            if (!count) {
              return;
            }
            const step = event.key === "ArrowDown" ? 1 : -1;
            state.gpu.activeIndex = (state.gpu.activeIndex + step + count) % count;
            updateActiveGpuOption();
          } else if (event.key === "Enter") {
            const pick = state.gpu.activeIndex >= 0
              ? state.gpu.visible[state.gpu.activeIndex]
              : (count === 1 ? state.gpu.visible[0] : null);
            if (pick) {
              event.preventDefault();
              gpuSelect(pick);
            }
          }
        });

        ui.gpuModelList.addEventListener("mousedown", (event) => event.preventDefault());
        ui.gpuModelList.addEventListener("click", (event) => {
          const option = event.target.closest(".gpu-option");
          if (!option) {
            return;
          }
          const gpu = state.gpu.visible[Number(option.dataset.index)];
          if (gpu) {
            gpuSelect(gpu);
          }
        });

        ui.gpuClear.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          gpuResetBar();
          applyAndRender();
        });

        ui.gpuCountDown.addEventListener("click", () => gpuSetCount(state.gpu.count - 1));
        ui.gpuCountUp.addEventListener("click", () => gpuSetCount(state.gpu.count + 1));
        ui.gpuCount.addEventListener("change", () => gpuSetCount(parseInt(ui.gpuCount.value, 10)));

        ui.gpuReserveDown.addEventListener("click", () => gpuSetReserve(reservePercent() - RESERVE_STEP));
        ui.gpuReserveUp.addEventListener("click", () => gpuSetReserve(reservePercent() + RESERVE_STEP));
        ui.gpuReserve.addEventListener("change", () => gpuSetReserve(parseInt(ui.gpuReserve.value, 10)));

        ui.gpuVram.addEventListener("input", () => {
          const value = parseFloat(ui.gpuVram.value.replace(",", "."));
          state.gpu.custom = true;
          state.gpu.selected = null;
          state.gpu.vendor = "custom";
          ui.gpuVendor.value = "custom";
          ui.gpuModel.value = "";
          setGpuCountDisabled(true);
          gpuSetBudget(Number.isFinite(value) && value > 0 ? value : null);
        });
      }

      function gpuVisibleList(showAll) {
        const query = showAll ? "" : ui.gpuModel.value.trim().toLowerCase();
        const vendor = state.gpu.vendor;
        return state.gpu.list.filter((gpu) =>
          (vendor === "all" || vendor === "custom" || gpu.manufacturer === vendor) &&
          (!query || gpu.model.toLowerCase().includes(query) || gpu.manufacturer.toLowerCase().includes(query)));
      }

      function openGpuList(showAll = false) {
        renderGpuList(showAll);
        ui.gpuModelList.hidden = false;
        ui.gpuModel.setAttribute("aria-expanded", "true");
      }

      function closeGpuList() {
        ui.gpuModelList.hidden = true;
        ui.gpuModel.setAttribute("aria-expanded", "false");
        state.gpu.activeIndex = -1;
      }

      function renderGpuList(showAll = false) {
        const items = gpuVisibleList(showAll);
        state.gpu.visible = items;
        state.gpu.activeIndex = -1;
        if (!items.length) {
          ui.gpuModelList.innerHTML = `<div class="gpu-combo-empty">No matching GPU</div>`;
          return;
        }
        ui.gpuModelList.innerHTML = items.map((gpu, index) => {
          const selected = state.gpu.selected === gpu;
          const vendorTag = gpu.manufacturer === "NVIDIA" ? "NV" : gpu.manufacturer;
          return `<div class="gpu-option${selected ? " is-selected" : ""}" role="option" aria-selected="${selected}" data-index="${index}">
            <span class="gpu-opt-vendor">${escapeHtml(vendorTag)}</span>
            <span class="gpu-opt-name">${escapeHtml(gpu.model)}</span>
            <span class="gpu-opt-vram">${escapeHtml(String(gpu.vram_gb))}&thinsp;GB</span>
            <span class="gpu-opt-date">${escapeHtml(formatGpuRelease(gpu.release))}</span>
          </div>`;
        }).join("");
      }

      function updateActiveGpuOption() {
        ui.gpuModelList.querySelectorAll(".gpu-option").forEach((el, index) => {
          const active = index === state.gpu.activeIndex;
          el.classList.toggle("active", active);
          if (active) {
            el.scrollIntoView({ block: "nearest" });
          }
        });
      }

      function gpuSelect(gpu) {
        state.gpu.selected = gpu;
        state.gpu.custom = false;
        ui.gpuModel.value = gpu.model;
        // Follow the pick: point the vendor select at the card's own maker so the
        // two fields never disagree (falls back to "any" for unlisted vendors).
        const vendor = [...ui.gpuVendor.options].some((option) => option.value === gpu.manufacturer)
          ? gpu.manufacturer
          : "all";
        state.gpu.vendor = vendor;
        ui.gpuVendor.value = vendor;
        setGpuCountDisabled(false);
        closeGpuList();
        gpuUpdateBudgetFromSelection();
      }

      function gpuSetCount(next) {
        const clamped = Math.max(1, Math.min(16, Math.round(next) || 1));
        state.gpu.count = clamped;
        ui.gpuCount.value = String(clamped);
        if (state.gpu.selected) {
          gpuUpdateBudgetFromSelection();
        }
      }

      // Reserve is stored as a fraction but edited in whole percent steps.
      const RESERVE_STEP = 5;
      const RESERVE_MAX = 90;

      function reservePercent() {
        return Math.round(state.gpu.reserve * 100);
      }

      function gpuSetReserve(nextPercent) {
        const rounded = Math.round(Number(nextPercent) / RESERVE_STEP) * RESERVE_STEP;
        const clamped = Math.max(0, Math.min(RESERVE_MAX, Number.isFinite(rounded) ? rounded : 0));
        state.gpu.reserve = clamped / 100;
        ui.gpuReserve.value = `${clamped}%`;
        applyAndRender();
      }

      function gpuUpdateBudgetFromSelection() {
        const gpu = state.gpu.selected;
        const total = gpu ? gpu.vram_gb * state.gpu.count : null;
        ui.gpuVram.value = total ? String(total) : "";
        gpuSetBudget(total);
      }

      function gpuSetBudget(budget) {
        state.gpu.budget = Number.isFinite(budget) && budget > 0 ? budget : null;
        applyAndRender();
      }

      // Usable VRAM: total minus the reserved share. Everything that judges
      // whether a model fits works off this, not the raw total.
      function gpuUsableBudget() {
        const budget = state.gpu.budget;
        if (!budget) {
          return null;
        }
        const usable = budget * (1 - state.gpu.reserve);
        return usable > 0 ? usable : null;
      }

      function formatGb(value) {
        return Number.isFinite(value) ? String(Math.round(value * 10) / 10) : "—";
      }

      function updateReserveHint() {
        if (!ui.gpuTotal) {
          return;
        }
        const budget = state.gpu.budget;
        if (!budget || !state.gpu.reserve) {
          ui.gpuTotal.removeAttribute("title");
          return;
        }
        const pct = Math.round(state.gpu.reserve * 100);
        ui.gpuTotal.title = `${formatGb(gpuUsableBudget())} GB usable — ${pct}% of ${formatGb(budget)} GB reserved`;
      }

      function setGpuCountDisabled(disabled) {
        ui.gpuStepper.classList.toggle("disabled", disabled);
        ui.gpuCount.disabled = disabled;
        ui.gpuCountDown.disabled = disabled;
        ui.gpuCountUp.disabled = disabled;
      }

      function gpuResetBar() {
        state.gpu.vendor = "all";
        state.gpu.selected = null;
        state.gpu.count = 1;
        state.gpu.custom = false;
        state.gpu.budget = null;
        state.gpu.reserve = 0;
        if (!ui.gpuBar || ui.gpuBar.hidden) {
          return;
        }
        ui.gpuReserve.value = "0%";
        ui.gpuVendor.value = "all";
        ui.gpuModel.value = "";
        ui.gpuCount.value = "1";
        ui.gpuVram.value = "";
        setGpuCountDisabled(false);
        closeGpuList();
      }

      const GPU_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function formatGpuRelease(iso) {
        if (!iso) {
          return "";
        }
        const [year, month] = iso.split("-");
        const monthIndex = Number(month);
        if (Number.isFinite(monthIndex) && monthIndex >= 1 && monthIndex <= 12) {
          return `${GPU_MONTHS[monthIndex - 1]} ${year}`;
        }
        return year || "";
      }

      // Range-colors a VRAM requirement against the active GPU budget:
      // green while comfortable, sliding to amber as it approaches 100%,
      // struck through when it exceeds the budget.
      function renderVramCell(raw) {
        const html = formatVram(raw);
        const budget = gpuUsableBudget();
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!budget || !Number.isFinite(num)) {
          return `<td class="mono">${html}</td>`;
        }
        // With a reserve set, the tooltip names the usable budget so the
        // shading and the total in the filter bar don't look contradictory.
        const budgetLabel = state.gpu.reserve
          ? `${formatGb(budget)} GB usable (${Math.round(state.gpu.reserve * 100)}% of ${formatGb(state.gpu.budget)} GB reserved)`
          : `${formatGb(budget)} GB budget`;
        const ratio = num / budget;
        if (ratio > 1) {
          return `<td class="mono vram-over" title="Needs ${num} GB — over the ${budgetLabel}">${html}</td>`;
        }
        const t = Math.max(0, Math.min(1, (ratio - 0.55) / 0.45));
        const hue = Math.round(150 - t * 130);
        return `<td class="mono vram-fit" style="--fit-h:${hue}" title="${Math.round(ratio * 100)}% of ${budgetLabel}">${html}</td>`;
      }

      function updateMeta() {
        const shown = state.filteredModels.length;
        const total = state.data.models.length;
        ui.resultCount.textContent = `${shown} of ${total} models`;
        const shownCreators = new Set(state.filteredModels.map((m) => m.creatorName)).size;
        const totalCreators = new Set(state.data.models.map((m) => m.creator?.name || "Unknown")).size;
        ui.creatorCount.textContent = `${shownCreators} of ${totalCreators} creators`;
        const shownBenchmarks = visibleBenchmarkKeys().length;
        const totalBenchmarks = state.benchmarkKeys.length;
        ui.benchmarkCount.textContent = shownBenchmarks === totalBenchmarks
          ? `${totalBenchmarks} benchmarks`
          : `${shownBenchmarks} of ${totalBenchmarks} benchmarks`;
      }

      function getTopScoresByBenchmark(models) {
        const topScores = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((model) => toNumber(model.scores?.[key]))
            .filter((value) => Number.isFinite(value));
          topScores[key] = values.length ? Math.max(...values) : Number.NaN;
        });
        return topScores;
      }

      function getScoreRangesByBenchmark(models) {
        const ranges = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((m) => toNumber(m.scores?.[key]))
            .filter((v) => Number.isFinite(v));
          if (!values.length) { ranges[key] = null; return; }
          const top = Math.max(...values);
          const nonTop = values.filter((v) => !nearlyEqual(v, top));
          ranges[key] = {
            top,
            second: nonTop.length ? Math.max(...nonTop) : null,
            min: nonTop.length ? Math.min(...nonTop) : null
          };
        });
        return ranges;
      }

      function scoreToGrey(score, range) {
        if (!range || range.second === null || !Number.isFinite(score)) return null;
        const { second, min } = range;
        // t = 0 at min (most muted), t = 1 at second-best (most prominent)
        const t = nearlyEqual(second, min) ? 1 : Math.max(0, Math.min(1, (score - min) / (second - min)));
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        // light: #8b8b8b (channel 139) → #111111 (channel 17)
        // dark:  #6e6e6e (channel 110) → #aaaaaa (channel 170) — flipped & lifted for dark bg
        const channel = isDark
          ? Math.round(110 + 60 * t)
          : Math.round(139 - 122 * t);
        const hex = channel.toString(16).padStart(2, "0");
        return `#${hex}${hex}${hex}`;
      }

      function getOrderedBenchmarkKeys(benchmarks) {
        return Object.keys(benchmarks || {});
      }

      function getBenchmarkLabel(key) {
        return state.data?.benchmarks?.[key]?.short_name || state.data?.benchmarks?.[key]?.name || key;
      }

      // Column headers use short_name to stay narrow; lists with room (the
      // benchmark picker) use the full name.
      function getBenchmarkFullName(key) {
        return state.data?.benchmarks?.[key]?.name || getBenchmarkLabel(key);
      }

      function getBenchmarkIcon(key) {
        const icon = state.data?.benchmarks?.[key]?.icon_svg;
        if (typeof icon !== "string") {
          return "";
        }
        if (icon.trim().startsWith("<svg")) {
          return icon;
        }
        return icon;
      }

      function renderBenchmarkIcon(key) {
        const icon = getBenchmarkIcon(key);
        if (!icon) {
          return "";
        }
        if (icon.startsWith("<svg")) {
          return icon;
        }
        return `<img class="benchmark-icon" src="${escapeAttr(icon)}" alt="" aria-hidden="true">`;
      }

      function getBestInTableByModel(models) {
        const result = new Map();
        models.forEach((model) => result.set(model, new Set()));

        if (!models.length) {
          return result;
        }

        const topByBenchmark = getTopScoresByBenchmark(models);
        const topContext = Math.max(...models.map((m) => parseUnitNumber(m.context)).filter((v) => Number.isFinite(v)));

        models.forEach((model) => {
          const flags = result.get(model);
          if (!flags) {
            return;
          }

          const contextValue = parseUnitNumber(model.context);
          if (Number.isFinite(contextValue) && Number.isFinite(topContext) && nearlyEqual(contextValue, topContext)) {
            flags.add("context");
          }

          Object.keys(topByBenchmark).forEach((key) => {
            const value = toNumber(model.scores?.[key]);
            const top = topByBenchmark[key];
            if (Number.isFinite(value) && Number.isFinite(top) && nearlyEqual(value, top)) {
              flags.add(key);
            }
          });
        });

        return result;
      }

      function formatContext(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        const match = str.match(/^(\d+\.?\d*)([A-Za-z]+)$/);
        if (!match) return escapeHtml(str);
        const [, num, unit] = match;
        return `${escapeHtml(num)}<span class="p-letter">${escapeHtml(unit)}</span>`;
      }

      function formatVram(raw) {
        if (raw == null || raw === "") return "-";
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!Number.isFinite(num)) return escapeHtml(String(raw));
        return `${escapeHtml(String(num))}<span class="p-unit">&thinsp;</span><span class="p-letter">GB</span>`;
      }

      function formatParams(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        // Matches "123B", "117B-A5.1B", "1T-A32B", unknown-active forms like
        // "2.8T-A~B", and standalone effective forms like "E4B".
        const mainMatch = str.match(/^(\d+\.?\d*)([BT])(?:-(A)(\d+\.?\d*|~)([BT]))?$/i);
        if (mainMatch) {
          const [, mainNum, mainUnit, aPrefix, activeNum, activeUnit] = mainMatch;
          let html = `${escapeHtml(mainNum)}<span class="p-letter">${escapeHtml(mainUnit)}</span>`;
          if (aPrefix) {
            html += `<span class="p-unit">&thinsp;-&thinsp;</span>${escapeHtml(aPrefix)}${escapeHtml(activeNum)}<span class="p-letter">${escapeHtml(activeUnit)}</span>`;
          }
          return html;
        }

        const effectiveMatch = str.match(/^(E)(\d+\.?\d*)(B)$/i);
        if (effectiveMatch) {
          const [, effectivePrefix, effectiveNum, effectiveUnit] = effectiveMatch;
          return `${escapeHtml(effectivePrefix)}${escapeHtml(effectiveNum)}<span class="p-letter">${escapeHtml(effectiveUnit)}</span>`;
        }

        return escapeHtml(str);
      }

      function formatScore(value) {
        if (!Number.isFinite(value)) {
          return '<span class="num na">&mdash;&nbsp;</span>';
        }
        return value.toFixed(1);
      }

      function toNumber(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          return value;
        }
        if (typeof value === "string") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : Number.NaN;
        }
        return Number.NaN;
      }

      function parseUnitNumber(raw) {
        if (raw == null) {
          return Number.NaN;
        }

        const text = String(raw).trim().toLowerCase();
        const match = text.match(/([0-9]*\.?[0-9]+)\s*([a-z]+)/);
        if (!match) {
          const plain = Number(text.replace(/,/g, ""));
          return Number.isFinite(plain) ? plain : Number.NaN;
        }

        const value = Number(match[1]);
        const unit = match[2];
        if (!Number.isFinite(value)) {
          return Number.NaN;
        }

        const multipliers = {
          k: 1e3,
          m: 1e6,
          b: 1e9,
          t: 1e12
        };

        const tail = unit[0];
        if (tail in multipliers) {
          return value * multipliers[tail];
        }

        return value;
      }

      function nearlyEqual(a, b) {
        return Math.abs(a - b) < 1e-9;
      }

      function sortModeValue(key, direction) {
        return `${key}::${direction}`;
      }

      function parseSortModeValue(value) {
        const parts = String(value).split("::");
        const key = parts[0] || defaultSortKey();
        const direction = parts[1] === "asc" ? "asc" : "desc";
        return { key, direction };
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function debounce(fn, delayMs) {
        let timer;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delayMs);
        };
      }
    })();
  </script>
</body>
</html>
