        setTimeout(() => document.documentElement.classList.remove("theme-transitioning"), 400);
        if (isDark) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        }
      });

      async function loadData() {
        try {
          const data = await fetchRemoteData();
          validateData(data);
          init(data);
        } catch (err) {
          showImportOnly(`Unable to load llm.json automatically. ${err.message}`);
        }
      }

      async function fetchRemoteText(url) {
        const cacheBustedUrl = `${url}?t=${Date.now()}`;
        const response = await fetch(cacheBustedUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }
        return response.text();
      }

      async function fetchRemoteData() {
        return JSON.parse(await fetchRemoteText(DATA_URL));
      }

      function showImportOnly(message) {
        // The toolbar now lives inside the filters panel, so keep the panel
        // visible and hide only the toggle and filter fields — otherwise the
        // import pills/button would be hidden along with the panel.
        ui.filtersPanel.hidden = false;
        ui.filtersToggle.style.display = "none";
        ui.controls.style.display = "none";
        ui.toolbar.hidden = false;
        ui.status.classList.add("error");
        ui.status.textContent = message;
        ui.resultCount.textContent = "No data loaded";
        ui.benchmarkCount.textContent = "Import required";
      }

      // Collapse/expand the filter fields. overflow on the collapse wrapper is
      // hidden while animating (so the 0fr squeeze clips) and set visible once
      // open, so field dropdowns (GPU combo, compare list) aren't clipped.
      function setFiltersCollapsed(collapsed, animate) {
        ui.filtersPanel.classList.toggle("collapsed", collapsed);
        ui.filtersToggle.setAttribute("aria-expanded", String(!collapsed));

        if (collapsed) {
          ui.controlsCollapse.classList.remove("is-open");
          return;
        }
        if (animate && !prefersReducedMotion()) {
          ui.controlsCollapse.addEventListener("transitionend", function onEnd(e) {
            if (e.propertyName !== "grid-template-rows") return;
            ui.controlsCollapse.removeEventListener("transitionend", onEnd);
            if (!ui.filtersPanel.classList.contains("collapsed")) {
              ui.controlsCollapse.classList.add("is-open");
            }
          });
        } else {
          ui.controlsCollapse.classList.add("is-open");
        }
      }

      // Width a filter slot wants before another column is worth having. It is
      // a comfort target, not a hard floor: 3 columns need ~1010px of viewport,
      // 2 need ~650px, and below that the panel goes single-column.
      const FILTER_SLOT_TARGET = 300;

      // Rows fill left to right, and the column count is the widest that both
      // fits the width and leaves no widow — a last row less than half full.
      // Exact divisors qualify first, so six slots still go 3/3, 2/2/2 or 1×6;
      // a count with no useful divisor settles for a short last row instead of
      // collapsing to a single column, so seven go 4/3. The ceil(n/2) cap keeps
      // the whole set off one line either way, which is what rules out 5+1.
      // Fields flow in DOM order; none is pinned to a row.
      function updateFilterColumns() {
        // One slot per top-level field; a field cluster counts once, not once
        // per member.
        const slots = [...ui.controls.querySelectorAll(".field, .field-cluster")]
          .filter((el) => !el.closest("[hidden]") && !el.parentElement.closest(".field-cluster"));
        // Full-width fields bring their own row, so they don't count toward the
        // split of the regular slots.
        const inlineSlots = slots.filter((el) => !el.classList.contains("field-full"));
        if (!inlineSlots.length) {
          return;
        }

        const styles = getComputedStyle(ui.controls);
        const gap = parseFloat(styles.columnGap) || 0;
        const available = ui.controls.getBoundingClientRect().width
          - (parseFloat(styles.paddingLeft) || 0)
          - (parseFloat(styles.paddingRight) || 0);
        const fits = Math.max(1, Math.floor((available + gap) / (FILTER_SLOT_TARGET + gap)));
        const limit = Math.min(fits, Math.ceil(inlineSlots.length / 2));

        let columns = 1;
        for (let candidate = limit; candidate >= 1; candidate -= 1) {
          const lastRow = inlineSlots.length % candidate;
          if (lastRow === 0 || lastRow * 2 >= candidate) {
            columns = candidate;
            break;
          }
        }
        ui.controls.style.setProperty("--filter-cols", String(columns));
      }

      function prefersReducedMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function validateData(data) {
        if (!data || typeof data !== "object") {
          throw new Error("Invalid JSON root.");
        }
        if (!Array.isArray(data.models) || !data.benchmarks || typeof data.benchmarks !== "object") {
          throw new Error("Expected models[] and benchmarks{}.");
        }
      }

      function init(data) {
        state.data = data;
        state.benchmarkKeys = getOrderedBenchmarkKeys(data.benchmarks);
        state.sortGroups = Array.isArray(data.sortGroups) ? data.sortGroups : [];
        // Drop hidden keys that no longer exist in the freshly loaded data.
        state.filters.hiddenBenchmarks = state.filters.hiddenBenchmarks
          .filter((key) => state.benchmarkKeys.includes(key));
        state.sort.key = defaultSortKey();
        state.sort.direction = "desc";
        ensureSortVisible();

        const title = data.title || "OpenBench Index";
        ui.title.textContent = title;
        syncTitleLines();
        document.title = title;
        ui.subtitle.textContent = data.subtitle || "";
        ui.subtitle.hidden = !data.subtitle;
        ui.filtersPanel.hidden = false;
        // Collapsed on mobile by default, expanded on desktop.
        setFiltersCollapsed(window.matchMedia("(max-width: 860px)").matches, false);
        // Enable collapse/chevron transitions only after the initial state paints.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => ui.filtersPanel.classList.add("ready"));
        });
        ui.toolbar.hidden = false;
        ui.status.classList.remove("error");

        populateFilters();
        updateFilterColumns();
        if (!state.eventsBound) {
          bindEvents();
          state.eventsBound = true;
        }
        applyAndRender();
        loadGpuData();
      }

      // Open/close plumbing shared by the checkbox-list widgets (model compare,
      // benchmark visibility). onToggle gets the clicked item's data-value.
      function bindMultiSelectWidget(el, onToggle) {
        let widgetWasOpen = false;
        el.addEventListener("mousedown", () => {
          widgetWasOpen = el.classList.contains("open");
        });

        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const item = e.target.closest(".model-compare-item");
          if (item) {
            onToggle(item.dataset.value);
            return;
          }
          // Working the search box is not a click on the list itself.
          if (e.target.closest(".model-compare-search")) return;
          // Opening is handled by the focus event; only close here if it was already open
          if (widgetWasOpen) {
            el.classList.remove("open");
          }
        });

        el.addEventListener("focus", () => {
          el.classList.add("open");
          focusOptionSearch(el);
        });

        // focusout rather than blur: focus lives in the search box most of the
        // time the list is open, and blur does not bubble out of it.
        el.addEventListener("focusout", (e) => {
          if (!el.contains(e.relatedTarget)) {
            el.classList.remove("open");
          }
        });

        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.classList.contains("model-compare-search-input")) {
            const first = el.querySelector(".model-compare-item:not(.is-filtered-out)");
            if (first) {
              e.preventDefault();
              onToggle(first.dataset.value);
            }
            return;
          }
          if (e.key !== "Escape") return;
          el.classList.remove("open");
          if (el.contains(document.activeElement)) document.activeElement.blur();
        });

        let hoverOpenTimer = null;
        el.addEventListener("mouseenter", () => {
          if (!el.classList.contains("open")) {
            hoverOpenTimer = setTimeout(() => {
              el.classList.add("open");
            }, 1000);
          }
        });
        el.addEventListener("mouseleave", () => {
          clearTimeout(hoverOpenTimer);
        });

        el.addEventListener("wheel", (e) => {
          if (!el.classList.contains("open")) {
            e.preventDefault();
            el.classList.add("open");
            el.focus();
          }
        }, { passive: false });

        document.addEventListener("click", () => {
          el.classList.remove("open");
        });
      }

      // Header both checkbox widgets share: the summary line that stands in
      // for the list while it is closed, and the search box that narrows the
      // options while it is open. Call after the items have been written.
      // `reset` ({label, tip, action}) becomes the floating button in the
      // bottom-right corner of the open list that resets the selection.
      function decorateMultiSelectWidget(el, placeholder, reset) {
        const empty = document.createElement("div");
        empty.className = "model-compare-empty";
        empty.textContent = "No matches";
        empty.hidden = true;
        el.appendChild(empty);

        const summary = document.createElement("div");
        summary.className = "model-compare-summary";
        el.insertBefore(summary, el.firstChild);

        const search = document.createElement("div");
        search.className = "model-compare-search";
        const input = document.createElement("input");
        input.type = "text";
        input.className = "model-compare-search-input";
        input.placeholder = placeholder;
        input.setAttribute("aria-label", placeholder);
        input.autocomplete = "off";
        input.spellcheck = false;
        search.appendChild(input);

        const clearBtn = document.createElement("button");
        clearBtn.type = "button";
        clearBtn.className = "model-compare-search-clear";
        clearBtn.textContent = "⌫";
        clearBtn.setAttribute("aria-label", "Clear filter text");
        clearBtn.setAttribute("data-tip", "Empty the filter box and show every option again. The selection is kept.");
        clearBtn.addEventListener("mousedown", (e) => {
          e.preventDefault(); // keeps focus inside the widget so the list stays open
          e.stopPropagation();
        });
        clearBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          clearOptionSearch(el);
          focusOptionSearch(el);
        });
        search.appendChild(clearBtn);
        el.insertBefore(search, el.firstChild);

        // The open-list twin of the selection-clear × (which hides while the
        // list is open): rides the bottom-right corner and resets the list.
        const resetWrap = document.createElement("div");
        resetWrap.className = "model-compare-reset";
        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "model-compare-reset-btn";
        resetBtn.textContent = "×";
        resetBtn.setAttribute("aria-label", reset.label);
        resetBtn.setAttribute("data-tip", reset.tip);
        resetBtn.addEventListener("mousedown", (e) => {
          e.preventDefault(); // keeps focus inside the widget so the list stays open
          e.stopPropagation();
        });
        resetBtn.addEventListener("click", (e) => {
          e.stopPropagation(); // the widget's own click handler would close the list
          reset.action();
        });
        resetWrap.appendChild(resetBtn);
        el.appendChild(resetWrap);

        input.addEventListener("input", () => filterMultiSelectOptions(el));
        filterMultiSelectOptions(el);
      }

      // Purely a view over the options — selected values are never read or
      // written here, so a narrowed list still carries every earlier pick.
      function filterMultiSelectOptions(el) {
        const input = el.querySelector(".model-compare-search-input");
        const query = (input ? input.value : "").trim().toLowerCase();
        let shown = 0;
        el.querySelectorAll(".model-compare-item").forEach((item) => {
          const hit = !query || item.textContent.toLowerCase().includes(query);
          item.classList.toggle("is-filtered-out", !hit);
          if (hit) shown += 1;
        });
        const empty = el.querySelector(".model-compare-empty");
        if (empty) empty.hidden = shown > 0;
      }

      function clearOptionSearch(el) {
        const input = el.querySelector(".model-compare-search-input");
        if (!input || !input.value) return;
        input.value = "";
        filterMultiSelectOptions(el);
      }

      // Typing straight into the search box is the point of opening the list,
      // but only where a keyboard is already out: focusing it on touch raises
      // the on-screen keyboard over the options it is meant to filter.
      function focusOptionSearch(el) {
        if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
        const input = el.querySelector(".model-compare-search-input");
        if (input) input.focus();
      }

      function bindImportEvents() {
        bindMultiSelectWidget(ui.modelCompare, (name) => {
          const idx = state.filters.selectedModels.indexOf(name);
          if (idx >= 0) {
            state.filters.selectedModels.splice(idx, 1);
          } else {
            state.filters.selectedModels.push(name);
          }
          updateCompareWidget();
          applyAndRender();
        });

        bindMultiSelectWidget(ui.benchmarkPick, (key) => {
          toggleBenchmark(key);
        });

        ui.importBtn.addEventListener("click", () => {
          ui.importFile.click();
        });

        ui.importFile.addEventListener("change", async (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          try {
            const text = await file.text();
            const imported = JSON.parse(text);
            validateData(imported);
            state.filters.search = "";
            state.filters.selectedModels = [];
            state.filters.hiddenBenchmarks = [];
            state.filters.addedWindow = "all";
            state.filters.addedFrom = "";
            state.filters.addedTo = "";
            state.sort.key = defaultSortKey();
            state.sort.direction = "desc";
            ui.search.value = "";
            ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
            init(imported);
          } catch (err) {
            ui.content.innerHTML = `<div class="status error">Import failed: ${escapeHtml(err.message || "Invalid JSON file.")}</div>`;
          } finally {
            ui.importFile.value = "";
          }
        });
      }

      function populateFilters() {
        const modelNames = [...new Set(state.data.models.map((m) => m.name || "Unknown"))].sort((a, b) => a.localeCompare(b));
        ui.modelCompare.innerHTML = modelNames.map((name) => {
          const sel = state.filters.selectedModels.includes(name);
          return `<div class="model-compare-item${sel ? " selected" : ""}" data-value="${escapeHtml(name)}" role="option" aria-selected="${sel}">
            <span class="model-compare-check"></span>
            <span>${escapeHtml(name)}</span>
          </div>`;
        }).join("");

        decorateMultiSelectWidget(ui.modelCompare, "Filter models", {
          label: "Unselect all models",
          tip: "Unselect every model and show the full table.",
          action: () => {
            state.filters.selectedModels = [];
            updateCompareWidget();
            applyAndRender();
          }
        });
        updateCompareSummary();

        populateBenchmarkPicker();

        populateAddedOptions();

        populateSortOptions();
      }

      /* ── Date-added window ────────────────────────── */

      // `days` counts calendar days *including* today, so 7 covers the same
      // stretch as the NEW badge (see NEW_DAYS) and the two agree on which
      // models are recent. Calendar years are appended from the data, so a year
      // is offered exactly while some model carries it.
      const ADDED_WINDOWS = [
        { value: "all", label: "Any date added" },
        { value: "d1", label: "Today", days: 1 },
        { value: "d3", label: "Last 3 days", days: 3 },
        { value: "d7", label: "Last 7 days", days: 7 },
        { value: "d30", label: "Last 30 days", days: 30 },
        { value: "d90", label: "Last 90 days", days: 90 },
        { value: "d180", label: "Last 6 months", days: 180 },
        { value: "d365", label: "Last 12 months", days: 365 }
      ];

      const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

      // The stamp this filter reads, or "" when the model carries none it can
      // use — an undated model cannot be placed in a window at all.
      function modelAddedDate(model) {
        const raw = model.date_added;
        return typeof raw === "string" && ISO_DATE.test(raw) ? raw : "";
      }

      // Local midnight N days back, in the same YYYY-MM-DD shape the stamps use
      // — which is what lets modelPassesFilters compare them as plain strings.
      function isoDaysAgo(days) {
        const day = new Date();
        day.setHours(0, 0, 0, 0);
        day.setDate(day.getDate() - days);
        const pad = (value) => String(value).padStart(2, "0");
        return `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`;
      }

      function populateAddedOptions() {
        const years = [...new Set(state.data.models
          .map((model) => modelAddedDate(model).slice(0, 4))
          .filter(Boolean))].sort().reverse();

        ui.addedWindow.innerHTML = [
          ...ADDED_WINDOWS.map((option) =>
            `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`),
          ...years.map((year) => `<option value="y${escapeHtml(year)}">${escapeHtml(year)}</option>`)
        ].join("");

        // A year offered by previously loaded data may be gone from this set.
        const offered = [...ui.addedWindow.options].some((option) => option.value === state.filters.addedWindow);
        setAddedWindow(offered ? state.filters.addedWindow : "all");
      }

      // Resolves the picked window into the bounds that filter. A relative
      // window leaves the upper bound open and is re-resolved on every call, so
      // "last 7 days" stays honest across a day boundary.
      function setAddedWindow(value) {
        const preset = ADDED_WINDOWS.find((entry) => entry.value === value);
        const year = /^y(\d{4})$/.exec(value);

        state.filters.addedWindow = value;
        if (preset?.days) {
          state.filters.addedFrom = isoDaysAgo(preset.days - 1);
          state.filters.addedTo = "";
        } else if (year) {
          state.filters.addedFrom = `${year[1]}-01-01`;
          state.filters.addedTo = `${year[1]}-12-31`;
        } else {
          state.filters.addedFrom = "";
          state.filters.addedTo = "";
        }
        ui.addedWindow.value = value;
      }

      // Sort options cover the fixed columns, the sort groups and every
      // *visible* benchmark — hidden benchmarks drop out so the dropdown can't
      // sort on a column that isn't on screen.
      function populateSortOptions() {
        const fixedSortOptions = FIXED_COLUMNS.map((column) => ({
          key: column.key,
          label: columnSortLabel(column.key)
        }));

        const groupSortOptions = (state.sortGroups || []).map((group) => ({
          key: groupSortKey(group.key),
          label: group.label || group.key
        }));

        const benchmarkSortOptions = visibleBenchmarkKeys().map((key) => ({
          key,
          label: getBenchmarkFullName(key)
        }));

        const sortOptions = [...fixedSortOptions, ...groupSortOptions, ...benchmarkSortOptions];
        ui.sortMode.innerHTML = sortOptions.map((option) => {
          const ascLabel = `${option.label} ↑`;
          const descLabel = `${option.label} ↓`;
          return [
            `<option value="${escapeHtml(sortModeValue(option.key, "desc"))}">${escapeHtml(descLabel)}</option>`,
            `<option value="${escapeHtml(sortModeValue(option.key, "asc"))}">${escapeHtml(ascLabel)}</option>`
          ].join("");
        }).join("");

        ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
      }

      /* ── Benchmark visibility ─────────────────────── */

      function isBenchmarkVisible(key) {
        return !state.filters.hiddenBenchmarks.includes(key);
      }

      function visibleBenchmarkKeys() {
        return state.benchmarkKeys.filter(isBenchmarkVisible);
      }

      function populateBenchmarkPicker() {
        ui.benchmarkPick.innerHTML = state.benchmarkKeys.map((key) => {
          const sel = isBenchmarkVisible(key);
          const name = getBenchmarkFullName(key);
          const tip = tipAttrs(benchmarkTipFields(key));
          return `<div class="model-compare-item${sel ? " selected" : ""}" data-value="${escapeHtml(key)}" role="option" aria-selected="${sel}"${tip}>
            <span class="model-compare-check"></span>
            <span>${escapeHtml(name)}</span>
          </div>`;
        }).join("");

        decorateMultiSelectWidget(ui.benchmarkPick, "Filter benchmarks", {
          label: "Show all benchmarks",
          tip: "Bring every benchmark column back into the table.",
          action: showAllBenchmarks
        });
        updateBenchmarkWidget();
      }

      function updateBenchmarkWidget() {
        ui.benchmarkPick.querySelectorAll(".model-compare-item").forEach((item) => {
          const selected = isBenchmarkVisible(item.dataset.value);
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });

        const summary = ui.benchmarkPick.querySelector(".model-compare-summary");
        if (!summary) return;
        const visible = visibleBenchmarkKeys();
        const allShown = visible.length === state.benchmarkKeys.length;
        if (allShown) {
          summary.textContent = `All ${state.benchmarkKeys.length} benchmarks`;
        } else if (!visible.length) {
          summary.textContent = "No benchmark columns";
        } else {
          summary.textContent = visible.map((key) => getBenchmarkFullName(key)).join(", ");
        }
        summary.classList.toggle("is-hint", allShown);
      }

      function toggleBenchmark(key) {
        if (!state.benchmarkKeys.includes(key)) {
          return;
        }
        const hidden = state.filters.hiddenBenchmarks;
        const idx = hidden.indexOf(key);
        if (idx >= 0) {
          hidden.splice(idx, 1);
        } else {
          hidden.push(key);
        }
        onBenchmarkVisibilityChanged();
      }

      function showAllBenchmarks() {
        if (!state.filters.hiddenBenchmarks.length) {
          return;
        }
        state.filters.hiddenBenchmarks = [];
        onBenchmarkVisibilityChanged();
      }

      function onBenchmarkVisibilityChanged() {
        // Stored benchmark column widths are dropped so the remaining columns
        // re-measure and re-share the freed space instead of compounding.
        state.benchmarkKeys.forEach((key) => delete state.columnWidths[key]);
        ensureSortVisible();
        updateBenchmarkWidget();
        populateSortOptions();
        applyAndRender();
      }

      // A hidden column can't stay the sort key: fall back to the default sort,
      // and if that is hidden too, to the first visible benchmark.
      function ensureSortVisible() {
        if (!state.benchmarkKeys.includes(state.sort.key) || isBenchmarkVisible(state.sort.key)) {
          return;
        }
        state.sort.key = defaultSortKey();
        state.sort.direction = "desc";
        if (state.benchmarkKeys.includes(state.sort.key) && !isBenchmarkVisible(state.sort.key)) {
          state.sort.key = visibleBenchmarkKeys()[0] || "name";
        }
      }

      function updateCompareWidget() {
        ui.modelCompare.querySelectorAll(".model-compare-item").forEach((item) => {
          const selected = state.filters.selectedModels.includes(item.dataset.value);
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        updateCompareSummary();
      }

      function updateCompareSummary() {
        const summary = ui.modelCompare.querySelector(".model-compare-summary");
        if (!summary) return;
        if (state.filters.selectedModels.length === 0) {
          summary.textContent = "Pick models to compare";
          summary.classList.add("is-hint");
        } else {
          summary.textContent = state.filters.selectedModels.join(", ");
          summary.classList.remove("is-hint");
        }
      }

      function bindEvents() {
        ui.filtersToggle.addEventListener("click", () => {
          setFiltersCollapsed(!ui.filtersPanel.classList.contains("collapsed"), true);
        });

        ui.search.addEventListener("input", debounce((event) => {
          state.filters.search = event.target.value.trim().toLowerCase();
          applyAndRender();
        }, 100));

        ui.clearCompare.addEventListener("mousedown", (e) => {
          e.preventDefault(); // keeps focus off modelCompare so clearing does not open it
          e.stopPropagation();
          state.filters.selectedModels = [];
          updateCompareWidget();
          applyAndRender();
        });

        ui.clearBenchmarks.addEventListener("mousedown", (e) => {
          e.preventDefault(); // keeps focus off benchmarkPick so clearing does not open it
          e.stopPropagation();
          showAllBenchmarks();
        });

        ui.addedWindow.addEventListener("change", (event) => {
          setAddedWindow(event.target.value);
          applyAndRender();
        });

        ui.clearSearch.addEventListener("click", () => {
          ui.search.value = "";
          state.filters.search = "";
          applyAndRender();
        });

        window.addEventListener("resize", debounce(() => updateFilterColumns(), 150));
        window.addEventListener("resize", debounce(() => syncTitleLines(), 100));

        ui.sortMode.addEventListener("change", (event) => {
          const nextSort = parseSortModeValue(event.target.value);
          state.sort.key = nextSort.key;
          state.sort.direction = nextSort.direction;
          applyAndRender();
        });

        ui.resetBtn.addEventListener("click", () => {
          if (!state.data) {
            return;
          }

          state.filters.search = "";
          state.filters.selectedModels = [];
          state.filters.hiddenBenchmarks = [];
          state.benchmarkKeys.forEach((key) => delete state.columnWidths[key]);
          state.sort.key = defaultSortKey();
          state.sort.direction = "desc";

          ui.search.value = "";

          ui.modelCompare.classList.remove("open");
          ui.benchmarkPick.classList.remove("open");
          clearOptionSearch(ui.modelCompare);
          clearOptionSearch(ui.benchmarkPick);
          updateCompareWidget();
          updateBenchmarkWidget();
          populateSortOptions();

          setAddedWindow("all");
          gpuResetBar();
          applyAndRender();
        });
      }

      function applyAndRender() {
        if (!state.data) {
          return;
        }

        const models = state.data.models
          .map((model) => {
            return {
              ...model,
              creatorName: creatorNameOf(model)
            };
          })
          .filter((model) => modelPassesFilters(model));

        sortModels(models);
        state.filteredModels = models;

        renderTable();
        updateMeta();
        updateFilterGlow();
      }

      // Marks controls that currently constrain the table so CSS can
      // highlight them (gradient border / glow).
      function updateFilterGlow() {
        const searchOn = Boolean(state.filters.search);
        const compareOn = state.filters.selectedModels.length > 0;
        const benchmarksOn = state.filters.hiddenBenchmarks.length > 0;
        const gpuOn = Boolean(state.gpu.budget);
        const sortOn = state.sort.key !== defaultSortKey() || state.sort.direction !== "desc";
        const vendorOn = state.gpu.vendor !== "all";
        const reserveOn = state.gpu.reserve > 0;
        const addedOn = Boolean(state.filters.addedFrom || state.filters.addedTo);

        ui.search.closest(".field")?.classList.toggle("filter-on", searchOn);
        ui.modelCompare.closest(".field")?.classList.toggle("filter-on", compareOn);
        ui.benchmarkPick.closest(".field")?.classList.toggle("filter-on", benchmarksOn);
        ui.addedWindow.closest(".field")?.classList.toggle("filter-on", addedOn);
        ui.sortMode.closest(".field")?.classList.toggle("filter-on", sortOn);
        ui.gpuVendor.closest(".field")?.classList.toggle("filter-on", vendorOn);
        ui.gpuModel.closest(".field")?.classList.toggle("filter-on", gpuOn && Boolean(state.gpu.selected));
        ui.gpuVram.closest(".field")?.classList.toggle("filter-on", gpuOn);
        ui.gpuReserve?.closest(".field")?.classList.toggle("filter-on", reserveOn);
        ui.resetBtn.classList.toggle("filter-on", searchOn || compareOn || benchmarksOn || addedOn || gpuOn || sortOn || vendorOn || reserveOn);
        updateReserveHint();
        syncHostingPresets();

        // Active-constraint count, surfaced in the toggle bar when collapsed.
        const activeCount = [searchOn, compareOn, benchmarksOn, addedOn, sortOn, gpuOn || vendorOn || reserveOn].filter(Boolean).length;
        ui.filtersCount.textContent = `${activeCount} active`;
        ui.filtersCount.hidden = activeCount === 0;

        updateExportHints();
      }

      function creatorNameOf(model) {
        return model.creator?.name || "Unknown";
      }

      // Runs both over the decorated on-screen rows and over raw upstream
      // models (see filterModelsDocument), so it must not rely on creatorName
      // having been attached already.
      function modelPassesFilters(model) {
        if (state.filters.search) {
          const haystack = `${model.name || ""} ${creatorNameOf(model)}`.toLowerCase();
          if (!haystack.includes(state.filters.search)) {
            return false;
          }
        }

        if (state.filters.selectedModels.length && !state.filters.selectedModels.includes(model.name || "Unknown")) {
          return false;
        }

        // Date-added window, both bounds inclusive. ISO stamps sort the same as
        // strings, so no parsing is needed. A model with no usable stamp cannot
        // be shown to fall inside the window, so it drops out while one is set.
        const { addedFrom, addedTo } = state.filters;
        if (addedFrom || addedTo) {
          const added = modelAddedDate(model);
          if (!added) {
            return false;
          }
          if (addedFrom && added < addedFrom) {
            return false;
          }
          if (addedTo && added > addedTo) {
            return false;
          }
        }

        // GPU VRAM budget: keep a model only if it fits at some quantization
        // level (int4 is the smallest, so min of the present values decides).
        const usableVram = gpuUsableBudget();
        if (usableVram) {
          const vram = model.vram || {};
          const requirements = [vram.int4, vram.int8, vram.fp16]
            .map(toNumber)
            .filter((value) => Number.isFinite(value));
          if (!requirements.length || Math.min(...requirements) > usableVram) {
            return false;
          }
        }

        return true;
      }

      function sortModels(models) {
        // Grouped sort: collapse several benchmarks into one priority-weighted
        // composite computed over the current (filtered) model set, then sort
        // on that single number. Computed once per sort, not per comparison.
        const group = getSortGroup(state.sort.key);
        const composite = group ? computeGroupComposite(models, group) : null;

        // "desc" always means best-first, so a lower-is-better benchmark
        // compares its numbers the other way round: ▼ puts the smallest value
        // on top and ▲ the largest. Group composites are already "how good"
        // scores, so they never flip.
        const flipped = !composite && isLowerBetter(state.sort.key);
        const directionFactor = (state.sort.direction === "asc" ? 1 : -1) * (flipped ? -1 : 1);

        models.sort((a, b) => {
          const left = composite ? composite.get(a) : valueForSort(a, state.sort.key);
          const right = composite ? composite.get(b) : valueForSort(b, state.sort.key);

          const leftMissing = left == null || Number.isNaN(left);
          const rightMissing = right == null || Number.isNaN(right);

          if (leftMissing && rightMissing) {
            return String(a.name || "").localeCompare(String(b.name || ""));
          }
          if (leftMissing) {
            return 1;
          }
          if (rightMissing) {
            return -1;
          }

          if (typeof left === "number" && typeof right === "number") {
            return (left - right) * directionFactor;
          }

          return String(left).localeCompare(String(right)) * directionFactor;
        });
      }

      function groupSortKey(key) {
        return `group:${key}`;
      }

      // Default sort comes from llm.json: data.defaultSort names either a
      // sort-group key or a plain column/benchmark key. Falls back to the
      // first sort group, then the first benchmark column.
      function defaultSortKey() {
        const groups = state.sortGroups || [];
        const configured = state.data?.defaultSort;
        if (typeof configured === "string" && configured) {
          const group = groups.find((g) => g.key === configured);
          return group ? groupSortKey(group.key) : configured;
        }
        if (groups.length) {
          return groupSortKey(groups[0].key);
        }
        return state.benchmarkKeys[0] || "name";
      }

      function getSortGroup(key) {
        if (typeof key !== "string" || !key.startsWith("group:")) {
          return null;
        }
        return (state.sortGroups || []).find((group) => groupSortKey(group.key) === key) || null;
      }

      // Per-benchmark percentile rank in [0,1] over present models. Ties share
      // the average rank. Returns null when fewer than 2 models have a score
      // (can't rank a single point — e.g. a benchmark only one model ran).
      function percentileMap(models, key) {
        const entries = [];
        models.forEach((model) => {
          const value = toNumber(model.scores?.[key]);
          if (Number.isFinite(value)) {
            entries.push({ model, value });
          }
        });
        if (entries.length < 2) {
          return null;
        }
        entries.sort((a, b) => a.value - b.value);
        const n = entries.length;
        const lower = isLowerBetter(key);
        const map = new Map();
        let i = 0;
        while (i < n) {
          let j = i;
          while (j + 1 < n && nearlyEqual(entries[j + 1].value, entries[i].value)) {
            j += 1;
          }
          const pct = ((i + j) / 2) / (n - 1); // average rank of the tie group
          for (let k = i; k <= j; k += 1) {
            // A percentile is "how good", so a lower-is-better benchmark flips:
            // the smallest value is the 1.0 end.
            map.set(entries[k].model, lower ? 1 - pct : pct);
          }
          i = j + 1;
        }
        return map;
      }

      // Group benchmark entries may be plain keys or { key, weight } objects.
      // Explicit weights express benchmark reliability; entries without one
      // fall back to geometric decay by list position (decay^i).
      function groupBenchmarkEntries(group) {
        const raw = Array.isArray(group.benchmarks) ? group.benchmarks : [];
        const decay = Number.isFinite(group.decay) ? group.decay : 0.6;
        return raw.map((entry, i) => {
          const obj = typeof entry === "string" ? { key: entry } : entry || {};
          const weight = Number.isFinite(obj.weight) ? obj.weight : Math.pow(decay, i);
          return { key: obj.key, weight };
        });
      }

      // Reliability-weighted normalized composite for a sort group.
      // - Each benchmark normalized to a percentile rank (kills scale differences).
      // - Each benchmark's weight comes from groupBenchmarkEntries (explicit
      //   weight, or decay^i by position), so the most reliable benchmarks lead
      //   and lower-weighted ones fill gaps / break ties.
      // - Missing benchmarks are imputed, not skipped: absence is ignorance, not
      //   evidence of a bottom rank. The fill starts at percentile 0.5 (median
      //   model) and slides toward the level the model has actually demonstrated
      //   as its coverage grows, but is capped at the median --
      //   fill = min(0.5 + (own - 0.5) * coverageShare, 0.5) -- so a blank can
      //   hold a strong model back or drag a weak one down, but can never lift
      //   anyone: a sparsely measured model cannot outrank a well-tested one on
      //   imputed strength alone. Every model divides by the same total weight,
      //   which keeps composites comparable and the ranking invariant to
      //   rescaling all weights (coverageShare is a ratio, so no absolute weight
      //   magnitude leaks into the fill).
      // - Benchmarks nobody can be ranked on (fewer than 2 scored models) are
      //   left out of the total so they don't dilute anyone.
      // - A model measured on less than group.minScoredFraction of the total
      //   weight is left unranked rather than scored: its composite would be
      //   mostly imputation, and reporting that as a rank implies evidence that
      //   does not exist.
      // Returns a Map(model -> composite|null); null sinks to the bottom like a
      // missing value (model had no scores in the group, or too few to rank).
      function computeGroupComposite(models, group) {
        const entries = groupBenchmarkEntries(group);
        const pctMaps = entries.map((entry) => percentileMap(models, entry.key));
        const weights = entries.map((entry, i) => (pctMaps[i] ? entry.weight : 0));
        const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
        const minScoredFraction = Number.isFinite(group.minScoredFraction)
          ? group.minScoredFraction
          : 0;
        const minScoredWeight = minScoredFraction * totalWeight;

        const result = new Map();
        models.forEach((model) => {
          let sumWeight = 0;
          let sumWeighted = 0;
          entries.forEach((entry, i) => {
            const pctMap = pctMaps[i];
            if (!pctMap) return;
            const pct = pctMap.get(model);
            if (pct === undefined) return;
            sumWeight += weights[i];
            sumWeighted += weights[i] * pct;
          });
          if (sumWeight <= 0 || sumWeight < minScoredWeight) {
            result.set(model, null);
            return;
          }
          const missingWeight = totalWeight - sumWeight;
          const own = sumWeighted / sumWeight;
          const fill = Math.min(0.5 + (own - 0.5) * (sumWeight / totalWeight), 0.5);
          result.set(model, (sumWeighted + fill * missingWeight) / totalWeight);
        });
        return result;
      }

      function valueForSort(model, key) {
        if (key === "name") {
          return model.name || "";
        }
        if (key === "creator") {
          return model.creatorName || "";
        }
        if (key === "params") {
          return parseUnitNumber(model.params);
        }
        if (key === "context") {
          return parseUnitNumber(model.context);
        }
        if (key === "vram_fp16") {
          return model.vram?.fp16 ?? NaN;
        }
        if (key === "vram_int8") {
          return model.vram?.int8 ?? NaN;
        }
        if (key === "vram_int4") {
          return model.vram?.int4 ?? NaN;
        }
        return toNumber(model.scores?.[key]);
      }

      function measureModelColumnInitialWidth(models) {
        if (window.innerWidth <= 860) return 150;
        const probe = document.createElement("span");
        probe.className = "model-name-label";
        probe.style.position = "absolute";
        probe.style.visibility = "hidden";
        probe.style.pointerEvents = "none";
        probe.style.whiteSpace = "nowrap";
        document.body.appendChild(probe);

        const probeStyles = window.getComputedStyle(probe);
        const context = document.createElement("canvas").getContext("2d");
        const font = probeStyles.font || [
          probeStyles.fontStyle,
          probeStyles.fontVariant,
          probeStyles.fontWeight,
          probeStyles.fontSize,
          probeStyles.fontFamily
        ].filter(Boolean).join(" ");

        let widestLabel = 0;
        if (context) {
          context.font = font;
          models.forEach((model) => {
            const textWidth = context.measureText(model.name || "Unknown").width;
            const badgeWidth = isRecentModel(model) ? 22 : 0;
            widestLabel = Math.max(widestLabel, textWidth + badgeWidth);
          });
        }

        document.body.removeChild(probe);
        return Math.ceil(widestLabel + 6);
      }

      function renderTable() {
        // Every anchor in here is about to be replaced.
        closeTip();

        if (!state.filteredModels.length) {
          ui.content.innerHTML = `
            <div class="empty">No models match your filters.</div>
            ${renderBenchmarkDirectory()}
            ${renderSourcesDirectory()}
          `;
          return;
        }

        const benchKeys = visibleBenchmarkKeys();
        const headers = [
          ...FIXED_COLUMNS.map((column) => ({
            ...column,
            label: columnLabel(column.key),
            tip: {
              eyebrow: "Column",
              title: columnMeta(column.key).sortLabel || columnLabel(column.key),
              body: columnMeta(column.key).description || ""
            },
            initialWidth: column.key === "name"
              ? measureModelColumnInitialWidth(state.filteredModels)
              : column.initialWidth
          })),
          ...benchKeys.map((key) => ({
            key,
            label: getBenchmarkLabel(key),
            // Headers show short_name to stay narrow, so the slip carries the
            // full name, what the benchmark measures, and a link to it.
            tip: benchmarkTipFields(key),
            className: "num bench-head head-right",
            minWidth: 95,
            initialWidth: 95
          }))
        ];
        state.headerWidthsByKey = Object.fromEntries(headers.map((header) => [header.key, {
          minWidth: header.minWidth,
          maxWidth: header.maxWidth,
          initialWidth: header.initialWidth
        }]));

        const bestInTableByModel = getBestInTableByModel(state.filteredModels);
        const scoreRanges = getScoreRangesByBenchmark(state.filteredModels);

        const tableHtml = `
          <div class="table-shell">
            <table aria-label="LLM benchmark table">
              <thead>
                <tr>
                  ${headers.map((header) => renderHeaderCell(header)).join("")}
                </tr>
              </thead>
              <tbody>
                ${state.filteredModels.map((model) => renderRow(model, bestInTableByModel.get(model) || new Set(), scoreRanges, benchKeys)).join("")}
              </tbody>
            </table>
          </div>
          ${renderRecentPanel()}
          ${renderBenchmarkDirectory()}
          ${renderSourcesDirectory()}
        `;

        ui.content.innerHTML = tableHtml;

        ui.content.querySelectorAll("th[data-sort-key]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sortKey;
            if (!key) {
              return;
            }
            if (state.sort.key === key) {
              state.sort.direction = state.sort.direction === "desc" ? "asc" : "desc";
            } else {
              state.sort.key = key;
              // Lower-is-better columns are not listed here: "desc" already
              // sorts them best-first (see sortModels), so the first click
              // behaves like every other benchmark column.
              state.sort.direction = (key === "name" || key === "creator" ||
                key === "vram_fp16" || key === "vram_int8" || key === "vram_int4") ? "asc" : "desc";
            }

            ui.sortMode.value = sortModeValue(state.sort.key, state.sort.direction);
            applyAndRender();
          });
        });

        initColumnResize();
      }

      /* ── Recently added ──────────────────────────────
         The week the table marks, written out underneath it: every model
         wearing a NEW badge and every score set in red, filed under the day it
         was stamped. */

      // How many of a day's models are listed before the rest fold away.
      const RECENT_DAY_PREVIEW = 12;

      // "5 models", "1 score" — the counts in the lead and beside a new model.
      function countLabel(count, noun) {
        return `${count} ${noun}${count === 1 ? "" : "s"}`;
      }

      // The scores a model brought with it: every visible column holding a
      // number, in table order. Derived columns are left out, the same
      // exclusion scoreFreshness makes for a model already here — an index
      // recomputed from the other columns is arithmetic, not a measurement,
      // whether it lands with a new model or a day later.
      function arrivedScores(model) {
        return visibleBenchmarkKeys()
          .filter((key) => !isDerivedBenchmark(key))
          .map((key) => ({ key, value: toNumber(model.scores?.[key]) }))
          .filter(({ value }) => Number.isFinite(value));
      }

      // Everything the table is currently marking, gathered by the day it was
      // stamped: models added inside the window, and single scores stamped
      // inside it on models older than that. Membership is decided by the very
      // tests the marks use — isRecentModel and scoreFreshness — so the list
      // and the table cannot disagree about what is new, down to the one case
      // they skip, a derived column. Both kinds of row carry their scores the
      // same way, {model, entries}, so one renderer draws either.
      // Reads state.filteredModels and the visible benchmark keys, so it
      // describes the table on screen rather than the whole file.
      function recentAdditions() {
        const benchKeys = visibleBenchmarkKeys();
        const byDate = new Map();
        const dayFor = (date) => {
          if (!byDate.has(date)) {
            byDate.set(date, { date, age: daysSince(date), models: [], scores: [] });
          }
          return byDate.get(date);
        };

        state.filteredModels.forEach((model) => {
          if (isRecentModel(model)) {
            dayFor(model.date_added).models.push({ model, entries: arrivedScores(model) });
            return;
          }
          // A model can hold scores from several days at once, so its cells are
          // split by their own stamp rather than filed under the newest of them.
          const byStamp = new Map();
          benchKeys.forEach((key) => {
            const value = toNumber(model.scores?.[key]);
            if (!Number.isFinite(value) || !scoreFreshness(model, key)) {
              return;
            }
            const stamp = model.scores_updated[key];
            if (!byStamp.has(stamp)) {
              byStamp.set(stamp, []);
            }
            byStamp.get(stamp).push({ key, value });
          });
          byStamp.forEach((entries, stamp) => dayFor(stamp).scores.push({ model, entries }));
        });

        // Newest day first; within a day, table order, since these were
        // collected by walking the rows.
        return [...byDate.values()].sort((a, b) => a.age - b.age);
      }

      // Links in this panel pass through the same gate a slip's link does, so an
      // imported llm.json cannot put anything but a web address behind one; a
      // rejected URL simply leaves plain text.
      function recentLinkUrl(url) {
        return tipSafeUrl(url) ? url : "";
      }

      // A model's name as it appears in this panel: the same slip the table row
      // carries, and the same red when the model itself is the new thing.
      function renderRecentModelName(model, isNew) {
        const name = escapeHtml(model.name || "Unknown");
        const url = recentLinkUrl(model.url);
        const tip = tipAttrs(modelTipFields(model));
        const className = `recent-model${isNew ? " model-new" : ""}`;
        return url
          ? `<a class="${className}" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer"${tip}>${name}</a>`
          : `<span class="${className}"${tip}>${name}</span>`;
      }

      // The chips for one entry: each benchmark, its value, and a link to the
      // page the value was read from. A score that arrived with a new model is
      // drawn and hovers exactly like one restamped on a model already here —
      // the day means the same thing in both cases, so one renderer says it
      // once.
      function renderRecentScoreChips(row, day) {
        const model = row.model;
        const chips = row.entries.map(({ key, value }) => {
          const source = recentLinkUrl(model.scores_source?.[key]);
          // The slip carries the same provenance the table cell's slip does.
          const tip = tipAttrs({
            eyebrow: model.name || "",
            eyebrowVerbatim: true,
            title: getBenchmarkFullName(key),
            body: scoreTipBody(key),
            meta: [
              `Added ${day.date} · ${describeAge(day.age)}`,
              source ? "" : "No source recorded for this score."
            ].filter(Boolean).join("\n"),
            url: source
          });
          // Column headers wear short_name because a table column has a fixed
          // width to live in; a chip here has none, so it can say which
          // benchmark it is outright instead of asking for a hover.
          const label = `<span class="recent-score-name">${escapeHtml(getBenchmarkFullName(key))}</span><span class="recent-score-value">${formatScore(value, key)}</span>`;
          return source
            ? `<a class="recent-score" href="${escapeAttr(source)}" target="_blank" rel="noopener noreferrer"${tip}>${label}</a>`
            : `<span class="recent-score"${tip}>${label}</span>`;
        }).join("");
        return chips ? `<span class="recent-scores">${chips}</span>` : "";
      }

      function renderRecentModelEntry(row, day) {
        // A new model is listed with the scores it arrived with, spelled out the
        // same way a restamped score is: the count leads, so the size of the row
        // is legible before the chips are read, and the chips follow. Both are
        // over the visible columns, like everything else in the panel, and both
        // vanish together when the model brought no score the table is showing —
        // the badge already says why it is listed.
        const model = row.model;
        const scored = row.entries.length;
        return `
          <div class="recent-entry">
            <span class="recent-entry-head">${renderNewBadge(model.date_added)}${renderRecentModelName(model, true)}</span>
            ${model.creatorName ? `<span class="recent-creator">${escapeHtml(model.creatorName)}</span>` : ""}
            ${scored ? `<span class="recent-note">arrived with ${countLabel(scored, "score")}</span>` : ""}
            ${renderRecentScoreChips(row, day)}
          </div>
        `;
      }

      function renderRecentScoreEntry(row, day) {
        return `
          <div class="recent-entry">
            <span class="recent-entry-head">${renderRecentModelName(row.model, false)}</span>
            ${renderRecentScoreChips(row, day)}
          </div>
        `;
      }

      function renderRecentPanel() {
        const days = recentAdditions();
        const modelCount = days.reduce((total, day) => total + day.models.length, 0);
        // Every score the panel lists, whichever kind of row carries it: the
        // ones restamped on models already here and the ones a new model
        // arrived with. The lead counts what is on screen, so a reader can
        // check it against the chips below rather than being told that a new
        // model's scores are somewhere in the model count.
        const scoreCount = days.reduce((total, day) =>
          total + [...day.models, ...day.scores]
            .reduce((sum, row) => sum + row.entries.length, 0), 0);

        const lead = modelCount || scoreCount
          ? `<span class="recent-count">${countLabel(modelCount, "model")}</span> and <span class="recent-count">${countLabel(scoreCount, "score")}</span> arrived in the last ${NEW_DAYS} days — the window the table marks, across the models and columns it is showing now. A date records only the last write, so a score measured again is listed like a first one. A new model's scores are listed beside it, since they arrived with it, and a derived column is left out, exactly as in the table.`
          : `Nothing has been added in the last ${NEW_DAYS} days.`;

        const items = days.map((day) => {
          // The dot fades across the same window the table marks in red, off
          // the same arithmetic — it just still has a gradient to spend.
          const fresh = ((NEW_DAYS - day.age) / NEW_DAYS).toFixed(3);
          const entries = [
            ...day.models.map((row) => renderRecentModelEntry(row, day)),
            ...day.scores.map((row) => renderRecentScoreEntry(row, day))
          ];
          // One fetch can restamp a hundred models at once, and a day that long
          // buries every other day under it. The head of the list stands for the
          // day — in table order, so it is the day's best-ranked models — and
          // the tail waits behind a disclosure. Nothing is dropped, and <details>
          // needs no wiring, which matters where the panel is rebuilt from a
          // string on every filter change.
          const head = entries.slice(0, RECENT_DAY_PREVIEW).join("");
          const tail = entries.slice(RECENT_DAY_PREVIEW);
          const more = tail.length
            ? `<details class="recent-more"><summary>${countLabel(tail.length, "more model")}</summary><div class="recent-entries">${tail.join("")}</div></details>`
            : "";
          return `
            <li class="recent-day" style="--fresh:${fresh}">
              <div class="recent-date">
                <span class="recent-date-day">${escapeHtml(day.date)}</span>
                <span class="recent-date-age">${escapeHtml(describeAge(day.age))}</span>
              </div>
              <div class="recent-entries">${head}${more}</div>
            </li>
          `;
        }).join("");

        return `
          <section class="recent-panel" aria-label="Recently added models and scores">
            <h2>Recently Added</h2>
            <p class="recent-lead">${lead}</p>
            ${items ? `<ol class="recent-days">${items}</ol>` : ""}
          </section>
        `;
      }

      // Reference cards: entries from data.columnCards (table columns that need
      // provenance, e.g. the Spheron VRAM estimates) followed by one card per
      // visible benchmark. Both come from llm.json — nothing is hardcoded here.
      function referenceCards() {
        const columnCards = (Array.isArray(state.data?.columnCards) ? state.data.columnCards : [])
          .filter((card) => card && card.name)
          .map((card) => ({
            name: card.name,
            category: card.category || "",
            description: card.description || "",
            links: benchmarkLinks(card),
            icon: ""
          }));

        const benchmarkCards = visibleBenchmarkKeys().map((key) => {
          const benchmark = state.data?.benchmarks?.[key] || {};
          return {
            name: benchmark.name || getBenchmarkLabel(key),
            category: benchmark.category || "",
            description: benchmark.description || "",
            links: benchmarkLinks(benchmark),
            icon: renderBenchmarkIcon(key)
          };
        });

        return [...columnCards, ...benchmarkCards];
      }

      function renderBenchmarkDirectory() {
        const items = referenceCards().map((card) => `
            <article class="benchmark-item">
              <div class="benchmark-head">
                <span class="benchmark-name">${card.icon}${escapeHtml(card.name)}</span>
                ${card.category ? `<span class="benchmark-category">${escapeHtml(card.category)}</span>` : ""}
              </div>
              ${card.description ? `<p class="benchmark-desc">${escapeHtml(card.description)}</p>` : ""}
              ${card.links.length ? `<div class="benchmark-links">${card.links.map((url) => `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`).join("")}</div>` : ""}
            </article>
          `).join("");

        return `
          <section class="benchmarks-panel" aria-label="Benchmark and column reference">
            <h2>Reference</h2>
            <div class="benchmarks-list">${items}</div>
          </section>
        `;
      }

      function renderSourcesDirectory() {
        const sources = [
          ...(Array.isArray(state.data?.sources) ? state.data.sources : []),
          ...((state.data?.models || []).map((model) => model?.url))
        ]
          .filter((url) => typeof url === "string" && url.trim().length > 0);

        if (!sources.length) {
          return "";
        }

        const links = [...new Set(sources)]
          .sort((a, b) => a.localeCompare(b))
          .map((url) => `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`)
          .join("");

        return `
          <section class="sources-panel" aria-label="Sources">
            <h2>Sources</h2>
            <div class="sources-list">${links}</div>
          </section>
        `;
      }

      function benchmarkLinks(benchmark) {
        if (!benchmark || typeof benchmark !== "object") {
          return [];
        }
        if (Array.isArray(benchmark.urls)) {
          return benchmark.urls.filter((url) => typeof url === "string" && url.trim().length > 0);
        }
        if (typeof benchmark.url === "string" && benchmark.url.trim().length > 0) {
          return [benchmark.url];
        }
        return [];
      }

      function initColumnResize() {
        const table = ui.content.querySelector("table");
        if (!table) return;
        const ths = table.querySelectorAll("thead th");
        const shell = table.parentElement;

        // Capture initial widths for columns not yet stored, bounded by configured min/max widths.
        ths.forEach((th) => {
          const key = th.dataset.sortKey;
          const { minWidth, maxWidth, initialWidth: configuredInitialWidth } = getHeaderWidthConfig(key, th);
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(maxWidth) ? maxWidth + "px" : "none";
          if (key && !state.columnWidths[key]) {
            const initialWidth = configuredInitialWidth ?? th.getBoundingClientRect().width;
            state.columnWidths[key] = Math.max(minWidth, Math.min(initialWidth, maxWidth));
          }
        });

        const benchmarkHeaders = [...ths].filter((th) => state.benchmarkKeys.includes(th.dataset.sortKey));
        if (shell && benchmarkHeaders.length > 0) {
          const shellWidth = shell.getBoundingClientRect().width;
          const totalWidth = [...ths].reduce((sum, th) => {
            const key = th.dataset.sortKey;
            return sum + (key ? (state.columnWidths[key] || 0) : 0);
          }, 0);
          const extraWidth = Math.floor(shellWidth - totalWidth);
          if (extraWidth > 0) {
            const extraPerBenchmark = Math.floor(extraWidth / benchmarkHeaders.length);
            const remainder = extraWidth % benchmarkHeaders.length;
            benchmarkHeaders.forEach((th, index) => {
              const key = th.dataset.sortKey;
              if (!key) return;
              const bonus = extraPerBenchmark + (index < remainder ? 1 : 0);
              state.columnWidths[key] = (state.columnWidths[key] || 0) + bonus;
            });
          }
        }

        // Switch to fixed layout and apply stored widths
        table.style.tableLayout = "fixed";
        ths.forEach((th) => {
          const key = th.dataset.sortKey;
          if (key && state.columnWidths[key]) {
            const { minWidth, maxWidth } = getHeaderWidthConfig(key, th);
            const clampedWidth = Math.max(minWidth, Math.min(state.columnWidths[key], maxWidth));
            state.columnWidths[key] = clampedWidth;
            th.style.width = clampedWidth + "px";
            th.style.maxWidth = Number.isFinite(maxWidth) ? maxWidth + "px" : "none";
          }
        });
        syncTableWidth(table);

        // Attach mousedown listeners to resize handles
        table.querySelectorAll(".col-resize-handle").forEach((handle) => {
          handle.addEventListener("mousedown", onResizeMouseDown);
        });
      }

      function onResizeMouseDown(e) {
        e.preventDefault();
        e.stopPropagation();

        const handle = e.currentTarget;
        const th = handle.closest("th");
        const key = handle.dataset.resizeKey;
        if (!th || !key) return;

        const startX = e.clientX;
        const startWidth = th.getBoundingClientRect().width;
        const { minWidth, maxWidth } = getHeaderWidthConfig(key, th);
        const table = th.closest("table");
        const shell = table?.parentElement || null;
        const tableWidth = table ? table.getBoundingClientRect().width : Infinity;
        const shellWidth = shell ? shell.getBoundingClientRect().width : tableWidth;
        const availableWidth = Math.max(tableWidth, shellWidth);
        let otherColumnsMinWidth = 0;
        if (table) {
          table.querySelectorAll("thead th").forEach((otherTh) => {
            const otherKey = otherTh.dataset.sortKey;
            if (!otherKey || otherKey === key) return;
            const { minWidth: otherMinWidth } = getHeaderWidthConfig(otherKey, otherTh);
            otherColumnsMinWidth += otherMinWidth;
          });
        }
        const effectiveMaxWidth = Math.min(maxWidth, availableWidth - otherColumnsMinWidth);

        document.body.classList.add("col-resizing");

        function onMouseMove(e) {
          const newWidth = Math.max(minWidth, Math.min(startWidth + (e.clientX - startX), effectiveMaxWidth));
          th.style.width = newWidth + "px";
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(effectiveMaxWidth) ? effectiveMaxWidth + "px" : "none";
          syncTableWidth(table);
        }

        function onMouseUp(e) {
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
          document.body.classList.remove("col-resizing");

          const finalWidth = Math.max(minWidth, Math.min(startWidth + (e.clientX - startX), effectiveMaxWidth));
          state.columnWidths[key] = finalWidth;
          th.style.width = finalWidth + "px";
          th.style.minWidth = minWidth + "px";
          th.style.maxWidth = Number.isFinite(effectiveMaxWidth) ? effectiveMaxWidth + "px" : "none";
          syncTableWidth(table);

          // Swallow the click event the browser fires after mouseup so sort doesn't trigger
          th.addEventListener("click", (ev) => ev.stopPropagation(), { capture: true, once: true });
        }

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      }

      function renderHeaderCell(header) {
        const isSorted = state.sort.key === header.key;

        // When a grouped sort is active, every benchmark in the group is marked
        // with a diamond, so the contributing columns are visible at a glance
        // even though no single column "is" the sort key.
        const group = getSortGroup(state.sort.key);
        const groupEntries = group ? groupBenchmarkEntries(group) : [];
        const groupEntry = groupEntries.find((entry) => entry.key === header.key);
        const inGroup = groupEntry !== undefined;

        let indicator = "";
        if (isSorted) {
          const sortSymbol = state.sort.direction === "desc" ? "▼" : "▲";
          indicator = `<span class="sort-indicator">${sortSymbol}</span>`;
        } else if (inGroup) {
          indicator = `<span class="sort-indicator group-indicator">◆</span>`;
        }

        const className = header.className ? ` ${header.className}` : "";
        const metaLines = [];
        if (isSorted) {
          metaLines.push(state.sort.direction === "desc" ? "Sorted best first" : "Sorted worst first");
        }
        if (inGroup) {
          metaLines.push(`Counts toward “${group.label || group.key}” · weight ${groupEntry.weight}`);
        }
        const tip = tipAttrs({ ...(header.tip || {}), meta: metaLines.join("\n") });

        const resizeHandle = `<div class="col-resize-handle" data-resize-key="${escapeHtml(header.key)}"></div>`;
        const icon = renderBenchmarkIcon(header.key);
        const labelContent = `${icon}<span class="th-label-text">${escapeHtml(header.label)}</span>`;
        const minWidthAttr = header.minWidth != null ? ` data-min-width="${header.minWidth}"` : "";
        const maxWidthAttr = header.maxWidth != null ? ` data-max-width="${header.maxWidth}"` : "";
        const initialWidthAttr = header.initialWidth != null ? ` data-initial-width="${header.initialWidth}"` : "";
        return `<th class="${className.trim()}" data-sort-key="${escapeHtml(header.key)}"${tip}${minWidthAttr}${maxWidthAttr}${initialWidthAttr}><span class="th-label">${labelContent}</span>${indicator}${resizeHandle}</th>`;
      }

      // How long a stamp counts as new. One window for both date_added and
      // scores_updated, so "new" means the same span of time whether it is a
      // whole model or a single score of a model that has been here a while.
      const NEW_DAYS = 7;

      // Whole days between an ISO date stamp and today, null if unparseable.
      // Both ends are local midnight, so the count is calendar days — the unit
      // the stamps are written in — and a clock change cannot shift it.
      function daysSince(isoDate) {
        if (!isoDate) return null;
        const stamped = new Date(isoDate + "T00:00:00");
        if (Number.isNaN(stamped.getTime())) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return Math.round((today.getTime() - stamped.getTime()) / 86400000);
      }

      // A whole-day age in words, so a reader is never left counting from a
      // bare date. Shared by the score slip and the Recently Added panel.
      function describeAge(days) {
        if (days === 0) return "today";
        if (days === 1) return "yesterday";
        return `${days} days ago`;
      }

      function isRecentModel(model) {
        const age = daysSince(model.date_added);
        return age !== null && age >= 0 && age < NEW_DAYS;
      }

      // How new one score is: 1 stamped today, falling toward 0 as it nears
      // NEW_DAYS old, and 0 once it is older than that (or undated, or stamped
      // in the future). The table reads it as a yes/no — a fresh score is
      // simply red — but the Recently Added panel still fades a day's entries
      // by it, so the graded value stays.
      function scoreFreshness(model, key) {
        // A model added this week has every score stamped with its arrival, so
        // the NEW badge beside its name already says the whole row is new —
        // marking each cell as well would be the same news thirty times over.
        if (isRecentModel(model)) return 0;
        // A derived column (the Coding index) is recomputed from the others, so
        // its date moves whenever any input moves. That is arithmetic catching
        // up, not a new measurement, and the inputs that did change are marked
        // in their own cells.
        if (isDerivedBenchmark(key)) return 0;
        const age = daysSince(model.scores_updated?.[key]);
        if (age === null || age < 0 || age >= NEW_DAYS) return 0;
        return (NEW_DAYS - age) / NEW_DAYS;
      }

      function renderNewBadge(dateAdded) {
        const pts = "100,10 118.1,32.4 145,22 149.5,50.5 177.9,55 167.6,81.9 190,100 167.6,118.1 177.9,145 149.5,149.5 145,177.9 118.1,167.6 100,190 81.9,167.6 55,177.9 50.5,149.5 22.1,145 32.4,118.1 10,100 32.4,81.9 22.1,55 50.5,50.5 55,22 81.9,32.4";
        const tip = tipAttrs({
          eyebrow: "New",
          body: "Added to the index in the last seven days.",
          meta: dateAdded ? `Added ${dateAdded}` : ""
        });
        return (
          `<span class="new-badge"${tip}>` +
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="22" height="22" aria-label="New model">` +
          `<g transform="rotate(-12 100 100)">` +
          `<polygon points="${pts}" fill="url(#new-badge-grad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" filter="url(#new-badge-shadow)"/>` +
          `<text x="100" y="116" font-family="'Impact','Arial Black',sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NEW</text>` +
          `</g>` +
          `</svg>` +
          `</span>`
        );
      }

      function renderRow(model, bestInTable, scoreRanges, benchKeys) {
        const modelName = escapeHtml(model.name || "Unknown");
        const modelUrl = model.url || "";
        const creatorName = escapeHtml(model.creatorName);
        const creatorUrl = model.creator?.url || "";
        const isNew = isRecentModel(model);
        const modelTip = tipAttrs(modelTipFields(model));
        const scoreCells = benchKeys.map((key) => {
          const value = toNumber(model.scores?.[key]);
          const hasValue = Number.isFinite(value);
          // Only cells that hold a number get a slip, and they carry a kind
          // rather than their text — see TIP_RESOLVERS.score.
          const tipAttr = hasValue ? ` data-tip-kind="score"` : "";
          const isTop = bestInTable.has(key);
          // An empty cell has no score, so nothing about it can be new.
          const fresh = hasValue ? scoreFreshness(model, key) : 0;
          const declarations = [];
          if (!isTop) {
            const grey = hasValue ? scoreToGrey(value, scoreRanges[key]) : null;
            if (grey) declarations.push(`color:${grey}`);
          }
          const style = declarations.length ? ` style="${declarations.join(";")}"` : "";
          // Only whether it is fresh reaches the cell: the red the class paints
          // is flat, the same one a new model's name gets.
          const className = `num${isTop ? " top-score" : ""}${fresh ? " fresh-score" : ""}`;
          const content = isTop
            ? `<span class="top-score-mark">${formatScore(value, key)}</span>`
            : formatScore(value, key);
          return `<td class="${className}"${style}${tipAttr}>${content}</td>`;
        }).join("");

        return `
          <tr>
            <td class="col-model"><span class="model-name-wrap">${isNew ? renderNewBadge(model.date_added) : ""}${modelUrl ? `<a href="${escapeAttr(modelUrl)}" target="_blank" rel="noopener noreferrer"${modelTip} class="model-name-label${isNew ? ' model-new' : ""}">${modelName}</a>` : `<span class="model-name-label${isNew ? ' model-new' : ""}"${modelTip}>${modelName}</span>`}</span></td>
            <td class="creator">${creatorUrl ? `<a href="${escapeAttr(creatorUrl)}" target="_blank" rel="noopener noreferrer">${creatorName}</a>` : creatorName}</td>
            <td class="mono">${formatParams(model.params)}</td>
            <td class="mono">${formatContext(model.context)}</td>
            ${renderVramCell(model.vram?.fp16)}
            ${renderVramCell(model.vram?.int8)}
            ${renderVramCell(model.vram?.int4)}
            ${scoreCells}
          </tr>
        `;
      }

      /* ── GPU VRAM filter ─────────────────────────── */

      async function loadGpuData() {
        if (state.gpu.list.length) {
          return;
        }
        const urls = ["gpu.json", `https://dgrieser.github.io/ai-bench/gpu.json?t=${Date.now()}`];
        for (const url of urls) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              continue;
            }
            const list = await response.json();
            if (Array.isArray(list) && list.length) {
              initGpuBar(list);
              return;
            }
          } catch (err) {
            // try next source; the GPU filter is optional
          }
        }
      }

      function initGpuBar(list) {
        state.gpu.list = list
          .filter((gpu) => gpu && gpu.model && Number.isFinite(Number(gpu.vram_gb)))
          .map((gpu) => ({
            manufacturer: String(gpu.manufacturer || ""),
            model: String(gpu.model),
            vram_gb: Number(gpu.vram_gb),
            release: typeof gpu.release === "string" ? gpu.release : ""
          }))
          .sort((a, b) =>
            a.manufacturer.localeCompare(b.manufacturer) ||
            a.model.localeCompare(b.model, undefined, { numeric: true }));

        if (!state.gpu.list.length) {
          return;
        }
        ui.gpuBar.hidden = false;
        ui.controls.classList.add("has-gpu");
        initHostingPresets();
        updateFilterColumns();
        if (!state.gpu.eventsBound) {
          bindGpuEvents();
          state.gpu.eventsBound = true;
        }
      }

      // ── Hosting presets ──────────────────────────────────────────────

      // mittwald's Managed Dedicated AI Hosting tiers. A preset is nothing more
      // than a shortcut into the GPU filter — it picks a card and a card count,
      // and the budget, VRAM shading and Reserve then behave exactly as if the
      // fields had been filled in by hand.
      const HOSTING_PRESET_VENDOR = "NVIDIA";
      const HOSTING_PRESET_GPU = "RTX PRO 6000 Blackwell (Server)";
      const HOSTING_PRESETS = [
        { tier: "M", cards: 1 },
        { tier: "L", cards: 2 },
        { tier: "XL", cards: 4 }
      ];

      function hostingPresetGpu() {
        return state.gpu.list.find((gpu) =>
          gpu.manufacturer === HOSTING_PRESET_VENDOR && gpu.model === HOSTING_PRESET_GPU) || null;
      }

      // Chips are rendered from gpu.json rather than from hard-coded totals, so
      // a change to the card's VRAM there carries the tier labels with it. No
      // card, no strip — the tiers would have nothing to point the filter at.
      function initHostingPresets() {
        if (!ui.hostingPresets || !ui.presetChips) {
          return;
        }
        const gpu = hostingPresetGpu();
        if (!gpu) {
          ui.hostingPresets.hidden = true;
          return;
        }
        ui.presetChips.innerHTML = HOSTING_PRESETS.map((preset) => {
          const total = formatGb(gpu.vram_gb * preset.cards);
          const tip = `Sets the GPU filter to ${preset.cards} × ${gpu.manufacturer} ${gpu.model} — a ${total} GB VRAM budget. Click again to clear it.`;
          return `<button type="button" class="preset-chip" data-cards="${preset.cards}" aria-pressed="false" data-tip-title="Hosting tier ${escapeHtml(preset.tier)}" data-tip="${escapeHtml(tip)}">
            <span class="preset-tier">${escapeHtml(preset.tier)}</span>
            <span class="preset-spec">${escapeHtml(`${preset.cards}× · ${total} GB`)}</span>
          </button>`;
        }).join("");
        ui.presetsNote.textContent = `${gpu.manufacturer} ${gpu.model} · ${formatGb(gpu.vram_gb)} GB per card`;
        ui.hostingPresets.hidden = false;

        if (!state.gpu.presetsBound) {
          ui.presetChips.addEventListener("click", (event) => {
            const chip = event.target.closest(".preset-chip");
            if (chip) {
              applyHostingPreset(Number(chip.dataset.cards));
            }
          });
          state.gpu.presetsBound = true;
        }
        syncHostingPresets();
      }

      // Clicking the armed tier again clears the GPU filter, so the strip can
      // undo itself without a trip down to the × in the fields.
      function applyHostingPreset(cards) {
        const gpu = hostingPresetGpu();
        if (!gpu || !Number.isFinite(cards)) {
          return;
        }
        if (hostingPresetActive(cards)) {
          gpuResetBar();
          applyAndRender();
          return;
        }
        // Count goes in directly rather than through gpuSetCount: gpuSelect
        // derives the budget from it and renders once, not twice.
        state.gpu.count = clampGpuCount(cards);
        ui.gpuCount.value = String(state.gpu.count);
        setGpuCountDisabled(false);
        gpuSelect(gpu);
      }

      // A tier is armed only while the filter still holds exactly what the
      // preset put there, so editing the fields by hand unarms the chip.
      function hostingPresetActive(cards) {
        return Boolean(state.gpu.budget)
          && state.gpu.selected?.model === HOSTING_PRESET_GPU
          && state.gpu.count === cards;
      }

      function syncHostingPresets() {
        if (!ui.presetChips) {
          return;
        }
        ui.presetChips.querySelectorAll(".preset-chip").forEach((chip) => {
          const active = hostingPresetActive(Number(chip.dataset.cards));
          chip.classList.toggle("is-active", active);
          chip.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function bindGpuEvents() {
        ui.gpuVendor.addEventListener("change", (event) => {
          const vendor = event.target.value;
          state.gpu.vendor = vendor;
          if (vendor === "custom") {
            state.gpu.custom = true;
