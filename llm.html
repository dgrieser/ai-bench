          .map((a) => { const p = radarPoint(CX, CY, R, a.i, n, a.pct); return `${r1(p.x)},${r1(p.y)}`; })
          .join(" ");

        // Fills first, then every stroke, then every marker: no series' wash
        // can then sit on top of another's outline. The data polygon spans the
        // ranked axes only — a missing score is a chord between its
        // neighbours, never a fake zero at the hub.
        const shapes = single
          ? (series[0].ranked.length >= 2 ? `<polygon class="radar-shape" points="${vertices(series[0])}"/>` : "")
          : series.map((s) => {
              // Two vertices make a line, not an area, so a fill would draw
              // nothing but a seam over its own stroke.
              const fill = s.ranked.length >= 3
                ? `<polygon class="radar-shape radar-fill radar-series" data-series="${s.slot}" points="${vertices(s)}"/>`
                : "";
              // Closed by repeating the first point rather than with <polygon>,
              // so a dash pattern starts and ends on a vertex.
              const line = s.ranked.length >= 2
                ? `<polyline class="radar-line radar-series" data-series="${s.slot}" points="${vertices(s)} ${vertices(s).split(" ")[0]}"/>`
                : "";
              return { fill, line };
            }).reduce((out, part) => ({ fills: out.fills + part.fill, lines: out.lines + part.line }), { fills: "", lines: "" });

        const shapeMarkup = single ? shapes : shapes.fills + shapes.lines;

        // Markers. One model keeps its hollow hub dot for a missing axis; a
        // comparison drops it, because five hollow dots piled on the hub say
        // nothing the axis label's "k/N" does not say better.
        const dots = single
          ? series[0].axisData.map((a) => {
              const p = radarPoint(CX, CY, R, a.i, n, a.ranked ? a.pct : 0);
              return a.ranked
                ? `<circle class="radar-dot" cx="${r1(p.x)}" cy="${r1(p.y)}" r="4.5"/>`
                : `<circle class="radar-dot missing" cx="${r1(p.x)}" cy="${r1(p.y)}" r="3"/>`;
            }).join("")
          : series.map((s) => s.ranked.map((a) => {
              const p = radarPoint(CX, CY, R, a.i, n, a.pct);
              return radarMarker(s.slot, p.x, p.y, 4);
            }).join("")).join("");

        // Invisible hit targets; the delegated tooltip system picks the
        // data-tip attributes up from SVG unchanged. One model gets a target
        // per vertex, with its unranked axes carrying the same slip on their
        // label instead — a pile of hollow dots at the hub is no place to aim
        // a pointer. A comparison gets one wedge per axis instead of one
        // target per vertex: two models tied on an axis stack their markers,
        // and a target you cannot separate is a target you cannot hit. The
        // wedge's slip lists every model on that axis, best first.
        const hits = single
          ? series[0].axisData.filter((a) => a.ranked).map((a) => {
              const p = radarPoint(CX, CY, R, a.i, n, a.pct);
              return `<circle class="radar-hit" cx="${r1(p.x)}" cy="${r1(p.y)}" r="14" fill="transparent"${tipAttrs(radarAxisTip(models[0], a))}/>`;
            }).join("")
          : axes.map((key, i) =>
              `<path class="radar-hit" d="${radarAxisWedge(CX, CY, R * 1.06, i, n)}" fill="transparent"${tipAttrs(radarCompareAxisTip(series, i, key))}/>`
            ).join("");

        const labels = axes.map((key, i) => {
          const p = radarPoint(CX, CY, R * 1.12, i, n, 1);
          const cos = Math.cos(p.angle);
          const sin = Math.sin(p.angle);
          const anchor = cos > 0.3 ? "start" : cos < -0.3 ? "end" : "middle";
          // Side labels grow away from their spoke, and at eight axes the
          // horizontal-most anchors sit close enough to the edge that the
          // longest short_name would leave the box — so they get nudged
          // just far enough back in.
          const labelX = anchor === "start" ? Math.min(p.x, W - 76)
            : anchor === "end" ? Math.max(p.x, 76)
            : p.x;
          // Two lines per axis — name over raw score — shifted clear of the
          // rim: up above the chart, down below it, centered at the sides.
          const nameY = sin < -0.5 ? p.y - 10 : sin > 0.5 ? p.y + 12 : p.y - 1;
          const scoredCount = series.filter((s) => s.axisData[i].scored).length;
          const missing = scoredCount ? "" : " missing";
          // One model shows its number; a comparison shows how many of its
          // models ran the benchmark at all, and only when some did not —
          // five numbers do not fit under one label, and "5 of 5" is noise.
          const valueText = single
            ? (series[0].axisData[i].scored ? series[0].axisData[i].value.toFixed(scoreDecimals(key)) : "&mdash;")
            : (scoredCount < series.length ? `${scoredCount}/${series.length}` : "");
          const tip = single && !series[0].axisData[i].ranked ? tipAttrs(radarAxisTip(models[0], series[0].axisData[i])) : "";
          return `<g${tip}>` +
            `<text class="radar-label${missing}" x="${r1(labelX)}" y="${r1(nameY)}" text-anchor="${anchor}">${escapeHtml(getBenchmarkLabel(key))}</text>` +
            (valueText ? `<text class="radar-value${missing}" x="${r1(labelX)}" y="${r1(nameY + 16)}" text-anchor="${anchor}">${valueText}</text>` : "") +
            `</g>`;
        }).join("");

        const title = single
          ? `Radar chart of ${models[0].name || "this model"} percentile ranks over ${n} benchmarks`
          : `Radar chart comparing ${models.map((model) => model.name || "Unknown").join(", ")} over ${n} benchmarks by percentile rank`;
        return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeAttr(title)}">` +
          rings + spokes + ticks + shapeMarkup + dots + hits + labels +
          `</svg>`;
      }

      // Who is who. The swatch is drawn with the very classes the chart uses,
      // so a colour or a dash can never drift between the two, and the mean
      // percentile beside each name is the one number that says which shape is
      // bigger. The × is the fourth way to edit a comparison: it navigates to
      // the same address minus that model.
      function radarLegend(series) {
        const items = series.map((s) => {
          const name = s.model.name || "Unknown";
          const slug = modelSlug(name);
          const meanText = s.mean === null ? "&mdash;" : `p${Math.round(s.mean * 100)}`;
          const meanTip = s.mean === null
            ? "No charted axis has a rank for this model."
            : `Mean percentile rank over the ${s.ranked.length} charted ${s.ranked.length === 1 ? "axis" : "axes"} this model is ranked on.`;
          return `<li class="radar-legend-item" data-series="${s.slot}">` +
            `<svg class="radar-legend-swatch" viewBox="0 0 26 12" aria-hidden="true">` +
              `<line class="radar-line radar-series" data-series="${s.slot}" x1="1" y1="6" x2="25" y2="6"/>` +
              radarMarker(s.slot, 13, 6, 3.5) +
            `</svg>` +
            `<a class="radar-legend-name" href="#model/${escapeAttr(encodeURIComponent(slug))}">${escapeHtml(name)}</a>` +
            `<span class="radar-legend-mean"${tipAttrs({ eyebrow: "Mean rank", title: name, body: meanTip })}>${meanText}</span>` +
            `<button type="button" class="radar-legend-x" data-action="compare-remove" data-slug="${escapeAttr(slug)}" aria-label="${escapeAttr(`Drop ${name} from the comparison`)}">&times;</button>` +
            `</li>`;
        }).join("");
        return `<ul class="radar-legend">${items}</ul>`;
      }

      // The slip on a radar vertex (or, for an empty axis, its label): which
      // benchmark, the raw score, where it stands, when it moved, and where
      // it was read — the same provenance a table cell's slip carries.
      function radarAxisTip(model, a) {
        const bench = state.data?.benchmarks?.[a.key] || {};
        const updated = model.scores_updated?.[a.key];
        const source = recentLinkUrl(model.scores_source?.[a.key]);
        const body = a.scored
          ? `Scores ${a.value.toFixed(scoreDecimals(a.key))}. ${scoreTipBody(a.key)}`
          : `No score recorded for this model. ${scoreTipBody(a.key)}`;
        return {
          eyebrow: bench.category || "Benchmark",
          title: bench.name || getBenchmarkLabel(a.key),
          iconKey: a.key,
          body,
          meta: [
            a.ranked ? `Percentile ${Math.round(a.pct * 100)} of ${rankedCount(a.key)} ranked models` : "",
            a.scored && !a.ranked ? "Too few models ran this benchmark to rank it." : "",
            updated ? `Updated ${updated}` : ""
          ].filter(Boolean).join("\n"),
          url: source || benchmarkLinks(bench)[0] || ""
        };
      }

      // The slip on an axis wedge: every compared model's standing on that one
      // benchmark, best first. Models with no score are listed too — an
      // absence is the comparison's point as often as a number is.
      function radarCompareAxisTip(series, i, key) {
        const bench = state.data?.benchmarks?.[key] || {};
        const rows = series
          .map((s) => ({ name: s.model.name || "Unknown", a: s.axisData[i] }))
          .sort((x, y) => (y.a.ranked ? y.a.pct : -1) - (x.a.ranked ? x.a.pct : -1));
        const meta = rows.map(({ name, a }) => {
          if (!a.scored) {
            return `${name} — no score`;
          }
          const score = a.value.toFixed(scoreDecimals(key));
          return a.ranked ? `${name} — ${score} (p${Math.round(a.pct * 100)})` : `${name} — ${score} (unranked)`;
        }).join("\n");
        return {
          eyebrow: bench.category || "Benchmark",
          title: bench.name || getBenchmarkLabel(key),
          iconKey: key,
          body: scoreTipBody(key),
          meta,
          url: benchmarkLinks(bench)[0] || ""
        };
      }

      /* ── Benchmark detail dialog ──
         Below 720px the benchmark table keeps only name and score; a long
         press on a score row opens this dialog with what the hidden columns
         held — percentile, dates, provenance — plus the gist of what the
         benchmark measures. Wired in bindDetailEvents. */

      const BENCH_PRESS_MS = 450;   // the same deliberate hold the tooltip asks for
      const BENCH_PRESS_SLOP = 10;  // a press that travels further is a pan

      // The dialog exists for the layout that hides the columns it repeats;
      // on a wide screen the table already says everything.
      function benchDialogEnabled() {
        return window.matchMedia("(max-width: 720px)").matches;
      }

      // A link shown as its domain: the domain is the provenance tell (see
      // tipLinkMarkup). Callers pass URLs that already survived the gate.
      function sourceHost(url) {
        const parsed = tipSafeUrl(url);
        return parsed ? parsed.host.replace(/^www\./, "") : "";
      }

      function openBenchDialog(model, key) {
        if (!state.data?.benchmarks?.[key]) {
          return;
        }
        const bench = state.data.benchmarks[key];
        const value = toNumber(model.scores?.[key]);
        const scored = Number.isFinite(value);
        const pct = scored ? percentileFor(model, key) : null;
        const updated = model.scores_updated?.[key] || "";
        const age = daysSince(updated);
        const source = recentLinkUrl(model.scores_source?.[key]);
        const benchUrl = recentLinkUrl(benchmarkLinks(bench)[0] || "");
        const fresh = scored && scoreFreshness(model, key) > 0;

        ui.benchDialog.innerHTML = `
          <button type="button" class="bench-dialog-close" aria-label="Close">&times;</button>
          <span class="bench-dialog-eyebrow">${escapeHtml(bench.category || "Benchmark")}</span>
          <h3 class="bench-dialog-title">${renderBenchmarkIcon(key)}${escapeHtml(bench.name || getBenchmarkLabel(key))}</h3>
          ${bench.description ? `<p class="bench-dialog-desc">${escapeHtml(firstSentence(bench.description))} ${isLowerBetter(key) ? "Lower is better." : "Higher is better."}</p>` : ""}
          <dl>
            <dt>Score</dt>
            <dd${fresh ? ' class="fresh"' : ""}>${formatScore(value, key)}</dd>
            <dt>Percentile</dt>
            <dd>${Number.isFinite(pct) ? `p${Math.round(pct * 100)} of ${rankedCount(key)} ranked` : '<span class="na">&mdash;</span>'}</dd>
            <dt>Updated</dt>
            <dd${fresh ? ' class="fresh"' : ""}>${updated ? `${escapeHtml(updated)}${age !== null && age >= 0 ? ` (${escapeHtml(describeAge(age))})` : ""}` : '<span class="na">&mdash;</span>'}</dd>
            <dt>Source</dt>
            <dd>${source ? `<a href="${escapeAttr(source)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceHost(source))}</a>` : '<span class="na">&mdash;</span>'}</dd>
            <dt>About</dt>
            <dd>${benchUrl ? `<a href="${escapeAttr(benchUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceHost(benchUrl))}</a>` : '<span class="na">&mdash;</span>'}</dd>
          </dl>
        `;
        closeTip();
        if (!ui.benchDialog.open) {
          ui.benchDialog.showModal();
        }
      }

      function closeBenchDialog() {
        if (ui.benchDialog.open) {
          ui.benchDialog.close();
        }
      }

      // Everything the index knows about the model, scored or not, grouped
      // the way the columns are. Dates wear the same red the table gives a
      // freshly restamped score; sources show as their domain, since the
      // domain is the provenance tell (see tipLinkMarkup).
      // How many of the index's benchmarks this model has a number for — the
      // Coverage line on a detail page and in a comparison's specs table, so
      // the two can never disagree about what "N of M" counts.
      function modelCoverage(model) {
        return state.benchmarkKeys
          .filter((key) => Number.isFinite(toNumber(model.scores?.[key]))).length;
      }

      // Benchmarks in the index's own order, filed under their category. The
      // detail table, the axis menu and the comparison table all walk this, so
      // there is one definition of the grouping and of the order it comes in.
      function benchmarkKeysByCategory() {
        const groups = [];
        const byCategory = new Map();
        state.benchmarkKeys.forEach((key) => {
          const category = state.data?.benchmarks?.[key]?.category || "Other";
          if (!byCategory.has(category)) {
            byCategory.set(category, { category, keys: [] });
            groups.push(byCategory.get(category));
          }
          byCategory.get(category).keys.push(key);
        });
        return groups;
      }

      function renderDetailBenchTable(model) {
        const rows = benchmarkKeysByCategory().map(({ category, keys }) => {
          const items = keys.map((key) => {
            const bench = state.data.benchmarks[key] || {};
            const value = toNumber(model.scores?.[key]);
            const scored = Number.isFinite(value);
            const pct = scored ? percentileFor(model, key) : null;
            const updated = model.scores_updated?.[key] || "";
            const source = recentLinkUrl(model.scores_source?.[key]);
            const fresh = scored && scoreFreshness(model, key) > 0;
            const flags = [
              bench.derived ? `<span class="bench-flag">derived</span>` : "",
              isLowerBetter(key) ? `<span class="bench-flag">lower is better</span>` : ""
            ].join("");
            return `
              <tr data-bench-key="${escapeAttr(key)}"${scored ? "" : ' class="bench-missing"'}>
                <td><span class="bench-name-cell"${tipAttrs(benchmarkTipFields(key))}>${renderBenchmarkIcon(key)}<span class="bench-name-text">${escapeHtml(bench.name || getBenchmarkLabel(key))}</span></span>${flags}</td>
                <td class="num">${formatScore(value, key)}</td>
                <td class="num bench-pct">${Number.isFinite(pct) ? `p${Math.round(pct * 100)}` : '<span class="num na">&mdash;&nbsp;</span>'}</td>
                <td class="num${fresh ? " fresh-score" : ""}">${updated ? escapeHtml(updated) : '<span class="num na">&mdash;&nbsp;</span>'}</td>
                <td class="bench-source">${source
                  ? `<a href="${escapeAttr(source)}" target="_blank" rel="noopener noreferrer"${tipAttrs({ eyebrow: "Source", body: "Where this score was read.", url: source })}>${escapeHtml(sourceHost(source))}</a>`
                  : '<span class="na">&mdash;</span>'}</td>
              </tr>`;
          }).join("");
          return `<tr class="bench-cat-row"><td colspan="5">${escapeHtml(category)}</td></tr>${items}`;
        }).join("");

        return `
          <section class="detail-bench-panel" aria-label="All benchmarks for this model">
            <h2>All benchmarks</h2>
            <div class="detail-bench-card">
              <table class="detail-bench-table">
                <thead>
                  <tr>
                    <th>Benchmark</th>
                    <th class="num">Score</th>
                    <th class="num">Percentile</th>
                    <th class="num">Updated</th>
                    <th>Source</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      /* ── Model comparison ────────────────────────────
         Two to five models side by side: one radar with a series each, one
         specs table, one all-benchmarks table with a column per model. It
         lives behind #compare/<slug>,<slug>, so a comparison is a link the
         way a detail page is — and it is built out of the detail page's
         parts rather than a second copy of them: the same axes, the same
         percentile ranks, the same benchmark grouping. */

      const COMPARE_MIN = 2;
      const COMPARE_MAX = 5;
      // Never emitted with anything else: modelSlug only ever produces
      // [a-z0-9.-], so a comma can never turn up inside a slug.
      const COMPARE_SEP = ",";

      // Route slugs to model objects — raw ones out of state.modelsBySlug,
      // because percentileFor keys its rank maps by object identity (see the
      // note in init) and the decorated copies applyAndRender builds would
      // rank as null for everything. Two models that slug the same collide in
      // that map already, so a comparison can only ever hold one of them;
      // there is nothing to do about it here that renaming would not do
      // better upstream.
      function resolveCompareModels(slugs) {
        const models = [];
        const missing = [];
        slugs.forEach((slug) => {
          const model = state.modelsBySlug.get(slug);
          if (model) {
            models.push(model);
          } else {
            missing.push(slug);
          }
        });
        return { models, missing };
      }

      // Everything the address can get wrong is decided here, and in every
      // case the hash is left saying exactly what the page shows — so a link
      // that gets shared onward is the link the sharer was looking at.
      function renderCompareRoute(slugs) {
        const raw = String(location.hash || "").match(/^#compare\/(.+)$/);
        // parseCompareSlugs already dropped duplicates and cut the list; this
        // is how many the reader actually asked for.
        const asked = raw ? decodeSlug(raw[1]).split(/[,+]/).filter((part) => part.trim()).length : slugs.length;
        const truncated = asked > slugs.length;
        const { models, missing } = resolveCompareModels(slugs);

        // A comparison of one is a detail page — including one left holding a
        // single model because the rest of the address went stale. Replaced
        // rather than pushed: the degenerate address has no business sitting
        // in the history for the back button to walk into.
        if (models.length === 1) {
          location.replace(`#model/${encodeURIComponent(modelSlug(models[0].name))}`);
          return;
        }

        if (!models.length) {
          renderUnknownCompare(slugs);
          document.title = state.data.title || "OpenBench Index";
          return;
        }

        const kept = models.map((model) => modelSlug(model.name));
        if (missing.length || truncated) {
          history.replaceState(null, "", compareHash(kept));
          state.route.slugs = kept;
        }

        renderCompareView(models, missing, truncated ? asked : 0);
        document.title = `${models.map((model) => model.name).join(" vs ")} · ${state.data.title || "OpenBench Index"}`;
      }

      // Nothing in the address names a model the index knows — every slug is
      // stale or mistyped. Same empty-state voice renderUnknownModel uses.
      function renderUnknownCompare(slugs) {
        closeTip();
        ui.content.innerHTML = `
          <section class="detail-head">
            <a class="detail-back" href="#">&larr; Leaderboard</a>
          </section>
          <div class="empty">No model called ${slugs.map((slug) => `&ldquo;${escapeHtml(slug)}&rdquo;`).join(" or ")} is in the index.</div>
        `;
      }

      function renderCompareView(models, missing, asked) {
        // Every anchor in here is about to be replaced.
        closeTip();
        ui.content.innerHTML = `
          ${renderCompareHead(models, missing, asked)}
          <div class="detail-grid">
            ${renderRadarSection(models)}
          </div>
          ${renderCompareSpecs(models)}
          ${renderCompareBenchTable(models)}
        `;
      }

      // The swatch that ties a name to its series, repeated wherever a model
      // is named on this page — the byline, the table heads — so the legend is
      // never the only place to look a colour up.
      function compareSwatch(slot) {
        return `<span class="compare-swatch" style="background: var(--series-${slot + 1})" aria-hidden="true"></span>`;
      }

      function renderCompareHead(models, missing, asked) {
        // The heading is the comparison — the models' own names, joined the way
        // the page title joins them, each in its series colour and each still a
        // link to its own page. A byline underneath would now be the same names
        // a second time, so the swatch and the link came up here with them.
        // Each "vs" travels inside the item it introduces rather than between
        // two of them, so five long names wrap as "…thinker / vs qwen3…" and
        // never leave a joiner stranded at the end of a line.
        // Each name carries the × that drops it, because the line that says who
        // is being compared is where a reader looks to change who is being
        // compared. Same action the legend's × fires, so the two cannot drift:
        // it navigates to this address minus that model, and dropping to one
        // lands on the survivor's own page, exactly as a one-slug address does.
        const heading = models.map((model, slot) => {
          const name = model.name || "Unknown";
          const slug = modelSlug(name);
          return `<span class="compare-name-item">` +
            (slot ? `<span class="compare-vs">vs</span>` : "") +
            `${compareSwatch(slot)}` +
            `<a href="#model/${escapeAttr(encodeURIComponent(slug))}">${escapeHtml(name)}</a>` +
            `<button type="button" class="compare-name-x" data-action="compare-remove" data-slug="${escapeAttr(slug)}"` +
            ` aria-label="${escapeAttr(`Drop ${name} from the comparison`)}">&times;</button>` +
            `</span>`;
        }).join("");

        const notes = [
          asked ? `Showing the first ${models.length} of ${asked} models — a comparison holds ${COMPARE_MAX}.` : "",
          missing.length ? `${missing.map((slug) => `&ldquo;${escapeHtml(slug)}&rdquo;`).join(" and ")} ${missing.length === 1 ? "is" : "are"} not in the index and ${missing.length === 1 ? "was" : "were"} dropped.` : ""
        ].filter(Boolean).map((note) => `<p class="compare-missing-note">${note}</p>`).join("");

        return `
          <section class="detail-head compare-head">
            <div class="detail-head-main">
              <a class="detail-back" href="#">&larr; Leaderboard</a>
              <h2 class="detail-name compare-name">${heading}</h2>
              <div class="compare-actions">${compareHeadActions(models)}</div>
              ${notes}
            </div>
          </section>
        `;
      }

      /* ── The "compare with…" picker ──
         One component with two callers: the + Add model button on a
         comparison and the Compare with… button on a single model's page. It
         borrows the axis menu's shell and rows wholesale — the only thing it
         adds is a search box, because four hundred models is not a list
         anyone scrolls. */

      function compareHeadActions(models) {
        return `${renderComparePicker(models, "+ Add model", models.length >= COMPARE_MAX)}
          <button type="button" class="compare-btn" data-action="compare-copy"${tipAttrs({
            eyebrow: "Share",
            body: "Copies this page's address. The comparison lives in the link, so it reopens exactly as it is here — note that the export button still follows the filter panel, not this page."
          })}>Copy link</button>
          <button type="button" class="compare-btn" data-action="compare-clear">Clear</button>`;
      }

      // Only the action row re-renders when the menu opens, closes or is
      // typed into — the radar and the tables below it are untouched, so the
      // page never jumps. Both views put their picker in .compare-actions,
      // which is what makes one function enough.
      function rerenderCompareControls() {
        const host = ui.content.querySelector(".compare-actions");
        if (!host) {
          return;
        }
        closeTip();
        const models = currentRadarModels();
        if (state.route.view === "compare") {
          host.innerHTML = compareHeadActions(models);
        } else if (models.length) {
          host.innerHTML = renderComparePicker(models, "Compare with&hellip;");
        }
        // Typing straight into the search box is the point of opening the
        // list, but only where a keyboard is already out — the same rule
        // focusOptionSearch follows for the filter panel's widgets.
        if (state.compare.pickerOpen && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          host.querySelector(".compare-menu-search-input")?.focus();
        }
      }

      // A menu row toggles, inside the cap. Only the body is swapped, so the
      // search box above it keeps focus and caret while the reader works.
      function togglePendingModel(slug) {
        const index = state.compare.pending.indexOf(slug);
        if (index >= 0) {
          state.compare.pending.splice(index, 1);
        } else if (state.compare.pending.length < COMPARE_MAX) {
          state.compare.pending.push(slug);
        }
        const body = document.getElementById("compareMenuBody");
        if (body) {
          body.innerHTML = renderCompareMenuBody();
        }
      }

      // The address is the comparison, so handing it over is the whole share
      // story. The prompt is the fallback for a browser that withholds the
      // clipboard (no permission, or a page not served over https).
      function copyCompareLink(button) {
        const restore = () => {
          const label = button.textContent;
          button.textContent = "Copied";
          window.setTimeout(() => { button.textContent = label; }, 1200);
        };
        const ask = () => window.prompt("Copy this link", location.href);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(location.href).then(restore, ask);
        } else {
          ask();
        }
      }

      // The slugs the Compare Models picker currently adds up to. Names go
      // through modelSlug rather than being looked up, because that widget
      // holds names and the address holds slugs.
      function selectedCompareSlugs() {
        return state.filters.selectedModels.map((name) => modelSlug(name));
      }

      function compareSelectionReady() {
        const count = state.filters.selectedModels.length;
        return count >= COMPARE_MIN && count <= COMPARE_MAX;
      }

      function goToSelectedComparison() {
        if (compareSelectionReady()) {
          location.hash = compareHash(selectedCompareSlugs());
        }
      }

      function renderComparePicker(models, label, disabled) {
        const menu = state.compare.pickerOpen ? renderCompareMenu() : "";
        return `<button type="button" class="compare-btn" data-action="compare-toggle-picker"` +
          `${disabled ? " disabled" : ""} aria-expanded="${String(Boolean(state.compare.pickerOpen))}" aria-haspopup="true"` +
          `${disabled ? tipAttrs({ body: `A comparison holds ${COMPARE_MAX} models — drop one first.` }) : ""}>${label}</button>${menu}`;
      }

      function renderCompareMenu() {
        return `<div class="axis-menu compare-menu">
          <div class="compare-menu-search">
            <input type="text" class="compare-menu-search-input" placeholder="Filter models" aria-label="Filter models"
              autocomplete="off" spellcheck="false" value="${escapeAttr(state.compare.query)}">
          </div>
          <div id="compareMenuBody">${renderCompareMenuBody()}</div>
        </div>`;
      }

      // Only this body is ever swapped as the reader types, so the input above
      // it is never replaced and keeps its focus and its caret.
      function renderCompareMenuBody() {
        const pending = state.compare.pending;
        const query = state.compare.query.trim().toLowerCase();
        const atMax = pending.length >= COMPARE_MAX;

        // Picked first, then the leaderboard order the reader was just looking
        // at, then whatever the filters were hiding — alphabetically, so the
        // tail is at least predictable.
        const seen = new Set();
        const ordered = [];
        const push = (model) => {
          const slug = modelSlug(model.name);
          if (!seen.has(slug)) {
            seen.add(slug);
            ordered.push({ model, slug });
          }
        };
        pending.forEach((slug) => {
          const model = state.modelsBySlug.get(slug);
          if (model) push(model);
        });
        state.filteredModels.forEach((row) => {
          const model = state.modelsBySlug.get(modelSlug(row.name));
          if (model) push(model);
        });
        [...state.data.models]
          .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")))
          .forEach(push);

        const items = ordered
          .filter(({ model }) => !query || `${model.name || ""} ${creatorNameOf(model)}`.toLowerCase().includes(query))
          .map(({ model, slug }) => {
            const on = pending.includes(slug);
            const disabled = !on && atMax;
            return `<button type="button" class="axis-menu-item${on ? " on" : ""}" data-action="compare-pick" data-slug="${escapeAttr(slug)}"${disabled ? " disabled" : ""}>` +
              `<span class="axis-menu-check" aria-hidden="true">&#10003;</span>` +
              `<span class="axis-menu-name">${escapeHtml(model.name || "Unknown")}</span>` +
              `<span class="axis-menu-score">${escapeHtml(creatorNameOf(model))}</span>` +
              `</button>`;
          }).join("");

        const note = atMax
          ? `<div class="axis-menu-note">${COMPARE_MAX} of ${COMPARE_MAX} &mdash; unpick one to add another.</div>`
          : "";
        const empty = items ? "" : `<div class="compare-menu-empty">No model matches that.</div>`;
        const ready = pending.length >= COMPARE_MIN;
        const foot = `<div class="compare-menu-foot">
          <button type="button" class="compare-btn is-primary" data-action="compare-go"${ready ? "" : " disabled"}${ready ? "" : tipAttrs({
            body: `Pick at least ${COMPARE_MIN} models to compare them side by side.`
          })}>Compare ${pending.length} model${pending.length === 1 ? "" : "s"}</button>
        </div>`;
        return `${note}${empty}${items}${foot}`;
      }

      /* ── Specs, side by side ──
         A table rather than the detail page's <dl>: a two-column definition
         list does not generalize to five models. Same rows in the same order,
         so a reader moving between the two pages reads the same list. */

      // Which cells in a spec row earn the best-value mark. Context and
      // coverage have a best — more of either is strictly better. Parameters
      // and VRAM do not: a bigger model is not a better one, and a smaller
      // VRAM figure is a smaller model rather than a better result, which is
      // exactly why the table's own VRAM shading is a fit test against a
      // budget and not a ranking.
      function compareSpecBest(values) {
        const numbers = values.filter((value) => Number.isFinite(value));
        if (numbers.length < 2) {
          return new Set();
        }
        const top = Math.max(...numbers);
        const best = new Set();
        values.forEach((value, i) => {
          if (Number.isFinite(value) && nearlyEqual(value, top)) {
            best.add(i);
          }
        });
        return best;
      }

      function renderCompareSpecs(models) {
        const heads = models.map((model, slot) => {
          const name = model.name || "Unknown";
          return `<th scope="col"><span class="compare-head-cell">${compareSwatch(slot)}` +
            `<a href="#model/${escapeAttr(encodeURIComponent(modelSlug(name)))}">${escapeHtml(name)}</a></span></th>`;
        }).join("");

        const row = (label, cells) =>
          `<tr><th scope="row" class="compare-spec-name">${label}</th>${cells}</tr>`;

        const creators = models.map((model) => {
          const name = escapeHtml(creatorNameOf(model));
          const url = recentLinkUrl(model.creator?.url);
          return `<td class="compare-spec-value">${url
            ? `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${name}</a>`
            : name}</td>`;
        }).join("");

        // Context arrives as a unit string ("256k", "1M"), so it goes through
        // parseUnitNumber — the same reader the table's own top-context mark
        // and the context sort use.
        const contexts = compareSpecBest(models.map((model) => parseUnitNumber(model.context)));
        const coverages = compareSpecBest(models.map((model) => modelCoverage(model)));

        // One VRAM row per quantization, each slip carrying where that figure
        // was read — the same static fields the detail page's card uses.
        const vramRows = ["fp16", "int8", "int4"].map((quant) => {
          const cells = models.map((model) => {
            const value = model.vram?.[quant];
            const source = recentLinkUrl(model.vram_source?.[quant]);
            const tip = value == null ? "" : tipAttrs({
              eyebrow: "VRAM estimate",
              title: `${model.name || "Unknown"} @ ${quant}`,
              body: source ? "Estimated weights-only memory. The link is where the figure was read." : "Estimated weights-only memory. No source recorded.",
              url: source
            });
            return `<td class="compare-spec-value"${tip}>${formatVram(value)}</td>`;
          }).join("");
          return row(`VRAM ${escapeHtml(quant)}`, cells);
        }).join("");

        const rows = [
          row("Creator", creators),
          row("Parameters", models.map((model) => `<td class="compare-spec-value">${formatParams(model.params)}</td>`).join("")),
          row("Context", models.map((model, i) => `<td class="compare-spec-value${contexts.has(i) ? " is-best" : ""}">${formatContext(model.context)}</td>`).join("")),
          vramRows,
          row("Added", models.map((model) => `<td class="compare-spec-value">${model.date_added ? escapeHtml(model.date_added) : "-"}</td>`).join("")),
          row("Coverage", models.map((model, i) => `<td class="compare-spec-value${coverages.has(i) ? " is-best" : ""}">${modelCoverage(model)} / ${state.benchmarkKeys.length}</td>`).join("")),
          // The address itself, spelled out, is the one cell that can force a
          // model's whole column wider than the phone it is being read on --
          // and five of them say the same host anyway. So the row is the mark
          // the tooltips use for an outbound link, and the address travels in
          // the slip behind it, where the host and path are already styled
          // apart.
          row("Model page", models.map((model) => {
            const url = recentLinkUrl(model.url);
            const name = model.name || "Unknown";
            return `<td class="compare-spec-value">${url
              ? `<a class="compare-link" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer"` +
                `${tipAttrs({ eyebrow: "Model page", title: name, body: "Where this model is published.", url })}` +
                ` aria-label="${escapeAttr(`Open the ${name} model page`)}">&#8599;</a>`
              : '<span class="na">&mdash;</span>'}</td>`;
          }).join(""))
        ].join("");

        return `
          <section class="detail-bench-panel compare-panel" aria-label="Specifications side by side">
            <h2>Details</h2>
            <div class="detail-bench-card">
              <table class="compare-table compare-specs-table">
                <thead><tr><th scope="col">Detail</th>${heads}</tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      /* ── Benchmarks, side by side ──
         Every benchmark in the index, scored or not, grouped the way the
         columns are — a row nobody ran is dimmed rather than dropped, because
         a shared blank is as much of an answer as a number, and the row is
         also the axis picker's shopping list. */

      // The best cells in one row: every model tied at the best value, flipped
      // for a lower-is-better benchmark. Nothing is marked when fewer than two
      // models have a number — there is no "best" among one score.
      function compareBestSet(models, key) {
        const values = models.map((model) => toNumber(model.scores?.[key]));
        const numbers = values.filter((value) => Number.isFinite(value));
        if (numbers.length < 2) {
          return new Set();
        }
        const top = isLowerBetter(key) ? Math.min(...numbers) : Math.max(...numbers);
        const best = new Set();
        values.forEach((value, i) => {
          if (Number.isFinite(value) && nearlyEqual(value, top)) {
            best.add(i);
          }
        });
        return best;
      }

      // Score over rank. The dates and the provenance the detail page shows in
      // their own columns move into the cell's own slip here — five models
      // times five fields is not a table anyone reads — and the slip is also
      // what a phone gets, where the rank line is hidden and a long press on
      // the cell is what opens it.
      function renderCompareScoreCell(model, key, isBest) {
        const value = toNumber(model.scores?.[key]);
        const scored = Number.isFinite(value);
        const pct = scored ? percentileFor(model, key) : null;
        const fresh = scored && scoreFreshness(model, key) > 0;
        const classes = ["compare-cell", isBest ? "is-best" : "", fresh ? "is-fresh" : ""].filter(Boolean).join(" ");
        const tip = tipAttrs(radarAxisTip(model, {
          key,
          value,
          scored,
          pct,
          ranked: scored && Number.isFinite(pct)
        }));
        const score = scored
          ? `<span class="compare-score">${formatScore(value, key)}</span>`
          : `<span class="na">&mdash;</span>`;
        const rank = Number.isFinite(pct) ? `p${Math.round(pct * 100)}` : "&mdash;";
        return `<td class="${classes}"${tip}>${score}<span class="compare-pct">${rank}</span></td>`;
      }

      function renderCompareBenchTable(models) {
        const span = models.length + 1;
        const heads = models.map((model, slot) => {
          const name = model.name || "Unknown";
          return `<th scope="col"><span class="compare-head-cell">${compareSwatch(slot)}` +
            `<a href="#model/${escapeAttr(encodeURIComponent(modelSlug(name)))}">${escapeHtml(name)}</a></span></th>`;
        }).join("");

        const rows = benchmarkKeysByCategory().map(({ category, keys }) => {
          const items = keys.map((key) => {
            const bench = state.data.benchmarks[key] || {};
            const best = compareBestSet(models, key);
            const anyScored = models.some((model) => Number.isFinite(toNumber(model.scores?.[key])));
            const flags = [
              bench.derived ? `<span class="bench-flag">derived</span>` : "",
              isLowerBetter(key) ? `<span class="bench-flag">lower is better</span>` : ""
            ].join("");
            const cells = models.map((model, i) => renderCompareScoreCell(model, key, best.has(i))).join("");
            return `
              <tr data-bench-key="${escapeAttr(key)}"${anyScored ? "" : ' class="bench-missing"'}>
                <td><span class="bench-name-cell"${tipAttrs(benchmarkTipFields(key))}>${renderBenchmarkIcon(key)}<span class="bench-name-text">${escapeHtml(bench.name || getBenchmarkLabel(key))}</span></span>${flags}</td>
                ${cells}
              </tr>`;
          }).join("");
          return `<tr class="bench-cat-row"><td colspan="${span}"><span class="bench-cat-label">${escapeHtml(category)}</span></td></tr>${items}`;
        }).join("");

        return `
          <section class="detail-bench-panel compare-panel" aria-label="All benchmarks side by side">
            <h2>All benchmarks</h2>
            <div class="detail-bench-card">
              <table class="compare-table">
                <thead><tr><th scope="col">Benchmark</th>${heads}</tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      /* ── GPU VRAM filter ─────────────────────────── */

      async function loadGpuData() {
        if (state.gpu.list.length) {
          return;
        }
        try {
          const list = JSON.parse(await fetchRemoteText(GPU_DATA_URLS));
          if (Array.isArray(list) && list.length) {
            initGpuBar(list);
          }
        } catch (err) {
          // the GPU filter is optional; leave the bar unbuilt
        }
      }

      function initGpuBar(list) {
        state.gpu.list = list
          .filter((gpu) => gpu && gpu.model && Number.isFinite(Number(gpu.vram_gb)))
          .map((gpu) => ({
            manufacturer: String(gpu.manufacturer || ""),
            model: String(gpu.model),
            vram_gb: Number(gpu.vram_gb),
            release: typeof gpu.release === "string" ? gpu.release : ""
          }))
          .sort((a, b) =>
            a.manufacturer.localeCompare(b.manufacturer) ||
            a.model.localeCompare(b.model, undefined, { numeric: true }));

        if (!state.gpu.list.length) {
          return;
        }
        ui.gpuBar.hidden = false;
        ui.controls.classList.add("has-gpu");
        initHostingPresets();
        updateFilterColumns();
        if (!state.gpu.eventsBound) {
          bindGpuEvents();
          state.gpu.eventsBound = true;
        }
      }

      // ── Hosting presets ──────────────────────────────────────────────

      // mittwald's Managed Dedicated AI Hosting tiers. A preset is nothing more
      // than a shortcut into the GPU filter — it picks a card and a card count,
      // and the budget, VRAM shading and Reserve then behave exactly as if the
      // fields had been filled in by hand.
      const HOSTING_PRESET_VENDOR = "NVIDIA";
      const HOSTING_PRESET_GPU = "RTX PRO 6000 Blackwell (Server)";
      const HOSTING_PRESETS = [
        { tier: "M", cards: 1 },
        { tier: "L", cards: 2 },
        { tier: "XL", cards: 4 }
      ];

      function hostingPresetGpu() {
        return state.gpu.list.find((gpu) =>
          gpu.manufacturer === HOSTING_PRESET_VENDOR && gpu.model === HOSTING_PRESET_GPU) || null;
      }

      // Chips are rendered from gpu.json rather than from hard-coded totals, so
      // a change to the card's VRAM there carries the tier labels with it. No
      // card, no strip — the tiers would have nothing to point the filter at.
      function initHostingPresets() {
        if (!ui.hostingPresets || !ui.presetChips) {
          return;
        }
        const gpu = hostingPresetGpu();
        if (!gpu) {
          ui.hostingPresets.hidden = true;
          return;
        }
        ui.presetChips.innerHTML = HOSTING_PRESETS.map((preset) => {
          const total = formatGb(gpu.vram_gb * preset.cards);
          const tip = `Sets the GPU filter to ${preset.cards} × ${gpu.manufacturer} ${gpu.model} — a ${total} GB VRAM budget. Click again to clear it.`;
          return `<button type="button" class="preset-chip" data-cards="${preset.cards}" aria-pressed="false" data-tip-title="Hosting tier ${escapeHtml(preset.tier)}" data-tip="${escapeHtml(tip)}">
            <span class="preset-tier">${escapeHtml(preset.tier)}</span>
            <span class="preset-spec">${escapeHtml(`${preset.cards}× · ${total} GB`)}</span>
          </button>`;
        }).join("");
        ui.presetsNote.textContent = `${gpu.manufacturer} ${gpu.model} · ${formatGb(gpu.vram_gb)} GB per card`;
        ui.hostingPresets.hidden = false;

        if (!state.gpu.presetsBound) {
          ui.presetChips.addEventListener("click", (event) => {
            const chip = event.target.closest(".preset-chip");
            if (chip) {
              applyHostingPreset(Number(chip.dataset.cards));
            }
          });
          state.gpu.presetsBound = true;
        }
        syncHostingPresets();
      }

      // Clicking the armed tier again clears the GPU filter, so the strip can
      // undo itself without a trip down to the × in the fields.
      function applyHostingPreset(cards) {
        const gpu = hostingPresetGpu();
        if (!gpu || !Number.isFinite(cards)) {
          return;
        }
        if (hostingPresetActive(cards)) {
          gpuResetBar();
          applyAndRender();
          return;
        }
        // Count goes in directly rather than through gpuSetCount: gpuSelect
        // derives the budget from it and renders once, not twice.
        state.gpu.count = clampGpuCount(cards);
        ui.gpuCount.value = String(state.gpu.count);
        setGpuCountDisabled(false);
        gpuSelect(gpu);
      }

      // A tier is armed only while the filter still holds exactly what the
      // preset put there, so editing the fields by hand unarms the chip.
      function hostingPresetActive(cards) {
        return Boolean(state.gpu.budget)
          && state.gpu.selected?.model === HOSTING_PRESET_GPU
          && state.gpu.count === cards;
      }

      function syncHostingPresets() {
        if (!ui.presetChips) {
          return;
        }
        ui.presetChips.querySelectorAll(".preset-chip").forEach((chip) => {
          const active = hostingPresetActive(Number(chip.dataset.cards));
          chip.classList.toggle("is-active", active);
          chip.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function bindGpuEvents() {
        ui.gpuVendor.addEventListener("change", (event) => {
          const vendor = event.target.value;
          state.gpu.vendor = vendor;
          if (vendor === "custom") {
            state.gpu.custom = true;
            state.gpu.selected = null;
            ui.gpuModel.value = "";
            setGpuCountDisabled(true);
            closeGpuList();
            updateFilterGlow();
            ui.gpuVram.focus();
            return;
          }
          state.gpu.custom = false;
          setGpuCountDisabled(false);
          if (state.gpu.selected && vendor !== "all" && state.gpu.selected.manufacturer !== vendor) {
            state.gpu.selected = null;
            ui.gpuModel.value = "";
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          updateFilterGlow();
          if (!ui.gpuModelList.hidden || document.activeElement === ui.gpuModel) {
            openGpuList();
          }
        });

        ui.gpuModel.addEventListener("focus", () => {
          const keepAll = Boolean(state.gpu.selected && ui.gpuModel.value === state.gpu.selected.model);
          openGpuList(keepAll);
        });

        ui.gpuModel.addEventListener("input", () => {
          if (state.gpu.selected && ui.gpuModel.value !== state.gpu.selected.model) {
            state.gpu.selected = null;
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          openGpuList();
        });

        ui.gpuModel.addEventListener("blur", () => {
          closeGpuList();
          if (state.gpu.selected) {
            ui.gpuModel.value = state.gpu.selected.model;
          }
        });

        ui.gpuModel.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeGpuList();
            return;
          }
          if (ui.gpuModelList.hidden && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
            event.preventDefault();
            openGpuList();
            return;
          }
          const count = state.gpu.visible.length;
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            if (!count) {
              return;
            }
            const step = event.key === "ArrowDown" ? 1 : -1;
            state.gpu.activeIndex = (state.gpu.activeIndex + step + count) % count;
            updateActiveGpuOption();
          } else if (event.key === "Enter") {
            const pick = state.gpu.activeIndex >= 0
              ? state.gpu.visible[state.gpu.activeIndex]
              : (count === 1 ? state.gpu.visible[0] : null);
            if (pick) {
              event.preventDefault();
              gpuSelect(pick);
            }
          }
        });

        ui.gpuModelList.addEventListener("mousedown", (event) => event.preventDefault());
        ui.gpuModelList.addEventListener("click", (event) => {
          const option = event.target.closest(".gpu-option");
          if (!option) {
            return;
          }
          const gpu = state.gpu.visible[Number(option.dataset.index)];
          if (gpu) {
            gpuSelect(gpu);
          }
        });

        ui.gpuClear.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          gpuResetBar();
          applyAndRender();
        });

        ui.gpuCountDown.addEventListener("click", () => gpuSetCount(state.gpu.count - 1));
        ui.gpuCountUp.addEventListener("click", () => gpuSetCount(state.gpu.count + 1));
        ui.gpuCount.addEventListener("change", () => gpuSetCount(parseInt(ui.gpuCount.value, 10)));

        ui.gpuReserveDown.addEventListener("click", () => gpuSetReserve(reservePercent() - RESERVE_STEP));
        ui.gpuReserveUp.addEventListener("click", () => gpuSetReserve(reservePercent() + RESERVE_STEP));
        ui.gpuReserve.addEventListener("change", () => gpuSetReserve(parseInt(ui.gpuReserve.value, 10)));

        ui.gpuVram.addEventListener("input", () => {
          const value = parseFloat(ui.gpuVram.value.replace(",", "."));
          state.gpu.custom = true;
          state.gpu.selected = null;
          state.gpu.vendor = "custom";
          ui.gpuVendor.value = "custom";
          ui.gpuModel.value = "";
          setGpuCountDisabled(true);
          gpuSetBudget(Number.isFinite(value) && value > 0 ? value : null);
        });
      }

      function gpuVisibleList(showAll) {
        const query = showAll ? "" : ui.gpuModel.value.trim().toLowerCase();
        const vendor = state.gpu.vendor;
        return state.gpu.list.filter((gpu) =>
          (vendor === "all" || vendor === "custom" || gpu.manufacturer === vendor) &&
          (!query || gpu.model.toLowerCase().includes(query) || gpu.manufacturer.toLowerCase().includes(query)));
      }

      function openGpuList(showAll = false) {
        renderGpuList(showAll);
        ui.gpuModelList.hidden = false;
        ui.gpuModel.setAttribute("aria-expanded", "true");
      }

      function closeGpuList() {
        ui.gpuModelList.hidden = true;
        ui.gpuModel.setAttribute("aria-expanded", "false");
        state.gpu.activeIndex = -1;
      }

      function renderGpuList(showAll = false) {
        const items = gpuVisibleList(showAll);
        state.gpu.visible = items;
        state.gpu.activeIndex = -1;
        if (!items.length) {
          ui.gpuModelList.innerHTML = `<div class="gpu-combo-empty">No matching GPU</div>`;
          return;
        }
        ui.gpuModelList.innerHTML = items.map((gpu, index) => {
          const selected = state.gpu.selected === gpu;
          const vendorTag = gpu.manufacturer === "NVIDIA" ? "NV" : gpu.manufacturer;
          return `<div class="gpu-option${selected ? " is-selected" : ""}" role="option" aria-selected="${selected}" data-index="${index}">
            <span class="gpu-opt-vendor">${escapeHtml(vendorTag)}</span>
            <span class="gpu-opt-name">${escapeHtml(gpu.model)}</span>
            <span class="gpu-opt-vram">${escapeHtml(String(gpu.vram_gb))}&thinsp;GB</span>
            <span class="gpu-opt-date">${escapeHtml(formatGpuRelease(gpu.release))}</span>
          </div>`;
        }).join("");
      }

      function updateActiveGpuOption() {
        ui.gpuModelList.querySelectorAll(".gpu-option").forEach((el, index) => {
          const active = index === state.gpu.activeIndex;
          el.classList.toggle("active", active);
          if (active) {
            el.scrollIntoView({ block: "nearest" });
          }
        });
      }

      function gpuSelect(gpu) {
        state.gpu.selected = gpu;
        state.gpu.custom = false;
        ui.gpuModel.value = gpu.model;
        // Follow the pick: point the vendor select at the card's own maker so the
        // two fields never disagree (falls back to "any" for unlisted vendors).
        const vendor = [...ui.gpuVendor.options].some((option) => option.value === gpu.manufacturer)
          ? gpu.manufacturer
          : "all";
        state.gpu.vendor = vendor;
        ui.gpuVendor.value = vendor;
        setGpuCountDisabled(false);
        closeGpuList();
        gpuUpdateBudgetFromSelection();
      }

      function clampGpuCount(next) {
        return Math.max(1, Math.min(16, Math.round(next) || 1));
      }

      function gpuSetCount(next) {
        const clamped = clampGpuCount(next);
        state.gpu.count = clamped;
        ui.gpuCount.value = String(clamped);
        if (state.gpu.selected) {
          gpuUpdateBudgetFromSelection();
        }
      }

      // Reserve is stored as a fraction but edited in whole percent steps.
      const RESERVE_STEP = 5;
      const RESERVE_MAX = 90;

      function reservePercent() {
        return Math.round(state.gpu.reserve * 100);
      }

      function gpuSetReserve(nextPercent) {
        const rounded = Math.round(Number(nextPercent) / RESERVE_STEP) * RESERVE_STEP;
        const clamped = Math.max(0, Math.min(RESERVE_MAX, Number.isFinite(rounded) ? rounded : 0));
        state.gpu.reserve = clamped / 100;
        ui.gpuReserve.value = `${clamped}%`;
        applyAndRender();
      }

      function gpuUpdateBudgetFromSelection() {
        const gpu = state.gpu.selected;
        const total = gpu ? gpu.vram_gb * state.gpu.count : null;
        ui.gpuVram.value = total ? String(total) : "";
        gpuSetBudget(total);
      }

      function gpuSetBudget(budget) {
        state.gpu.budget = Number.isFinite(budget) && budget > 0 ? budget : null;
        applyAndRender();
      }

      // Usable VRAM: total minus the reserved share. Everything that judges
      // whether a model fits works off this, not the raw total.
      function gpuUsableBudget() {
        const budget = state.gpu.budget;
        if (!budget) {
          return null;
        }
        const usable = budget * (1 - state.gpu.reserve);
        return usable > 0 ? usable : null;
      }

      function formatGb(value) {
        return Number.isFinite(value) ? String(Math.round(value * 10) / 10) : "—";
      }

      function updateReserveHint() {
        if (!ui.gpuTotal) {
          return;
        }
        const budget = state.gpu.budget;
        if (!budget || !state.gpu.reserve) {
          ui.gpuTotal.removeAttribute("title");
          return;
        }
        const pct = Math.round(state.gpu.reserve * 100);
        ui.gpuTotal.title = `${formatGb(gpuUsableBudget())} GB usable — ${pct}% of ${formatGb(budget)} GB reserved`;
      }

      function setGpuCountDisabled(disabled) {
        ui.gpuStepper.classList.toggle("disabled", disabled);
        ui.gpuCount.disabled = disabled;
        ui.gpuCountDown.disabled = disabled;
        ui.gpuCountUp.disabled = disabled;
      }

      function gpuResetBar() {
        state.gpu.vendor = "all";
        state.gpu.selected = null;
        state.gpu.count = 1;
        state.gpu.custom = false;
        state.gpu.budget = null;
        state.gpu.reserve = 0;
        if (!ui.gpuBar || ui.gpuBar.hidden) {
          return;
        }
        ui.gpuReserve.value = "0%";
        ui.gpuVendor.value = "all";
        ui.gpuModel.value = "";
        ui.gpuCount.value = "1";
        ui.gpuVram.value = "";
        setGpuCountDisabled(false);
        closeGpuList();
      }

      const GPU_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function formatGpuRelease(iso) {
        if (!iso) {
          return "";
        }
        const [year, month] = iso.split("-");
        const monthIndex = Number(month);
        if (Number.isFinite(monthIndex) && monthIndex >= 1 && monthIndex <= 12) {
          return `${GPU_MONTHS[monthIndex - 1]} ${year}`;
        }
        return year || "";
      }

      // Range-colors a VRAM requirement against the active GPU budget:
      // green while comfortable, sliding to amber as it approaches 100%,
      // struck through when it exceeds the budget.
      function renderVramCell(raw) {
        const html = formatVram(raw);
        const budget = gpuUsableBudget();
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!Number.isFinite(num)) {
          return `<td class="mono">${html}</td>`;
        }
        const tip = ` data-tip-kind="vram"`;
        if (!budget) {
          return `<td class="mono"${tip}>${html}</td>`;
        }
        // With a reserve set, the tooltip names the usable budget so the
        // shading and the total in the filter bar don't look contradictory.
        const budgetLabel = state.gpu.reserve
          ? `${formatGb(budget)} GB usable budget (${Math.round(state.gpu.reserve * 100)}% of ${formatGb(state.gpu.budget)} GB reserved)`
          : `${formatGb(budget)} GB budget`;
        const ratio = num / budget;
        if (ratio > 1) {
          return `<td class="mono vram-over"${tip}>${html}</td>`;
        }
        const t = Math.max(0, Math.min(1, (ratio - 0.55) / 0.45));
        const hue = Math.round(150 - t * 130);
        return `<td class="mono vram-fit" style="--fit-h:${hue}"${tip}>${html}</td>`;
      }

      function updateMeta() {
        const shown = state.filteredModels.length;
        const total = state.data.models.length;
        ui.resultCount.textContent = `${shown} of ${total} models`;
        const shownCreators = new Set(state.filteredModels.map((m) => m.creatorName)).size;
        const totalCreators = new Set(state.data.models.map(creatorNameOf)).size;
        ui.creatorCount.textContent = `${shownCreators} of ${totalCreators} creators`;
        const shownBenchmarks = visibleBenchmarkKeys().length;
        const totalBenchmarks = state.benchmarkKeys.length;
        ui.benchmarkCount.textContent = shownBenchmarks === totalBenchmarks
          ? `${totalBenchmarks} benchmarks`
          : `${shownBenchmarks} of ${totalBenchmarks} benchmarks`;
      }

      function getTopScoresByBenchmark(models) {
        const topScores = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((model) => toNumber(model.scores?.[key]))
            .filter((value) => Number.isFinite(value));
          if (!values.length) {
            topScores[key] = Number.NaN;
            return;
          }
          topScores[key] = isLowerBetter(key) ? Math.min(...values) : Math.max(...values);
        });
        return topScores;
      }

      function getScoreRangesByBenchmark(models) {
        const ranges = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((m) => toNumber(m.scores?.[key]))
            .filter((v) => Number.isFinite(v));
          if (!values.length) { ranges[key] = null; return; }
          // Named by rank, not by magnitude: `top` is the best score, `second`
          // the runner-up, `min` the worst. On a lower-is-better benchmark that
          // means top/min are the numeric min/max, which keeps scoreToGrey's
          // "muted at min, prominent at second" ramp pointing the right way.
          const lower = isLowerBetter(key);
          const best = (vals) => (lower ? Math.min(...vals) : Math.max(...vals));
          const worst = (vals) => (lower ? Math.max(...vals) : Math.min(...vals));
          const top = best(values);
          const nonTop = values.filter((v) => !nearlyEqual(v, top));
          ranges[key] = {
            top,
            second: nonTop.length ? best(nonTop) : null,
            min: nonTop.length ? worst(nonTop) : null
          };
        });
        return ranges;
      }

      function scoreToGrey(score, range) {
        if (!range || range.second === null || !Number.isFinite(score)) return null;
        const { second, min } = range;
        // t = 0 at min (most muted), t = 1 at second-best (most prominent)
        const t = nearlyEqual(second, min) ? 1 : Math.max(0, Math.min(1, (score - min) / (second - min)));
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        // light: #8b8b8b (channel 139) → #111111 (channel 17)
        // dark:  #6e6e6e (channel 110) → #aaaaaa (channel 170) — flipped & lifted for dark bg
        const channel = isDark
          ? Math.round(110 + 60 * t)
          : Math.round(139 - 122 * t);
        const hex = channel.toString(16).padStart(2, "0");
        return `#${hex}${hex}${hex}`;
      }

      function getOrderedBenchmarkKeys(benchmarks) {
        return Object.keys(benchmarks || {});
      }

      function getBenchmarkLabel(key) {
        return state.data?.benchmarks?.[key]?.short_name || state.data?.benchmarks?.[key]?.name || key;
      }

      // Benchmarks where a smaller number is the better result (e.g. a
      // hallucination rate). Everything that ranks asks this instead of
      // assuming "bigger is better": the top-score mark, the grey ramp, group
      // percentiles, and the sort direction — ▼ still means best-first, so
      // such a column compares against its numbers (see sortModels).
      function isLowerBetter(key) {
        return state.data?.benchmarks?.[key]?.lower_is_better === true;
      }

      // Benchmarks computed from other columns rather than read from a
      // leaderboard — derive_indexes.py writes the ones there are today.
      function isDerivedBenchmark(key) {
        return state.data?.benchmarks?.[key]?.derived === true;
      }

      // Column headers use short_name to stay narrow; lists with room (the
      // benchmark picker, the sort dropdown) use the full name.
      function getBenchmarkFullName(key) {
        return state.data?.benchmarks?.[key]?.name || getBenchmarkLabel(key);
      }

      // Serializes tooltip fields into the data-tip* attributes an anchor needs.
      // data-tip is always written, even when empty: it is what marks the
      // element as an anchor.
      function tipAttrs(fields) {
        const attrs = [` data-tip="${escapeAttr(fields.body || "")}"`];
        if (fields.eyebrow) attrs.push(` data-tip-eyebrow="${escapeAttr(fields.eyebrow)}"`);
        if (fields.eyebrowVerbatim) attrs.push(` data-tip-eyebrow-verbatim`);
        if (fields.eyebrowUrl) attrs.push(` data-tip-eyebrow-url="${escapeAttr(fields.eyebrowUrl)}"`);
        if (fields.title) attrs.push(` data-tip-title="${escapeAttr(fields.title)}"`);
        if (fields.meta) attrs.push(` data-tip-meta="${escapeAttr(fields.meta)}"`);
        // The benchmark key, not its icon markup: tipMarkup looks the icon up,
        // so an attribute never has to carry HTML.
        if (fields.iconKey) attrs.push(` data-tip-icon="${escapeAttr(fields.iconKey)}"`);
        if (fields.url) attrs.push(` data-tip-url="${escapeAttr(fields.url)}"`);
        return attrs.join("");
      }

      // One tooltip contract for a benchmark, shared by the column header and
      // the visibility picker: what it is, what it measures, where to read it up.
      function benchmarkTipFields(key, eyebrow) {
        const bench = state.data?.benchmarks?.[key] || {};
        return {
          eyebrow: eyebrow || bench.category || "Benchmark",
          title: bench.name || getBenchmarkLabel(key),
          body: bench.description || "",
          url: benchmarkLinks(bench)[0] || "",
          iconKey: key
        };
      }

      // The gist of a longer description: its first sentence, capped so one
      // runaway opening cannot fill a slip. Lets a score cell say what its
      // benchmark is without repeating the paragraph the column header carries.
      function firstSentence(text) {
        const trimmed = String(text || "").trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^.*?[.!?](?=\s|$)/);
        const sentence = match ? match[0] : trimmed;
        if (sentence.length <= 180) return sentence;
        const clipped = sentence.slice(0, 180);
        const cut = clipped.lastIndexOf(" ");
        // Trailing punctuation left hanging by the cut ("incorrect /", "tasks —")
        // reads as a typo rather than an ellipsis, so it goes with the tail.
        const kept = (cut > 0 ? clipped.slice(0, cut) : clipped).replace(/[\s,;:/(\-–—]+$/, "");
        return `${kept}…`;
      }

      // What one score's slip says about the benchmark behind it: the gist, and
      // which way the number reads — a pass rate and a hallucination rate look
      // alike until you know which direction is good. The full description stays
      // on the column header, which has the room for it.
      function scoreTipBody(key) {
        const bench = state.data?.benchmarks?.[key] || {};
        return [
          firstSentence(bench.description),
          isLowerBetter(key) ? "Lower is better." : "Higher is better."
        ].filter(Boolean).join(" ");
      }

      // One tooltip contract for a model, shared by the table row and the
      // Recently Added panel: who made it, when it arrived, and the page its
      // details are checked against.
      function modelTipFields(model) {
        const url = model.url || "";
        return {
          eyebrow: model.creatorName || "",
          eyebrowVerbatim: true,
          eyebrowUrl: model.creator?.url || "",
          title: model.name || "Unknown",
          body: url
            ? "Click for the model's detail page: every recorded score, and a radar profile you can shape. The link below is the creator's own page for it."
            : "Click for the model's detail page: every recorded score, and a radar profile you can shape.",
          meta: model.date_added ? `Added ${model.date_added}` : "Date added unknown",
          url
        };
      }

      function getBenchmarkIcon(key) {
        const icon = state.data?.benchmarks?.[key]?.icon_svg;
        if (typeof icon !== "string") {
          return "";
        }
        if (icon.trim().startsWith("<svg")) {
          return icon;
        }
        return icon;
      }

      function renderBenchmarkIcon(key) {
        const icon = getBenchmarkIcon(key);
        if (!icon) {
          return "";
        }
        if (icon.startsWith("<svg")) {
          return icon;
        }
        return `<img class="benchmark-icon" src="${escapeAttr(icon)}" alt="" aria-hidden="true">`;
      }

      function getBestInTableByModel(models) {
        const result = new Map();
        models.forEach((model) => result.set(model, new Set()));

        if (!models.length) {
          return result;
        }

        const topByBenchmark = getTopScoresByBenchmark(models);
        const topContext = Math.max(...models.map((m) => parseUnitNumber(m.context)).filter((v) => Number.isFinite(v)));

        models.forEach((model) => {
          const flags = result.get(model);
          if (!flags) {
            return;
          }

          const contextValue = parseUnitNumber(model.context);
          if (Number.isFinite(contextValue) && Number.isFinite(topContext) && nearlyEqual(contextValue, topContext)) {
            flags.add("context");
          }

          Object.keys(topByBenchmark).forEach((key) => {
            const value = toNumber(model.scores?.[key]);
            const top = topByBenchmark[key];
            if (Number.isFinite(value) && Number.isFinite(top) && nearlyEqual(value, top)) {
              flags.add(key);
            }
          });
        });

        return result;
      }

      function formatContext(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        const match = str.match(/^(\d+\.?\d*)([A-Za-z]+)$/);
        if (!match) return escapeHtml(str);
        const [, num, unit] = match;
        return `${escapeHtml(num)}<span class="p-letter">${escapeHtml(unit)}</span>`;
      }

      function formatVram(raw) {
        if (raw == null || raw === "") return "-";
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!Number.isFinite(num)) return escapeHtml(String(raw));
        return `${escapeHtml(String(num))}<span class="p-unit">&thinsp;</span><span class="p-letter">GB</span>`;
      }

      function formatParams(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        // Matches "123B", "117B-A5.1B", "1T-A32B", unknown-active forms like
        // "2.8T-A~B", and standalone effective forms like "E4B".
        const mainMatch = str.match(/^(\d+\.?\d*)([BT])(?:-(A)(\d+\.?\d*|~)([BT]))?$/i);
        if (mainMatch) {
          const [, mainNum, mainUnit, aPrefix, activeNum, activeUnit] = mainMatch;
          let html = `${escapeHtml(mainNum)}<span class="p-letter">${escapeHtml(mainUnit)}</span>`;
          if (aPrefix) {
            html += `<span class="p-unit">&thinsp;-&thinsp;</span>${escapeHtml(aPrefix)}${escapeHtml(activeNum)}<span class="p-letter">${escapeHtml(activeUnit)}</span>`;
          }
          return html;
        }

        const effectiveMatch = str.match(/^(E)(\d+\.?\d*)(B)$/i);
        if (effectiveMatch) {
          const [, effectivePrefix, effectiveNum, effectiveUnit] = effectiveMatch;
          return `${escapeHtml(effectivePrefix)}${escapeHtml(effectiveNum)}<span class="p-letter">${escapeHtml(effectiveUnit)}</span>`;
        }

        return escapeHtml(str);
      }

      // Benchmarks are printed with one decimal unless llm.json says otherwise
      // ("decimals": 0 for a whole-number index like the Coding column, whose
      // values are points rather than a percentage).
      function scoreDecimals(key) {
        const decimals = state.data?.benchmarks?.[key]?.decimals;
        return Number.isFinite(decimals) ? decimals : 1;
      }

      function formatScore(value, key) {
        if (!Number.isFinite(value)) {
          return '<span class="num na">&mdash;&nbsp;</span>';
        }
        return value.toFixed(scoreDecimals(key));
      }

      function toNumber(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          return value;
        }
        if (typeof value === "string") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : Number.NaN;
        }
        return Number.NaN;
      }

      function parseUnitNumber(raw) {
        if (raw == null) {
          return Number.NaN;
        }

        const text = String(raw).trim().toLowerCase();
        const match = text.match(/([0-9]*\.?[0-9]+)\s*([a-z]+)/);
        if (!match) {
          const plain = Number(text.replace(/,/g, ""));
          return Number.isFinite(plain) ? plain : Number.NaN;
        }

        const value = Number(match[1]);
        const unit = match[2];
        if (!Number.isFinite(value)) {
          return Number.NaN;
        }

        const multipliers = {
          k: 1e3,
          m: 1e6,
          b: 1e9,
          t: 1e12
        };

        const tail = unit[0];
        if (tail in multipliers) {
          return value * multipliers[tail];
        }

        return value;
      }

      function nearlyEqual(a, b) {
        return Math.abs(a - b) < 1e-9;
      }

      function sortModeValue(key, direction) {
        return `${key}::${direction}`;
      }

      function parseSortModeValue(value) {
        const parts = String(value).split("::");
        const key = parts[0] || defaultSortKey();
        const direction = parts[1] === "asc" ? "asc" : "desc";
        return { key, direction };
      }

      /* ── Export ─────────────────────────────────────────
         Exports always re-fetch upstream, so the values in a downloaded file
         are the published ones — never a locally imported file. The model
         exports do honour the on-screen filters though: only the models that
         pass them, and only the benchmarks that are shown, make it into the
         file, and it is then named llm-filtered.* so it can't be mistaken for
         the published llm.json. Sort order is not carried over (upstream order
         is kept), and the GPU exports are never filtered. JSON/YAML carry the
         whole document; CSV can only hold a table, so it flattens models[] /
         the GPU list. */

      // Takes "csv" (models data) or "<dataset>.<format>" such as "gpu.csv", so
      // the ?export= value reads like the file it produces. Each serializer gets
      // the raw response body: an unfiltered JSON export passes it through
      // byte-for-byte rather than round-tripping through JSON.stringify, which
      // would drop upstream formatting (and turn 68.0 into 68).
      //
      // A hoisted function, not a const map: ?export= runs while this block is
      // still in the temporal dead zone, so a const here would throw.
      function exportSpec(value) {
        const parts = String(value || "").trim().toLowerCase().split(".");
        if (parts.length > 2) return null;
        const dataset = parts.length === 2 ? parts[0] : "llm";
        const format = parts[parts.length - 1];

        let url;
        let tabulate;
        switch (dataset) {
          case "llm":
            url = DATA_URLS;
            tabulate = modelsToCsv;
            break;
          case "gpu":
            url = GPU_DATA_URLS;
            tabulate = gpusToCsv;
            break;
          default:
            return null;
        }

        // ?export= can run before the data has loaded; exportFilters() reports
        // nothing active until then, so such an export is the full document.
        const filtered = dataset === "llm" && exportFilters().active;
        const stem = filtered ? `${dataset}-filtered` : dataset;
        const refine = filtered ? filterModelsDocument : (data) => data;

        switch (format) {
          case "json":
            return {
              url,
              filename: `${stem}.json`,
              mime: "application/json",
              serialize: (text) => (filtered ? `${JSON.stringify(refine(JSON.parse(text)), null, 2)}\n` : text)
            };
          case "yaml":
          case "yml":
            return { url, filename: `${stem}.yaml`, mime: "application/yaml", serialize: (text) => toYaml(refine(JSON.parse(text))) };
          case "csv":
            return { url, filename: `${stem}.csv`, mime: "text/csv;charset=utf-8", serialize: (text) => tabulate(refine(JSON.parse(text))) };
          default:
            return null;
        }
      }

      // What an export would drop, measured against the loaded data. Sort is
      // deliberately not part of this: exports keep upstream order, so
      // re-sorting the table must not advertise a filtered download. Neither is
      // the GPU vendor picker, which only narrows the GPU list, not the models.
      function exportFilters() {
        const totalModels = state.data?.models?.length || 0;
        const totalBenchmarks = state.benchmarkKeys.length;
        const loaded = Boolean(state.data);
        const hiddenBenchmarks = loaded ? state.filters.hiddenBenchmarks.length : 0;
        const modelsOn = loaded && (
          Boolean(state.filters.search)
          || state.filters.selectedModels.length > 0
          || Boolean(state.filters.addedFrom)
          || Boolean(state.filters.addedTo)
          || Boolean(gpuUsableBudget())
        );
        return {
          active: modelsOn || hiddenBenchmarks > 0,
          models: modelsOn ? state.filteredModels.length : totalModels,
          totalModels,
          benchmarks: totalBenchmarks - hiddenBenchmarks,
          totalBenchmarks
        };
      }

      // Narrows a freshly fetched upstream document to the current filters.
      // Benchmarks are pruned by the hidden set rather than kept by the visible
      // one, so a benchmark upstream gained since the page loaded still comes
      // along instead of being silently dropped.
      function filterModelsDocument(data) {
        const hidden = new Set(state.filters.hiddenBenchmarks);
        const models = (Array.isArray(data.models) ? data.models : [])
          .filter((model) => modelPassesFilters(model))
          .map((model) => {
            if (!hidden.size) return model;
            const pruned = { ...model };
            if (pruned.scores) pruned.scores = withoutKeys(pruned.scores, hidden);
            if (pruned.scores_updated) pruned.scores_updated = withoutKeys(pruned.scores_updated, hidden);
            return pruned;
          });

        return {
          ...data,
          benchmarks: hidden.size ? withoutKeys(data.benchmarks, hidden) : data.benchmarks,
          models
        };
      }

      function withoutKeys(map, drop) {
        if (!map || typeof map !== "object") return map;
        return Object.fromEntries(Object.entries(map).filter(([key]) => !drop.has(key)));
      }

      function bindExportEvents() {
        ui.exportBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          setExportMenuOpen(ui.exportList.hidden);
        });

        ui.exportList.addEventListener("click", (event) => {
          const item = event.target.closest("button[data-export]");
          if (!item) return;
          setExportMenuOpen(false);
          exportData(item.dataset.export);
        });
