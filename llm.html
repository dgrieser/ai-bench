            state.gpu.selected = null;
            ui.gpuModel.value = "";
            setGpuCountDisabled(true);
            closeGpuList();
            updateFilterGlow();
            ui.gpuVram.focus();
            return;
          }
          state.gpu.custom = false;
          setGpuCountDisabled(false);
          if (state.gpu.selected && vendor !== "all" && state.gpu.selected.manufacturer !== vendor) {
            state.gpu.selected = null;
            ui.gpuModel.value = "";
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          updateFilterGlow();
          if (!ui.gpuModelList.hidden || document.activeElement === ui.gpuModel) {
            openGpuList();
          }
        });

        ui.gpuModel.addEventListener("focus", () => {
          const keepAll = Boolean(state.gpu.selected && ui.gpuModel.value === state.gpu.selected.model);
          openGpuList(keepAll);
        });

        ui.gpuModel.addEventListener("input", () => {
          if (state.gpu.selected && ui.gpuModel.value !== state.gpu.selected.model) {
            state.gpu.selected = null;
            ui.gpuVram.value = "";
            gpuSetBudget(null);
          }
          openGpuList();
        });

        ui.gpuModel.addEventListener("blur", () => {
          closeGpuList();
          if (state.gpu.selected) {
            ui.gpuModel.value = state.gpu.selected.model;
          }
        });

        ui.gpuModel.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeGpuList();
            return;
          }
          if (ui.gpuModelList.hidden && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
            event.preventDefault();
            openGpuList();
            return;
          }
          const count = state.gpu.visible.length;
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            if (!count) {
              return;
            }
            const step = event.key === "ArrowDown" ? 1 : -1;
            state.gpu.activeIndex = (state.gpu.activeIndex + step + count) % count;
            updateActiveGpuOption();
          } else if (event.key === "Enter") {
            const pick = state.gpu.activeIndex >= 0
              ? state.gpu.visible[state.gpu.activeIndex]
              : (count === 1 ? state.gpu.visible[0] : null);
            if (pick) {
              event.preventDefault();
              gpuSelect(pick);
            }
          }
        });

        ui.gpuModelList.addEventListener("mousedown", (event) => event.preventDefault());
        ui.gpuModelList.addEventListener("click", (event) => {
          const option = event.target.closest(".gpu-option");
          if (!option) {
            return;
          }
          const gpu = state.gpu.visible[Number(option.dataset.index)];
          if (gpu) {
            gpuSelect(gpu);
          }
        });

        ui.gpuClear.addEventListener("mousedown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          gpuResetBar();
          applyAndRender();
        });

        ui.gpuCountDown.addEventListener("click", () => gpuSetCount(state.gpu.count - 1));
        ui.gpuCountUp.addEventListener("click", () => gpuSetCount(state.gpu.count + 1));
        ui.gpuCount.addEventListener("change", () => gpuSetCount(parseInt(ui.gpuCount.value, 10)));

        ui.gpuReserveDown.addEventListener("click", () => gpuSetReserve(reservePercent() - RESERVE_STEP));
        ui.gpuReserveUp.addEventListener("click", () => gpuSetReserve(reservePercent() + RESERVE_STEP));
        ui.gpuReserve.addEventListener("change", () => gpuSetReserve(parseInt(ui.gpuReserve.value, 10)));

        ui.gpuVram.addEventListener("input", () => {
          const value = parseFloat(ui.gpuVram.value.replace(",", "."));
          state.gpu.custom = true;
          state.gpu.selected = null;
          state.gpu.vendor = "custom";
          ui.gpuVendor.value = "custom";
          ui.gpuModel.value = "";
          setGpuCountDisabled(true);
          gpuSetBudget(Number.isFinite(value) && value > 0 ? value : null);
        });
      }

      function gpuVisibleList(showAll) {
        const query = showAll ? "" : ui.gpuModel.value.trim().toLowerCase();
        const vendor = state.gpu.vendor;
        return state.gpu.list.filter((gpu) =>
          (vendor === "all" || vendor === "custom" || gpu.manufacturer === vendor) &&
          (!query || gpu.model.toLowerCase().includes(query) || gpu.manufacturer.toLowerCase().includes(query)));
      }

      function openGpuList(showAll = false) {
        renderGpuList(showAll);
        ui.gpuModelList.hidden = false;
        ui.gpuModel.setAttribute("aria-expanded", "true");
      }

      function closeGpuList() {
        ui.gpuModelList.hidden = true;
        ui.gpuModel.setAttribute("aria-expanded", "false");
        state.gpu.activeIndex = -1;
      }

      function renderGpuList(showAll = false) {
        const items = gpuVisibleList(showAll);
        state.gpu.visible = items;
        state.gpu.activeIndex = -1;
        if (!items.length) {
          ui.gpuModelList.innerHTML = `<div class="gpu-combo-empty">No matching GPU</div>`;
          return;
        }
        ui.gpuModelList.innerHTML = items.map((gpu, index) => {
          const selected = state.gpu.selected === gpu;
          const vendorTag = gpu.manufacturer === "NVIDIA" ? "NV" : gpu.manufacturer;
          return `<div class="gpu-option${selected ? " is-selected" : ""}" role="option" aria-selected="${selected}" data-index="${index}">
            <span class="gpu-opt-vendor">${escapeHtml(vendorTag)}</span>
            <span class="gpu-opt-name">${escapeHtml(gpu.model)}</span>
            <span class="gpu-opt-vram">${escapeHtml(String(gpu.vram_gb))}&thinsp;GB</span>
            <span class="gpu-opt-date">${escapeHtml(formatGpuRelease(gpu.release))}</span>
          </div>`;
        }).join("");
      }

      function updateActiveGpuOption() {
        ui.gpuModelList.querySelectorAll(".gpu-option").forEach((el, index) => {
          const active = index === state.gpu.activeIndex;
          el.classList.toggle("active", active);
          if (active) {
            el.scrollIntoView({ block: "nearest" });
          }
        });
      }

      function gpuSelect(gpu) {
        state.gpu.selected = gpu;
        state.gpu.custom = false;
        ui.gpuModel.value = gpu.model;
        // Follow the pick: point the vendor select at the card's own maker so the
        // two fields never disagree (falls back to "any" for unlisted vendors).
        const vendor = [...ui.gpuVendor.options].some((option) => option.value === gpu.manufacturer)
          ? gpu.manufacturer
          : "all";
        state.gpu.vendor = vendor;
        ui.gpuVendor.value = vendor;
        setGpuCountDisabled(false);
        closeGpuList();
        gpuUpdateBudgetFromSelection();
      }

      function clampGpuCount(next) {
        return Math.max(1, Math.min(16, Math.round(next) || 1));
      }

      function gpuSetCount(next) {
        const clamped = clampGpuCount(next);
        state.gpu.count = clamped;
        ui.gpuCount.value = String(clamped);
        if (state.gpu.selected) {
          gpuUpdateBudgetFromSelection();
        }
      }

      // Reserve is stored as a fraction but edited in whole percent steps.
      const RESERVE_STEP = 5;
      const RESERVE_MAX = 90;

      function reservePercent() {
        return Math.round(state.gpu.reserve * 100);
      }

      function gpuSetReserve(nextPercent) {
        const rounded = Math.round(Number(nextPercent) / RESERVE_STEP) * RESERVE_STEP;
        const clamped = Math.max(0, Math.min(RESERVE_MAX, Number.isFinite(rounded) ? rounded : 0));
        state.gpu.reserve = clamped / 100;
        ui.gpuReserve.value = `${clamped}%`;
        applyAndRender();
      }

      function gpuUpdateBudgetFromSelection() {
        const gpu = state.gpu.selected;
        const total = gpu ? gpu.vram_gb * state.gpu.count : null;
        ui.gpuVram.value = total ? String(total) : "";
        gpuSetBudget(total);
      }

      function gpuSetBudget(budget) {
        state.gpu.budget = Number.isFinite(budget) && budget > 0 ? budget : null;
        applyAndRender();
      }

      // Usable VRAM: total minus the reserved share. Everything that judges
      // whether a model fits works off this, not the raw total.
      function gpuUsableBudget() {
        const budget = state.gpu.budget;
        if (!budget) {
          return null;
        }
        const usable = budget * (1 - state.gpu.reserve);
        return usable > 0 ? usable : null;
      }

      function formatGb(value) {
        return Number.isFinite(value) ? String(Math.round(value * 10) / 10) : "—";
      }

      function updateReserveHint() {
        if (!ui.gpuTotal) {
          return;
        }
        const budget = state.gpu.budget;
        if (!budget || !state.gpu.reserve) {
          ui.gpuTotal.removeAttribute("title");
          return;
        }
        const pct = Math.round(state.gpu.reserve * 100);
        ui.gpuTotal.title = `${formatGb(gpuUsableBudget())} GB usable — ${pct}% of ${formatGb(budget)} GB reserved`;
      }

      function setGpuCountDisabled(disabled) {
        ui.gpuStepper.classList.toggle("disabled", disabled);
        ui.gpuCount.disabled = disabled;
        ui.gpuCountDown.disabled = disabled;
        ui.gpuCountUp.disabled = disabled;
      }

      function gpuResetBar() {
        state.gpu.vendor = "all";
        state.gpu.selected = null;
        state.gpu.count = 1;
        state.gpu.custom = false;
        state.gpu.budget = null;
        state.gpu.reserve = 0;
        if (!ui.gpuBar || ui.gpuBar.hidden) {
          return;
        }
        ui.gpuReserve.value = "0%";
        ui.gpuVendor.value = "all";
        ui.gpuModel.value = "";
        ui.gpuCount.value = "1";
        ui.gpuVram.value = "";
        setGpuCountDisabled(false);
        closeGpuList();
      }

      const GPU_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function formatGpuRelease(iso) {
        if (!iso) {
          return "";
        }
        const [year, month] = iso.split("-");
        const monthIndex = Number(month);
        if (Number.isFinite(monthIndex) && monthIndex >= 1 && monthIndex <= 12) {
          return `${GPU_MONTHS[monthIndex - 1]} ${year}`;
        }
        return year || "";
      }

      // Range-colors a VRAM requirement against the active GPU budget:
      // green while comfortable, sliding to amber as it approaches 100%,
      // struck through when it exceeds the budget.
      function renderVramCell(raw) {
        const html = formatVram(raw);
        const budget = gpuUsableBudget();
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!Number.isFinite(num)) {
          return `<td class="mono">${html}</td>`;
        }
        const tip = ` data-tip-kind="vram"`;
        if (!budget) {
          return `<td class="mono"${tip}>${html}</td>`;
        }
        // With a reserve set, the tooltip names the usable budget so the
        // shading and the total in the filter bar don't look contradictory.
        const budgetLabel = state.gpu.reserve
          ? `${formatGb(budget)} GB usable budget (${Math.round(state.gpu.reserve * 100)}% of ${formatGb(state.gpu.budget)} GB reserved)`
          : `${formatGb(budget)} GB budget`;
        const ratio = num / budget;
        if (ratio > 1) {
          return `<td class="mono vram-over"${tip}>${html}</td>`;
        }
        const t = Math.max(0, Math.min(1, (ratio - 0.55) / 0.45));
        const hue = Math.round(150 - t * 130);
        return `<td class="mono vram-fit" style="--fit-h:${hue}"${tip}>${html}</td>`;
      }

      function updateMeta() {
        const shown = state.filteredModels.length;
        const total = state.data.models.length;
        ui.resultCount.textContent = `${shown} of ${total} models`;
        const shownCreators = new Set(state.filteredModels.map((m) => m.creatorName)).size;
        const totalCreators = new Set(state.data.models.map(creatorNameOf)).size;
        ui.creatorCount.textContent = `${shownCreators} of ${totalCreators} creators`;
        const shownBenchmarks = visibleBenchmarkKeys().length;
        const totalBenchmarks = state.benchmarkKeys.length;
        ui.benchmarkCount.textContent = shownBenchmarks === totalBenchmarks
          ? `${totalBenchmarks} benchmarks`
          : `${shownBenchmarks} of ${totalBenchmarks} benchmarks`;
      }

      function getTopScoresByBenchmark(models) {
        const topScores = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((model) => toNumber(model.scores?.[key]))
            .filter((value) => Number.isFinite(value));
          if (!values.length) {
            topScores[key] = Number.NaN;
            return;
          }
          topScores[key] = isLowerBetter(key) ? Math.min(...values) : Math.max(...values);
        });
        return topScores;
      }

      function getScoreRangesByBenchmark(models) {
        const ranges = {};
        visibleBenchmarkKeys().forEach((key) => {
          const values = models
            .map((m) => toNumber(m.scores?.[key]))
            .filter((v) => Number.isFinite(v));
          if (!values.length) { ranges[key] = null; return; }
          // Named by rank, not by magnitude: `top` is the best score, `second`
          // the runner-up, `min` the worst. On a lower-is-better benchmark that
          // means top/min are the numeric min/max, which keeps scoreToGrey's
          // "muted at min, prominent at second" ramp pointing the right way.
          const lower = isLowerBetter(key);
          const best = (vals) => (lower ? Math.min(...vals) : Math.max(...vals));
          const worst = (vals) => (lower ? Math.max(...vals) : Math.min(...vals));
          const top = best(values);
          const nonTop = values.filter((v) => !nearlyEqual(v, top));
          ranges[key] = {
            top,
            second: nonTop.length ? best(nonTop) : null,
            min: nonTop.length ? worst(nonTop) : null
          };
        });
        return ranges;
      }

      function scoreToGrey(score, range) {
        if (!range || range.second === null || !Number.isFinite(score)) return null;
        const { second, min } = range;
        // t = 0 at min (most muted), t = 1 at second-best (most prominent)
        const t = nearlyEqual(second, min) ? 1 : Math.max(0, Math.min(1, (score - min) / (second - min)));
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        // light: #8b8b8b (channel 139) → #111111 (channel 17)
        // dark:  #6e6e6e (channel 110) → #aaaaaa (channel 170) — flipped & lifted for dark bg
        const channel = isDark
          ? Math.round(110 + 60 * t)
          : Math.round(139 - 122 * t);
        const hex = channel.toString(16).padStart(2, "0");
        return `#${hex}${hex}${hex}`;
      }

      function getOrderedBenchmarkKeys(benchmarks) {
        return Object.keys(benchmarks || {});
      }

      function getBenchmarkLabel(key) {
        return state.data?.benchmarks?.[key]?.short_name || state.data?.benchmarks?.[key]?.name || key;
      }

      // Benchmarks where a smaller number is the better result (e.g. a
      // hallucination rate). Everything that ranks asks this instead of
      // assuming "bigger is better": the top-score mark, the grey ramp, group
      // percentiles, and the sort direction — ▼ still means best-first, so
      // such a column compares against its numbers (see sortModels).
      function isLowerBetter(key) {
        return state.data?.benchmarks?.[key]?.lower_is_better === true;
      }

      // Benchmarks computed from other columns rather than read from a
      // leaderboard — derive_indexes.py writes the ones there are today.
      function isDerivedBenchmark(key) {
        return state.data?.benchmarks?.[key]?.derived === true;
      }

      // Column headers use short_name to stay narrow; lists with room (the
      // benchmark picker, the sort dropdown) use the full name.
      function getBenchmarkFullName(key) {
        return state.data?.benchmarks?.[key]?.name || getBenchmarkLabel(key);
      }

      // Serializes tooltip fields into the data-tip* attributes an anchor needs.
      // data-tip is always written, even when empty: it is what marks the
      // element as an anchor.
      function tipAttrs(fields) {
        const attrs = [` data-tip="${escapeAttr(fields.body || "")}"`];
        if (fields.eyebrow) attrs.push(` data-tip-eyebrow="${escapeAttr(fields.eyebrow)}"`);
        if (fields.eyebrowVerbatim) attrs.push(` data-tip-eyebrow-verbatim`);
        if (fields.eyebrowUrl) attrs.push(` data-tip-eyebrow-url="${escapeAttr(fields.eyebrowUrl)}"`);
        if (fields.title) attrs.push(` data-tip-title="${escapeAttr(fields.title)}"`);
        if (fields.meta) attrs.push(` data-tip-meta="${escapeAttr(fields.meta)}"`);
        // The benchmark key, not its icon markup: tipMarkup looks the icon up,
        // so an attribute never has to carry HTML.
        if (fields.iconKey) attrs.push(` data-tip-icon="${escapeAttr(fields.iconKey)}"`);
        if (fields.url) attrs.push(` data-tip-url="${escapeAttr(fields.url)}"`);
        return attrs.join("");
      }

      // One tooltip contract for a benchmark, shared by the column header and
      // the visibility picker: what it is, what it measures, where to read it up.
      function benchmarkTipFields(key, eyebrow) {
        const bench = state.data?.benchmarks?.[key] || {};
        return {
          eyebrow: eyebrow || bench.category || "Benchmark",
          title: bench.name || getBenchmarkLabel(key),
          body: bench.description || "",
          url: benchmarkLinks(bench)[0] || "",
          iconKey: key
        };
      }

      // The gist of a longer description: its first sentence, capped so one
      // runaway opening cannot fill a slip. Lets a score cell say what its
      // benchmark is without repeating the paragraph the column header carries.
      function firstSentence(text) {
        const trimmed = String(text || "").trim();
        if (!trimmed) return "";
        const match = trimmed.match(/^.*?[.!?](?=\s|$)/);
        const sentence = match ? match[0] : trimmed;
        if (sentence.length <= 180) return sentence;
        const clipped = sentence.slice(0, 180);
        const cut = clipped.lastIndexOf(" ");
        // Trailing punctuation left hanging by the cut ("incorrect /", "tasks —")
        // reads as a typo rather than an ellipsis, so it goes with the tail.
        const kept = (cut > 0 ? clipped.slice(0, cut) : clipped).replace(/[\s,;:/(\-–—]+$/, "");
        return `${kept}…`;
      }

      // What one score's slip says about the benchmark behind it: the gist, and
      // which way the number reads — a pass rate and a hallucination rate look
      // alike until you know which direction is good. The full description stays
      // on the column header, which has the room for it.
      function scoreTipBody(key) {
        const bench = state.data?.benchmarks?.[key] || {};
        return [
          firstSentence(bench.description),
          isLowerBetter(key) ? "Lower is better." : "Higher is better."
        ].filter(Boolean).join(" ");
      }

      // One tooltip contract for a model, shared by the table row and the
      // Recently Added panel: who made it, when it arrived, and the page its
      // details are checked against.
      function modelTipFields(model) {
        const url = model.url || "";
        return {
          eyebrow: model.creatorName || "",
          eyebrowVerbatim: true,
          eyebrowUrl: model.creator?.url || "",
          title: model.name || "Unknown",
          body: url
            ? "The creator's page for this model: the model card or release note its details are checked against."
            : "No page is recorded for this model, so nothing here links out.",
          meta: model.date_added ? `Added ${model.date_added}` : "Date added unknown",
          url
        };
      }

      function getBenchmarkIcon(key) {
        const icon = state.data?.benchmarks?.[key]?.icon_svg;
        if (typeof icon !== "string") {
          return "";
        }
        if (icon.trim().startsWith("<svg")) {
          return icon;
        }
        return icon;
      }

      function renderBenchmarkIcon(key) {
        const icon = getBenchmarkIcon(key);
        if (!icon) {
          return "";
        }
        if (icon.startsWith("<svg")) {
          return icon;
        }
        return `<img class="benchmark-icon" src="${escapeAttr(icon)}" alt="" aria-hidden="true">`;
      }

      function getBestInTableByModel(models) {
        const result = new Map();
        models.forEach((model) => result.set(model, new Set()));

        if (!models.length) {
          return result;
        }

        const topByBenchmark = getTopScoresByBenchmark(models);
        const topContext = Math.max(...models.map((m) => parseUnitNumber(m.context)).filter((v) => Number.isFinite(v)));

        models.forEach((model) => {
          const flags = result.get(model);
          if (!flags) {
            return;
          }

          const contextValue = parseUnitNumber(model.context);
          if (Number.isFinite(contextValue) && Number.isFinite(topContext) && nearlyEqual(contextValue, topContext)) {
            flags.add("context");
          }

          Object.keys(topByBenchmark).forEach((key) => {
            const value = toNumber(model.scores?.[key]);
            const top = topByBenchmark[key];
            if (Number.isFinite(value) && Number.isFinite(top) && nearlyEqual(value, top)) {
              flags.add(key);
            }
          });
        });

        return result;
      }

      function formatContext(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        const match = str.match(/^(\d+\.?\d*)([A-Za-z]+)$/);
        if (!match) return escapeHtml(str);
        const [, num, unit] = match;
        return `${escapeHtml(num)}<span class="p-letter">${escapeHtml(unit)}</span>`;
      }

      function formatVram(raw) {
        if (raw == null || raw === "") return "-";
        const num = typeof raw === "number" ? raw : parseFloat(raw);
        if (!Number.isFinite(num)) return escapeHtml(String(raw));
        return `${escapeHtml(String(num))}<span class="p-unit">&thinsp;</span><span class="p-letter">GB</span>`;
      }

      function formatParams(raw) {
        if (!raw) return "-";
        const str = String(raw).trim();
        // Matches "123B", "117B-A5.1B", "1T-A32B", unknown-active forms like
        // "2.8T-A~B", and standalone effective forms like "E4B".
        const mainMatch = str.match(/^(\d+\.?\d*)([BT])(?:-(A)(\d+\.?\d*|~)([BT]))?$/i);
        if (mainMatch) {
          const [, mainNum, mainUnit, aPrefix, activeNum, activeUnit] = mainMatch;
          let html = `${escapeHtml(mainNum)}<span class="p-letter">${escapeHtml(mainUnit)}</span>`;
          if (aPrefix) {
            html += `<span class="p-unit">&thinsp;-&thinsp;</span>${escapeHtml(aPrefix)}${escapeHtml(activeNum)}<span class="p-letter">${escapeHtml(activeUnit)}</span>`;
          }
          return html;
        }

        const effectiveMatch = str.match(/^(E)(\d+\.?\d*)(B)$/i);
        if (effectiveMatch) {
          const [, effectivePrefix, effectiveNum, effectiveUnit] = effectiveMatch;
          return `${escapeHtml(effectivePrefix)}${escapeHtml(effectiveNum)}<span class="p-letter">${escapeHtml(effectiveUnit)}</span>`;
        }

        return escapeHtml(str);
      }

      // Benchmarks are printed with one decimal unless llm.json says otherwise
      // ("decimals": 0 for a whole-number index like the Coding column, whose
      // values are points rather than a percentage).
      function scoreDecimals(key) {
        const decimals = state.data?.benchmarks?.[key]?.decimals;
        return Number.isFinite(decimals) ? decimals : 1;
      }

      function formatScore(value, key) {
        if (!Number.isFinite(value)) {
          return '<span class="num na">&mdash;&nbsp;</span>';
        }
        return value.toFixed(scoreDecimals(key));
      }

      function toNumber(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          return value;
        }
        if (typeof value === "string") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : Number.NaN;
        }
        return Number.NaN;
      }

      function parseUnitNumber(raw) {
        if (raw == null) {
          return Number.NaN;
        }

        const text = String(raw).trim().toLowerCase();
        const match = text.match(/([0-9]*\.?[0-9]+)\s*([a-z]+)/);
        if (!match) {
          const plain = Number(text.replace(/,/g, ""));
          return Number.isFinite(plain) ? plain : Number.NaN;
        }

        const value = Number(match[1]);
        const unit = match[2];
        if (!Number.isFinite(value)) {
          return Number.NaN;
        }

        const multipliers = {
          k: 1e3,
          m: 1e6,
          b: 1e9,
          t: 1e12
        };

        const tail = unit[0];
        if (tail in multipliers) {
          return value * multipliers[tail];
        }

        return value;
      }

      function nearlyEqual(a, b) {
        return Math.abs(a - b) < 1e-9;
      }

      function sortModeValue(key, direction) {
        return `${key}::${direction}`;
      }

      function parseSortModeValue(value) {
        const parts = String(value).split("::");
        const key = parts[0] || defaultSortKey();
        const direction = parts[1] === "asc" ? "asc" : "desc";
        return { key, direction };
      }

      /* ── Export ─────────────────────────────────────────
         Exports always re-fetch upstream, so the values in a downloaded file
         are the published ones — never a locally imported file. The model
         exports do honour the on-screen filters though: only the models that
         pass them, and only the benchmarks that are shown, make it into the
         file, and it is then named llm-filtered.* so it can't be mistaken for
         the published llm.json. Sort order is not carried over (upstream order
         is kept), and the GPU exports are never filtered. JSON/YAML carry the
         whole document; CSV can only hold a table, so it flattens models[] /
         the GPU list. */

      // Takes "csv" (models data) or "<dataset>.<format>" such as "gpu.csv", so
      // the ?export= value reads like the file it produces. Each serializer gets
      // the raw response body: an unfiltered JSON export passes it through
      // byte-for-byte rather than round-tripping through JSON.stringify, which
      // would drop upstream formatting (and turn 68.0 into 68).
      //
      // A hoisted function, not a const map: ?export= runs while this block is
      // still in the temporal dead zone, so a const here would throw.
      function exportSpec(value) {
        const parts = String(value || "").trim().toLowerCase().split(".");
        if (parts.length > 2) return null;
        const dataset = parts.length === 2 ? parts[0] : "llm";
        const format = parts[parts.length - 1];

        let url;
        let tabulate;
        switch (dataset) {
          case "llm":
            url = DATA_URL;
            tabulate = modelsToCsv;
            break;
          case "gpu":
            url = GPU_DATA_URL;
            tabulate = gpusToCsv;
            break;
          default:
            return null;
        }

        // ?export= can run before the data has loaded; exportFilters() reports
        // nothing active until then, so such an export is the full document.
        const filtered = dataset === "llm" && exportFilters().active;
        const stem = filtered ? `${dataset}-filtered` : dataset;
        const refine = filtered ? filterModelsDocument : (data) => data;

        switch (format) {
          case "json":
            return {
              url,
              filename: `${stem}.json`,
              mime: "application/json",
              serialize: (text) => (filtered ? `${JSON.stringify(refine(JSON.parse(text)), null, 2)}\n` : text)
            };
          case "yaml":
          case "yml":
            return { url, filename: `${stem}.yaml`, mime: "application/yaml", serialize: (text) => toYaml(refine(JSON.parse(text))) };
          case "csv":
            return { url, filename: `${stem}.csv`, mime: "text/csv;charset=utf-8", serialize: (text) => tabulate(refine(JSON.parse(text))) };
          default:
            return null;
        }
      }

      // What an export would drop, measured against the loaded data. Sort is
      // deliberately not part of this: exports keep upstream order, so
      // re-sorting the table must not advertise a filtered download. Neither is
      // the GPU vendor picker, which only narrows the GPU list, not the models.
      function exportFilters() {
        const totalModels = state.data?.models?.length || 0;
        const totalBenchmarks = state.benchmarkKeys.length;
        const loaded = Boolean(state.data);
        const hiddenBenchmarks = loaded ? state.filters.hiddenBenchmarks.length : 0;
        const modelsOn = loaded && (
          Boolean(state.filters.search)
          || state.filters.selectedModels.length > 0
          || Boolean(state.filters.addedFrom)
          || Boolean(state.filters.addedTo)
          || Boolean(gpuUsableBudget())
        );
        return {
          active: modelsOn || hiddenBenchmarks > 0,
          models: modelsOn ? state.filteredModels.length : totalModels,
          totalModels,
          benchmarks: totalBenchmarks - hiddenBenchmarks,
          totalBenchmarks
        };
      }

      // Narrows a freshly fetched upstream document to the current filters.
      // Benchmarks are pruned by the hidden set rather than kept by the visible
      // one, so a benchmark upstream gained since the page loaded still comes
      // along instead of being silently dropped.
      function filterModelsDocument(data) {
        const hidden = new Set(state.filters.hiddenBenchmarks);
        const models = (Array.isArray(data.models) ? data.models : [])
          .filter((model) => modelPassesFilters(model))
          .map((model) => {
            if (!hidden.size) return model;
            const pruned = { ...model };
            if (pruned.scores) pruned.scores = withoutKeys(pruned.scores, hidden);
            if (pruned.scores_updated) pruned.scores_updated = withoutKeys(pruned.scores_updated, hidden);
            return pruned;
          });

        return {
          ...data,
          benchmarks: hidden.size ? withoutKeys(data.benchmarks, hidden) : data.benchmarks,
          models
        };
      }

      function withoutKeys(map, drop) {
        if (!map || typeof map !== "object") return map;
        return Object.fromEntries(Object.entries(map).filter(([key]) => !drop.has(key)));
      }

      function bindExportEvents() {
        ui.exportBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          setExportMenuOpen(ui.exportList.hidden);
        });

        ui.exportList.addEventListener("click", (event) => {
          const item = event.target.closest("button[data-export]");
          if (!item) return;
          setExportMenuOpen(false);
          exportData(item.dataset.export);
        });

        document.addEventListener("click", (event) => {
          if (!ui.exportList.hidden && !ui.exportMenu.contains(event.target)) {
            setExportMenuOpen(false);
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !ui.exportList.hidden) {
            setExportMenuOpen(false);
            ui.exportBtn.focus();
          }
        });
      }

      function setExportMenuOpen(open) {
        ui.exportList.hidden = !open;
        ui.exportBtn.setAttribute("aria-expanded", String(open));
      }

      // Keeps the menu honest about what a download will hold: the model
      // entries are marked when they would be filtered, the GPU group is marked
      // as unaffected so the difference is explicit. Driven from
      // updateFilterGlow, alongside the other active-filter cues.
      function updateExportHints() {
        const filters = exportFilters();

        ui.exportBtn.classList.toggle("is-filtered", filters.active);
        ui.exportModelsFlag.hidden = !filters.active;
        ui.exportGpuFlag.hidden = !filters.active;
        ui.exportModelsNote.hidden = !filters.active;
        ui.exportModelsNote.textContent = filters.active
          ? `${filters.models} of ${filters.totalModels} models\n${filters.benchmarks} of ${filters.totalBenchmarks} benchmarks`
          : "";
        ui.exportList.querySelectorAll('button[data-export^="llm."]').forEach((button) => {
          button.classList.toggle("is-filtered", filters.active);
        });

        // The error flash owns the title while it is showing; it restores this.
        if (!ui.exportBtn.classList.contains("is-error")) {
          setExportButtonLabel();
        }
      }

      function setExportButtonLabel() {
        const filters = exportFilters();
        const label = filters.active
          ? `Export data — model exports follow the active filters (${filters.models} of ${filters.totalModels} models, ${filters.benchmarks} of ${filters.totalBenchmarks} benchmarks); GPU exports are never filtered`
          : "Export data";
        ui.exportBtn.title = label;
        ui.exportBtn.setAttribute("aria-label", label);
      }

      async function exportData(target) {
        const spec = exportSpec(target);
        if (!spec) return;
        try {
          const text = await fetchRemoteText(spec.url);
          triggerDownload(spec.serialize(text), spec.filename, spec.mime);
        } catch (err) {
          console.error("Export failed.", err);
          flashExportError(err.message);
        }
      }

      // Timer id hangs off the function so this stays hoisting-safe too.
      function flashExportError(message) {
        clearTimeout(flashExportError.timer);
        ui.exportBtn.classList.add("is-error");
        ui.exportBtn.title = `Export failed. ${message}`;
        ui.exportBtn.setAttribute("aria-label", `Export failed. ${message}`);
        flashExportError.timer = setTimeout(() => {
          ui.exportBtn.classList.remove("is-error");
          setExportButtonLabel();
        }, 2500);
      }

      function triggerDownload(text, filename, mime) {
        const url = URL.createObjectURL(new Blob([text], { type: mime }));
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      // Minimal YAML emitter, enough for llm.json's shape (nested objects and
      // arrays of objects/strings/numbers/null). Hand-rolled so the page keeps
      // its zero-dependency, single-file property.
      function toYaml(value, indent) {
        const depth = indent || 0;
        const pad = "  ".repeat(depth);

        if (Array.isArray(value)) {
          if (!value.length) return `${pad}[]\n`;
          return value
            .map((item) => (isYamlContainer(item)
              // A bare dash plus an indented block avoids splicing the dash
              // into the nested output's first line.
              ? `${pad}-\n${toYaml(item, depth + 1)}`
              : `${pad}- ${yamlScalar(item)}\n`))
            .join("");
        }

        if (isYamlContainer(value)) {
          const keys = Object.keys(value);
          if (!keys.length) return `${pad}{}\n`;
          return keys
            .map((key) => {
              const child = value[key];
              const label = `${pad}${yamlScalar(key)}:`;
              if (!isYamlContainer(child)) return `${label} ${yamlScalar(child)}\n`;
              // Empty containers go inline so the key never dangles.
              if (Array.isArray(child)) {
                return child.length ? `${label}\n${toYaml(child, depth + 1)}` : `${label} []\n`;
              }
              return Object.keys(child).length ? `${label}\n${toYaml(child, depth + 1)}` : `${label} {}\n`;
            })
            .join("");
        }

        return `${pad}${yamlScalar(value)}\n`;
      }

      function isYamlContainer(value) {
        return Array.isArray(value) || (value !== null && typeof value === "object");
      }

      function yamlScalar(value) {
        if (value === null || value === undefined) return "null";
        if (typeof value === "boolean") return String(value);
        if (typeof value === "number") return Number.isFinite(value) ? String(value) : "null";
        return yamlString(String(value));
      }

      const YAML_RESERVED = /^(?:true|false|null|yes|no|on|off|y|n|~)$/i;
      // Deliberately narrow: a plain scalar must start with a letter and hold no
      // ":" — that alone rules out every implicitly typed form (numbers, dates,
      // "12:30" sexagesimals, URLs), so anything else falls through to quoting.
      const YAML_PLAIN_SAFE = /^[A-Za-z][A-Za-z0-9 ._+()'&,%/=?-]*$/;

      function yamlString(text) {
        const plainOk = YAML_PLAIN_SAFE.test(text)
          && !/\s#/.test(text)
          && !text.endsWith(" ")
          && !YAML_RESERVED.test(text);
        if (plainOk) return text;
        return `"${text
          .replace(/\\/g, "\\\\")
          .replace(/"/g, '\\"')
          .replace(/\n/g, "\\n")
          .replace(/\r/g, "\\r")
          .replace(/\t/g, "\\t")}"`;
      }

      const CSV_MODEL_COLUMNS = [
        ["name", (model) => model.name],
        ["date_added", (model) => model.date_added],
        ["url", (model) => model.url],
        ["params", (model) => model.params],
        ["context", (model) => model.context],
        ["creator_name", (model) => model.creator?.name],
        ["creator_url", (model) => model.creator?.url],
        ["vram_fp16", (model) => model.vram?.fp16],
        ["vram_int8", (model) => model.vram?.int8],
        ["vram_int4", (model) => model.vram?.int4]
      ];

      const CSV_GPU_COLUMNS = [
        ["manufacturer", (gpu) => gpu.manufacturer],
        ["model", (gpu) => gpu.model],
        ["vram_gb", (gpu) => gpu.vram_gb],
        ["release", (gpu) => gpu.release]
      ];

      // One row per model: the fixed fields above plus one raw score column per
      // benchmark, in llm.json's benchmark order. Values stay unformatted, so
      // params/context remain the source strings ("123B", "256k").
      function modelsToCsv(data) {
        const benchmarkKeys = getOrderedBenchmarkKeys(data.benchmarks);
        const models = Array.isArray(data.models) ? data.models : [];
        return csvDocument(
          CSV_MODEL_COLUMNS.map(([label]) => label).concat(benchmarkKeys),
          models.map((model) => CSV_MODEL_COLUMNS
            .map(([, read]) => read(model))
            .concat(benchmarkKeys.map((key) => model.scores?.[key])))
        );
      }

      // gpu.json is already a flat list, so its CSV is the file one-to-one.
      function gpusToCsv(data) {
        const gpus = Array.isArray(data) ? data : [];
        return csvDocument(
          CSV_GPU_COLUMNS.map(([label]) => label),
          gpus.map((gpu) => CSV_GPU_COLUMNS.map(([, read]) => read(gpu)))
        );
      }

      function csvDocument(header, rows) {
        // Leading BOM keeps Excel from mangling non-ASCII names.
        return `\uFEFF${[header].concat(rows).map((row) => row.map(csvCell).join(",")).join("\r\n")}\r\n`;
      }

      function csvCell(value) {
        if (value === null || value === undefined) return "";
        const text = String(value);
        return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
      }

      // Table cells carry a kind instead of their full tooltip text: 123 models
      // against 33 benchmarks is a lot of markup to repeat for content only one
      // cell at a time ever shows.
      const TIP_RESOLVERS = {
        vram(el) {
          const cell = el.closest("td");
          const row = cell && cell.parentElement;
          const column = cell && FIXED_COLUMNS[cell.cellIndex];
          if (!cell || !row || !column?.key.startsWith("vram_")) return null;

          const model = state.filteredModels[row.sectionRowIndex];
          const quant = column.key.slice("vram_".length);
          const value = model?.vram?.[quant];
          const num = typeof value === "number" ? value : parseFloat(value);
          if (!model || !Number.isFinite(num)) return null;

          const budget = gpuUsableBudget();
          const estimate = `Estimated VRAM to hold this model for single-model inference at ${quant.toUpperCase()} precision.`;
          let fit = "";
          if (budget) {
            const budgetLabel = state.gpu.reserve
              ? `${formatGb(budget)} GB usable budget (${Math.round(state.gpu.reserve * 100)}% of ${formatGb(state.gpu.budget)} GB reserved)`
              : `${formatGb(budget)} GB budget`;
            fit = num > budget
              ? `Does not fit: needs ${num} GB, over the ${budgetLabel}.`
              : `Fits: takes ${Math.round(num / budget * 100)}% of the ${budgetLabel}.`;
          }

          const source = model.vram_source?.[quant];
          return {
            eyebrow: model.name || "",
            eyebrowVerbatim: true,
            title: `${quant.toUpperCase()} VRAM · ${num} GB`,
            // A second paragraph only once a budget exists to compare against;
            // until then the slip says where to set one.
            body: fit
              ? `${estimate}\n${fit}`
              : `${estimate} Pick a GPU in the filters to see whether it fits a budget.`,
            meta: source ? "Estimated by Spheron GPU Recommender." : "No source recorded for this estimate.",
            url: source || ""
          };
        },
        score(el) {
          const cell = el.closest("td");
          const row = cell && cell.parentElement;
          if (!cell || !row) return null;

          const model = state.filteredModels[row.sectionRowIndex];
          const key = visibleBenchmarkKeys()[cell.cellIndex - FIXED_COLUMNS.length];
          if (!model || !key) return null;

          const bench = state.data?.benchmarks?.[key] || {};
          const updated = model.scores_updated?.[key];
          const source = model.scores_source?.[key];
          // The red on the number says a score is new; the slip says how new,
          // since a bare date leaves the reader counting days.
          const age = scoreFreshness(model, key) ? daysSince(updated) : null;
          const newness = age === null ? "" : ` · new ${describeAge(age)}`;
          return {
            eyebrow: model.name || "",
            eyebrowVerbatim: true,
            title: bench.name || getBenchmarkLabel(key),
            iconKey: key,
            body: scoreTipBody(key),
            meta: [
              updated ? `Updated ${updated}${newness}` : "",
              source ? "" : "No source recorded for this score."
            ].filter(Boolean).join("\n"),
            // The page this one score was read from, not the benchmark's own
            // home page: which leaderboard, model card or vendor post a number
            // came from is the whole of what a single cell can be checked by.
            url: source || ""
          };
        }
      };

      function tipFields(el) {
        const kind = el.getAttribute("data-tip-kind");
        if (kind) {
          return TIP_RESOLVERS[kind] ? TIP_RESOLVERS[kind](el) : null;
        }
        return {
          eyebrow: el.getAttribute("data-tip-eyebrow") || "",
          eyebrowVerbatim: el.hasAttribute("data-tip-eyebrow-verbatim"),
          eyebrowUrl: el.getAttribute("data-tip-eyebrow-url") || "",
          title: el.getAttribute("data-tip-title") || "",
          iconKey: el.getAttribute("data-tip-icon") || "",
          body: el.getAttribute("data-tip") || "",
          meta: el.getAttribute("data-tip-meta") || "",
          url: el.getAttribute("data-tip-url") || ""
        };
      }

      function tipMarkup(el) {
        const fields = tipFields(el);
        if (!fields) return "";

        const parts = [];
        if (fields.eyebrow) {
          const className = `tip-eyebrow${fields.eyebrowVerbatim ? " verbatim" : ""}`;
          const text = escapeHtml(fields.eyebrow);
          parts.push(tipSafeUrl(fields.eyebrowUrl)
            ? `<a class="${className}" href="${escapeAttr(fields.eyebrowUrl)}" target="_blank" rel="noopener noreferrer">${text}</a>`
            : `<span class="${className}">${text}</span>`);
        }
        if (fields.title) {
          // Empty for a benchmark without one, and for the slips that are not
          // about a benchmark at all, so the title simply stands alone.
          const icon = fields.iconKey ? renderBenchmarkIcon(fields.iconKey) : "";
          const mark = icon ? `<span class="tip-icon">${icon}</span>` : "";
          parts.push(`<span class="tip-title">${mark}${escapeHtml(fields.title)}</span>`);
        }
        splitTipLines(fields.body).forEach((line) => {
          parts.push(`<p class="tip-body">${escapeHtml(line)}</p>`);
        });
        const metaLines = splitTipLines(fields.meta);
        if (metaLines.length) {
          parts.push(`<span class="tip-meta">${metaLines.map(escapeHtml).join("<br>")}</span>`);
        }
        if (fields.url) {
          parts.push(`<div class="tip-source">${tipLinkMarkup(fields.url)}</div>`);
        }
        return parts.join("");
      }

      function splitTipLines(value) {
        return String(value || "").split("\n").map((line) => line.trim()).filter(Boolean);
      }

      // Gate for every link a slip renders. An imported llm.json is not trusted
      // input, so anything that is not a plain web address never becomes an
      // href — callers fall back to plain text.
      function tipSafeUrl(url) {
        if (!url) return null;
        let parsed = null;
        try {
          parsed = new URL(url);
        } catch (err) {
          return null;
        }
        return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed : null;
      }

      // Host and path are styled apart because provenance is the point: a score
      // from the vendor's own model card means something different from one on
      // an independent leaderboard, and the domain is the whole tell.
      function tipLinkMarkup(url) {
        const parsed = tipSafeUrl(url);
        if (!parsed) {
          return `<span class="tip-link tip-link-plain">${escapeHtml(url)}</span>`;
        }

        const host = parsed.host.replace(/^www\./, "");
        const path = `${parsed.pathname === "/" ? "" : parsed.pathname}${parsed.search}${parsed.hash}`;
        return (
          `<a class="tip-link" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">` +
          `<span class="tip-link-mark" aria-hidden="true">&#8599;</span>` +
          `<span class="tip-link-url"><span class="tip-link-host">${escapeHtml(host)}</span>` +
          (path ? `<span class="tip-link-path">${escapeHtml(path)}</span>` : "") +
          `</span></a>`
        );
      }

      function placeTip() {
        const anchor = tooltip.anchor;
        if (!anchor || !document.contains(anchor)) {
          closeTip();
          return;
        }

        const rect = anchor.getBoundingClientRect();
        const vw = document.documentElement.clientWidth;
        const vh = document.documentElement.clientHeight;
        // A re-render or a scrolled-away row leaves the slip pointing at
        // nothing, so it goes with its anchor.
        if ((!rect.width && !rect.height) || rect.bottom < 0 || rect.top > vh || rect.right < 0 || rect.left > vw) {
          closeTip();
          return;
        }

        const el = tooltip.el;
        // offsetWidth/Height ignore the resting transform, so the measurement
        // holds whether the slip is open or still animating in.
        const width = el.offsetWidth;
        const height = el.offsetHeight;

        const roomBelow = vh - rect.bottom;
        const roomAbove = rect.top;
        let placement = "bottom";
        let top = rect.bottom + TIP_GAP;
        if (roomBelow < height + TIP_GAP + TIP_EDGE && roomAbove > roomBelow) {
          placement = "top";
          top = rect.top - TIP_GAP - height;
        }

        let left = rect.left + rect.width / 2 - width / 2;
        left = Math.max(TIP_EDGE, Math.min(left, vw - width - TIP_EDGE));
        top = Math.max(TIP_EDGE, Math.min(top, vh - height - TIP_EDGE));

        el.dataset.placement = placement;
        el.style.left = `${Math.round(left)}px`;
        el.style.top = `${Math.round(top)}px`;
      }

      function openTip(anchor, pinned) {
        window.clearTimeout(tooltip.showTimer);
        window.clearTimeout(tooltip.hideTimer);

        const markup = tipMarkup(anchor);
        if (!markup) return;

        if (tooltip.anchor && tooltip.anchor !== anchor) {
          tooltip.anchor.removeAttribute("aria-describedby");
        }
        tooltip.anchor = anchor;
        tooltip.pinned = Boolean(pinned);
        tooltip.over = false;
        tooltip.el.innerHTML = markup;
        tooltip.el.setAttribute("aria-hidden", "false");
        anchor.setAttribute("aria-describedby", "tooltip");
        placeTip();
        if (tooltip.anchor) {
          tooltip.el.classList.add("is-open");
        }
      }

      function queueTip(anchor) {
        window.clearTimeout(tooltip.showTimer);
        window.clearTimeout(tooltip.hideTimer);
        const warm = tooltip.el.classList.contains("is-open")
          || Date.now() - tooltip.closedAt < TIP_WARM_WINDOW;
        tooltip.showTimer = window.setTimeout(
          () => openTip(anchor, false),
          warm ? TIP_WARM_DELAY : TIP_SHOW_DELAY
        );
      }

      // Deferred close. Anything that re-engages the slip — the pointer landing
      // on it, or going back to the anchor — cancels the pending timer.
      function queueTipClose() {
        window.clearTimeout(tooltip.hideTimer);
        tooltip.hideTimer = window.setTimeout(() => {
          if (tooltip.over || tooltip.pinned) return;
          closeTip();
        }, TIP_HIDE_DELAY);
      }

      function closeTip() {
        window.clearTimeout(tooltip.showTimer);
        window.clearTimeout(tooltip.hideTimer);
        if (tooltip.anchor) {
          tooltip.anchor.removeAttribute("aria-describedby");
        }
        tooltip.anchor = null;
        tooltip.pinned = false;
        tooltip.over = false;
        tooltip.closedAt = Date.now();
        tooltip.el.classList.remove("is-open");
        tooltip.el.setAttribute("aria-hidden", "true");
      }

      function tipAnchorFrom(target) {
        if (!(target instanceof Element)) return null;
        if (tooltip.el.contains(target)) return null;
        return target.closest(TIP_SELECTOR);
      }

      function initTooltips() {
        tooltip.el = document.getElementById("tooltip");
        if (!tooltip.el) return;

        // Delegated, so rows rendered later need no rebinding.
        document.addEventListener("pointerover", (event) => {
          if (event.pointerType === "touch") return;
          const anchor = tipAnchorFrom(event.target);
          if (!anchor) return;
          if (anchor === tooltip.anchor) {
            window.clearTimeout(tooltip.hideTimer);
            return;
          }
          queueTip(anchor);
        });

        document.addEventListener("pointerout", (event) => {
          if (event.pointerType === "touch") return;
          const anchor = tipAnchorFrom(event.target);
          if (!anchor) return;
          // Moving within the same anchor is not a leave.
          if (event.relatedTarget instanceof Node && anchor.contains(event.relatedTarget)) return;
          if (anchor !== tooltip.anchor) {
            window.clearTimeout(tooltip.showTimer);
            return;
          }
          queueTipClose();
        });

        tooltip.el.addEventListener("pointerenter", () => {
          tooltip.over = true;
          window.clearTimeout(tooltip.hideTimer);
        });

        tooltip.el.addEventListener("pointerleave", () => {
          tooltip.over = false;
          if (!tooltip.pinned) queueTipClose();
        });

        // Touch opens on a deliberate hold, not on a tap. Half the page is a
        // tip anchor, so a tap-to-open slip lands on top of whatever the tap
        // was actually for — a row link, a checkbox item, a pan of the table.
        // A press that travels (TIP_TAP_SLOP) is a scroll and cancels.
        let tapStart = null;
        let pressTimer = 0;
        let swallowClick = false;

        function cancelPress() {
          window.clearTimeout(pressTimer);
          pressTimer = 0;
          tapStart = null;
        }

        document.addEventListener("pointerdown", (event) => {
          swallowClick = false;
          if (tooltip.el.contains(event.target)) return;
          const anchor = tipAnchorFrom(event.target);
          if (event.pointerType === "touch" || event.pointerType === "pen") {
            cancelPress();
            if (anchor !== tooltip.anchor) closeTip();
            if (!anchor) return;
            tapStart = { anchor, x: event.clientX, y: event.clientY };
            pressTimer = window.setTimeout(() => {
              const start = tapStart;
              cancelPress();
              if (!start || !document.contains(start.anchor)) return;
              // The hold has become a gesture of its own, so the click it
              // would otherwise end in is dropped: holding a benchmark to read
              // what it measures must not also toggle its column off.
              swallowClick = true;
              // No hover on touch, so the slip pins open until the next touch
              // lands somewhere else.
              openTip(start.anchor, true);
            }, TIP_LONG_PRESS);
            return;
          }
          if (!anchor) closeTip();
        });

        document.addEventListener("pointermove", (event) => {
          if (!tapStart) return;
          if (Math.abs(event.clientX - tapStart.x) <= TIP_TAP_SLOP
            && Math.abs(event.clientY - tapStart.y) <= TIP_TAP_SLOP) return;
          cancelPress();
        }, { passive: true });

        document.addEventListener("pointerup", cancelPress);
        document.addEventListener("pointercancel", cancelPress);

        // Capture, so the swallowed click never reaches the row, widget or
        // link under the finger.
        document.addEventListener("click", (event) => {
          if (!swallowClick) return;
          swallowClick = false;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        // The hold is ours on touch; the browser's own long-press menu would
        // land on top of the slip. Desktop right-click is left alone.
        document.addEventListener("contextmenu", (event) => {
          if (window.matchMedia("(hover: hover)").matches) return;
          if (!tipAnchorFrom(event.target)) return;
          event.preventDefault();
        });

        document.addEventListener("focusin", (event) => {
          if (tooltip.el.contains(event.target)) {
            window.clearTimeout(tooltip.hideTimer);
            return;
          }
          const anchor = tipAnchorFrom(event.target);
          // :focus-visible keeps this to keyboard focus. Clicking a button
          // focuses it too, and a slip popping up under your own click reads
          // as a glitch.
          if (anchor && event.target.matches(":focus-visible")) {
            openTip(anchor, false);
          } else if (!tooltip.pinned) {
            closeTip();
          }
        });

        document.addEventListener("focusout", (event) => {
          const anchor = tipAnchorFrom(event.target);
          if (anchor && anchor === tooltip.anchor && !tooltip.over) queueTipClose();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && tooltip.anchor) closeTip();
        });

        // Capture, so scrolling the table shell moves the slip too.
        window.addEventListener("scroll", () => {
          if (tooltip.anchor) placeTip();
        }, true);

        window.addEventListener("resize", () => closeTip());
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function debounce(fn, delayMs) {
        let timer;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delayMs);
        };
      }
    })();
  </script>
</body>
</html>
