name: calibrate indexes

# Nightly re-measurement of each derived index's transfer_ratio -- how far one
# benchmark speaks for the rest of its index, which sets how hard a thinly
# measured model is pulled toward the middle of the field. It is a measurement
# of llm.json and moves as llm.json does, so it is re-taken every night rather
# than typed into derive_indexes.py and left to go stale.
#
# The ratios land in index-calibration.json, and llm.json is refitted with them
# in the same commit, so the site never shows a ranking computed from ratios
# other than the ones committed beside it.
#
# No `push` trigger, for the same reason update-benchmarks.yml has none: the
# commit below is pushed with the deploy key, which does trigger workflow
# events.

on:
  schedule:
    # 03:41 UTC: between the three-hourly refreshes (17 past), after a night's
    # worth of them.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with update-benchmarks.yml: both rewrite llm.json and push to main, so
# a calibration never interleaves with a refresh and neither pushes over the
# other.
concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      # The deploy key is what the main ruleset lets push; see the checkout
      # step in update-benchmarks.yml.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PUSH_SSH_KEY }}
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The index math and the calibration code, before either is trusted to
      # rewrite the published ranking.
      - name: Check the index math
        run: |
          ./test_index_math.py
          ./test_index_revision_fallback.py

      - name: Calibrate
        run: ./derive_indexes.py --calibrate --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refit the indexes
        run: ./derive_indexes.py --write --top 0

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Calibration unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -c 'import json, sys; sys.exit(0 if json.load(open("llm.json")).get("models") else "llm.json has no models; refusing to commit")' \
            || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-calibration.json llm.json
          git commit -m "chore(data): nightly index calibration"
          git pull --rebase --autostash origin main
          git push
