name: update benchmarks

# Daily unattended `update-all`. Scores land in llm.json and are committed to
# main (which republishes the GitHub Pages site). Anything that needs a human --
# a newly released model, an unrecognised source name -- is queued instead of
# guessed, and collected into a rolling `pending-prompts` issue. Nothing is ever
# recorded as answered, so the questions survive until you answer them locally.

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but do not commit or touch the issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Fails fast, before any network work. A broken freeze guard would let the
      # run bury source names as __unmappable__ with nobody ever prompted, and a
      # loosened match tier would commit wrong mappings into the proposal PR.
      - name: Check collect mode and the matcher
        run: |
          ./test_prompts.py
          ./test_propose.py

      # The openness index has a 12h TTL, so the daily run always rebuilds it
      # from its three sources; this only spares re-fetching when a run is
      # repeated or dispatched inside that window. The run_id in the key is
      # deliberate: an exact key hit skips the save, which would freeze the
      # cache at its first contents forever. restore-keys does the restoring.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ai-bench
          key: ai-bench-openness-${{ github.run_id }}
          restore-keys: ai-bench-openness-

      - name: Refresh benchmarks
        id: refresh
        continue-on-error: true
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./update-all --collect-prompts pending-prompts.jsonl

      # Rendered outside the working tree so the commit step cannot pick it up.
      - name: Render the pending queue
        id: pending
        run: |
          ./pending_prompts.py pending-prompts.jsonl --format markdown > "$RUNNER_TEMP/pending.md"
          echo "count=$(./pending_prompts.py pending-prompts.jsonl --count)" >> "$GITHUB_OUTPUT"
          {
            echo "## Pending review"
            echo
            cat "$RUNNER_TEMP/pending.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          COUNT: ${{ steps.pending.outputs.count }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): daily benchmark refresh" \
                     -m "${COUNT} prompt(s) queued for manual review."
          git push

      # A proposal PR, not an issue: the mapping questions become a reviewable
      # diff with clickable suggestions. Skipped entirely while one is already
      # open, so a force-push can never discard review work in progress.
      - name: Propose the pending mappings
        id: propose
        if: ${{ !inputs.dry_run && steps.pending.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          BRANCH: chore/mapping-proposals
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                      --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "PR #$open_pr is still open; not proposing again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          ./propose.py pending-prompts.jsonl --apply \
            --plan "$RUNNER_TEMP/plan.json" --body "$RUNNER_TEMP/body.md"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing proposable in the queue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "chore(mappings): propose mappings for the pending queue"
          git push --force origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Proposed benchmark mappings" \
            --body-file "$RUNNER_TEMP/body.md" --assignee dgrieser \
            --label pending-prompts
          # Queried rather than scraped out of the create output.
          num=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                  --json number --jq '.[0].number')
          echo "pr=$num" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$num." >> "$GITHUB_STEP_SUMMARY"

      # One review carrying every suggestion, so it is a single notification.
      - name: Attach the mapping suggestions
        if: ${{ steps.propose.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(jq '.comments | length' "$RUNNER_TEMP/plan.json")
          if [ "$count" -eq 0 ]; then
            echo "No suggestions to attach." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq '{event: "COMMENT",
               body: "Each parked line below has a suggestion you can commit directly. Ignoring one is safe: `__pending__` records nothing and the name is queued again next run.",
               comments: .comments}' \
            "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/review.json"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ steps.propose.outputs.pr }}/reviews" \
            --input "$RUNNER_TEMP/review.json" >/dev/null
          echo "Attached $count suggestion(s)." >> "$GITHUB_STEP_SUMMARY"

      # The queue now lives in the proposal PR; retire the old issue channel.
      - name: Close the superseded pending-prompts issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --label pending-prompts --state open --limit 1 \
                  --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment \
              "Superseded: pending mappings now arrive as a proposal PR with commitable suggestions."
          fi

      - name: Fail if a step of update-all failed
        if: ${{ steps.refresh.outcome != 'success' }}
        run: |
          echo "update-all reported a failed step; see its log above." >&2
          exit 1
