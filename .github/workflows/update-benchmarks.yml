name: update benchmarks

# Unattended `update-all`. Scores land in llm.json and are committed to main
# (which republishes the GitHub Pages site). Anything that needs a human -- a
# newly released model, an unrecognised source name -- is queued instead of
# guessed, and arrives as a proposal PR with commitable suggestions. Nothing is
# ever recorded as answered, so the questions survive until you answer them.

on:
  schedule:
    - cron: "17 */3 * * *"

  # A merged mapping change earns an immediate refresh rather than waiting for
  # the next cron: the new mappings pull in scores for models that were unmapped
  # until now, and the run re-collects the queue, so closing one proposal PR
  # opens the next batch straight away. Covers hand-written mapping PRs too.
  #
  # This cannot run away: the only trigger a write of this workflow could hit is
  # a pull request being merged, and the workflow never merges anything -- it
  # pushes a data commit to main and force-pushes its proposal branch. One human
  # merge is one run. Note that the data commit is pushed with a deploy key,
  # which unlike GITHUB_TOKEN *does* trigger workflow events, so a `push`
  # trigger must never be added to this file.
  # `branches` filters the PR's *base*, so only merges into main qualify. Without
  # it a stacked PR merged into a feature branch would refresh that branch and
  # push the data commit there, off the published site.
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "*mapping*.json"
      - "llm.json"
      # A merged proposal PR may carry nothing but a flipped new-model decision;
      # that run is the one that has to act on it.
      - "check_new-decisions.json"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but do not commit, propose, or push"
        type: boolean
        default: false

permissions:
  # Read-only for contents: nothing is written with GITHUB_TOKEN any more. Both
  # pushes ride on the deploy key configured by checkout, which is the only
  # identity besides a repository admin that the ruleset lets through.
  contents: read
  pull-requests: write
  # Kept even though the issue channel is retired: --label and --assignee on a
  # PR go through the issues API, and losing them would break the propose step.
  issues: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    # For a pull_request event: merges only, and only from this repo -- a fork
    # PR's GITHUB_TOKEN is read-only and could not push the refreshed scores.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A pull_request event would otherwise check out the PR's merge ref; this
      # run wants the base branch it was just merged into.
      #
      # main is covered by a branch ruleset that requires a pull request, and
      # GITHUB_TOKEN cannot be exempted from it: GitHub Actions is not an app
      # that can be installed on a user-owned repository, so it cannot appear in
      # the ruleset's bypass list. A write deploy key can, and does. Handing the
      # key to checkout makes it the credential git keeps for every later push,
      # so the data commit lands on main while the rule still applies to
      # everyone else.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PUSH_SSH_KEY }}
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.ref
                || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Fails fast, before any network work. A broken freeze guard would let the
      # run bury source names as __unmappable__ with nobody ever prompted, a
      # loosened match tier would commit wrong mappings into the proposal PR, and
      # a broken decision applier would silently re-add an ignored model.
      - name: Check collect mode and the matcher
        run: |
          ./test_prompts.py
          ./test_propose.py
          ./test_new_models.py

      # The openness index has a 12h TTL, so the daily run always rebuilds it
      # from its three sources; this only spares re-fetching when a run is
      # repeated or dispatched inside that window. The run_id in the key is
      # deliberate: an exact key hit skips the save, which would freeze the
      # cache at its first contents forever. restore-keys does the restoring.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ai-bench
          key: ai-bench-openness-${{ github.run_id }}
          restore-keys: ai-bench-openness-

      - name: Refresh benchmarks
        id: refresh
        continue-on-error: true
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./update-all --collect-prompts pending-prompts.jsonl

      # Rendered outside the working tree so the commit step cannot pick it up.
      - name: Render the pending queue
        id: pending
        run: |
          ./pending_prompts.py pending-prompts.jsonl --format markdown > "$RUNNER_TEMP/pending.md"
          echo "count=$(./pending_prompts.py pending-prompts.jsonl --count)" >> "$GITHUB_OUTPUT"
          {
            echo "## Pending review"
            echo
            cat "$RUNNER_TEMP/pending.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          COUNT: ${{ steps.pending.outputs.count }}
          # A merge-triggered run labelled "daily" would be a lie in the log.
          REASON: >-
            ${{ github.event_name == 'pull_request'
                && format('Refreshed after merging #{0}.', github.event.pull_request.number)
                || 'Scheduled refresh.' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): benchmark refresh" \
                     -m "${REASON} ${COUNT} prompt(s) queued for manual review."
          git push

      # A proposal PR, not an issue: the mapping questions become a reviewable
      # diff with clickable suggestions. Skipped entirely while one is already
      # open, so a force-push can never discard review work in progress.
      - name: Propose the pending mappings
        id: propose
        if: ${{ !inputs.dry_run && steps.pending.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          BRANCH: chore/mapping-proposals
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                      --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "PR #$open_pr is still open; not proposing again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          ./propose.py pending-prompts.jsonl --apply \
            --plan "$RUNNER_TEMP/plan.json" --body "$RUNNER_TEMP/body.md"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing proposable in the queue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "chore(mappings): propose mappings for the pending queue"
          git push --force origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Proposed benchmark mappings" \
            --body-file "$RUNNER_TEMP/body.md" --assignee dgrieser \
            --label pending-prompts
          # Queried rather than scraped out of the create output.
          num=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                  --json number --jq '.[0].number')
          echo "pr=$num" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$num." >> "$GITHUB_STEP_SUMMARY"

      # One review carrying every suggestion, so it is a single notification.
      #
      # GitHub rejects the whole review (422) if any one comment points at a line
      # outside the diff, which used to mean a single bad line silently cost the
      # PR every suggestion it advertised. propose.py now only asks for lines it
      # changed; the per-comment retry below is the belt to that braces, so one
      # rejected line costs one suggestion instead of all of them.
      - name: Attach the mapping suggestions
        if: ${{ steps.propose.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.propose.outputs.pr }}
          INTRO: "Each line below has a suggestion you can commit directly. Ignoring a parked mapping is safe: `__pending__` records nothing and the name is queued again next run. A new model's suggestion is the opposite answer to adding it: `__ignored__` removes the entry again on the next run and stops the slug being offered."
        run: |
          count=$(jq '.comments | length' "$RUNNER_TEMP/plan.json")
          if [ "$count" -eq 0 ]; then
            echo "No suggestions to attach." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api="repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews"

          jq --arg body "$INTRO" '{event: "COMMENT", body: $body, comments: .comments}' \
            "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/review.json"
          if gh api -X POST "$api" --input "$RUNNER_TEMP/review.json" >/dev/null 2>"$RUNNER_TEMP/err"; then
            echo "Attached $count suggestion(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Batch review rejected: $(cat "$RUNNER_TEMP/err")" >&2
          echo "Batch review rejected; retrying one comment at a time." >> "$GITHUB_STEP_SUMMARY"
          attached=0
          for index in $(seq 0 $((count - 1))); do
            jq --argjson i "$index" --arg body "$INTRO" \
              '{event: "COMMENT", body: $body, comments: [.comments[$i]]}' \
              "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/one.json"
            if gh api -X POST "$api" --input "$RUNNER_TEMP/one.json" >/dev/null 2>"$RUNNER_TEMP/err"; then
              attached=$((attached + 1))
            else
              line=$(jq -r --argjson i "$index" '.comments[$i] | "\(.path):\(.line)"' "$RUNNER_TEMP/plan.json")
              echo "- suggestion for \`$line\` rejected: $(cat "$RUNNER_TEMP/err")" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Attached $attached of $count suggestion(s)." >> "$GITHUB_STEP_SUMMARY"
          [ "$attached" -gt 0 ]

      - name: Fail if a step of update-all failed
        if: ${{ steps.refresh.outcome != 'success' }}
        run: |
          echo "update-all reported a failed step; see its log above." >&2
          exit 1
