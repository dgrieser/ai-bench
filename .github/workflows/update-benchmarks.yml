name: update benchmarks

# Unattended `update-all`. Scores land in llm.json and are committed to main
# (which republishes the GitHub Pages site). Anything that needs a human -- a
# newly released model, an unrecognised source name -- is queued instead of
# guessed, and arrives as a proposal PR with commitable suggestions. Nothing is
# ever recorded as answered, so the questions survive until you answer them.

on:
  schedule:
    - cron: "17 */3 * * *"

  # A merged mapping change earns an immediate refresh rather than waiting for
  # the next cron: the new mappings pull in scores for models that were unmapped
  # until now, and the run re-collects the queue, so closing one proposal PR
  # opens the next batch straight away. Covers hand-written mapping PRs too.
  #
  # This cannot run away: the only trigger a write of this workflow could hit is
  # a pull request being merged, and the workflow never merges anything -- it
  # pushes a data commit to main and force-pushes its proposal branch. One human
  # merge is one run. Note that those commits are pushed with a deploy key,
  # which unlike GITHUB_TOKEN *does* trigger workflow events, so a `push`
  # trigger must never be added to this file. A run carrying `answers` pushes
  # *twice* -- the answers, then the data they produced -- so the same rule is
  # now load-bearing in two places, not one.
  # `branches` filters the PR's *base*, so only merges into main qualify. Without
  # it a stacked PR merged into a feature branch would refresh that branch and
  # push the data commit there, off the published site.
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "*mapping*.json"
      # Candidates ruled out by hand ("none of these"; see _rejections.py).
      - "rejected-candidates.json"
      - "llm.json"
      # A merged proposal PR may carry nothing but a flipped new-model decision;
      # that run is the one that has to act on it.
      - "check_new-decisions.json"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but do not commit, propose, or push"
        type: boolean
        default: false
      # The admin page's write path. A JSON array of answer records; see
      # _answers.py for the shapes and for the validation that makes accepting
      # them from outside the repository safe. Empty on every other run, so the
      # cron and merge paths are untouched.
      #
      # This value is attacker-controlled as far as this file is concerned, and
      # this job holds a write deploy key and two API tokens. It must therefore
      # reach a `run:` only through `env:` -- never as ${{ inputs.answers }}
      # inside a script, which is textual substitution before the shell parses
      # and would make a crafted payload arbitrary code on the runner.
      answers:
        description: "JSON array of answers to apply before refreshing"
        type: string
        default: ""
      skip_refresh:
        description: "Apply the answers and stop, instead of also refreshing scores"
        type: boolean
        default: false
      # The quick run: apply the answers, then re-collect the mapping questions
      # and nothing else -- check_new.py and every mapping updater, side by
      # side, and no update.py, so no scores and no index. It is what the admin
      # page sends when a model has just been added: the new model is in
      # llm.json a minute or two later and every board's names have been
      # matched against it, so its mappings can be answered in the same sitting
      # instead of after the ten-minute refresh. The scores those mappings
      # unlock arrive with the next full run, as with skip_refresh.
      quick:
        description: "After the answers, only re-collect the mapping queue (no scores)"
        type: boolean
        default: false
      # The proposal PR is off unless asked for. The admin page answers the same
      # queue without one, and a PR nobody intends to merge is noise that also
      # blocks the next proposal, since the propose step skips while one is open.
      #
      # `inputs` is null on a schedule or a merge, so this is falsy there and no
      # PR is opened on any automatic path. Ticking it on a manual dispatch is
      # the way back -- worth knowing about if the admin host is ever down, since
      # the PR is then the only way to answer without a terminal.
      propose:
        description: "Also open a proposal PR for anything still unanswered"
        type: boolean
        default: false

permissions:
  # Read-only for contents: nothing is written with GITHUB_TOKEN any more. Both
  # pushes ride on the deploy key configured by checkout, which is the only
  # identity besides a repository admin that the ruleset lets through.
  contents: read
  pull-requests: write
  # Kept even though the issue channel is retired: --label and --assignee on a
  # PR go through the issues API, and losing them would break the propose step.
  issues: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    # For a pull_request event: merges only, and only from this repo -- a fork
    # PR's GITHUB_TOKEN is read-only and could not push the refreshed scores.
    #
    # Note what this no longer says. Dispatching used to require repository
    # write, so this guard bounded who could make the job push to main. With the
    # `answers` input that is no longer true: the bound is now the fine-grained
    # PAT's scope (Actions only, so it can queue this workflow and nothing
    # else), the host auth in front of the page, and answer.py's validation of
    # every record. The ref check below is the part of that which lives here.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every step here runs Python against a pipe, so stdout is block-buffered
    # by default and a step's output arrives in whichever chunks the buffer
    # happens to flush -- most of it at exit. The timestamps Actions puts on
    # those lines are when the runner read them, not when they were written,
    # so a long step reads as a single stall parked against whatever line sat
    # on the flush boundary. update.py's command listing is printed before any
    # fetching, which made a 3.5-minute refresh look like the one fetcher
    # named just above the boundary hanging. Job-level so the whole log is
    # honest about when things happened, not just the refresh.
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      # A pull_request event would otherwise check out the PR's merge ref; this
      # run wants the base branch it was just merged into.
      #
      # main is covered by a branch ruleset that requires a pull request, and
      # GITHUB_TOKEN cannot be exempted from it: GitHub Actions is not an app
      # that can be installed on a user-owned repository, so it cannot appear in
      # the ruleset's bypass list. A write deploy key can, and does. Handing the
      # key to checkout makes it the credential git keeps for every later push,
      # so the data commit lands on main while the rule still applies to
      # everyone else.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PUSH_SSH_KEY }}
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.ref
                || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Both response caches in one step: ~/.cache/artificialanalysis (see
      # "The request budget" in README.md) and ~/.cache/ai-bench (the openness
      # index, plus the responses the fetchers share within a refresh -- see
      # _cache.py). One restore and one save instead of two of each.
      #
      # Across runs, a merge- or dispatch-triggered refresh landing inside the
      # AA window after a cron costs no API requests at all, which keeps a free
      # key (100 requests a day) clear of its ceiling. It cannot serve a cron
      # stale data: the crons are three hours apart and the response TTLs one
      # hour, so a scheduled run re-reads regardless of what was restored. The
      # openness index (12h TTL) is the one thing that does carry over, and
      # only whether a model ships weights, which moves slowly.
      #
      # Restored before `Apply the answers` because that step reads AA too --
      # an answer is checked against the live slug list.
      #
      # The run_id in the key is deliberate: an exact key hit skips the save,
      # which would freeze the cache at its first contents forever.
      # restore-keys does the restoring.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/artificialanalysis
            ~/.cache/ai-bench
          key: responses-${{ github.run_id }}
          restore-keys: responses-

      # The test suites no longer run here: full-tests.yml runs every one of
      # them daily, and here they were a minute and a half of each refresh
      # re-checking code that had not changed since the last green run. What
      # guards the data now is check_data.py, run on the file itself right
      # before each commit below -- the one check no daily run can make.
      #
      # test_answers.py stays, on runs that carry answers only: it tests the
      # validator that stands between this job's deploy key and input from
      # outside the repository, so a regression there has to stop the run
      # before anything is applied, not show up in tomorrow's report. Under a
      # second, and offline.
      - name: Check the answer validator
        if: ${{ inputs.answers != '' }}
        run: ./test_answers.py

      # A merged pull request changed mapping files by hand -- a proposal PR,
      # or a fix in code review -- and the admin page's Updates tab lists every
      # mapping change with who made it. Recorded from the merge commit against
      # its first parent, so it is exactly what the merge brought onto main.
      # The checkout is one commit deep, so the parent is fetched first.
      # Logging is a courtesy, not a gate: a failure here must not cost the run.
      - name: Log the merged mappings
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --no-tags --depth=2 origin "$SHA"
          ./mapping_log.py commit "$SHA" -w

      # A quick run skips the refresh already; asking for both would be a run
      # that re-collects the queue from a batch that was told not to.
      - name: Guard the quick input
        if: ${{ inputs.quick && inputs.skip_refresh }}
        run: |
          echo "quick and skip_refresh are exclusive: quick is a lighter refresh, not none" >&2
          exit 1

      # Two combinations that are silently destructive rather than merely wrong,
      # so they are refused rather than interpreted.
      - name: Guard the answers input
        if: ${{ inputs.answers != '' }}
        # Through env rather than interpolated, for the same reason `answers` is:
        # a ref name may contain backticks and $( , and both would run inside the
        # test below.
        env:
          REF: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The ref of a workflow_dispatch is whatever the caller named. Without
          # this, answers could be applied and pushed to a branch off the
          # published site, with a green check and nobody the wiser.
          if [ "$REF" != "main" ]; then
            echo "answers may only be applied on main, not $REF" >&2
            exit 1
          fi
          # dry_run skips the commit but not the run: check_new.py would consume
          # and clear the decisions the apply step just wrote, so the answers
          # would be destroyed rather than previewed. answer.py has its own dry
          # run for that.
          if [ "$DRY_RUN" = "true" ]; then
            echo "answers cannot be combined with dry_run: the decisions would be" >&2
            echo "applied, consumed by check_new.py and then not committed." >&2
            exit 1
          fi

      # The value never appears in the script: env only, read as "$ANSWERS" and
      # piped in, so no quoting or length question arises. The AA key is needed
      # because an Artificial Analysis answer is checked against the live slug
      # list, and an empty list refuses rather than admits.
      - name: Apply the answers
        id: apply
        if: ${{ inputs.answers != '' }}
        env:
          ANSWERS: ${{ inputs.answers }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          # Explicit, though no sibling step exports it: every mapping writer is
          # a no-op under collect mode, so a leak would make this step report
          # success while writing nothing.
          AI_BENCH_PENDING_PROMPTS: ""
        run: |
          printf '%s' "$ANSWERS" | ./answer.py --stdin -w --result "$RUNNER_TEMP/answers.json"
          {
            echo "## Answers applied"
            echo
            jq -r '.applied[] | "- \(.)"' "$RUNNER_TEMP/answers.json"
          } >> "$GITHUB_STEP_SUMMARY"
          # The models this batch touched, for a quick run to read the Hugging
          # Face cards of and nothing else. From the applier's validated result,
          # so each is an llm.json slug; a rename counts under its new name.
          models=$(jq -r '[.records[]?
                           | select(.kind | IN("model-add", "model-create", "model-edit",
                                                "model-rename", "reference-add"))
                           | if .kind == "model-rename" then .value else .subject end]
                          | unique | join(",")' "$RUNNER_TEMP/answers.json")
          echo "models=${models}" >> "$GITHUB_OUTPUT"

      # Its own commit, so the history reads "these were the answers" then "this
      # is what they produced" -- the shape a merged mapping PR and its follow-up
      # refresh already have.
      - name: Commit and push the answers
        if: ${{ inputs.answers != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The answers changed nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Same gate as the data commit below: the answers wrote llm.json too.
          ./check_data.py || exit 1
          # Counted from the applier's own result, never from the input: the
          # input must not reach a script even inside quotes.
          count=$(jq '.applied | length' "$RUNNER_TEMP/answers.json")
          # The Cleanup tab's preview report, re-read from what the batch just wrote,
          # so a cleanup or a check-off leaves the page in this same push rather
          # than at the end of the refresh. Reads only; a failure costs the
          # report, never the answers. --hub asks Hugging Face about the cases
          # with a release rule (a rule the batch may just have set).
          ./preview_cleanup.py --publish --hub \
            || echo "::warning title=Preview report::could not republish _pending/previews.json"
          # The Models tab's mapping index, for the same reason: an edit made
          # there shows on the page as soon as this push lands. Reads only.
          ./mapping_index.py --publish \
            || echo "::warning title=Mapping index::could not republish _pending/mappings.json"
          # Which mapping changes the batch asked for and which followed from it
          # -- read off answer.py's validated result, never off the input.
          ./mapping_log.py record --by auto --batch "$RUNNER_TEMP/answers.json" --run "$RUN_URL" -w \
            || echo "::warning title=Mapping log::could not record this batch's mapping changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(mappings): apply answers from the admin UI" \
                     -m "Applied ${count} answer(s) dispatched from the admin UI."
          git pull --rebase --autostash origin main
          git push

      # skip_refresh is fast feedback for an answers-only run: the answer is
      # recorded in about a minute and the scores it unlocks land on the next
      # cron. It is not an equivalent path -- a mapping does nothing until
      # update.py reads it.
      #
      # A broken fetcher does not fail this step. update-all exits 3 when every
      # failure was a source it could not read -- a board that moved, a host
      # that is down -- and each of those is recorded in the warnings file for
      # the next step to annotate. The run stays green, every other score
      # lands, and the admin page shows the warnings beside the run. Anything
      # else (exit 1) is a bug in this repository and still reds the run.
      - name: Refresh benchmarks
        id: refresh
        if: ${{ !inputs.skip_refresh }}
        continue-on-error: true
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_BENCH_FETCH_WARNINGS: ${{ runner.temp }}/fetch-warnings.jsonl
          QUICK: ${{ inputs.quick }}
          HAS_ANSWERS: ${{ steps.apply.conclusion == 'success' }}
          TOUCHED: ${{ steps.apply.outputs.models }}
        run: |
          status=0
          quick=()
          if [ "$QUICK" = "true" ]; then
            quick=(--mappings-only)
            # A quick run takes what the last full run cached, up to six hours
            # old, instead of re-reading it: the full runs are three hours apart
            # and save these caches, so this is a hit almost always. It is
            # after the questions a new model raises, and those come from the
            # boards' names, which a few hours do not change -- the one read
            # that must be fresh, AA's slug list, was just made by the answer
            # step and is inside even the normal TTL.
            export ARTIFICIAL_ANALYSIS_CACHE_TTL=21600
            export AI_BENCH_LLMSTATS_CACHE_TTL=21600
            export AI_BENCH_VALS_CACHE_TTL=21600
            export AI_BENCH_HF_CACHE_TTL=21600
            # Whether a model ships weights changes rarely; a week is fine.
            export AI_BENCH_OPENNESS_TTL=604800
            # With a batch, only its models' Hugging Face cards can hold a label
            # nobody has reviewed; the rest of the HF questions are carried over
            # in the next step. A bare quick run still reads every card.
            if [ "$HAS_ANSWERS" = "true" ]; then
              export AI_BENCH_QUICK_MODELS="$TOUCHED"
            fi
          fi
          ./update-all --collect-prompts pending-prompts.jsonl "${quick[@]}" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "Only fetchers failed; reported as warnings, not as a failed step." >&2
            exit 0
          fi
          exit "$status"

      # One `::warning` per fetcher that failed, titled "Fetcher failed: ...",
      # which is the prefix api.php filters the run's annotations on. Runs
      # whatever the refresh concluded: a run that went red for another reason
      # should still say which sources it could not read.
      - name: Report fetcher warnings
        if: ${{ !inputs.skip_refresh }}
        run: ./_fetch_warnings.py annotate "$RUNNER_TEMP/fetch-warnings.jsonl" --summary "$GITHUB_STEP_SUMMARY"

      # The markdown stays outside the working tree so the commit step cannot
      # pick it up; the JSON deliberately does not, because the admin page reads
      # it and answer.py checks answers against it.
      #
      # Only a successful refresh may rewrite it. `Refresh benchmarks` is
      # continue-on-error, so a half-failed run leaves a partial queue, and a
      # skipped one leaves none at all -- committing either would erase live
      # questions from the page until the next cron.
      #
      # A refresh whose only failures were fetchers counts as successful, and
      # the one gap that leaves is closed here: a mapping updater that could
      # not read its board asked nothing, so its questions are carried over
      # from the queue already committed (--carry-over), minus any whose
      # mapping has since been answered.
      - name: Render the pending queue
        id: pending
        if: ${{ steps.refresh.outcome == 'success' }}
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          NARROW_HF: ${{ inputs.quick && steps.apply.conclusion == 'success' }}
        run: |
          ./pending_prompts.py pending-prompts.jsonl --format markdown > "$RUNNER_TEMP/pending.md"
          carry=()
          # A quick run with a batch read only that batch's Hugging Face cards,
          # so the questions the other cards raise are kept from the queue
          # already committed rather than dropped.
          [ "$NARROW_HF" = "true" ] && carry+=(--carry-over update_huggingface_mapping.py)
          while read -r route; do
            carry+=(--carry-over "$route")
          done < <(./_fetch_warnings.py routes "$RUNNER_TEMP/fetch-warnings.jsonl")
          ./pending_prompts.py pending-prompts.jsonl --format json --out _pending/pending.json "${carry[@]}"
          echo "count=$(./pending_prompts.py pending-prompts.jsonl --count)" >> "$GITHUB_OUTPUT"
          {
            echo "## Pending review"
            echo
            cat "$RUNNER_TEMP/pending.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # The slug list the admin page offers when renaming a hand-added model
      # onto the name AA publishes it under. Committed rather than proxied so
      # the page reads it straight from the repo like the queue and llm.json:
      # api.php used to fetch it live, which cost four API requests every
      # sitting, on the interactive path, against a free key's hundred a day.
      #
      # Free: the response this run already fetched is still inside the cache
      # window, so writing the file costs no request of its own. Gated on a
      # wholly successful refresh for the same reason the queue is -- and
      # artificialanalysis.py refuses to write a short list, so a bad answer
      # from AA leaves yesterday's good one in place instead of emptying the
      # page's suggestions.
      - name: Publish the Artificial Analysis model list
        if: ${{ steps.refresh.outcome == 'success' }}
        continue-on-error: true
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: ./artificialanalysis.py --publish-models _aa/models.json

      # The Cleanup tab: preview entries whose model looks released, with the
      # decisions a cleanup needs (see _preview_cleanup.py). Read off llm.json,
      # the mapping files, the queue and the AA list above -- all files this
      # run just wrote. The only requests are --hub's: one or two to the
      # Hugging Face Hub per case with a release rule (preview-cleanup-rules.json),
      # whose failure carries the last answer over. Not gated on the refresh: it
      # describes the files as they are, and a stale report would offer
      # decisions about scores that have since moved (answer.py would refuse
      # them as stale, but the page should not offer them in the first place).
      - name: Publish the preview cleanup report
        continue-on-error: true
        run: ./preview_cleanup.py --publish --hub

      # The Models tab's mappings: every model-name mapping file, the "not
      # these" lists, and which columns each source supplies to each model
      # (see _mapping_index.py). Read off the files this run just wrote; no
      # requests. Not gated on the refresh, like the report above: it
      # describes the files as they are.
      - name: Publish the mapping index
        continue-on-error: true
        run: ./mapping_index.py --publish

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          COUNT: ${{ steps.pending.outputs.count }}
          # A merge-triggered run labelled "daily" would be a lie in the log.
          REASON: >-
            ${{ github.event_name == 'pull_request'
                && format('Refreshed after merging #{0}.', github.event.pull_request.number)
                || inputs.quick && 'Quick run from the admin UI: mapping queue only, no scores.'
                || 'Scheduled refresh.' }}
          SUBJECT: >-
            ${{ inputs.quick && 'chore(data): mapping queue refresh'
                || 'chore(data): benchmark refresh' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Anything this run wrote to a mapping file on its own. In collect
          # mode that is normally nothing -- the writers are frozen -- so an
          # entry here is worth seeing on the Updates tab.
          ./mapping_log.py record --by auto --run "$RUN_URL" -w \
            || echo "::warning title=Mapping log::could not record this run's mapping changes"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The one gate between this run and the live site: llm.json parses,
          # has not lost models or scores en masse against HEAD, and its
          # history and sources are intact. Under a second.
          ./check_data.py || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${SUBJECT}" \
                     -m "${REASON} ${COUNT} prompt(s) queued for manual review."
          git pull --rebase --autostash origin main
          git push

      # A proposal PR, not an issue: the mapping questions become a reviewable
      # diff with clickable suggestions. Skipped entirely while one is already
      # open, so a force-push can never discard review work in progress.
      #
      # Now opt-in (see the `propose` input). The queue is published to
      # _pending/pending.json on every successful refresh and the admin page
      # answers from that, so the questions survive without a PR carrying them --
      # this step is the fallback, not the delivery mechanism.
      - name: Propose the pending mappings
        id: propose
        if: ${{ inputs.propose && !inputs.dry_run && steps.pending.outputs.count != '' && steps.pending.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          BRANCH: chore/mapping-proposals
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                      --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "PR #$open_pr is still open; not proposing again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          ./propose.py pending-prompts.jsonl --apply \
            --plan "$RUNNER_TEMP/plan.json" --body "$RUNNER_TEMP/body.md"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing proposable in the queue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "chore(mappings): propose mappings for the pending queue"
          git push --force origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Proposed benchmark mappings" \
            --body-file "$RUNNER_TEMP/body.md" --assignee dgrieser \
            --label pending-prompts
          # Queried rather than scraped out of the create output.
          num=$(gh pr list --head "$BRANCH" --state open --limit 1 \
                  --json number --jq '.[0].number')
          echo "pr=$num" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$num." >> "$GITHUB_STEP_SUMMARY"

      # One review carrying every suggestion, so it is a single notification.
      #
      # GitHub rejects the whole review (422) if any one comment points at a line
      # outside the diff, which used to mean a single bad line silently cost the
      # PR every suggestion it advertised. propose.py now only asks for lines it
      # changed; the per-comment retry below is the belt to that braces, so one
      # rejected line costs one suggestion instead of all of them.
      - name: Attach the mapping suggestions
        if: ${{ steps.propose.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.propose.outputs.pr }}
          INTRO: "Each line below has a suggestion you can commit directly. Ignoring a parked mapping is safe: `__pending__` records nothing and the name is queued again next run. A new model's suggestion is the opposite answer to adding it: `__ignored__` removes the entry again on the next run and stops the slug being offered."
        run: |
          count=$(jq '.comments | length' "$RUNNER_TEMP/plan.json")
          if [ "$count" -eq 0 ]; then
            echo "No suggestions to attach." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api="repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews"

          jq --arg body "$INTRO" '{event: "COMMENT", body: $body, comments: .comments}' \
            "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/review.json"
          if gh api -X POST "$api" --input "$RUNNER_TEMP/review.json" >/dev/null 2>"$RUNNER_TEMP/err"; then
            echo "Attached $count suggestion(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Batch review rejected: $(cat "$RUNNER_TEMP/err")" >&2
          echo "Batch review rejected; retrying one comment at a time." >> "$GITHUB_STEP_SUMMARY"
          attached=0
          for index in $(seq 0 $((count - 1))); do
            jq --argjson i "$index" --arg body "$INTRO" \
              '{event: "COMMENT", body: $body, comments: [.comments[$i]]}' \
              "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/one.json"
            if gh api -X POST "$api" --input "$RUNNER_TEMP/one.json" >/dev/null 2>"$RUNNER_TEMP/err"; then
              attached=$((attached + 1))
            else
              line=$(jq -r --argjson i "$index" '.comments[$i] | "\(.path):\(.line)"' "$RUNNER_TEMP/plan.json")
              echo "- suggestion for \`$line\` rejected: $(cat "$RUNNER_TEMP/err")" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Attached $attached of $count suggestion(s)." >> "$GITHUB_STEP_SUMMARY"
          [ "$attached" -gt 0 ]

      # Not a fetcher: those are warnings (see `Refresh benchmarks`), so what
      # reaches here is a failure in this repository's own code.
      - name: Fail if a step of update-all failed
        if: ${{ !inputs.skip_refresh && steps.refresh.outcome != 'success' }}
        run: |
          echo "update-all reported a failed step; see its log above." >&2
          exit 1
