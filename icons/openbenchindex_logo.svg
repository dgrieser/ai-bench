<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1536 1536"
     width="1536"
     height="1536">

  <defs>
    <!-- Very subtle dark background variation visible in the reference -->
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </radialGradient>

    <!-- Pink C -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2684"/>
      <stop offset="1" stop-color="#fb237d"/>
    </linearGradient>

    <!-- Benchmark bars -->
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#087fff"/>
      <stop offset="1" stop-color="#0878f5"/>
    </linearGradient>

    <!-- Main B -->
    <linearGradient id="bWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e3e3"/>
      <stop offset="1" stop-color="#e5e5e5"/>
    </linearGradient>

    <!-- Reproduces the very slight softness/shadow of the raster reference -->
    <filter id="softShadow"
            x="-10%" y="-10%"
            width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha"
                      stdDeviation="2.2"
                      result="blur"/>
      <feOffset dy="1.2"
                result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536"
        height="1536"
        fill="url(#bg)"/>

  <!-- Benchmark bars; intentionally behind the pink C -->
  <g fill="url(#blue)"
     filter="url(#softShadow)">

    <path d="
      M511 782
      H555
      Q565 782 565 792
      V906
      H501
      V792
      Q501 782 511 782
      Z
    "/>

    <path d="
      M606 719
      H650
      Q660 719 660 729
      V906
      H596
      V729
      Q596 719 606 719
      Z
    "/>

    <path d="
      M702 645
      H746
      Q756 645 756 655
      V906
      H692
      V655
      Q692 645 702 645
      Z
    "/>
  </g>

  <!--
    Pink C.
    Reconstructed as a circular annulus clipped by the
    perfectly vertical opening visible in the reference.
  -->
  <path
    d="
      M768 393.28

      A307.75 307.75
       0 1 0
       768 943.78

      L768 857.88

      A234.30 234.30
       0 1 1
       768 479.79

      Z
    "
    fill="url(#pink)"
    filter="url(#softShadow)"
  />

  <!--
    Custom B.
    The left edge intentionally bows inward around the center,
    matching the distinctive custom geometry in the image.
  -->
  <path
    fill="url(#bWhite)"
    fill-rule="evenodd"
    filter="url(#softShadow)"
    transform="translate(0 -1)"
    d="
      M821 364.5
      H1055

      C1138.46 366.45
       1208.71 442.53
       1207 526

      C1206.86 576.70
       1184.77 620.58
