<!-- OpenBench's own Coding index: angle brackets and a slash inside a
     two-tone ring, sibling to the Tooling index mark. viewBox cropped to the
     drawing so sizing it by height lands its top and bottom on the ink — see
     .tip-icon in llm.html. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="357.12 332.16 821.76 845.44"
  fill="none"
>
  <!-- Outer ring: pink section -->
  <path
    d="M 483.10 478.51
       A 391.14 403.21 0 1 1 1040.78 1043.75"
    stroke="#FD2179"
    stroke-width="37"
    stroke-linecap="butt"
  />

  <!-- Outer ring: blue section -->
  <path
    d="M 1040.78 1043.75
       A 391.14 403.21 0 0 1 483.10 478.51"
    stroke="#0170FE"
    stroke-width="37"
    stroke-linecap="butt"
  />

  <!-- Left angle bracket -->
  <path
    d="M 628 635
       L 510 754
       L 628 872"
    stroke="#FFFFFF"
    stroke-width="35"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center slash -->
  <path
    d="M 821 586
       L 714 918"
    stroke="#FFFFFF"
    stroke-width="35"
    stroke-linecap="round"
  />

  <!-- Right angle bracket -->
  <path
    d="M 897 635
       L 1014 753
       L 898 872"
    stroke="#FFFFFF"
    stroke-width="35"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
