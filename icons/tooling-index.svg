<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="293.76 261.12 948.48 947.84"
  width="948.48"
  height="947.84"
>
  <!--
    Transparent background.
    Reconstructed from the supplied 1536 × 1536 reference, with the viewBox
    then cropped to the drawing so sizing it by height lands its top and bottom
    on the ink — see .tip-icon in llm.html.
  -->

  <!-- llm.html sets color-scheme per theme and the browser hands that down to
       an SVG loaded in an <img>, so this follows the site's own toggle rather
       than the reader's OS. The two values are llm.html's text ink; an <img>
       cannot read the page's custom property, so they are copied here and have
       to be changed alongside it. The fill attribute is the fallback for
       anything that ignores the style. -->
  <style>
    .ink { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e0ddd7; }
    }
  </style>

  <!-- Outer ring: blue section -->
  <path
    d="
      M 1108.3519 1030.9717
      A 451.09 451.09 0 0 1 422.3550 445.0749
    "
    fill="none"
    stroke="#2878FE"
    stroke-width="44.33"
    stroke-linecap="butt"
  />

  <!-- Outer ring: pink section -->
  <path
    d="
      M 422.3550 445.0749
      A 451.09 451.09 0 1 1 1108.3519 1030.9717
    "
    fill="none"
    stroke="#FD1F7B"
    stroke-width="44.33"
    stroke-linecap="butt"
  />

  <!-- Plug cable; sits behind the wrench and plug body -->
  <path
    d="
      M 629.50 920.66
      A 174.05 174.05 0 0 0 969.79 932.55
    "
    fill="none"
    stroke="#2878FE"
    stroke-width="35.58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Plug body -->
  <path
    d="
      M 886 815.5
      H 1053.5
      V 884

      C 1053.5 911
        1032 933
        1005 933

      H 934.5

      C 907.5 933
        886 911
        886 884

      Z
    "
    fill="#2878FE"
  />

  <!-- Plug pins -->
  <rect
    x="912"
    y="735.5"
    width="32"
    height="65.5"
    rx="16"
    fill="#2878FE"
  />

  <rect
    x="995"
    y="735.5"
    width="31"
    height="65.5"
    rx="15.5"
    fill="#2878FE"
  />

  <!-- Wrench: the page's ink rather than a fixed near-white, which vanishes on
       the light theme's ground. See the style block above. -->
  <path
    class="ink"
    fill="#111111"
    fill-rule="evenodd"
    d="
      M 892 430

      A 136.36 136.36
        0 0 0
        727 618

      L 484 861

      A 62.38 62.38
        0 0 0
        571 950

      L 805 690

      A 136.36 136.36
        0 0 0
        979 513

      L 905 590
      L 852 590
      L 822 560
      L 822 505
      Z

      M 565.20 900.48

      A 32.11 32.11
        0 1 0
        500.98 900.48

      A 32.11 32.11
        0 1 0
        565.20 900.48

      Z
    "
  />
</svg>
