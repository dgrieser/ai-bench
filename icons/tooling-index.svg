<!-- OpenBench's own Tooling index: a wrench and a screwdriver flanking the
     same rising bar chart the Coding index carries, so the two derived
     columns read as siblings. Square viewBox because llm.html renders
     benchmark icons in a fixed 12x12 box, which would squash a wider
     drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
  <defs>
    <linearGradient id="tooling-index-bars" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="90">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#3b82f6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench: open-end head (arc with the jaw facing up) on a straight shaft. -->
    <path d="M28.5,25 A13,13 0 1,1 15.5,25"/>
    <path d="M22,48 L22,90"/>
    <!-- Screwdriver: handle, then the blade down to the tip. -->
    <path d="M106,22 L106,40"/>
    <path d="M106,52 L106,90"/>
  </g>
  <g fill="#3b82f6">
    <rect x="97" y="38" width="18" height="12" rx="4"/>
  </g>
  <g fill="url(#tooling-index-bars)">
    <rect x="40" y="64" width="12" height="26" rx="3"/>
    <rect x="58" y="50" width="12" height="40" rx="3"/>
    <rect x="76" y="36" width="12" height="54" rx="3"/>
  </g>
</svg>
